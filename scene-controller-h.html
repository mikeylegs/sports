<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lasers">
<title>Scene Control</title>
<style>
  :root{
    color-scheme:dark;
    --bg:#08090c;
    --face:#111318;
    --edge:#1c1f27;
    --ink:#f2f4f8;
    --dim:#6b7280;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #14171f 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:"Helvetica Neue",system-ui,sans-serif;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-user-select:none;user-select:none;
  }

  .stage{height:100%;display:flex;flex-direction:column;padding:18px 20px}

  /* discreet top bar: just a status glyph + settings */
  .bar{display:flex;align-items:center;justify-content:flex-end;gap:18px;height:22px;flex:0 0 auto}
  .link{position:absolute;left:22px;top:calc(env(safe-area-inset-top) + 20px);
    color:var(--dim);font-size:12px;letter-spacing:.04em}
  .live-dot{width:7px;height:7px;border-radius:50%;background:#2a2f39;transition:background .25s, box-shadow .25s}
  body.on .live-dot{background:#39d353;box-shadow:0 0 10px #39d353}
  .gear{width:26px;height:26px;opacity:.35;transition:opacity .2s;cursor:pointer}
  .gear:active{opacity:.9}

  /* the 8 pads */
  .grid{
    flex:1 1 auto;display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-template-rows:repeat(2,1fr);
    gap:14px;margin-top:14px;
  }
  .pad{
    position:relative;border-radius:20px;cursor:pointer;overflow:hidden;
    background:var(--face);
    border:1px solid var(--edge);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03), inset 0 -18px 30px rgba(0,0,0,.35);
    display:flex;align-items:flex-end;
    padding:16px 18px;
    transition:transform .12s ease, box-shadow .3s ease, border-color .3s ease, background .3s ease;
    --c:120,130,140;
  }
  .pad:active{transform:scale(.975)}
  /* unlit identity: the scene's colour, held back */
  .pad::before{
    content:"";position:absolute;left:16px;top:16px;width:9px;height:9px;border-radius:50%;
    background:rgb(var(--c));opacity:.5;transition:opacity .3s, box-shadow .3s;
  }
  .name{font-size:clamp(15px,2.4vw,22px);font-weight:600;line-height:1.12;letter-spacing:-.01em;
    color:#aeb4c0;transition:color .3s;max-width:9ch}

  /* lit: the light comes on */
  .pad.live{
    background:
      linear-gradient(180deg, rgba(var(--c),.28), rgba(var(--c),.10)),
      var(--face);
    border-color:rgba(var(--c),.85);
    box-shadow:0 0 0 1px rgba(var(--c),.5), 0 14px 44px -6px rgba(var(--c),.55);
    animation:breathe 3.4s ease-in-out infinite;
  }
  .pad.live .name{color:#fff}
  .pad.live::before{opacity:1;box-shadow:0 0 14px 2px rgb(var(--c))}

  @keyframes breathe{
    0%,100%{box-shadow:0 0 0 1px rgba(var(--c),.5), 0 14px 44px -6px rgba(var(--c),.55)}
    50%    {box-shadow:0 0 0 1px rgba(var(--c),.7), 0 18px 58px -4px rgba(var(--c),.8)}
  }
  @media (prefers-reduced-motion:reduce){.pad.live,.pad.latched{animation:none}}

  /* latched = pinned live, steady (no breathing) + lock badge */
  .pad.latched{animation:none;box-shadow:0 0 0 1px rgba(var(--c),.85), 0 16px 52px -6px rgba(var(--c),.75)}
  .lock{position:absolute;right:14px;top:13px;width:15px;height:15px;color:rgb(var(--c));opacity:0;transition:opacity .2s}
  .pad.latched .lock{opacity:.95}

  /* blackout pad reads as the odd one out */
  .pad.kill{--c:120,124,132}
  .pad.kill.armed{
    background:linear-gradient(180deg, rgba(255,59,59,.22), rgba(255,59,59,.06)), var(--face);
    border-color:rgba(255,59,59,.8);
    box-shadow:0 0 0 1px rgba(255,59,59,.5), 0 14px 40px -8px rgba(255,59,59,.5);
    animation:none;
  }
  .pad.kill.armed .name{color:#fff}
  .pad.kill.armed::before{opacity:1;background:#ff3b3b;box-shadow:0 0 14px 2px #ff3b3b}

  /* rainbow scene gets a spectrum mark instead of a single dot */
  .pad.spectrum::before{
    background:conic-gradient(from 0deg,#ff3b3b,#ffb020,#39d353,#22d3ee,#3a86ff,#8b5cf6,#ff2d95,#ff3b3b);
    opacity:.7;
  }
  .pad.spectrum.live::before{opacity:1;box-shadow:0 0 14px 2px rgba(255,255,255,.35)}

  /* settings overlay */
  .scrim{position:fixed;inset:0;background:rgba(4,5,7,.6);backdrop-filter:blur(6px);
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
  .scrim.open{opacity:1;pointer-events:auto}
  .panel{position:fixed;top:0;right:0;height:100%;width:min(380px,82vw);z-index:11;
    background:#0d0f14;border-left:1px solid #1c1f27;
    padding:calc(env(safe-area-inset-top) + 22px) 24px 24px;
    transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;gap:22px}
  .panel.open{transform:none}
  .panel h2{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
  .row{display:flex;flex-direction:column;gap:7px}
  .row label{font-size:13px;color:var(--dim)}
  .row input{background:#08090c;border:1px solid #232733;color:var(--ink);
    border-radius:10px;padding:11px 12px;font-size:15px}
  .fixline{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid #1c1f27;
    border-radius:10px;font-size:14px;color:#c7ccd6}
  .fixline .d{width:7px;height:7px;border-radius:50%;background:#39d353;box-shadow:0 0 8px #39d353}
  .ghost{margin-top:auto;background:transparent;border:1px solid #232733;color:#aeb4c0;
    border-radius:12px;padding:13px;font-size:15px;font-weight:600;text-align:center}
  .ghost:active{background:#14171f}
  /* hidden native switch used purely to trigger iOS system haptics on toggle —
     invisible, off-screen, never meant to be seen or tapped directly */
  #hapticSwitch{position:fixed;top:-999px;left:-999px;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
  <input type="checkbox" switch id="hapticSwitch" tabindex="-1" aria-hidden="true">
  <div class="stage">
    <a class="link">raw channels</a>
    <div class="bar">
      <span class="live-dot"></span>
      <svg class="gear" id="gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>
      </svg>
    </div>

    <div class="grid" id="grid">
      <div class="pad spectrum" style="--c:255,45,149"><span class="name">Rainbow Carousel</span></div>
      <div class="pad" style="--c:34,211,238"><span class="name">Particle Sky</span></div>
      <div class="pad" style="--c:255,176,32"><span class="name">Fast Blast</span></div>
      <div class="pad" style="--c:255,59,59"><span class="name">Hotbeam Strobe</span></div>
      <div class="pad" style="--c:139,92,246"><span class="name">Spinning Beams</span></div>
      <div class="pad" style="--c:58,134,255"><span class="name">Vertical Waves</span></div>
      <div class="pad" style="--c:57,211,83"><span class="name">Wild Things</span></div>
      <div class="pad kill"><span class="name">Blackout</span></div>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="panel" id="panel">
    <h2>Settings</h2>
    <div class="row">
      <label>Output address</label>
      <input value="192.168.1.255" spellcheck="false">
    </div>
    <div class="row">
      <label>Fixtures</label>
      <div class="fixline"><span class="d"></span>Fixture 1 — universe 0, channels 1–34</div>
    </div>
    <div class="ghost" id="close">Done</div>
  </aside>

<script>
  var grid=document.getElementById('grid');
  var kill=grid.querySelector('.kill');
  var usingTouch=false, mousePad=null;
  var lockSVG='<svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
  grid.querySelectorAll('.pad').forEach(function(p){ if(!p.classList.contains('kill')) p.insertAdjacentHTML('beforeend',lockSVG); });

  // ---- haptics ----
  // iOS Safari has no navigator.vibrate() (WebKit refuses to implement it), so we
  // fake it: toggling a hidden native <input switch> makes iOS fire its real
  // system haptic tick, since it's a genuine control rather than a script call.
  // Falls back to navigator.vibrate() where that IS supported (Android/desktop),
  // and no-ops silently everywhere else.
  var hapticEl=document.getElementById('hapticSwitch');
  function nativeTick(){ try{ hapticEl.click(); }catch(e){} }
  function haptic(strength){                 // 'light' | 'medium' | 'heavy'
    var taps = strength==='heavy' ? 3 : strength==='medium' ? 2 : 1;
    for(var i=0;i<taps;i++){ setTimeout(nativeTick, i*40); }
    if(navigator.vibrate){
      var pattern = strength==='heavy' ? [30,40,30,40,30] : strength==='medium' ? [15,50,15] : 12;
      navigator.vibrate(pattern);
    }
  }

  var counts=new Map();     // pad -> fingers currently on it
  var touchPad=new Map();   // touch id -> pad (or null)
  function cnt(p){ return counts.get(p)||0; }
  function syncDot(){ document.body.classList.toggle('on', !!grid.querySelector('.pad.live')); }

  function latchToggle(pad){
    kill.classList.remove('armed');
    if(pad.classList.contains('latched')) pad.classList.remove('latched');
    else pad.classList.add('latched','live');
    haptic('medium');
    syncDot();
  }
  function panic(){
    counts.clear();
    grid.querySelectorAll('.pad').forEach(function(p){ p.classList.remove('live','latched'); });
    kill.classList.add('armed'); document.body.classList.remove('on');
    haptic('heavy');
    setTimeout(function(){ kill.classList.remove('armed'); },450);
  }
  function down(pad){                       // a finger landed on pad
    if(pad===kill){ panic(); return; }
    var c=cnt(pad)+1; counts.set(pad,c);
    kill.classList.remove('armed');
    if(c===1){ pad.classList.add('live'); haptic('light'); }  // momentary on
    else if(c===2) latchToggle(pad);        // two fingers, same pad = latch
    syncDot();
  }
  function up(pad){                          // a finger lifted from pad
    if(!pad||pad===kill) return;
    var c=Math.max(0,cnt(pad)-1); counts.set(pad,c);
    if(c===0 && !pad.classList.contains('latched')) pad.classList.remove('live');
    syncDot();
  }

  grid.addEventListener('touchstart',function(e){
    usingTouch=true; e.preventDefault();
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      var pad=t.target&&t.target.closest?t.target.closest('.pad'):null;
      touchPad.set(t.identifier,pad);
      if(pad) down(pad);
    }
  },{passive:false});
  function endTouches(e){
    for(var i=0;i<e.changedTouches.length;i++){
      var t=e.changedTouches[i];
      up(touchPad.get(t.identifier)); touchPad.delete(t.identifier);
    }
  }
  grid.addEventListener('touchend',function(e){ e.preventDefault(); endTouches(e); },{passive:false});
  grid.addEventListener('touchcancel',endTouches);

  grid.addEventListener('mousedown',function(e){     // desktop/VNC (single hold): hold=momentary, shift=latch
    if(usingTouch) return;
    var pad=e.target.closest('.pad'); if(!pad) return;
    if(pad===kill){ panic(); return; }
    if(e.shiftKey){ latchToggle(pad); return; }
    pad.classList.add('live'); mousePad=pad; haptic('light'); syncDot();
  });
  window.addEventListener('mouseup',function(){
    if(usingTouch||!mousePad) return;
    if(!mousePad.classList.contains('latched')) mousePad.classList.remove('live');
    mousePad=null; syncDot();
  });

  var scrim=document.getElementById('scrim'), panel=document.getElementById('panel');
  function openSet(){scrim.classList.add('open');panel.classList.add('open');}
  function closeSet(){scrim.classList.remove('open');panel.classList.remove('open');}
  document.getElementById('gear').addEventListener('click',openSet);
  scrim.addEventListener('click',closeSet);
  document.getElementById('close').addEventListener('click',closeSet);
</script>
</body>
</html>
