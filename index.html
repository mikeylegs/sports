    b.style.cssText = 'flex:none;background:#1e293b;color:#c7d2fe;border:1px solid #475569;'
      + 'border-radius:4px;padding:3px 9px;font:bold 11px monospace;cursor:pointer;';
    return b;
  };
  const copyBtn = mkBtn('⧉ COPY');
  const collBtn = mkBtn('▾');
  bar.appendChild(ttl); bar.appendChild(copyBtn); bar.appendChild(collBtn);

  const body = document.createElement('div');
  body.style.cssText = 'padding:10px;overflow:auto;white-space:pre-wrap;flex:1;';

  root.appendChild(bar); root.appendChild(body);
  document.body.appendChild(root);

  const KEY = 'hudCollapsed_' + id;
  const setCollapsed = (on) => {
    body.style.display = on ? 'none' : 'block';
    collBtn.textContent = on ? '▸' : '▾';
    try { localStorage.setItem(KEY, on ? '1' : '0'); } catch(_){}
  };
  let collapsed = false;
  try { collapsed = localStorage.getItem(KEY) === '1'; } catch(_){}
  setCollapsed(collapsed);
  collBtn.onclick = () => { collapsed = !collapsed; setCollapsed(collapsed); };

  copyBtn.onclick = async () => {
    const txt = body.innerText || body.textContent || '';
    try { await navigator.clipboard.writeText(txt); copyBtn.textContent = '✓ COPIED'; }
    catch(_){
      // clipboard API can be blocked; fall back to a selection the user can copy
      const r = document.createRange(); r.selectNodeContents(body);

      copyBtn.textContent = 'SELECTED';

    setTimeout(() => { copyBtn.textContent = '⧉ COPY'; }, 1600);
  };

  const api = { root, body, bar, title: ttl,
                setText: (t) => { body.textContent = t; },
                setTitle: (t) => { ttl.textContent = t; } };
  root._hud = api;
  return api;
}

    .map(k => String(k.value || k.displayName || '').toLowerCase())
    .filter(Boolean);
}
const mlbIsRecap     = it => mlbKw(it).some(k => k === 'mlb_recap' || k === 'game-recap');
const mlbIsCondensed = it => mlbKw(it).some(k => k.startsWith('condensed'));   // the 12-min snoozefest

   playbacks[] also carries a 16000K highBit at the SAME 1280x720 — identical
   pixels, ~4x the bytes (a 3-min recap is ~360MB vs ~90MB). Wrong choice on a
   24/7 kiosk. Prefer 4000K → any 1280x720 mp4 → any mp4. */
function mlbPickMp4(it) {
  const mp4s = (it.playbacks || []).filter(p => /\.mp4(\?|$)/i.test(p.url || ''));
  if (!mp4s.length) return null;
  const score = p => {
    const u = (p.url || '') + ' ' + (p.name || '');

    if (/1280x720/i.test(u) && !/16000k/i.test(u)) return 2;
    if (/16000k|highbit/i.test(u)) return 0;   // last resort — huge
    return 1;
  };
  return mp4s.slice().sort((a, b) => score(b) - score(a))[0].url;

const _mlbContentCache = new Map();   // gamePk -> {t, items}

/* Most recent FINAL game for a team, within the last `days`. Returns gamePk|null. */
async function mlbLastFinalGamePk(teamId, days = 2) {
  const d = n => new Date(Date.now() - n * 864e5).toISOString().slice(0, 10);
  const url = `https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${teamId}`
            + `&startDate=${d(days)}&endDate=${d(0)}`;
  const raw = await proxyFetchText(url);
  if (!raw) return null;
  let j; try { j = JSON.parse(raw); } catch (_) { return null; }
  const games = (j.dates || []).flatMap(x => x.games || [])
    .filter(g => g.status?.abstractGameState === 'Final')
    .sort((a, b) => new Date(b.gameDate) - new Date(a.gameDate));
  return games.length ? games[0].gamePk : null;
}

/* ★ B1 (r141) — LIVE PER-PLAY HITS from MLB's own feed. The no-hitter detector's

   already uses. Returns {away,home} numbers or null; FAIL-SAFE (fetch/parse fail →
   null → detector stays silent, exactly today's behavior — never a phantom no-no).

   cadence, landed alongside B2's live smoke test. This is the proven building block. */
const _mlbHitsCache = new Map();   // gamePk -> {t, hits}
async function mlbLinescoreHits(gamePk){
  if (!gamePk) return null;
  const hit = _mlbHitsCache.get(gamePk);
  if (hit && Date.now() - hit.t < 30000) return hit.hits;   // 30s TTL (hits change ~per-batter)
  try {

    if (!raw) return null;

    if (!teams) return null;

    const hits = { away: num(teams.away?.hits), home: num(teams.home?.hits) };

/* ★ THE RESOLVER. Director asks "give me a Yankees recap" → this.
   Returns {url,title,duration,gamePk,source:'mlb'} or null.
   null is not a failure — it means "fall through to the existing YouTube path". */
async function mlbRecap(teamKey, knownPk) {
  try {
    // R114c: a UCS matchup already CARRIES its gamePk (ucsMlbGame resolved it).
    // Pass it in and we skip the schedule round-trip entirely.
    const teamId = MLB_TEAM_IDS[teamKey] || teamKey;
    const gamePk = knownPk || await mlbLastFinalGamePk(teamId);
    if (!gamePk) return null;
    const items = await mlbContent(gamePk);
    const recap = items.find(it => mlbIsRecap(it) && !mlbIsCondensed(it));
    if (!recap) return null;                       // recap not cut yet → YouTube
    const url = mlbPickMp4(recap);
    if (!url) return null;
    return { url, title: recap.headline || recap.title || 'Recap',
             duration: recap.duration || null, gamePk, source: 'mlb' };
  } catch (e) { return null; }
}

/* ★ THE BRAIN LINK. A stamped moment (gamePk + playerId + when) → its own clip.
   Clip lag measured at 17-39s, so a takeover callback can be near-live.
   NEVER match on headline text: the recap headline names the batter too, so a
   text match hands back the 3-min recap for every single play. */
async function mlbPlayClip(gamePk, playerId, playEndTimeISO) {
  try {
    const items = await mlbContent(gamePk);
    const playT = playEndTimeISO ? new Date(playEndTimeISO).getTime() : null;
    const tag = 'playerid-' + playerId;
    const cands = items.filter(it => {
      if (mlbIsRecap(it) || mlbIsCondensed(it)) return false;
      if (!mlbKw(it).includes(tag)) return false;
      if (!playT) return true;
      const t = new Date(it.date || it.timestamp).getTime();
      return t >= playT - 120000;                  // 2 min clock-skew allowance
    }).sort((a, b) => new Date(a.date || a.timestamp) - new Date(b.date || b.timestamp));
    const c = cands[0];
    if (!c) return null;
    const url = mlbPickMp4(c);
    if (!url) return null;
    const lagS = playT ? Math.round((new Date(c.date || c.timestamp).getTime() - playT) / 1000) : null;
    return { url, title: c.headline || c.title || 'Highlight',
             duration: c.duration || null, gamePk, lagS, source: 'mlb' };
  } catch (e) { return null; }
}

/* ══════════════════════════════════════════════════════════════════════════════
   R114 · UCS CORE — the backend of the Unified Card System.  FENCED BLOCK.
   ------------------------------------------------------------------------------
   THE PRIMITIVE:  (matchup × lifecycle-state) → card.
   A card is not a layout; it is a RENDER OF A MATCHUP IN A STATE.

   This block is the STATE MACHINE + VIDEO CONTRACT only. No pixels, no cards.
   It is pure logic, headlessly inspectable via ?ucs=1, and can be proven correct
   BEFORE the card mockups exist.

   ★ FENCE RULES (do not violate — this is what keeps the monolith safe):
     - UCS READS, NEVER MUTATES. It does not touch fetchAll, the panes, or globals.
     - Nothing outside calls into UCS internals. Entry points: ucsSnapshot(), ucsHud().
     - UCS calls OUT only to stable shared services (proxyFetchText, mlbRecap, WWS).
     - If UCS ever needs to reach INTO the existing panes' internals, THE FENCE HAS
       FAILED — stop and reconsider rather than threading it through.
     - Inert unless ?ucs=1. Same property that made R111 provably safe.
   ══════════════════════════════════════════════════════════════════════════════ */
const UCS_FEED = {};                       // league key -> normalized games (stashed by fetchAll)

// id→abbr for the teams we feature (extend as MLB_TEAMS grows). Declared HERE, above
// every use site — we ate a TDZ crash today, we don't leave that shape in the file.
const MLB_ABBR = { 147: 'NYY', 121: 'NYM', 111: 'BOS', 139: 'TB', 110: 'BAL', 141: 'TOR',
                   143: 'PHI', 144: 'ATL', 146: 'MIA', 120: 'WSH' };

const UCS_CFG = {
  // R114.1: NYY/NYM are HARDCODED panes in the legacy layout (isYank/isNYM), NOT
  // WWS-starred teams — WWS.watch.teams is a separate, usually-empty feature. UCS
  // takes them from config here, which is also exactly what makes them "just another
  // selector-editable slot" later: change this list, change the stories.
  MLB_TEAMS : ['NYY', 'NYM'],
  IMMINENT_H : 3,        // < 3h to first pitch  → PREGAME_IMMINENT (else PREGAME_ANALYSIS)
  // R114d: was 24 — my invention, and WRONG. Mike's own rules already answer this:
  // _recapFresh is a 2-DAY floor and R92's expiry is rolling +1 day, both because he's
  // often up past midnight and last night's game should still be there. 24h silently
  // pushed a 27-hour-old final into NEXT, which suppressed its recap. Match the codebase.
  NEXT_AFTER_H : 48,     // > 48h since final    → stop telling that story, show NEXT
  WEIGHT : {             // rotation airtime. LIVE dominates; a finished game is a whisper.
    LIVE: 4, TAKEOVER: 0, POSTGAME: 2, PREGAME_IMMINENT: 2,
    FINAL: 1, PREGAME_ANALYSIS: 1, NEXT: 1
  }
};

/* ── MATCHUPS ────────────────────────────────────────────────────────────────
   The universe of stories. Two sources, ONE shape — this is the collapse the
   spec asked for: "NYY/NYM pane should be its own WWS slot." Here it is. The
   Yankees are not special; they are a matchup like any other.                */
async function ucsMatchups() {
  const out = [];

  // a. featured MLB teams (the NYY/NYM panes, dissolved into ordinary matchups).
  //    R114c: resolved from MLB itself, NOT from ESPN's today/yesterday window.
  const stars = [...new Set([...(UCS_CFG.MLB_TEAMS || []),
                             ...((WWS.watch && WWS.watch.teams) || [])])];
  for (const abbr of stars) {
    const g = await ucsMlbGame(abbr);
    out.push({ id: 'mlb:' + abbr, kind: 'mlb', league: 'MLB', team: abbr, game: g,
               gamePk: g ? g.gamePk : null });
  }

  // b. curated WWS selections (soccer / tennis / golf / other)
  for (const e of (typeof wwsActive === 'function' ? wwsActive() : [])) {
    const g = (WWS.events && WWS.events[e.espnId]) || null;
    out.push({ id: 'wws:' + e.espnId, kind: wwsInferKind(e), league: e.league,
               label: e.label, event: e, game: g });
  }
  return out;
}

/* ── ★ MLB MATCHUP RESOLVER (R114c) ──────────────────────────────────────────
   The panel's NYY/NYM panes read ESPN's TODAY + YESTERDAY scoreboards and pick a
   game out of that window. That window is a LIE about what a matchup is: during
   the All-Star break the last Yankees game is 4 days back and the panes go blank.
   A story does not stop existing because ESPN's scoreboard rolled over.

   So MLB resolves its OWN matchup, from MLB, over a ±4-day window:
       live  →  today's upcoming  →  most recent final  →  next scheduled
   Same philosophy that made the video layer work: ASK MLB, don't infer from a
   scoreboard. And it hands back the gamePk, so mlbRecap()/mlbPlayClip() never
   have to look it up again.                                                   */
const _ucsMlbCache = new Map();                      // teamId -> {t, game}
async function ucsMlbGame(teamAbbr) {
  const teamId = MLB_TEAM_IDS[teamAbbr];
  if (!teamId) return null;
  const hit = _ucsMlbCache.get(teamId);
  if (hit && Date.now() - hit.t < 60000) return hit.game;     // 60s TTL

  const d = n => new Date(Date.now() + n * 864e5).toISOString().slice(0, 10);
  const url = `https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${teamId}`
            + `&startDate=${d(-4)}&endDate=${d(4)}`;
  let games = [];
  try {
    const raw = await proxyFetchText(url);
    if (raw) games = (JSON.parse(raw).dates || []).flatMap(x => x.games || []);
  } catch (_) { return null; }
  if (!games.length) { _ucsMlbCache.set(teamId, { t: Date.now(), game: null }); return null; }

  const norm = g => {
    const away = g.teams?.away, home = g.teams?.home;
    const st = g.status?.abstractGameState;                   // Preview | Live | Final
    return {
      gamePk: g.gamePk,
      gameDate: g.gameDate,
      gameStatus: st === 'Live' ? 'live' : st === 'Final' ? 'final' : 'upcoming',
      awayAbbr: MLB_ABBR[away?.team?.id] || String(away?.team?.name || '').slice(0, 3).toUpperCase(),
      homeAbbr: MLB_ABBR[home?.team?.id] || String(home?.team?.name || '').slice(0, 3).toUpperCase(),
      awayScore: away?.score ?? null,
      homeScore: home?.score ?? null,
      timeLabel: g.status?.detailedState || ''
    };
  };
  const all = games.map(norm);
  const now = Date.now();
  const live   = all.find(g => g.gameStatus === 'live');
  const upNext = all.filter(g => g.gameStatus === 'upcoming' && new Date(g.gameDate) >= now)
                    .sort((a, b) => new Date(a.gameDate) - new Date(b.gameDate))[0];
  const lastF  = all.filter(g => g.gameStatus === 'final')
                    .sort((a, b) => new Date(b.gameDate) - new Date(a.gameDate))[0];

  // priority: a live game always wins; then an imminent one (< 6h); then the last
  // final (the story we just told); then whatever's next on the calendar.
  const imminent = upNext && (new Date(upNext.gameDate) - now) / 3.6e6 <= 6 ? upNext : null;
  const game = live || imminent || lastF || upNext || null;
  _ucsMlbCache.set(teamId, { t: Date.now(), game });
  return game;
}


/* ── STATE ───────────────────────────────────────────────────────────────────
   ★ THE KEY IDEA: FINAL vs POSTGAME is decided by WHETHER A RECAP ACTUALLY
   EXISTS — not by a timer. The old `_recapFresh` 2-day floor was a GUESS at
   recap availability. For MLB we can now simply ask. A game sits in FINAL
   (score only, no video) and PROMOTES ITSELF to POSTGAME the moment its recap
   is cut. No 107-minute magic number, no guessing.

   TAKEOVER is deliberately NOT resolved here. It is an INTERRUPT owned by the
   Brain, not a state a matchup rests in. Mixing them would let a transient
   moment overwrite a durable story.                                          */
function ucsResolveState(m, hasVideo) {
  const g = m.game;
  if (!g) return 'PREGAME_ANALYSIS';                 // selected, no data yet
  if (g.gameStatus === 'live') return 'LIVE';

  if (g.gameStatus === 'upcoming') {
    const t = g.gameDate ? new Date(g.gameDate).getTime() : null;
    if (!t) return 'PREGAME_ANALYSIS';
    const hrs = (t - Date.now()) / 3.6e6;
    return hrs <= UCS_CFG.IMMINENT_H ? 'PREGAME_IMMINENT' : 'PREGAME_ANALYSIS';
  }

  if (g.gameStatus === 'final') {
    const t = g.gameDate ? new Date(g.gameDate).getTime() : null;
    const ageH = t ? (Date.now() - t) / 3.6e6 : 0;
    if (ageH > UCS_CFG.NEXT_AFTER_H) return 'NEXT';
    return hasVideo ? 'POSTGAME' : 'FINAL';          // ← promoted BY the recap existing
  }
  return 'PREGAME_ANALYSIS';
}

/* ── VIDEO CONTRACT ──────────────────────────────────────────────────────────
   ★ THE HONEST CONTRACT. The card DECLARES what it wants — (matchup, state).
   A per-sport RESOLVER answers. Relevance is a property of the RESOLVER, not of
   a global director:

     MLB       → EXACT.        Queried by gamePk. Cannot be wrong. exact:true
     YouTube   → BEST-EFFORT.  Searched by string. Gates/scoring/regex live HERE,
                               inside this one resolver, not in the architecture.

   That asymmetry is real and the spec must not paper over it. UCS does NOT
   "solve video relevance" globally — it solves it completely for MLB and
   quarantines the hard case to one function.

   Returns: { kind:'mp4'|'iframe', url, title, exact, source } | null
   null is not a failure. It means "this card has no video" — show it static.  */
async function ucsResolveVideo(m, state) {
  if (state !== 'POSTGAME' && state !== 'FINAL') return null;   // only recaps, for now

  if (m.kind === 'mlb') {
    const r = await mlbRecap(m.team, m.gamePk);                  // R111 — exact, bare mp4
    if (!r) return null;
    return { kind: 'mp4', url: r.url, title: r.title, duration: r.duration,
             exact: true, source: 'mlb', gamePk: r.gamePk };
  }

  // ⚠ NOT YET WIRED. The YouTube director stays where it is until UCS has cards
  // to hand it. Deliberately returns null so nothing half-wired can fire a clip.
  return null;
}

/* ── ROTATION ────────────────────────────────────────────────────────────────
   Weighted by state, not equal-time. A live game earns more airtime than a game
   that ended yesterday. Returns the matchups in render order, most-deserving
   first, with their weight — the rotation engine consumes this later.        */
function ucsRotationOrder(snap) {
  return snap.slice().sort((a, b) =>
    (UCS_CFG.WEIGHT[b.state] || 0) - (UCS_CFG.WEIGHT[a.state] || 0));
}

/* ── SNAPSHOT — the single entry point. Everything above, resolved. ───────── */
async function ucsSnapshot() {
  const ms = await ucsMatchups();
  const out = [];
  for (const m of ms) {
    // resolve video FIRST: for a final game, the recap's existence DECIDES the state
    const provisional = ucsResolveState(m, false);
    const video = await ucsResolveVideo(m, provisional);
    const state = ucsResolveState(m, !!video);
    out.push({ id: m.id, kind: m.kind, label: m.label || m.team || m.id,
               state, video, weight: UCS_CFG.WEIGHT[state] || 0, game: m.game });
  }
  return ucsRotationOrder(out);
}

/* ══════════════════════════════════════════════════════════════════════════════
   R116 · THE TAKEOVER COMPANION CLIP.  The crown jewel.
   ------------------------------------------------------------------------------
   Ben Rice hits a go-ahead triple. The takeover card fires. ~30 seconds later THAT
   EXACT TRIPLE plays on the wall. Not a recap. Not a highlight reel. That play.

   ★ WHY THERE IS NO playerId ANYWHERE IN HERE (this is the design, not a shortcut):
   The Brain fires off ESPN's game object. Its candidates carry
   `meta = { game:'NYY@TB', tier, urgency }` — WHICH GAME and WHEN. There is NO
   player identity in a Brain moment, and ESPN's athlete IDs would not match MLB's
   `playerid-` keywords anyway. Mapping ESPN→MLB by name is a brittle layer that
   would rot the first time someone got traded.
   We don't need it. A clip is tagged `gamepk-822708` and TIMESTAMPED. If a big
   thing happened in game X at time T, then THE CLIP THAT APPEARS FOR GAME X
   SHORTLY AFTER T *is* that moment's clip. Game + time is sufficient. Ask MLB.

   ★ WHY IT IS A POLLER, NOT A LOOKUP (the thing I had wrong):
   The Brain fires INSTANTLY. The clip DOES NOT EXIST YET — measured lag is 17–39s.
   A one-shot lookup at fire time finds nothing, forever. So the takeover card goes
   up immediately (unchanged), a watcher polls MLB, and the clip plays when it
   LANDS. The companion is ASYNCHRONOUS. That is the honest resolution of the
   "callback vs companion" question.
   ══════════════════════════════════════════════════════════════════════════════ */
const TKO_CFG = {
  POLL_MS   : 5000,     // MLB cuts clips in 17–39s; 5s polling finds them fast enough
  TIMEOUT_MS: 300000,   // R140: was 120s, but clips didn't post within 2 min on 7/16
                        //   (Baty/Alvarez GAVE UP at 120s yet the clips existed in Gameday).
                        //   Raised to 300s to MATCH MAX_LAG_S — never give up before a clip
                        //   could still legitimately be the moment's clip. (Was internally
                        //   inconsistent: quit at 2 min but accept clips up to 5 min.)
  SKEW_MS   : 90000,    // clock skew allowance between ESPN's clock and MLB's
  MAX_LAG_S : 300       // ★ a clip posted >5 min after the play is NOT that moment's
                        //   clip. Without this ceiling the resolver happily returned
                        //   the post-game PRESSER (lag 17,964s) for every moment.
};

/* ★ WHO just did the thing? The BRAIN can't tell us (no player identity, and ESPN's
   athlete IDs don't match MLB's). But MLB CAN — we know the gamePk, so we ask MLB's
   own live feed for the most recent scoring play and take ITS batter. MLB-native
   playerId, zero ESPN→MLB name mapping, nothing to rot when a player is traded. */
async function mlbMomentPlay(gamePk, aroundMs){
  try {
    const raw = await proxyFetchText('https://statsapi.mlb.com/api/v1.1/game/' + gamePk + '/feed/live');
    if (!raw) return null;
    const all = JSON.parse(raw)?.liveData?.plays?.allPlays || [];
    const scoring = all.filter(p => p.about && p.about.isScoringPlay && p.about.endTime);
    // the scoring play closest to the moment the Brain fired
    let best = null, bestD = Infinity;
    for (const p of scoring){
      const d = Math.abs(new Date(p.about.endTime).getTime() - aroundMs);
      if (d < bestD){ bestD = d; best = p; }
    }
    if (!best || bestD > TKO_CFG.SKEW_MS) return null;
    return { playerId: best.matchup?.batter?.id || null,
             endTime : new Date(best.about.endTime).getTime(),
             desc    : best.result?.description || '' };
  } catch(_) { return null; }
}

/* One-shot: the newest non-recap clip for this game posted at/after `sinceMs`.
   Returns a TYPED MEDIA DESCRIPTOR — the same contract R115 established, so this
   clip can be handed to the exact same player with no special-casing. */
async function mlbCompanionClip(gamePk, sinceMs, playerId){
  const items = await mlbContent(gamePk);
  if (!items.length) return null;
  const cands = items.filter(it => {
    if (mlbIsRecap(it) || mlbIsCondensed(it)) return false;      // never the recap/condensed
    // ★ if MLB told us WHO, require the clip to be tagged with them. This is the
    //   difference between "a clip from this game" and "THAT PLAY'S clip".
    if (playerId && !mlbKw(it).includes('playerid-' + playerId)) return false;
    const t = new Date(it.date || it.timestamp).getTime();
    const lag = (t - sinceMs) / 1000;
    return lag >= -(TKO_CFG.SKEW_MS/1000) && lag <= TKO_CFG.MAX_LAG_S;   // ★ bounded window
  }).sort((a,b) => new Date(a.date||a.timestamp) - new Date(b.date||b.timestamp));  // ★ OLDEST first
  // ★ OLDEST-FIRST, not newest. The companion is the FIRST clip to appear after the
  //   play. Newest-first looked fine live (only one clip exists at poll time) but on
  //   a FINISHED game it returned the last thing posted all night — the presser.
  //   The replay harness caught what a live test never would have.
  const c = cands[0];
  if (!c) return null;
  const url = mlbPickMp4(c);
  if (!url) return null;
  const lagS = Math.round((new Date(c.date||c.timestamp).getTime() - sinceMs) / 1000);
  return { kind:'mp4', url, title: c.headline || c.title || 'Highlight',
           duration: c.duration || null, exact:true, source:'mlb-companion',
           gamePk, lagS };
}

/* The watcher. Starts when a takeover fires; resolves when the clip lands.
   Returns a cancel() so a superseding takeover can kill an in-flight watch. */
function mlbCompanionWatch(gamePk, sinceMs, onClip, onGiveUp, rec){
  const t0 = Date.now();
  let dead = false;
  let moment = null;
  let polls = 0;
  const tick = async () => {
    if (dead) return;
    if (Date.now() - t0 > TKO_CFG.TIMEOUT_MS){
      window._tkoCompanion = 'gave up after ' + Math.round((Date.now()-t0)/1000) + 's';
      onGiveUp && onGiveUp(); return;
    }
    // ask MLB who just did it (once — the answer doesn't change mid-watch).
    // ★ This is ALSO where the ESPN lag becomes measurable: moment.endTime is MLB's
    //   truth for when the play happened; sinceMs is when the BRAIN fired. The gap
    //   between them IS ESPN's feed lag, and nobody has ever measured it.
    if (!moment){
      moment = await mlbMomentPlay(gamePk, sinceMs) || { playerId:null, endTime:sinceMs };
      if (rec) tkoLogUpdate(rec, { playEndMs: moment.endTime, playDesc: moment.desc,
                                   playerId: moment.playerId });
    }
    polls++;
    if (rec) tkoLogUpdate(rec, { polls });
    let clip = null;
    try { _mlbContentCache.delete(gamePk);
          clip = await mlbCompanionClip(gamePk, moment.endTime, moment.playerId); } catch(_){}
    if (dead) return;
    if (clip){
      window._tkoCompanion = 'clip in ' + Math.round((Date.now()-t0)/1000) + 's: ' + clip.title;
      // clip.lagS is measured against the PLAY, so the true post time is play + lag.
      if (rec) tkoLogUpdate(rec, { clipPostMs: moment.endTime + (clip.lagS||0)*1000 });
      onClip(clip); return;
    }
    setTimeout(tick, TKO_CFG.POLL_MS);
  };
  tick();
  return () => { dead = true; };
}

/* Glue: a Brain candidate → the gamePk to watch. meta.game is 'NYY@TB' — we only
   feature NYY/NYM, and the matchup ALREADY carries its gamePk (R114c), so this is
   a lookup in memory, not a network call. */
async function tkoGamePkFor(cand){
  const g = (cand && cand.meta && cand.meta.game) || '';
  for (const abbr of (UCS_CFG.MLB_TEAMS || [])){
    if (g.includes(abbr)){
      const m = await ucsMlbGame(abbr);
      if (m && m.gamePk) return m.gamePk;
    }
  }
  return null;
}

/* ── ?tkotest=1 — REPLAY HARNESS. No live baseball needed. ───────────────────
   Takes a finished game, walks its REAL scoring plays, and asks the companion
   resolver what it WOULD have found at that exact instant. If the clip it returns
   is the clip for that play, with a plausible lag, the companion works — we are
   just replaying a Tuesday instead of waiting for one.
   Then it PLAYS the clip through the R115 media mount, proving the whole chain.  */
if (new URLSearchParams(location.search).get('tkotest') === '1') {
  window.addEventListener('load', async () => {
    const _h = hudMake('tkotest-hud', 'TAKEOVER COMPANION — REPLAY', 'left:1vh;top:1vh;width:62vw;');
    const box = _h.body;
    const log = (m,c) => { const d=document.createElement('div');
      if(c==='ok')d.style.color='#4ade80'; if(c==='bad')d.style.color='#f87171';
      if(c==='hi'){d.style.color='#a5b4fc';d.style.fontWeight='bold';}
      d.textContent=m; box.appendChild(d); box.scrollTop=box.scrollHeight; };

    log('TAKEOVER COMPANION — REPLAY HARNESS (' + BUILD_MARKER + ')', 'hi');
    log('replaying real moments from a finished game. no live baseball needed.\n');

    const pk = (await ucsMlbGame('NYY') || {}).gamePk;
    if (!pk) { log('no NYY gamePk resolved', 'bad'); return; }
    log('gamePk: ' + pk);

    // pull the real play-by-play, take the scoring plays
    const raw = await proxyFetchText('https://statsapi.mlb.com/api/v1.1/game/' + pk + '/feed/live');
    if (!raw) { log('could not fetch live feed', 'bad'); return; }
    const j = JSON.parse(raw);
    const all = j?.liveData?.plays?.allPlays || [];
    const scoring = all.filter(p => p.about && p.about.isScoringPlay);
    log('scoring plays in this game: ' + scoring.length + '\n');

    let hits = 0, best = null, distinct = new Set();
    for (const p of scoring) {
      const T = new Date(p.about.endTime).getTime();
      const who = p.matchup?.batter?.id || null;
      const name = p.matchup?.batter?.fullName || '?';
      log('MOMENT: ' + (p.result?.description || '').slice(0, 58), 'hi');
      log('  MLB says: ' + name + ' (playerid-' + who + ') — no ESPN mapping needed.');
      const clip = await mlbCompanionClip(pk, T, who);
      if (!clip) { log('  ✗ no clip within ' + TKO_CFG.MAX_LAG_S + 's — moment gets no companion', 'bad'); log(''); continue; }

      // ★ FALSIFIABLE. A "pass" must be a clip that is PLAUSIBLY THIS PLAY'S:
      //   (a) posted within the lag ceiling, and (b) not the same clip as every
      //   other moment. The old test called the 5-hour-late presser a pass 7/7.
      const okLag = clip.lagS >= 0 && clip.lagS <= TKO_CFG.MAX_LAG_S;
      distinct.add(clip.url);
      if (okLag) {
        hits++;
        log('  ★ COMPANION: ' + clip.title, 'ok');
        log('    lag: ' + clip.lagS + 's after the play   ·   ' + clip.duration, 'ok');
        if (!best || clip.lagS < best.lagS) best = clip;
      } else {
        log('  ✗ REJECTED: ' + clip.title + ' (lag ' + clip.lagS + 's — not this moment)', 'bad');
      }
      log('');
    }

    log('── VERDICT ──', 'hi');
    log('  ' + hits + ' of ' + scoring.length + ' moments resolved their own clip.',
        hits === scoring.length ? 'ok' : 'bad');
    log('  distinct clips returned: ' + distinct.size + ' of ' + scoring.length
        + (distinct.size > 1 ? '  ✓ (not all the same clip)' : '  ✗ ALL THE SAME CLIP — BOGUS'),
        distinct.size > 1 ? 'ok' : 'bad');
    if (!best) return;
    log('\n  playing the fastest one through the R115 media mount...');
    log('  (same player as the recap. no special-casing. the contract holds.)');

    const host = document.createElement('div');
    host.style.cssText = 'margin-top:8px;position:relative;width:100%;aspect-ratio:16/9;background:#000;';
    box.appendChild(host);
    const v = document.createElement('video');
    v.src = best.url; v.controls = true; v.playsInline = true;
    v.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;';
    v.onplaying = () => log('  ★★ COMPANION CLIP PLAYING — ' + best.title, 'ok');
    v.onerror   = () => log('  ✗ video error', 'bad');
    host.appendChild(v);
    v.play().catch(() => { v.muted = true; v.play().catch(()=>{}); });
  });
}

async function proxyFetch(url) {
  // 1. Try ESPN directly first
  try {
    const res = await fetchWithTimeout(url, 8000);
    if (res.ok){ _proxyMark('direct', true); return await res.json(); }
    _proxyMark('direct', false, 'HTTP '+res.status);
  } catch(e) {
    _proxyMark('direct', false, e.message);
    console.warn('Direct fetch failed, trying proxies:', e.message);
  }

  // 2. Fall back to proxies
  for (const proxy of PROXIES) {
    const proxyUrl = proxy(url);
    let proxyHost = proxyUrl;
    try { proxyHost = new URL(proxyUrl).hostname; } catch {}
    try {
      const res = await fetchWithTimeout(proxyUrl, 10000);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      _proxyMark(proxyHost, true);
      try {
        const wrap = JSON.parse(text);
        return wrap.contents ? JSON.parse(wrap.contents) : wrap;
      } catch(e) {
        return JSON.parse(text);
      }
    } catch(e) {
      _proxyMark(proxyHost, false, e.message);
      console.warn(`Proxy failed (${proxyHost}):`, e.message);
    }
  }
  throw new Error('All fetch attempts failed');
}

// ── Heartbeat mode ────────────────────────────────────────────
// Detects close games in final minutes and pulses the row faster
function getHeartbeatLevel(g, leagueKey) {
  if (g.gameStatus !== 'live' || g.awayScore === null) return 0;
  const margin = Math.abs(g.awayScore - g.homeScore);
  const tl = g.timeLabel || '';

  if (leagueKey === 'NHL') {
    // Parse clock from "3rd · 2:14" or "OT · 1:30"
    const match = tl.match(/(\d+):(\d+)/);
    if (!match) return 0;
    const secsLeft = parseInt(match[1]) * 60 + parseInt(match[2]);
    const period   = tl.includes('OT') ? 4 : parseInt(tl);
    if (period < 3 && !tl.includes('OT')) return 0;
    if (margin > 2) return 0;
    if (secsLeft <= 60  && margin <= 1) return 3;
    if (secsLeft <= 120 && margin <= 1) return 2;
    if (secsLeft <= 300 && margin <= 2) return 1;
  }
  if (leagueKey === 'NBA') {
    const match = tl.match(/Q(\d+)\s*·\s*(\d+):(\d+)/);
    if (!match) return 0;
    const qtr = parseInt(match[1]);
    const secsLeft = parseInt(match[2]) * 60 + parseInt(match[3]);
    if (qtr < 4) return 0;
    if (margin > 6) return 0;
    if (secsLeft <= 60  && margin <= 3) return 3;
    if (secsLeft <= 120 && margin <= 4) return 2;
    if (secsLeft <= 300 && margin <= 6) return 1;
  }
  if (leagueKey === 'MLB') {
    // Final 3 innings, margin ≤ 2
    const inning = g.timeLabel?.match(/(\d+)/)?.[1];
    if (!inning) return 0;
    const inn = parseInt(inning);
    if (inn < 7) return 0;
    if (margin > 2) return 0;
    if (inn >= 9 && margin === 0) return 3;
    if (inn >= 9 && margin <= 1) return 2;
    if (inn >= 7 && margin <= 2) return 1;
  }
  return 0;
}

function updateHeartbeat(leagueKey, games) {
  const row = document.getElementById(`row-${leagueKey}`);
  if (!row) return;
  row.classList.remove('hb-1','hb-2','hb-3');
  const maxLevel = games.reduce((max, g) => {
    return Math.max(max, getHeartbeatLevel(g, leagueKey));
  }, 0);
  if (maxLevel > 0) row.classList.add(`hb-${maxLevel}`);
}

// Round-10 note 5: raw pitch events ("Pitch 4: Ball 2") aren't worth pane space.
// Keep the last MEANINGFUL play per game and show that instead; pitch events
// only advance the count dots, never the last-play block.
const _lpKeep = {};
function meaningfulPlay(g){
  const lp = g && g.lastPlay;
  if (lp && lp.primary && !/^pitch\b/i.test(lp.primary.trim())) { _lpKeep[g.id] = lp; return lp; }
  return _lpKeep[g.id] || null;
}
// ── Split last play into primary (always clean) + secondary (bonus detail) ──
function splitPlay(league, desc) {
  if (!desc) return { primary: '', secondary: '' };
  const d = desc.trim();

  if (league === 'MLB') {
    // "Judge HR (22) — Solo shot, 421 ft" → primary: "Judge HR (22)" secondary: "Solo shot · 421 ft"
    // "Devers RBI double — scores Casas from 2nd" → primary: "Devers RBI double" secondary: "scores Casas from 2nd"
    // "Cole K — swinging, 99 mph four-seamer" → primary: "Cole K" secondary: "99 mph four-seamer"
    const dashSplit = d.split(/\s*[—–-]\s*/);
    if (dashSplit.length >= 2) {
      return {
        primary: dashSplit[0].trim(),
        secondary: dashSplit.slice(1).join(' · ').trim(),
      };
    }
    // Fallback: split on comma
    const commaSplit = d.split(',');
    if (commaSplit.length >= 2) {
      return { primary: commaSplit[0].trim(), secondary: commaSplit.slice(1).join(',').trim() };
    }
    return { primary: d, secondary: '' };
  }

  if (league === 'NHL') {
    // "Draisaitl goal — Unassisted" → "Draisaitl goal" / "Unassisted"
    // "Reinhart goal (23) — assisted by Barkov, Tkachuk" → "Reinhart goal (23)" / "Barkov, Tkachuk"
    const dashSplit = d.split(/\s*[—–-]\s*/);
    let primary = dashSplit[0].trim();

    // If it's a goal and has a season total in parens already, keep it
    // If it's a goal without a total, try to extract from secondary detail
    if (/goal/i.test(primary) && !/\(\d+\)/.test(primary)) {
      // ESPN sometimes puts "(12)" in the secondary — pull it forward if present
      const fullText = d;
      const goalNum = fullText.match(/\((\d+)\s*(?:goals?)?\)/i);
      if (goalNum) primary = primary.replace(/goal/i, `goal (${goalNum[1]})`);
    }

    if (dashSplit.length >= 2) {
      const sec = dashSplit.slice(1).join(' ')
        .replace(/^assisted by /i,'')
        .replace(/\(\d+\s*(?:goals?)?\)/i,'') // remove goal count from secondary if moved to primary
        .trim();
      return { primary, secondary: sec };
    }
    return { primary, secondary: '' };
  }

  if (league === 'NBA') {
    // "Brunson three-pointer — off the glass" → "Brunson 3-pointer" / "off the glass"
    // "KD three-pointer — assisted by Gilgeous-Alexander" → "KD 3-pointer" / "by GGA"
    // "Wembanyama dunk — off the lob from GGA" → "Wembanyama dunk" / "off the lob"
    const dashSplit = d.split(/\s*[—–-]\s*/);
    let primary = dashSplit[0].trim()
      .replace(/three-pointer/i,'3-pointer')
      .replace(/two-pointer/i,'2-pointer');
    let secondary = dashSplit.length >= 2
      ? dashSplit.slice(1).join(' ').replace(/^assisted by /i,'').trim()
      : '';
    return { primary, secondary };
  }

  // Generic fallback
  const dashSplit = d.split(/\s*[—–-]\s*/);
  return dashSplit.length >= 2
    ? { primary: dashSplit[0].trim(), secondary: dashSplit.slice(1).join(' ').trim() }
    : { primary: d, secondary: '' };
}

// ── Play icon helper ──────────────────────────────────────────
function playIcon(league, desc) {
  if (!desc) return '📋';
  const d = desc.toLowerCase();
  if (league==='NHL') { return d.includes('goal')?'🚨':d.includes('penalty')?'🟨':'🏒'; }
  if (league==='NBA') { return d.includes('three')||d.includes('3-point')?'🎯':d.includes('dunk')?'💥':'🏀'; }
  if (league==='MLB') { return d.includes('hr')||d.includes('home run')?'💥':d.includes('strikeout')||d.includes('struck')?'🔴':d.includes('walk')?'🟢':'⚾'; }
  return '📋';
}

// ── Parse ESPN event ──────────────────────────────────────────
function ordinal(n){return n===1?'st':n===2?'nd':n===3?'rd':'th';}
// B1b (r145): read a cached MLB-fed hit count. Returns null unless a FRESH numeric
// value exists — null keeps _isNoHit() silent, which is the safe default.
function _b1bHit(awayAbbr, homeAbbr, side){
  try {
    const e = _hitsByGameKey.get(awayAbbr + '@' + homeAbbr);
    if (!e || Date.now() - e.t > B1B_HITS_TTL) return null;
    return typeof e[side] === 'number' ? e[side] : null;
  } catch (_) { return null; }
}

function parseEvent(ev, leagueKey) {
  const comp   = ev.competitions?.[0];
  const status = ev.status;
  /* ★ r152 — POSTPONED GAMES ARE NOT FINALS. ESPN's model is pre|in|post, and a
     POSTPONEMENT MOVES THE GAME TO 'post' — the same terminal state as a real final.
     The only thing separating them is status.type.completed (false when postponed),
     which this file never read. Field case 7/18: NYY @ LAD was postponed before first
     pitch; the panel flipped pre→post, called it FINAL, and the recap-delay tracker
     "witnessed" a final at 5:03 PM and sat waiting for a recap that can never exist —
     664 polls and climbing, since MLB doesn't cut a recap for a game nobody played.
     Normalising here rather than at each branch: 'state' has ~11 consumers (scores,
     NHL/other post handling, probable pitchers, timeLabel, tracker), and a postponed
     game should read as UPCOMING to every one of them. When MLB reschedules, it
     becomes a genuine upcoming game with no further intervention. */
  const _rawState  = status?.type?.state;
  const _postponed = _rawState === 'post' && status?.type?.completed === false;
  const state  = _postponed ? 'pre' : _rawState;
  const detail = status?.type?.shortDetail || '';
  const clock  = status?.displayClock || '';
  const period = status?.period || 0;
  const sit    = comp?.situation;
  const comps  = comp?.competitors || [];
  const away   = comps.find(c=>c.homeAway==='away') || comps[0] || {};
  const home   = comps.find(c=>c.homeAway==='home') || comps[1] || {};

  const awayAbbr  = normalizeAbbr(leagueKey, away.team?.abbreviation || '???');
  const homeAbbr  = normalizeAbbr(leagueKey, home.team?.abbreviation || '???');
  const awayScore = state!=='pre' ? parseInt(away.score??0,10) : null;
  const homeScore = state!=='pre' ? parseInt(home.score??0,10) : null;
  const id        = ev.id || `${awayAbbr}-${homeAbbr}`;

  // ── Season record (W-L or W-L-OTL) ──────────────────────────
  const awayRecord = away.records?.[0]?.summary || null;
  const homeRecord = home.records?.[0]?.summary || null;

  // ── Linescores (period-by-period) ────────────────────────────
  let linescores = null;
  if (state === 'post' && leagueKey !== 'MLB') {
    const awayLines = away.linescores?.map(l => l.value ?? l.displayValue ?? '-') || [];
    const homeLines = home.linescores?.map(l => l.value ?? l.displayValue ?? '-') || [];
    if (awayLines.length) linescores = { away: awayLines, home: homeLines };
  }

  // ── Top performers ────────────────────────────────────────────
  let topPerformers = null;
  const getTopFromComp = comp => {
    // Prefer 'rating' (full stat line); fall back to first leader category (points/goals)
    const cats = comp?.leaders || [];
    const ratingCat = cats.find(l => l.name === 'rating' || l.abbreviation === 'RAT');
    const cat = ratingCat || cats[0];
    const leader = cat?.leaders?.[0];
    if (!leader?.athlete) return null;
    const name = leader.athlete.shortName || leader.athlete.displayName;
    let stat = leader.displayValue || null;
    // Bare number (e.g. "32") → append category label ("32 PTS")
    if (stat && /^[\d.]+$/.test(stat.trim()) && cat.shortDisplayName) {
      stat = `${stat} ${cat.shortDisplayName.toUpperCase()}`;
    }
    const headshotUrl = typeof leader.athlete.headshot === 'string'
      ? leader.athlete.headshot : leader.athlete.headshot?.href || null;
    const img = headshotUrl ? `https://images.weserv.nl/?url=${encodeURIComponent(headshotUrl)}&w=80&output=png` : null;
    return name && stat ? { name, stat, img } : null;
  };
  const awayTop = getTopFromComp(away);
  const homeTop = getTopFromComp(home);
  const performers = [awayTop, homeTop].filter(Boolean);
  if (performers.length) topPerformers = performers;

  // ── NHL Three Stars — synthesized from both teams' leader categories ──
  if (leagueKey === 'NHL' && state === 'post') {
    const players = {}; // athleteId → {name, pos, teamAbbr, g, a, pts, img}
    [[away, awayAbbr],[home, homeAbbr]].forEach(([c, abbr]) => {
      (c?.leaders || []).forEach(cat => {
        (cat.leaders || []).forEach(l => {
          const a = l.athlete; if (!a) return;
          const p = players[a.id] = players[a.id] || {
            name: a.shortName || a.displayName, pos: a.position?.abbreviation || '',
            teamAbbr: abbr, g: null, a: null, pts: null,
            img: typeof a.headshot === 'string' ? `https://images.weserv.nl/?url=${encodeURIComponent(a.headshot)}&w=80&output=png` : null,
          };
          if (cat.abbreviation === 'G')   p.g   = l.value;
          if (cat.abbreviation === 'A')   p.a   = l.value;
          if (cat.abbreviation === 'PTS') p.pts = l.value;
        });
      });
    });
    const ranked = Object.values(players)
      .map(p => ({...p, score: (p.pts ?? (p.g||0)+(p.a||0))}))
      .sort((x,y) => y.score - x.score)
      .slice(0,3);
    if (ranked.length) {
      topPerformers = ranked.map((p,i) => ({
        name: p.name,
        stat: `${p.pos ? p.pos+' - ' : ''}${p.teamAbbr} · ${p.g!==null||p.a!==null ? `${p.g||0} G, ${p.a||0} A` : `${p.pts} PTS`}`,
        img: p.img, stars: i+1,
      }));
    }
  }

  const awaySeed = (away.seed && away.seed !== 99) ? away.seed : null;
  const homeSeed = (home.seed && home.seed !== 99) ? home.seed : null;
  const isPlayoffs = !!(ev.notes?.[0]?.headline || comp?.series?.summary);
  let lastPlay = null;
  const rawPlay = sit?.lastPlay?.text || sit?.lastPlay?.description || null;
  if (rawPlay && state==='in') {
    const { primary, secondary } = splitPlay(leagueKey, rawPlay);
    lastPlay = { icon: playIcon(leagueKey, rawPlay), primary, secondary };
  }

  // ── OT detection ─────────────────────────────────────────────
  const isOT = state==='in' && (
    (leagueKey==='NHL' && period >= 4) ||
    (leagueKey==='NBA' && period > 4)  ||
    (leagueKey==='MLB' && period > 9)
  );

  // ── MLB situation (runners + BSO) ─────────────────────────────
  let situation = null;
  if (leagueKey==='MLB' && state==='in' && sit) {
    situation = {
      onFirst:    !!(sit.onFirst),
      onSecond:   !!(sit.onSecond),
      onThird:    !!(sit.onThird),
      balls:      sit.balls   ?? null,
      strikes:    sit.strikes ?? null,
      outs:       sit.outs    ?? null,
      batter:     sit.batter?.athlete?.displayName || sit.batter?.displayName || null,
      batterStats:sit.batter?.summary || null,
      pitcher:    sit.pitcher?.athlete?.displayName || sit.pitcher?.displayName || null,
      pitchCount: sit.pitcher?.pitchCount ?? null,
      // P1-Brain: R/H/E for no-hitter/perfect-game detection (ESPN competitor top-level ints)
      // B1b (r145): ESPN's competitor.hits is undefined LIVE (proven), so these are
      // null exactly when the no-hitter detector needs them. Fall back to the MLB-fed
      // cache (populated fire-and-forget by b1bHydrateHits on the previous poll).
      // ESPN wins when it actually has a number; stale cache entries are ignored.
      // B1b (r145, exonerated r149b): ESPN's competitor.hits is undefined LIVE, so
      // fall back to the MLB-fed cache (fire-and-forget hydrate, previous poll).
      awayHits:   (away.hits!=null)?parseInt(away.hits,10):_b1bHit(awayAbbr,homeAbbr,'away'),
      homeHits:   (home.hits!=null)?parseInt(home.hits,10):_b1bHit(awayAbbr,homeAbbr,'home'),
      awayErrors: (away.errors!=null)?parseInt(away.errors,10):null,
      homeErrors: (home.errors!=null)?parseInt(home.errors,10):null,
      half:       (detail.match(/^(Top|Bot|Mid|End)/i)||[])[0] || null,  // inning half for walk-off/batting-team logic
      inning:     period || null,
    };
  }

  // ── Series info ───────────────────────────────────────────────
  const rawSummary = comp?.series?.summary || null;
  // Normalize ESPN's short NBA team codes in series summary text
  const seriesSummary = rawSummary ? rawSummary
    .replace(/\bNY\b/g, 'NYK')
    .replace(/\bGS\b/g, 'GSW')
    .replace(/\bSA\b/g, 'SAS')
    .replace(/\bNO\b/g, 'NOP')
    .replace(/\bUTAH\b/g, 'UTA') : null;
  const roundTitle = ev.notes?.[0]?.headline || null;

  // ── Intermission detection ────────────────────────────────────
  // ESPN signals intermission via shortDetail containing "End of", "Intermission", or "Mid-Period"
  const isIntermission = state==='in' && leagueKey==='NHL' && (
    /end of|intermission|mid-period/i.test(detail)
  );

  // ── Time label ────────────────────────────────────────────────
  let gameStatus='upcoming', timeLabel='', intermissionAfterPeriod=0;
  if (state==='in') {
    gameStatus='live';
    if (leagueKey==='MLB') {
      timeLabel = (detail && /top|bot|mid|end/i.test(detail)) ? detail
        : `${sit?.isTopHalf===false?'Bot':'Top'} ${period}${ordinal(period)}`;
    } else if (leagueKey==='NHL') {
      if (isIntermission) {
        // Figure out which intermission — after period 1 or 2
        intermissionAfterPeriod = period;
        const intName = period===1 ? '1st Intermission' : period===2 ? '2nd Intermission' : 'Intermission';
        timeLabel = intName;
      } else {
        const p = period===4?'OT':period===5?'2OT':`${period}${ordinal(period)}`;
        timeLabel = clock&&clock!=='0:00' ? `${p} · ${clock}` : p;
      }
    } else {
      const p = period>4?`OT${period-4}`:`Q${period}`;
      timeLabel = clock&&clock!=='0:00' ? `${p} · ${clock}` : p;
    }
    // ══ R105 INFERRED FINAL (?nofinalinfer=1 to disable — REVERSE IF INEFFECTIVE) ══
    // ESPN lags its own status flag: Mike saw NYY (road) up 5-3 showing "End 9th" long
    // after the game was actually over, which delayed the FINAL takeover. Same root cause
    // as the WALK-OFF GAP (LAA@TEX): a walk-off's winning run and the game-end happen on
    // the SAME play, so by the next 30s poll ESPN may still say 'in' — and the Brain, which
    // only fires walk-offs on LIVE games, misses it entirely.
    //
    // FIX: if the outcome is MATHEMATICALLY SETTLED, call it final ourselves. We only infer
    // from unambiguous states, and require the state to PERSIST ACROSS 2 POLLS before
    // committing (cheap insurance against a transient feed glitch / scoring correction).
    //   • inning >= 9, END/MID of inning, either team ahead  → final (last at-bat is done)
    //   • inning >= 9, BOTTOM half, HOME team ahead          → WALK-OFF, final immediately
    //   • inning >= 9, tied                                  → NOT final (extras)
    if (!window._noFinalInfer && leagueKey === 'MLB' && gameStatus === 'live' && period >= 9 && awayScore != null && homeScore != null && awayScore !== homeScore){
      const lbl = String(timeLabel || '');
      const isEnd    = /^end/i.test(lbl);                   // BOTTOM half complete → next inning's top
      const isMid    = /^mid/i.test(lbl);                   // TOP half complete → HOME still bats (bottom)
      const isBottom = /^bot/i.test(lbl);
      const homeAhead = homeScore > awayScore;
      // R150 FIX (Mike caught live: "Mid 9th, NYM 4 @ PHI 1" wrongly inferred FINAL —
      // PHI is HOME and still bats in the bottom 9th). Correct baseball end-conditions >=9th:
      //   * END  (bottom complete): someone ahead        -> final
      //   * MID  (top complete): ONLY final if HOME already ahead (else home bats) <- the bug
      //   * BOT  in progress: HOME ahead                 -> walk-off, final
      //   * TOP  in progress                             -> never (bottom still to come)
      // Verified 10/10 truth-table incl. Mid/away-ahead=NOT final and the inverse.
      const settled = isEnd || (isMid && homeAhead) || (isBottom && homeAhead);
      if (settled){
        window._inferFinal = window._inferFinal || {};
        const prev = window._inferFinal[id];
        // require the SAME settled state on 2 consecutive polls before committing
        if (prev && prev.a === awayScore && prev.h === homeScore && prev.lbl === lbl){
          gameStatus = 'final';
          timeLabel  = 'Final';
          window._inferFinalFired = window._inferFinalFired || {};
          if (!window._inferFinalFired[id]){
            window._inferFinalFired[id] = true;
            const walkoff = isBottom && homeAhead;
            console.log(`[R105] inferred FINAL${walkoff ? ' (WALK-OFF)' : ''}: ${awayAbbr} ${awayScore} @ ${homeAbbr} ${homeScore} — ESPN still said "${lbl}"`);
          }
        } else {
          window._inferFinal[id] = { a: awayScore, h: homeScore, lbl };
        }
      }
    }
  } else if (state==='post') {
    gameStatus='final';
    timeLabel = detail.startsWith('F/') ? detail : (detail||'Final');
    if (window._inferFinal) delete window._inferFinal[id];   // R105: ESPN caught up; clear tracker
  } else {
    gameStatus='upcoming';
    try {
      const gameDate = new Date(ev.date);
      const now = new Date();
      const tomorrow = new Date(now); tomorrow.setDate(now.getDate()+1);
      const dayAfter  = new Date(now); dayAfter.setDate(now.getDate()+2);
      const timeStr = gameDate.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
      if (gameDate.toDateString()===now.toDateString()) timeLabel=`Tonight · ${timeStr}`;
      else if (gameDate.toDateString()===tomorrow.toDateString()) timeLabel=`Tomorrow · ${timeStr}`;
      else if (gameDate.toDateString()===dayAfter.toDateString()) timeLabel=`${gameDate.toLocaleDateString('en-US',{weekday:'short'})} · ${timeStr}`;
      else timeLabel=`${gameDate.toLocaleDateString('en-US',{month:'short',day:'numeric'})} · ${timeStr}`;
    } catch { timeLabel=detail; }
    // r152: ...but a postponed game must not advertise its dead first-pitch time.
    // ESPN's own shortDetail ("Postponed") is authoritative; fall back to the word.
    if (_postponed) timeLabel = detail || 'Postponed';
  }

  // ── Broadcast network ─────────────────────────────────────────
  const broadcasts = comp?.broadcasts || ev.competitions?.[0]?.broadcasts || [];
  let network = broadcasts?.[0]?.names?.[0] || broadcasts?.[0]?.market?.shortName || null;
  // ESPN's public scoreboard API mostly only reports national deals (FOX,
  // ESPN, TBS, Apple TV+) or the generic MLB.TV streaming fallback — it
  // doesn't carry regional sports network (blackout) data. Since YES/SNY are
  // the actual local broadcasters for every Yankees/Mets game that isn't on
  // a national network, override the generic MLB.TV fallback specifically
  // for those two teams rather than showing a less useful default.
  network = resolveNetwork(network, awayAbbr, homeAbbr);

  // ── Next game info ────────────────────────────────────────────
  // Check multiple ESPN API locations for next event date
  let nextGame = null;
  const nextDate = comp?.series?.nextEventDate
    || comp?.series?.events?.find(e => new Date(e.date) > new Date())?.date
    || null;

  if (nextDate) {
    try {
      const nd = new Date(nextDate);
      if (!isNaN(nd.getTime())) {
        const now = new Date();
        const tomorrow = new Date(now); tomorrow.setDate(now.getDate()+1);
        const timeStr = nd.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
        let label;
        if (nd.toDateString()===now.toDateString())           label='Tonight';
        else if (nd.toDateString()===tomorrow.toDateString()) label='Tomorrow';
        else label=nd.toLocaleDateString('en-US',{weekday:'long'});
        nextGame = { label, time: timeStr, network };
      }
    } catch(e) {}
  }

  // ── Pitcher decisions (MLB final) ──────────────────────────────
  // NOTE: this bulk scoreboard feed has no win/loss/save data anywhere in it
  // (confirmed via debug dump — situation/decisions/leaders all lack it).
  // Real decision data comes from a separate per-game summary fetch, applied
  // on top of this game object later (see _decisionsCache / ensureDecisions).
  const decisions = null;


  // ── Probable pitchers (MLB upcoming only) ─────────────────────
  let pitchers = null;
  if (leagueKey === 'MLB' && state !== 'in' && state !== 'post') {
    const parsePitcher = p => {
      if (!p?.athlete && !p?.displayName) return null;
      const athlete = p.athlete || p;
      const name = athlete.shortName || athlete.displayName || null;
      const id   = athlete.id || null;
      const stats = p.statistics || athlete.statistics || [];
      const era   = stats.find(s => s.name==='ERA'||s.abbreviation==='ERA')?.displayValue || null;
      const wins  = stats.find(s => s.name==='wins'||s.abbreviation==='W')?.displayValue || null;
      const loss  = stats.find(s => s.name==='losses'||s.abbreviation==='L')?.displayValue || null;
      const record = (wins!==null&&loss!==null) ? `${wins}-${loss}` : null;
      const rawImg = athlete.headshot?.href
        || (id ? `https://a.espncdn.com/combiner/i?img=/i/headshots/mlb/players/full/${id}.png&w=120&h=88` : null);
      const img = rawImg ? `https://images.weserv.nl/?url=${encodeURIComponent(rawImg)}&w=120&output=png` : null;
      return name ? { name, era, record, img } : null;
    };

    // ESPN puts probables in multiple places depending on API version
    // Try: competitor.probables[], comp.probables[], comp.pitchers[]
    const findProbable = (competitor, side) => {
      // Method 1: competitor.probables array (most common)
      if (competitor?.probables?.length) return parsePitcher(competitor.probables[0]);
      // Method 2: comp.probables filtered by side
      const compProbables = comp?.probables || [];
      const sideP = compProbables.find(p =>
        p.homeAway === side || p.team?.abbreviation === competitor?.team?.abbreviation);
      if (sideP) return parsePitcher(sideP);
      // Method 3: top-level pitchers on competition
      const pitchersList = comp?.pitchers || [];
      const sideP2 = pitchersList.find(p => p.homeAway === side);
      if (sideP2) return parsePitcher(sideP2);
      return null;
    };

    const awayP = findProbable(away, 'away');
    const homeP = findProbable(home, 'home');
    if (awayP || homeP) pitchers = { away: awayP, home: homeP };
  }

  return {id,awayAbbr,homeAbbr,awayScore,homeScore,gameStatus,timeLabel,gameDate:ev.date,postponed:_postponed,
          seriesSummary,roundTitle,lastPlay,isOT,isIntermission,intermissionAfterPeriod,
          awayRecord,homeRecord,awaySeed,homeSeed,isPlayoffs,network,nextGame,pitchers,situation,
          linescores,topPerformers,decisions};
}

// ── Score change detection ────────────────────────────────────
function checkScoreChanges(games, leagueKey) {
  games.forEach(g => {
    // Track intermission start
    if (g.isIntermission) {
      const key = `${g.id}-int${g.intermissionAfterPeriod}`;
      if (!intermissionStarts[key]) {
        intermissionStarts[key] = { startedAt: Date.now(), afterPeriod: g.intermissionAfterPeriod };
      }
      g._intKey = key; // attach key for chip rendering
    }
    if (g.gameStatus!=='live'||g.awayScore===null) return;
    const prev = prevScores[g.id];
    if (prev && (prev.away!==g.awayScore||prev.home!==g.homeScore)) {
      const row = document.getElementById(`row-${leagueKey}`);
      if (row) {
        row.classList.remove('score-flash');
        void row.offsetWidth;
        row.classList.add('score-flash');
        setTimeout(()=>row.classList.remove('score-flash'),1300);
      }
    }
    prevScores[g.id] = {away:g.awayScore,home:g.homeScore};
  });
}

function updateOTGlow(leagueKey, games) {
  const row = document.getElementById(`row-${leagueKey}`);
  if (!row) return;
  row.classList.toggle('ot-glow', games.some(g=>g.isOT&&g.gameStatus==='live'));
}

// ── Team color row tinting removed — panel bleed handles color identity ──
function applyTeamColorToRow(lg, games) {
  const ca = document.getElementById(lg.caId);
  if (ca) ca.style.background = 'transparent';
  const fr = document.getElementById(lg.frId);
  if (fr) fr.style.background = 'linear-gradient(to left,#0a0c12,transparent)';
}

// ── Network bug helper ────────────────────────────────────────
function networkLabel(network) {
  if (!network) return '';
  return network.replace(/Apple TV\+/i,'Apple TV+').replace(/ESPN\d*/i,m=>m.toUpperCase()).trim();
}
function networkClass(network) {
  if (!network) return '';
  const n = network.toLowerCase();
  if (/^yes$/.test(n))       return ' net-yes';
  if (/^sny$/.test(n))       return ' net-sny';
  if (n.includes('espn'))    return ' net-espn';
  if (n.includes('abc'))     return ' net-abc';
  if (n.includes('fox'))     return ' net-fox';
  if (n.includes('tnt'))     return ' net-tnt';
  if (n.includes('tbs'))     return ' net-tbs';
  if (n.includes('nbc'))     return ' net-nbc';
  if (n.includes('peacock')) return ' net-peacock';
  if (n.includes('apple'))   return ' net-apple';
  if (n.includes('prime'))   return ' net-prime';
  if (/mlb\.?\s*tv/.test(n)) return ' net-mlbtv';
  return '';
}

const PGA_LOGO = '@@ASSET_016@@';
const WIMB_LOGO = '@@ASSET_017@@';
const NET_LOGOS = {YES:'@@ASSET_000@@',SNY:'@@ASSET_001@@',prime:'@@ASSET_002@@',FOX:'@@ASSET_003@@',NBC:'@@ASSET_004@@',ESPN:'@@ASSET_005@@',TBS:'@@ASSET_006@@',FS1:'@@ASSET_007@@',ABC:'@@ASSET_008@@',peacock:'@@ASSET_009@@',appletv:'@@ASSET_010@@'};
NET_LOGOS.TNT='@@ASSET_011@@';
NET_LOGOS.MLBTV='@@ASSET_012@@';
NET_LOGOS.YES='@@ASSET_013@@';
function networkLogoSrc(network){
  if(!network) return '';
  const n = String(network).toLowerCase();
  if(/\bfs1\b/.test(n)) return NET_LOGOS.FS1;
  if(n.includes('yes')) return NET_LOGOS.YES;
  if(n.includes('sny')) return NET_LOGOS.SNY;
  if(n.includes('espn')) return NET_LOGOS.ESPN;
  if(n.includes('abc')) return NET_LOGOS.ABC;
  if(n.includes('fox')) return NET_LOGOS.FOX;
  if(n.includes('tbs')) return NET_LOGOS.TBS;
  if(n.includes('nbc')) return NET_LOGOS.NBC;
  if(n.includes('peacock')) return NET_LOGOS.peacock;
  if(n.includes('apple')) return NET_LOGOS.appletv;
  if(n.includes('prime')||n.includes('amazon')) return NET_LOGOS.prime;
  if(n.includes('tnt')) return NET_LOGOS.TNT;
  if(/mlb\.?\s*tv/.test(n)) return NET_LOGOS.MLBTV;
  return '';
}
// Network bug: render the transparent logo float when we have an asset for the
// channel, else fall back to the original text pill (TNT, MLB.TV, etc.).
function netBug(network, pillClass, variant, label, forceLogo){
  if(!network) return '';
  const src = (_netBugsOn || forceLogo) ? networkLogoSrc(network) : null;   // R42: default text pill; R44: forceLogo=WC pane always shows logo (looks better than pill there)
  if(src){
    const v = variant==='chip' ? ' nl-chip' : variant==='sm' ? ' nl-sm' : '';
    return `<img class="net-logo${v}" src="${src}" alt="${(label!=null?label:network)}">`;
  }
  return `<span class="${pillClass}${networkClass(network)}">${label!=null?label:network}</span>`;
}

// Tracks previous on/off state per game so situationHtml can tell a freshly-lit
// base/ball/strike/out (deserves a light-up animation) from one that was already
// lit last render (should stay steady, not re-animate every refresh cycle).
const lastSituationState = {};
const lastKnownScores = {};

function situationHtml(sit, gameId) {
  if (!sit) return '';
  const prev = gameId ? (lastSituationState[gameId] || {}) : {};
  const cur = { onFirst:!!sit.onFirst, onSecond:!!sit.onSecond, onThird:!!sit.onThird,
    balls:sit.balls||0, strikes:sit.strikes||0, outs:sit.outs||0 };
  if (gameId) lastSituationState[gameId] = cur;

  // SVG: 100x80, bases at top/left/right only (no home plate)
  // Each base is a 22x22 rotated square, centered with padding to avoid clipping
  const base = (on, wasOn, cx,cy) => {
    const fill   = on ? '#fbbf24' : 'rgba(255,255,255,0.07)';
    const stroke = on ? '#ffd700' : 'rgba(255,255,255,0.15)';
    const sw     = on ? '2.5' : '1.5';
    const glow   = on ? `filter="url(#baseGlow)"` : '';
    const justLit = on && !wasOn ? ' base-just-lit' : '';
    return `<rect class="sit-base${justLit}" x="${cx-16}" y="${cy-16}" width="32" height="32" rx="3"
      fill="${fill}" stroke="${stroke}" stroke-width="${sw}"
      transform="rotate(45 ${cx} ${cy})" ${glow}/>`;
  };
  const diamond = `<svg class="sit-diamond" width="250" height="200" viewBox="-20 -20 150 120" overflow="visible">
    <defs>
      <filter id="baseGlow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="4" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    ${base(cur.onSecond, prev.onSecond, 55, 5)}
    ${base(cur.onThird,  prev.onThird,  5, 55)}
    ${base(cur.onFirst,  prev.onFirst,  105, 55)}
  </svg>`;
  const dot = (on, wasOn, cls) => `<div class="bso-dot${on?' '+cls:''}${on && !wasOn?' dot-just-lit':''}"></div>`;
  const bso = `<div class="sit-bso">
    <div class="bso-col"><span class="bso-lbl">B</span><div class="bso-dots">
      ${dot(cur.balls>=1,prev.balls>=1,'on-b')}${dot(cur.balls>=2,prev.balls>=2,'on-b')}${dot(cur.balls>=3,prev.balls>=3,'on-b')}${dot(cur.balls>=4,prev.balls>=4,'on-b')}
    </div></div>
    <div class="bso-col"><span class="bso-lbl">S</span><div class="bso-dots">
      ${dot(cur.strikes>=1,prev.strikes>=1,'on-s')}${dot(cur.strikes>=2,prev.strikes>=2,'on-s')}
    </div></div>
    <div class="bso-col"><span class="bso-lbl">O</span><div class="bso-dots">
      ${dot(cur.outs>=1,prev.outs>=1,'on-o')}${dot(cur.outs>=2,prev.outs>=2,'on-o')}${dot(cur.outs>=3,prev.outs>=3,'on-o')}
    </div></div>
  </div>`;
  return `<div class="sit-divider"></div>
    <div class="sit-block">${diamond}${bso}</div>`;
}

function chipHtml(g, leagueKey) {
  const has      = g.awayScore !== null;
  const awayW    = has && g.awayScore > g.homeScore;
  const homeW    = has && g.homeScore > g.awayScore;
  const live     = g.gameStatus === 'live';
  const upcoming = g.gameStatus === 'upcoming';
  const isPlayoff = !!(g.seriesSummary || g.roundTitle || g.isPlayoffs);

  const badgeCls = live?'s-live':g.gameStatus==='final'?'s-final':'s-soon';
  const badgeTxt = live?'● LIVE':g.gameStatus==='final'?'FINAL':'UPCOMING';

  // Team colors — used by row gradient (applied separately in applyTeamColorToRow)
  const homeColorHex = getTeamColor(leagueKey, g.homeAbbr);
  const awayColorHex = getTeamColor(leagueKey, g.awayAbbr);

  function logoHtml(abbr, isWinner) {
    const url      = teamLogoUrl(leagueKey, abbr);
    const color    = getTeamColor(leagueKey, abbr) || 'rgba(255,255,255,0.3)';
    const ringStyle= `border-color:${color};`;
    const imgOrFb  = url
      ? `<img class="t-logo${abbr==='NYY'?' nyy-logo':''}" src="${url}" alt="${abbr}"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
         <div class="t-logo-fb" style="display:none">${abbr.slice(0,3)}</div>`
      : `<div class="t-logo-fb">${abbr.slice(0,3)}</div>`;
    return `<div class="t-logo-wrap${live?' live-ring':''}">
      ${imgOrFb}
      <div class="t-logo-ring" style="${ringStyle}"></div>
    </div>`;
  }

  function scoreHtml(score, isWinner, abbr) {
    if (score === null || score === undefined) return '';
    const color = getTeamColor(leagueKey, abbr);
    const glowStyle = (isWinner && color && live) ? `--team-color:${color};` : '';
    const glowCls   = (isWinner && live) ? ' glow' : '';
    return `<span class="t-score${isWinner?' w':''}${glowCls}" style="${glowStyle}" data-score-id="${g.id}-${abbr}">${score}</span>`;
  }

  // Record or seed display — playoff shows seed, regular season shows record
  function metaHtml(abbr, record, seed) {
    if (record) return `<div class="t-meta"><span class="t-record">${record}</span></div>`;
    return '';
  }

  const timeParts = g.timeLabel.split(' · ');
  const timeHtml  = timeParts.length===2
    ? `<span class="chip-time-label">${timeParts[0]}</span><span class="chip-time-value">${timeParts[1]}</span>`
    : `<span class="chip-time-value">${g.timeLabel}</span>`;

  const _mp = meaningfulPlay(g);
  const lastPlayHtml = (live && _mp)
    ? `<div class="last-play">
         <span class="last-play-icon">${_mp.icon||''}</span>
         <div class="last-play-text">
           <span class="last-play-label">Last Play</span>
           <span class="last-play-primary">${_mp.primary}</span>

         </div>
       </div>` : '';

  // ── Rivalry detection ─────────────────────────────────────
  const isRivalry = RIVALRY_TEAMS.has(g.awayAbbr) || RIVALRY_TEAMS.has(g.homeAbbr);
  const rivalryTeam = RIVALRY_TEAMS.has(g.awayAbbr) ? g.awayAbbr : g.homeAbbr;
  const rivalryColor = RIVALRY_COLORS[rivalryTeam] || 'rgba(255,255,255,0.4)';
  const rivalryCls = isRivalry ? ' rivalry' : '';
  const rivalryStyle = isRivalry ? `--rivalry-color:${rivalryColor};` : '';
  // LIVE/UPCOMING: badge left, time block right
  // FINAL (plain): no badge left, "FINAL" badge right, no time block
  // FINAL (extras e.g. F/10, Final/OT): no badge left, time block shows extras, no redundant badge
  // Badge + time ordering:

  // UPCOMING: teams → TONIGHT/time → UPCOMING badge

  const isUpcoming = g.gameStatus === 'upcoming';

  const liveLeftBadge = live

  // ── Time block ───────────────────────────────────────────────

  let timeBlock;
  if (g.isIntermission && g._intKey) {
    const isPlayoffs = !!(g.seriesSummary || g.roundTitle);
    const elapsed    = Math.floor((Date.now() - (intermissionStarts[g._intKey]?.startedAt || Date.now())) / 1000);
    const total      = getIntermissionLength(g._intKey, isPlayoffs);
    const remaining  = Math.max(0, total - elapsed);
    const countdownTxt = getIntermissionCountdown(g._intKey, isPlayoffs);

  // For live MLB, wrap time + situation together in Option C layout

    };
    const divPill = (abbr) => {

    };

    return `<div class="chip mlb-pregame-chip${rivalryCls}" data-id="${g.id}" style="${rivalryStyle}">

        <div class="mlb-pregame-team">
          ${pgLogo(g.awayAbbr)}
          <div class="mlb-pregame-info">
            <span class="mlb-pregame-abbr">${g.awayAbbr}</span>
            <span class="mlb-pregame-record">${g.awayRecord||''}</span>
            ${divPill(g.awayAbbr)}
          </div>
          ${pregamePitcher(g.pitchers?.away, 'Away')}
        </div>
        <div class="mlb-pregame-sep"></div>
        <div class="mlb-pregame-team">
          ${pgLogo(g.homeAbbr)}
          <div class="mlb-pregame-info">
            <span class="mlb-pregame-abbr">${g.homeAbbr}</span>
            <span class="mlb-pregame-record">${g.homeRecord||''}</span>
            ${divPill(g.homeAbbr)}

  return `<div class="chip${rivalryCls}${g.gameStatus==='final'?' final-chip':''}" data-id="${g.id}" style="${rivalryStyle}${homeColorHex?`--chip-div:${homeColorHex};`:''}">`+`
    <div class="chip-teams${g.gameStatus==='final'?' final':''}">
      <div class="chip-team">
        ${logoHtml(g.awayAbbr, awayW)}
        <div class="t-name-group">
          <span class="t-abbr${awayW?' w':''}">${g.awayAbbr}</span>

        </div>
        ${has && !(g.gameStatus==='final' && g.linescores) ? scoreHtml(g.awayScore, awayW, g.awayAbbr) : ''}
      </div>
      <div class="chip-sep"></div>
      <div class="chip-team">
        ${logoHtml(g.homeAbbr, homeW)}

    </div>
    ${liveLeftBadge}

    ${leagueKey==='MLB' && g.gameStatus==='final' && g.decisions && full ? `

      ${(g.seriesSummary||g.roundTitle)?`

        ${g.nextGame && g.nextGame.label !== 'Tonight' ?`<div class="series-next">

    ${g.pitchers && full ? `<div class="chip-pitchers">

      <div class="pitcher-row">

        <div class="pitcher-photo-fb" style="display:none"></div>` : `<div class="pitcher-photo-fb"></div>`}
        <div class="pitcher-info">

    </div>` : ''}
  </div>`;
}

// ── Intermission countdown tracker ───────────────────────────
// Stores when each game's intermission started (timestamp in ms)
const intermissionStarts = {}; // key: gameId → { startedAt, afterPeriod }

// NHL intermission lengths in seconds
// Regular season: 15.5 min (930s), Playoffs: 15 min (900s)
// Prime-time TV: 17 min (1020s) — we default to 17 for Finals
function getIntermissionLength(gameId, isPlayoffs) {
  return isPlayoffs ? 1020 : 930; // Stanley Cup Finals gets 17 min
}

function getIntermissionCountdown(gameId, isPlayoffs) {
  const tracker = intermissionStarts[gameId];
  if (!tracker) return null;
  const elapsed = Math.floor((Date.now() - tracker.startedAt) / 1000);
  const total   = getIntermissionLength(gameId, isPlayoffs);
  const remaining = Math.max(0, total - elapsed);
  if (remaining === 0) return null; // intermission over
  const m = Math.floor(remaining / 60);
  const s = remaining % 60;
  return `${m}:${s.toString().padStart(2,'0')}`;
}

  const t = String(n || '').trim().split(/\s+/);
  if (t.length < 2) return n || '';
  const sfx = /^(jr\.?|sr\.?|ii|iii|iv|v)$/i;
  return sfx.test(t[t.length - 1]) && t.length > 2
    ? t[t.length - 2] + ' ' + t[t.length - 1]
    : t[t.length - 1];
}

    const fallbackDiv    = isYank ? '1st AL East' : '5th NL East';

    const _lead = fallbackStandings[0];
    const standingsRows = fallbackStandings.map((t,i) => {
      const _gb = ((_lead.w - t.w) + (t.l - _lead.l)) / 2;
      const _me = t.abbr===teamId?' me':'';

       </div>`;
    }).join('');

    return `<div class="mlb-feat-slot ${slotClass} ambient team-tinted" style="--slot-color:${slotTintColor}">
      <div class="mlb-amb-left">
        <img class="mlb-ambient-logo${teamId==='NYY'?' nyy-logo':''}" src="${ambLogo}" alt="${teamId}" onerror="this.style.opacity=0">
        <span class="mlb-ambient-name">${teamId}</span>
        <span class="mlb-amb-record" id="${divId}-record">${fallbackRecord}</span>
        <span class="mlb-status-pill" id="${divId}-div">${fallbackDiv}</span>

      <div class="mlb-amb-right">
        <div class="mlb-amb-div-label">${divName}</div>
        <div class="mlb-amb-head"><span>Team</span><span>W-L</span><span>GB</span></div>
        <div class="mlb-amb-standings" id="${divId}-standings">${standingsRows}</div>
        <div class="mlb-amb-next-section">
          <span class="mlb-amb-next-label" id="${divId}-next-lbl">Next Game</span>
          <span class="mlb-status-pill" id="${divId}-next" style="font-size:2.8cqh;padding:1cqh 3cqh;">Loading…</span>
        </div>
      </div>
    </div>`;
  }

  if (new URLSearchParams(location.search).get('delayed')==='1' && g.gameStatus==='live') { g = Object.assign({}, g, {gameStatus:'delayed', delayReason:'Rain delay · tarp on the field'}); }
  const delayed = g.gameStatus === 'delayed';
  const live = g.gameStatus === 'live';
  const final = g.gameStatus === 'final';
  const upcoming = g.gameStatus === 'upcoming';
  const awayW = final && g.awayScore > g.homeScore;
  const homeW = final && g.homeScore > g.awayScore;
  const awayDesig = DESIGNATED_TEAMS.has(g.awayAbbr);
  const homeDesig = DESIGNATED_TEAMS.has(g.homeAbbr);
  const awayColor = TEAM_COLORS[`MLB:${g.awayAbbr}`] || 'rgba(255,255,255,0.4)';
  const homeColor = TEAM_COLORS[`MLB:${g.homeAbbr}`] || 'rgba(255,255,255,0.4)';
  const awayLogo = logoUrl('MLB', g.awayAbbr);
  const homeLogo = logoUrl('MLB', g.homeAbbr);

  const sit = (live && g.situation) ? situationHtml(g.situation, g.id) : '';
  const sitBlock = sit ? `<div class="mlb-feat-sit">${sit}</div>` : '';

  // ── Upcoming: full pregame layout ──────────────────────────
  if (upcoming) {
    const dayPart = (g.timeLabel||'').split(' · ')[0] || '';
    const timePart = (g.timeLabel||'').split(' · ').pop() || g.timeLabel;
    const isToday = /tonight|today/i.test(dayPart) || !(g.timeLabel||'').includes(' · ');
    const isTomorrow = /tomorrow/i.test(dayPart);
    const pillCls = isToday ? 'today' : isTomorrow ? 'tomorrow' : 'future';

    const pgPhoto = (p) => p?.img

    const pgPitcher = (p, role) => p ? `
      <div class="feat-pg-pitcher">
        ${pgPhoto(p)}

          <span class="feat-pg-pitcher-rec">${p.record||''}</span>

    const divPillFeat = (abbr) => {
      if (abbr!=='NYY' && abbr!=='NYM') return '';

    const teamInfo = (abbr, record) => `

    return `<div class="mlb-feat-slot ${slotClass} team-tinted" style="--slot-color:${slotTintColor}">
      <div class="feat-pg-wrap">
        <div class="feat-pg-teams">
          <div class="feat-pg-row">
            ${teamLogo(g.awayAbbr, awayLogo)}

          </div>
          <div class="feat-pg-sep"></div>
          <div class="feat-pg-row">

        </div>
        <div class="feat-pg-bottom">
          <span class="feat-pg-timepill ${pillCls}">${timePart}</span>
          ${g.network ? netBug(g.network,'feat-pg-netpill','feat',g.network) : ''}
        </div>
      </div>
    </div>`;
  }


  let pitcherHtml = '';
  if (final && g.decisions) {
    const d = g.decisions;
    const dec = (role,cls,lbl) => d[role] ? `<div class="mlb-feat-pitcher">
      <img class="mlb-feat-pitcher-photo" src="${d[role].img||''}" onerror="this.style.display='none'">

  // Status / next-game chip
  const nextChip = g.nextGame
    ? `<span class="mlb-status-pill" style="margin-top:1cqh;">${g.nextGame.label} · ${g.nextGame.time}</span>`
    : '';

  // Determine which team is "ours" (designated) for prominence
  const awayIsDesig = DESIGNATED_TEAMS.has(g.awayAbbr);
  const homeIsDesig = DESIGNATED_TEAMS.has(g.homeAbbr);

  // ── Live: who's pitching vs batting ───────────────────────────
  // ESPN's status.type.detail (captured in g.timeLabel, e.g. "Top 8th") already
  // R12f: "Aaron Judge"→"Judge", "Michael A. Taylor"→"Taylor", "Cal Ripken Jr."→"Ripken Jr."
  // tells us the half-inning, so we derive it from that instead of depending
  // on an extra situation field. Top of the inning = away team bats, home
  // team pitches; bottom = the reverse.
  let awaySubLine = '', homeSubLine = '';
  if (live && g.situation) {
    const isTop = /^top/i.test(g.timeLabel || '');
    // Round-10 note 4: batter/pitcher = featured info block, stacked two-line.
    // R12f: LAST NAME only — full names clipped in the mid column even at min fit
    const pLine = g.situation.pitcher ? `<div class="mlb-feat-pb-name">P: ${pbLastName(g.situation.pitcher)}</div>` : '';
    const bLine = g.situation.batter ? `<div class="mlb-feat-pb-name">AB: ${pbLastName(g.situation.batter)}</div>` : '';
    if (isTop) { awaySubLine = bLine; homeSubLine = pLine; }
    else       { homeSubLine = bLine; awaySubLine = pLine; }
  }

  // Build a team block: logo + abbr + record + score (+ live pitcher/batter line)
  const teamBlock = (abbr, record, score, isW, isDesig, logoSrc, color, idPrefix, subLine) => {
    const scoreKey = `${g.id}-${abbr}`;
    const prevScore = lastKnownScores[scoreKey];
    const justScored = (score != null && prevScore != null && score !== prevScore);
    lastKnownScores[scoreKey] = score;
    return `
    <div class="mlb-feat-team-row">
      <img class="mlb-feat-team-logo${abbr==='NYY'?' nyy-logo':''}" src="${logoSrc}" alt="${abbr}" onerror="this.style.opacity=0">
      <div class="mlb-feat-team-info">
        <span class="mlb-feat-abbr${isW?' w':''}${isDesig?' desig':''}" data-fit="8.2" data-fit-min="4">${abbr}</span>
        <span class="mlb-feat-record">${record||''}</span>
        ${isDesig && idPrefix && !live ? `<div style="display:flex;gap:1cqh;align-items:center;margin-top:0.5cqh;">
          <span class="mlb-status-pill" style="font-size:1.92cqh;" id="${idPrefix}-div-live">Loading…</span>
        </div>` : ''}
      </div>
      ${!upcoming?`<span class="mlb-feat-score${isW?' w glow':''}${justScored?' score-just-changed':''}"${isW?` style="--team-color:${color}"`:''}${justScored?` data-to="${score}"`:''}>
        ${justScored?prevScore:(score??'')}</span>`:''}
    </div>`;
  };

  const awayIdPrefix = awayIsDesig ? (g.awayAbbr==='NYY'?'nyy':g.awayAbbr==='NYM'?'nym':null) : null;
  const homeIdPrefix = homeIsDesig ? (g.homeAbbr==='NYY'?'nyy':g.homeAbbr==='NYM'?'nym':null) : null;

  const teamsHtml = `
    <div class="mlb-feat-teams">
      ${teamBlock(g.awayAbbr,g.awayRecord,g.awayScore,awayW,awayIsDesig,awayLogo,awayColor,awayIdPrefix,awaySubLine)}
      <div class="mlb-feat-sep"></div>
      ${teamBlock(g.homeAbbr,g.homeRecord,g.homeScore,homeW,homeIsDesig,homeLogo,homeColor,homeIdPrefix,homeSubLine)}
    </div>`;

  const netBadge = g.network ? netBug(g.network,'mlb-feat-net-pill','sm',g.network) : '';
  const pbBlock = (live && (awaySubLine || homeSubLine))
    ? `<div class="mlb-feat-pbline" data-fit="7" data-fit-min="4.5">${[awaySubLine, homeSubLine].filter(Boolean).map(l => `<div>${l}</div>`).join('')}</div>`
    : '';
  const lastPlayHtml = (live && g.lastPlay) ? `<div class="mlb-feat-lastplay">
      <div class="mlb-feat-lp-primary">${(meaningfulPlay(g)||{icon:'',primary:''}).icon?(meaningfulPlay(g)).icon+' ':''}${(meaningfulPlay(g)||{primary:''}).primary}</div>
      ${(meaningfulPlay(g)||{}).secondary?`<div class="mlb-feat-lp-secondary">${(meaningfulPlay(g)).secondary}</div>`:''}
    </div>` : '';

  const statusBlock = delayed
    ? `<div class="mlb-feat-status"><span class="mlb-feat-delay-badge">DELAYED</span><span class="mlb-feat-delay-reason">${g.delayReason||'Delay'}</span></div>`
    : live
    ? `<div class="mlb-feat-status">
        <div class="mlb-feat-statusline">
          <span class="mlb-feat-time-label live"${/delay/i.test(g.timeLabel||'')?' style="white-space:nowrap"':''}>${/delay/i.test(g.timeLabel||'') ? (g.timeLabel||'').replace(/(\d+)(st|nd|rd|th)\b/ig,'$1').replace(/\s+/g,' ').trim() : (g.timeLabel||'')}</span>
          ${g.network ? netBug(g.network,'mlb-feat-net-inline','feat',g.network) : ''}
        </div>
        ${sitBlock}
        ${pbBlock}
       </div>`
    : final
      ? `<div class="mlb-feat-status">
          <span class="mlb-feat-final-badge">Final</span>
          ${pitcherHtml?`<div style="margin-top:1cqh">${pitcherHtml}</div>`:''}
          ${nextChip}
         </div>`
      : `<div class="mlb-feat-status">
          <span class="mlb-status-pill">${(g.timeLabel||'').split(' · ').pop()}</span>
          ${pitcherHtml?`<div style="margin-top:1cqh">${pitcherHtml}</div>`:''}
         </div>`;

  return `<div class="mlb-feat-slot ${slotClass} team-tinted${live?' has-wp':''}" style="--slot-color:${slotTintColor}">
    ${teamsHtml}
    ${statusBlock}
    ${live?wpBarHtml(g):''}
  </div>`;
}

const AL_LOGO_DATA_URI = '@@ASSET_014@@';
const NL_LOGO_DATA_URI = '@@ASSET_015@@';

function mlbSubleagueRowsShellHtml() {
  return `<div class="mlb-subleague-rows">
    <div class="mlb-subleague-row single">
      <div class="mlb-subleague-crawl" id="caLG"><div class="mlb-subleague-track" id="tLG"></div></div>
    </div>
  </div>`;
