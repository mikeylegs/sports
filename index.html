function lfStand3Html(divCacheId) {
  const c = divCacheId ? _standingsCache[divCacheId] : null;
  if (!c || !c.east) return `<div class="lf-slide-head" style="font-size:3cqh;color:rgba(255,255,255,0.25);">Standings unavailable</div>`;
  const lead = c.east[0];
  // Highlight this pane's OWN team, not the division leader: cache '5' = AL
  // East = NYY's pane, '24' = NL East = NYM's pane. Falls back to no highlight
  // for any other division.
  const meAbbr = divCacheId === '5' ? 'NYY' : divCacheId === '24' ? 'NYM' : null;
  const fmtGB = gb => gb === 0 ? '—' : (gb % 1 === 0 ? gb.toFixed(0) : gb.toFixed(1));
  return `<div class="lf-stand3-head"><span>Team</span><span>W-L</span><span>GB</span></div>` +
    c.east.map((t, i) => {
      const gb = ((lead.w - t.w) + (t.l - lead.l)) / 2;
      return `<div class="lf-stand3-row${t.abbr===meAbbr?' me':''}">
        <span class="lf-stand3-team"><span class="lf-stand3-rank">${i+1}.</span>${_standLogosOn?`<img class="lf-stand3-logo" src="${logoUrl('MLB',t.abbr)}" alt="" onerror="this.style.opacity=0">`:''}${t.abbr}</span>
        <span class="lf-stand3-rec">${t.w}–${t.l}</span>
        <span class="lf-stand3-gb">${fmtGB(gb)}</span>
      </div>`;
    }).join('');
}

// ── 7b: StatsAPI layer for HR/ERA leaders + spotlight players ──
// Routes JSON through the existing proxyFetch (direct -> CORS-proxy chain) so
// statsapi.mlb.com works from the browser; headshots load via <img> (no proxy).
// Every failure is swallowed: the affected slide stays data-ready="0" and is
// skipped by the rotation, so the 3 core slides keep working no matter what.
// NOTE: untested offline (sandbox has no network to statsapi.mlb.com) — verify
// on the panel. If the proxy chain can't reach statsapi, the stat slides simply
// won't appear and the backbone still rotates.
async function ensureTeamStats(slotClass, teamMlbId, spotlights) {
  if (!teamMlbId) return;
  const season = new Date().getFullYear();
  const run = async () => {
    try {
      // The /teams/{id}/leaders endpoint can't qualify leaders (returns 0-IP
      // position players for ERA, tiny-sample bench guys for AVG/SLG) and does
      // not support statGroup. Instead pull the roster with season stats hydrated
      // in one call and compute qualified leaders client-side.
      const url = `https://statsapi.mlb.com/api/v1/teams/${teamMlbId}/roster?rosterType=fullSeason&season=${season}&hydrate=person(stats(type=[season],group=[hitting,pitching],season=${season}))`;
      const data = await proxyFetch(url);
      const players = (data.roster || []).map(r => r.person).filter(Boolean);
      const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
      const statOf = (p, group) => {
        const s = (p.stats || []).find(x => x.group && (x.group.displayName || x.group) === group
          && x.type && (x.type.displayName || x.type) === 'season');
        return s && s.splits && s.splits[0] && s.splits[0].stat;
      };
      const hitters  = players.map(p => ({ p, st: statOf(p, 'hitting') })).filter(x => x.st && num(x.st.plateAppearances) > 0);
      const pitchers = players.map(p => ({ p, st: statOf(p, 'pitching') })).filter(x => x.st && num(x.st.inningsPitched) > 0);
      const maxPA = Math.max(1, ...hitters.map(x => num(x.st.plateAppearances)));
      const maxIP = Math.max(1, ...pitchers.map(x => num(x.st.inningsPitched)));
      const qualH = hitters.filter(x => num(x.st.plateAppearances) >= 0.4 * maxPA);          // regulars (rate stats)
      const qualP = pitchers.filter(x => num(x.st.inningsPitched) >= Math.max(10, 0.3 * maxIP)); // real pitchers (ERA)
      const mk = (arr, val) => arr.map(x => ({ person: { id: x.p.id, fullName: x.p.fullName }, value: val(x.st) }));
      const byHR  = mk([...hitters].sort((a, b) => num(b.st.homeRuns) - num(a.st.homeRuns)), s => s.homeRuns);
      const byRBI = mk([...hitters].sort((a, b) => num(b.st.rbi) - num(a.st.rbi)), s => s.rbi);
      const byAVG = mk([...qualH].sort((a, b) => num(b.st.avg) - num(a.st.avg)), s => s.avg);
      const bySLG = mk([...qualH].sort((a, b) => num(b.st.slg) - num(a.st.slg)), s => s.slg);
      const byERA = mk([...qualP].sort((a, b) => num(a.st.era) - num(b.st.era)), s => s.era);
      const _c = (window['lfStats_'+slotClass] = window['lfStats_'+slotClass] || {});
      _c.byHR = byHR; _c.byERA = byERA; _c.tlead = { AVG: byAVG, HR: byHR, RBI: byRBI, SLG: bySLG };
      lfFillLeaders(slotClass, 'hr', byHR);
      lfFillLeaders(slotClass, 'era', byERA);
      lfFillTeamLead(slotClass, { AVG: byAVG, HR: byHR, RBI: byRBI, SLG: bySLG });
      (spotlights || []).forEach((sp, i) => lfFillSpotlight(slotClass, i, sp, season));
    } catch (e) {
      console.warn('StatsAPI leaders fetch failed:', e && e.message);
    }
    setTimeout(run, 10 * 60 * 1000); // refresh every 10 min
  };
  run();
}

function lfFillTeamLead(slotClass, byCat) {
  const el = document.getElementById(`${slotClass}-teamlead`);
  if (!el) return;
  const order = ['AVG','HR','RBI','SLG'];
  const rows = order.map(cat => {
    const top = (byCat[cat] || [])[0];
    if (!top) return null;
    return { cat, id: top.person && top.person.id, name: lfShortName(top.person && top.person.fullName), val: top.value };
  }).filter(Boolean);
  if (rows.length < 4) return;   // only show the card when all four categories resolved
  const body = el.querySelector('.lf-tlead');
  if (!body) return;
  body.innerHTML = rows.map(r => `<div class="lf-tlead-row">
    <span class="lf-tlead-cat">${r.cat}</span>
    <img class="lf-tlead-head" alt="" src="${lfHeadshot(r.id,120)}" onerror="this.style.opacity=0.001;this.style.background='#1d2f54'">
    <div class="lf-tlead-id"><span class="lf-tlead-name" data-fit="3.7" data-fit-min="3.6">${r.name}</span></div>
    <span class="lf-tlead-val">${r.val}</span>
  </div>`).join('');
  el.dataset.ready = '1';
  if (typeof fitText === 'function') fitText(body);
}

// Next-game opponent record line: overall W-L + the split relevant to this game
// (we're home => opp is the road team => show opp road record "Away"; vice versa).
// Data from _teamRecCache (populated by the standings fetch). Empty string if absent.
function lfNextRecHtml(opp, side) {
  const r = opp ? _teamRecCache[opp] : null;
  if (!r || !r.wl) return '';
  const split = side === '@' ? r.home : r.road;
  const lbl = side === '@' ? 'Home' : 'Away';
  return `${r.wl}${split ? ` <span class="split">· ${split} ${lbl}</span>` : ''}`;
}

// Probable-pitchers block for the next-game card. `np` is normalized to
// {mine:{name,record?,era?}, opp:{name,record?,era?}} — record/era optional
// (the StatsAPI off-day fallback supplies name only). Returns '' when there's
// nothing to show, so the card collapses back to its centered layout.
function lfNextPitchersHtml(np, teamAbbr, oppAbbr) {
  if (!np || (!np.mine && !np.opp)) return '';
  const row = (p, ab, self) => (p && p.name)
    ? `<div class="lf-np-row${self ? ' self' : ''}">
         <span class="lf-np-team">${ab}</span>
         <span class="lf-np-name">${p.name}</span>
       </div>` : '';
  const rows = [row(np.mine, teamAbbr, true), row(np.opp, oppAbbr, false)].filter(Boolean).join('');
  return rows ? `<div class="lf-next2-pitchers">${rows}</div>` : '';
}

function lfApplySpot(el, spot){
  if (!el || !spot) return;
  const nameEl = el.querySelector('.lf-player-name');
  const headEl = el.querySelector('.lf-player-head');
  const statsEl = el.querySelector('.lf-player-stats');
  if (nameEl) nameEl.textContent = spot.name;
  if (headEl) headEl.src = spot.headSrc;
  if (statsEl) statsEl.innerHTML = spot.statsHtml;
  el.dataset.ready = '1';
}

// Re-apply cached stat data to any stat slide that a slot re-render reset to
// empty (data-ready!=='1'), so the rotation never collapses back to 3 dots.
function lfHealStats(slotClass){
  const c = window['lfStats_'+slotClass];
  if (!c) return;
  const empty = id => { const e = document.getElementById(id); return e && e.dataset.ready !== '1' ? e : null; };
  if (empty(`${slotClass}-hr`) && c.byHR) lfFillLeaders(slotClass, 'hr', c.byHR);
  if (empty(`${slotClass}-era`) && c.byERA) lfFillLeaders(slotClass, 'era', c.byERA);
  if (empty(`${slotClass}-teamlead`) && c.tlead) lfFillTeamLead(slotClass, c.tlead);
  (c.spots || []).forEach((sp, i) => { const e = empty(`${slotClass}-spot${i}`); if (e && sp) lfApplySpot(e, sp); });
}

function lfFillLeaders(slotClass, key, leaders) {
  const el = document.getElementById(`${slotClass}-${key}`);
  if (!el || !leaders.length) return;
  const body = el.querySelector('.lf-leaders');
  if (!body) return;
  body.innerHTML = leaders.slice(0, 4).map((l, i) => {
    const pid = l.person && l.person.id;
    return `<div class="lf-leader-row${i===0?' top':''}">
      <span class="lf-leader-rank">${i+1}</span>
      <img class="lf-leader-head" alt="" src="${lfHeadshot(pid,120)}" onerror="this.style.opacity=0.001;this.style.background='#1d2f54'">
      <span class="lf-leader-name">${lfShortName(l.person && l.person.fullName)}</span>
      <span class="lf-leader-val">${l.value}</span>
    </div>`;
  }).join('');
  el.dataset.ready = '1';
}

async function lfFillSpotlight(slotClass, i, sp, season) {
  const grp = sp.type === 'pitcher' ? 'pitching' : 'hitting';
  const url = `https://statsapi.mlb.com/api/v1/people/${sp.id}?hydrate=stats(group=[${grp}],type=[season],season=${season})`;
  try {
    const data = await proxyFetch(url);
    const p = data.people && data.people[0];
    const st = p && p.stats && p.stats[0] && p.stats[0].splits && p.stats[0].splits[0] && p.stats[0].splits[0].stat;
    if (!p || !st) return;
    const el = document.getElementById(`${slotClass}-spot${i}`);
    if (!el) return;
    const rows = sp.type === 'pitcher'
      ? [['ERA', st.era], ['W–L', `${st.wins}–${st.losses}`], ['K', st.strikeOuts], ['WHIP', st.whip], ['IP', st.inningsPitched], ['K/9', st.strikeoutsPer9Inn]]
      : [['AVG', st.avg], ['HR', st.homeRuns], ['RBI', st.rbi], ['OBP', st.obp], ['SLG', st.slg], ['OPS', st.ops]];
    const spot = {
      name: lfShortName(p.fullName),
      headSrc: lfHeadshot(sp.id, 360),
      statsHtml: rows.map(([lab, val]) => `<div class="lf-player-stat"><span class="lf-player-val">${val ?? '–'}</span><span class="lf-player-label">${lab}</span></div>`).join('')
    };
    const _c = (window['lfStats_'+slotClass] = window['lfStats_'+slotClass] || {});
    (_c.spots = _c.spots || [])[i] = spot;
    lfApplySpot(el, spot);
  } catch (e) {
    console.warn('StatsAPI spotlight fetch failed:', e && e.message);
  }
}

// Rotating-stage cycler: walks every data-ready slide in the stage, refreshing
// dynamic content (standings) on show and rebuilding the progress dots. Stat
// slides start data-ready="0" and join the rotation only once their fetch fills
// them, so nothing blank or broken is ever shown.
// ── Wide World of Sports: curated events from selections.json ──────────────
// Phase-2 consumer of the wws-selector page. selections.json (repo root, same
// origin) lists events with showFrom/showUntil (YYYYMMDD). Active events get
// live ESPN data and appear as rotator slides: event i → yank (even) /
// secondary (odd) stage. Poll: selections 5 min, live data 60s. Disable: ?wws=0
const WWS = { sel: [], events: {}, watch: { teams: [] }, lastSelAt: 0 };
function wwsToday(){ const d = nowET(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }
function wwsYesterday(){ const d = nowET(); d.setDate(d.getDate()-1); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }
// R92 DATE-FILTER FIX (Mike: "if it's selectable, it should show — I picked it for a reason").
// The selector already restricts to non-past-days, so IT is the availability gate. We remove
// the old noon-cutoff calendar filtering (morning finals were guillotined at 12:00 PM ET) and
// replace it with: SELECTED = SHOWN, from showFrom through showUntil + a rolling 1-DAY expiry.
// The +1 day is ROLLING AGE (not a midnight/noon boundary) so games stay visible for late-night
// viewing (Mike is often up past midnight) and only drop the following day. __watch (starred-team)
// events keep their same-day window since they're regenerated each poll.
function _wwsPlusOneDay(ymd){ if(!ymd) return ymd;
  const d = new Date(+String(ymd).slice(0,4), +String(ymd).slice(4,6)-1, +String(ymd).slice(6,8));
  d.setDate(d.getDate()+1);
  return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }
function wwsActive(){ const t = wwsToday();
  return WWS.sel.filter(e => e.showFrom <= t && t <= _wwsPlusOneDay(e.showUntil)); }
async function wwsPollSelections(){
  try {
    const r = await fetch(`selections.json?t=${Date.now()}`);
    if (r.ok){ const j = await r.json();
      WWS.sel = (j.events || []).filter(e => e.espnId && e.league);
      WWS.watch = (j.watch && typeof j.watch === 'object') ? j.watch : { teams: [] };  // R16
      window._selPollOk = true;                       // R98: monitor — fetch succeeded
      window._selPollCount = WWS.sel.length;          // R98: how many events the PANEL actually sees
    } else { window._selPollOk = false; }
  } catch(_){ window._selPollOk = false; }
  WWS.lastSelAt = Date.now();
}
// R98 BRAIN HEARTBEAT — confirms the Brain is alive + what it's seeing, at a glance,
// no console. Replaces Mike's manual "screenshot the brain overlay" habit.
function _brainBeatLine(){
  if (!window._brainLastEval) return 'idle (no eval yet)';
  const s2 = Math.round((Date.now() - window._brainLastEval)/1000);
  const c = window._brainCands ?? 0;
  const t = window._brainTiers || {tko:0, pin:0};
  const hot = (t.tko || t.pin) ? `  🔥${t.tko}tko/${t.pin}pin` : '';
  const stale = s2 > 60 ? ' ⚠STALE' : '';
  return `${s2}s ago · ${c} cands${hot}${stale}`;
}
// R98 SELECTIONS-POLL MONITOR — pairs with the new selector's published-state banner.
// Selector says "I published 5"; this says "the panel fetched 5". Closes the loop end-to-end
// with no console: if the selector shows IN SYNC but this shows 0 events, the push didn't land.
function _selPollLine(){
  if (!WWS.lastSelAt) return 'never';
  const s2 = Math.round((Date.now() - WWS.lastSelAt)/1000);
  const n2 = (window._selPollCount ?? '—');
  const bad = window._selPollOk === false ? ' ⚠FAIL' : '';
  const stale = s2 > 90 ? ' ⚠STALE' : '';
  return `${s2}s ago · ${n2} events${bad}${stale}`;
}
// R16: resolve starred teams → today's games as synthetic curated selections.
// Runs each WWS poll; appends to WWS.sel with a __watch flag so wwsActive keeps
// them and renderWwsSlot can order them LAST (curated events always win slot-2).
async function wwsPollWatch(){
  const teams = (WWS.watch && WWS.watch.teams) || [];
  if (!teams.length){ WWS.sel = WWS.sel.filter(e => !e.__watch); return; }
  const byLeague = {};
  teams.forEach(t => (byLeague[t.league] = byLeague[t.league] || []).push(t.abbr));
  const found = [];
  for (const [lg, abbrs] of Object.entries(byLeague)){
    try {
      const data = await proxyFetch(`https://site.api.espn.com/apis/site/v2/sports/${lg}/scoreboard?dates=${wwsToday()}`);
      for (const ev of (data && data.events) || []){
        const comp = (ev.competitions || [])[0] || {};
        const cs = (comp.competitors || []).map(c => (c.team && c.team.abbreviation) || '');
        if (!cs.some(a => abbrs.includes(a))) continue;
        const st = (ev.status && ev.status.type) || {};
        found.push({ league: lg, label: (ev.shortName || ev.name || '').toUpperCase(),
          espnId: String(ev.id), title: ev.shortName || ev.name || '',
          showFrom: wwsToday(), showUntil: wwsToday(), __watch: true,
          __live: st.state === 'in' });
      }
    } catch(_){}
  }
  // dedupe vs curated (a manually-picked game shouldn't double as a watch game)
  const curatedIds = new Set(WWS.sel.filter(e => !e.__watch).map(e => String(e.espnId)));
  WWS.sel = WWS.sel.filter(e => !e.__watch)
    .concat(found.filter(f => !curatedIds.has(f.espnId)));
}
async function wwsPollEvents(){
  const act = wwsActive(); if (!act.length) return;
  const byLeague = {};
  act.forEach(e => (byLeague[e.league] = byLeague[e.league] || []).push(e));
  for (const [lg, evs] of Object.entries(byLeague)){
    try {
      const data = await proxyFetch(`https://site.api.espn.com/apis/site/v2/sports/${lg}/scoreboard?dates=${wwsToday()}`);
      let evPool = (data && data.events) || [];
      // R14: before noon, also sweep yesterday's scoreboard so lingering finals hydrate
      if (nowET().getHours() < 12 && evs.some(e => !evPool.find(x => String(x.id) === String(e.espnId)))){
        try { const y = await proxyFetch(`https://site.api.espn.com/apis/site/v2/sports/${lg}/scoreboard?dates=${wwsYesterday()}`);
          evPool = evPool.concat((y && y.events) || []); } catch(_){}
      }
      for (const e of evs){
       // R139: per-EVENT try. Previously the whole per-league loop sat inside ONE
       // try/catch(_){} — so a throw on any single event aborted the loop AND silently
       // swallowed the error, blanking every WWS slide with zero diagnostics. Now one bad
       // event can't take down the others, and the error is surfaced (console + _wwsErr)
       // instead of hidden.
       try {
        // R16: espnId can be "eventId:compId" (a specific tennis match inside a
        // tournament event). Resolve event by the left part, competition by the
        // right — falling back to the first competition for normal single-comp events.
        const [evId, compId] = String(e.espnId).split(':');
        const ev = evPool.find(x => String(x.id) === evId);
        if (!ev) continue;
        // R16b: tennis matches live in ev.groupings[].competitions[]; search there
        // for the compId before falling back to top-level competitions.
        let comp = null;
        if (compId){
          for (const g of (ev.groupings || [])){
            comp = (g.competitions || []).find(c => String(c.id) === compId);
            if (comp) break;
          }
          if (!comp) comp = (ev.competitions || []).find(c => String(c.id) === compId) || null;
        } else {
          comp = (ev.competitions || [])[0] || {};
        }
        if (!comp) continue;
        const kind = e.league.startsWith('tennis') ? 'tennis'
                   : e.league.startsWith('golf') ? 'golf'
                   : e.league.startsWith('soccer') ? 'soccer' : 'team';
        const sides = (comp.competitors || []).map(c => ({
          teamId: c.team && c.team.id,
          name: (c.team && (c.team.abbreviation || c.team.shortDisplayName)) || (c.athlete && (c.athlete.shortName || c.athlete.displayName)) || '',
          logo: (c.team && c.team.logo) || '',
          flag: (c.athlete && c.athlete.flag && c.athlete.flag.href) || (c.team && c.team.flag && c.team.flag.href) || '',
          headshot: (c.athlete && c.athlete.headshot && (c.athlete.headshot.href || c.athlete.headshot)) || '',
          headshotIds: e.league.startsWith('tennis')
            ? [c.athlete && c.athlete.id, c.id].filter(Boolean).map(String) : [],
          score: c.score != null ? String(c.score) : '',
          sets: (c.linescores || []).map(l => l.value != null ? String(Math.round(l.value)) : ''),
          shootout: c.shootoutScore != null ? String(c.shootoutScore) : '',
          record: ((c.records || [])[0] || {}).summary || '',
          serving: !!(c.possession || c.service || c.serve || c.serving || (comp.situation && comp.situation.server && String(comp.situation.server)===String(c.id))),
          winner: !!c.winner,
          ...(kind === 'golf' ? (() => {   // R12d: layered thru/rd — proven helper first
            const gi = getCurrentRoundInfo(c.linescores);
            const rounds = (c.linescores || []).filter(r => r && r.displayValue !== undefined);
            const curR = rounds[rounds.length - 1];
            let thru = gi.thru !== '-' ? gi.thru
              : (c.status && (c.status.thru != null ? (c.status.thru >= 18 ? 'F' : String(c.status.thru)) : (c.status.displayThru || ''))) || '';
            if (/^f$/i.test((thru||'').trim())) thru = 'F';   // R29: ESPN sends lowercase 'f' via displayThru — normalize
            // R14b: pre-round → next tee time in THRU (PGA-app style)
            const tee = c.teeTime || (c.status && c.status.teeTime) || (c.athlete && c.athlete.teeTime)
              || (typeof findNextTeeTime === 'function' ? findNextTeeTime(c.linescores) : null);
            const started = gi.started;
            if (!started && tee){
              const t = new Date(tee);
              if (!isNaN(t)) thru = t.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}).replace(/\s?([AP])M/i, (m,x) => x.toLowerCase());
            }
            // R14b: R-column blank until the player has started the current round
            // (PGA app shows empty R4 pre-tee; our rd was carrying stale R3).
            const rdRaw = started ? (gi.roundScore != null ? gi.roundScore
              : curR ? (curR.displayValue != null ? curR.displayValue : curR.value) : null) : null;
            // R16c: pre-tee shows '-' in the round column (PGA-app style), not blank
            return { thru, rd: !started ? '-' : (rdRaw != null ? String(rdRaw).replace(/^\+?0$/, 'E') : '') };
          })() : {}),
        }));
        if (kind === 'golf') sides.sort((a, b) => (parseFloat(a.score) || 0) - (parseFloat(b.score) || 0));
        // Soccer deluxe (round 10): goal scorers per side from competition details.
        let scorers = null;
        if (kind === 'soccer'){
          scorers = {};
          for (const dt of (comp.details || [])){
            if (!(dt.scoringPlay || (dt.type && /goal/i.test(dt.type.text||'')))) continue;
            const tid = dt.team && dt.team.id;
            const nm = ((dt.athletesInvolved||[])[0]||{}).shortName || ((dt.athletesInvolved||[])[0]||{}).displayName || '';
            const min = (dt.clock && dt.clock.displayValue) || '';
            if (!tid || !nm) continue;
            (scorers[tid] = scorers[tid] || []).push(`${nm} ${min}`);
          }
        }
        const st = (ev.status && ev.status.type) || {};
        const ven = comp.venue || {};
        if (scorers) sides.forEach(x => { x.goals = (scorers[x.teamId] || []).slice(0, 4); });
        // Round 11: GOAL takeover — total-goals increase on a live curated match
        // fires the big-moment overlay on the WWS (right) pane.
        if (kind === 'soccer' && st.state === 'in'){
          const prevEv = WWS.events[e.espnId];
          const tot = sides.reduce((n,x)=>n+(parseInt(x.score,10)||0),0);
          // R139: guard prevEv.sides — a partially-built or older-shape prior entry can lack
          // `sides`, and `.reduce` on undefined threw, aborting the whole populate loop.
          const prevTot = (prevEv && Array.isArray(prevEv.sides)) ? prevEv.sides.reduce((n,x)=>n+(parseInt(x.score,10)||0),0) : tot;
          if (prevEv && Array.isArray(prevEv.sides) && tot > prevTot && typeof showTakeover === 'function'){
            const scorer = sides.flatMap(x=>x.goals||[]).slice(-1)[0] || '';
            // R36: which side just scored → light their score, use their flag/headshot
            const prevScores = prevEv.sides.map(x=>parseInt(x.score,10)||0);
            const scIdx = sides.findIndex((x,i)=>(parseInt(x.score,10)||0) > (prevScores[i]||0));
            const sc = sides[scIdx] || sides[0];
            const a=sides[0]||{}, h=sides[1]||{};
            showTakeover({ side:'right', accent:'#d4af37', wc:{
              flag: sc.flag||'', head: sc.headshot||(sc.headshotIds&&sc.headshotIds[0]?`https://a.espncdn.com/combiner/i?img=/i/headshots/soccer/players/full/${sc.headshotIds[0]}.png&w=350&h=350`:''),
              scorer: scorer||'', aAbbr:a.name||'', hAbbr:h.name||'', aScore:a.score||'0', hScore:h.score||'0',
              aWin: scIdx===0, hWin: scIdx===1 } });
          }
        }
        // R12b banner content: WC → "2026 FIFA World Cup" + city only;
        // golf → tournament name + course name. Others keep selector label.
        const wcYear = (ev.season && ev.season.year) || (ev.date ? new Date(ev.date).getFullYear() : '');
        const _tourn = ev.name || ev.shortName || (ev.season && ev.season.name) || '';
        const bLabel = kind === 'golf' ? (ev.name || ev.shortName || e.label || '')
          : (kind === 'soccer' && /fifa|world\s*cup/i.test((e.league || '') + ' ' + (e.label || ''))) ? `${wcYear || '2026'} FIFA World Cup`
          : kind === 'tennis' ? `${wcYear || new Date().getFullYear()} ${(_tourn||'').replace(/\bATP\b|\bWTA\b|men'?s|women'?s/ig,'').replace(/\s+/g,' ').trim() || 'Wimbledon'}`
          : e.label || '';
        const bVenue = kind === 'golf' ? ((ev.courses && ev.courses[0] && ev.courses[0].name) || ven.fullName || '')
          : kind === 'soccer' ? ((ven.address && [ven.address.city, ven.address.state].filter(Boolean).join(', ')) || '')
          : [ven.fullName, ven.address && (ven.address.city || ven.address.state)].filter(Boolean).join(' · ');
        WWS.events[e.espnId] = { title: e.title, label: bLabel, kind, date: ev.date || '',
          round: (ev.status && ev.status.period) || (comp.status && comp.status.period) || 0,
          pre: (kind === 'tennis' ? ((comp.status && comp.status.type && comp.status.type.state) || st.state) : st.state) === 'pre',
          kickoff: ev.date ? new Date(ev.date).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}) : '',
          sides: kind === 'golf' ? sides.slice(0, 20) : sides,
          venue: bVenue,
          situation: (comp.situation && (comp.situation.downDistanceText || comp.situation.shortDownDistanceText)) || '',
          status: kind === 'tennis'
            ? (() => {   // R18: "Final · Round 4" / "Set 4 · Round 4" — no city
                const rnd = ((comp.notes||[])[0]||{}).headline
                  || (ev.season && ev.season.slug ? '' : '')
                  || (comp.round && comp.round.displayName) || '';
                const mst = (comp.status && comp.status.type) || st;   // R23: match-level status
                const state = mst.state === 'post' ? (mst.shortDetail || 'Final')
                  : mst.state === 'in' ? (mst.shortDetail || 'Live') : (mst.shortDetail || '');
                return [state, rnd].filter(Boolean).join(' · ');
              })()
            : (st.shortDetail || st.description || ''),
          live: kind === 'tennis'
            ? ((comp.status && comp.status.type && comp.status.type.state) === 'in')   // R23: per-match
            : st.state === 'in' };
       } catch(_evErr){
         // R139: surface, don't swallow. Panel stays up; this one event is skipped.
         console.warn('[wws] event populate failed for', e && e.espnId, _evErr);
         window._wwsErr = { id: e && e.espnId, msg: (_evErr && _evErr.message) || String(_evErr), at: Date.now() };
       }
      }
    } catch(_){}
  }
  wwsFillSlides();
}
// ── WWS broadcast renderers (spec: wws-pane-concepts-v2, 3.6cqh floor) ──
function wwsBanner(d){

    body.style.display = collapsed ? 'none' : 'block';
    tgl.textContent = collapsed ? '▶' : '▼';
  };
  copy.onclick = () => {
    const txt = body.textContent || '';
    try { navigator.clipboard.writeText(txt); copy.textContent = '✓'; setTimeout(()=>copy.textContent='COPY', 1200); }
    catch(_){ copy.textContent = 'ERR'; setTimeout(()=>copy.textContent='COPY', 1200); }
  };
  const t0 = Date.now();
  const age = ts => ts ? Math.round((Date.now() - ts) / 1000) + 's' : '—';
  // R88: compact proxy-health line for the HUD. Each: shortname●/○ (●=last ok, ○=last fail)
  // with lastOk age. Shows at a glance if all proxies are dark (tonight's outage would've
  // been obvious instantly instead of digging through console errors).
  window._proxyHudLine = function(){
    const H = window._proxyHealth || {};
    const short = h => h.replace('api.','').replace('.com','').replace('.win','').replace('.io','').replace('proxy.','').split('.')[0].slice(0,8);
    const order = ['direct','codetabs','allorigins','corsfix','thingproxy'];
    const keys = Object.keys(H).sort((a,b)=>{const ia=order.findIndex(o=>a.includes(o)),ib=order.findIndex(o=>b.includes(o));return (ia<0?9:ia)-(ib<0?9:ib);});
    if (!keys.length) return '— (no fetches yet)';
    return keys.map(k=>{
      const h=H[k]; const dot = h.last==='ok' ? '●' : '○';
      const a = h.lastOk ? Math.round((Date.now()-h.lastOk)/1000)+'s' : 'never';
      return `${short(k)}${dot}${a}`;
    }).join(' ');
  };
  setInterval(() => {
    const D = (typeof RECAP !== 'undefined' && RECAP.director) || {};
    const vc = (typeof RECAP !== 'undefined' && RECAP.videoCache) || {};
    const caches = Object.keys(vc).map(k => `${k.split('-2')[0]}:${age(vc[k].at)}${vc[k].video ? '' : '(∅)'}`).join(' ') || '—';
    const lfY = document.querySelector('#yank-stage .lf-slide[data-slide="lf"]');
    const lfM = document.querySelector('#secondary-stage .lf-slide[data-slide="lf"]');
    body.textContent =   // R108: write into body, not el — el now holds the button bar
      `${typeof BUILD_MARKER !== 'undefined' ? BUILD_MARKER : '?'}\n`
      + `up ${Math.round((Date.now() - t0) / 60000)}m  live ${window._mlbLiveCount ?? '—'}\n`
      + `director ${D.count ?? '—'}/${D.threshold ?? '—'} idx ${D.idx ?? '—'} ${typeof _recapActive !== 'undefined' && _recapActive ? 'PLAYING' : 'idle'}\n`
      + `lf-cards yank:${lfY ? (lfY.classList.contains('active') ? 'ACTIVE' : 'yes') : 'no'} mets:${lfM ? (lfM.classList.contains('active') ? 'ACTIVE' : 'yes') : 'no'}\n`
      + `vidCache ${caches}\n`
      + `proxies ${_proxyHudLine()}\n`
      + `feed ${_feedFreshLine()}  errs ${_errRateLine()}\n`
      + `sel  ${_selPollLine()}\n`
      + `brain ${_brainBeatLine()}\n`
      + `recapEvt ${window._recapEvt || '—'}\n`
      + `nextGame ${age(window._nextGameCacheAt)}  standings ${age(window._divCacheAt)}`
      + (window._brainDebug && window._brainLog ? `\n── BRAIN ──\n` + window._brainLog.slice(-8).join('\n') : '');
  }, 1000);
})();

function startLfRotation(slotClass, divCacheId, teamMlbId, spotlights) {
  const flagKey = 'lfRotationStarted_' + slotClass;
  if (window[flagKey]) { requestAnimationFrame(() => lfHealStats(slotClass)); return; }
  window[flagKey] = true;
  ensureTeamStats(slotClass, teamMlbId, spotlights);

  let idx = 0;
  // Cards intentionally removed from the rotation: they're informative but
  // don't read well at kiosk distance. Keeping only LAST GAME / STANDINGS /
  // NEXT GAME. (Elements may still exist in the DOM + fetch data; they simply
  // never enter the rotation.)
  const HIDDEN_SLIDES = new Set(['spot', 'teamlead', 'hr', 'era']);
  const readySlides = () => {
    const s = document.getElementById(`${slotClass}-stage`);
    if (!s) return [];
    return Array.from(s.querySelectorAll('.lf-slide'))
      .filter(el => el.dataset.ready !== '0' && !HIDDEN_SLIDES.has(el.dataset.slide));
  };
  const paint = (slides, i) => {
    slides.forEach((s, k) => s.classList.toggle('active', k === i));
    const cur = slides[i];
    if (cur && cur.dataset.slide === 'stand') {
      const body = cur.querySelector('.lf-stand3');
      if (body) body.innerHTML = lfStand3Html(cur.dataset.div || divCacheId);   // R12: merged stage carries AL+NL slides
    }
    if (cur && cur.dataset.slide === 'next') {
      const recEl = cur.querySelector('.lf-next2-rec');
      if (recEl) recEl.innerHTML = lfNextRecHtml(cur.dataset.opp, cur.dataset.side);
    }
    if (cur && cur.dataset.slide === 'teamlead' && typeof fitText === 'function') fitText(cur);
    const dots = document.getElementById(`${slotClass}-dots`);
    if (dots) dots.innerHTML = slides.map((_, k) => `<span class="lf-dot${k === i ? ' active' : ''}"></span>`).join('');
  };
  paint(readySlides(), 0);
  setInterval(() => {
    try{ (window._lfBeats || (window._lfBeats = {}))[slotClass] = Date.now(); }catch(_){}   // r149b: proof-of-life per pane
    if (window.__lfPaused){ _dirNote('ROTATION PAUSED — __lfPaused set on ' + slotClass, true); return; }            // tester pause hook — undefined/no-op in production
    lfHealStats(slotClass);                  // self-heal stat slides wiped by a slot re-render
    // Recap clock: was previously advanced only from recapDirectorTick() when
    // the yank pane's OWN lf slide happened to be active. Since the always-
    // rotate redesign, that slide can legitimately be absent for stretches
    // (no qualifying recent final) — if it's ever missing on yank specifically,
    // the whole recap system stalled for BOTH teams forever. Tick the clock
    // here unconditionally, every interval, regardless of what's showing;
    // recapDirectorTick() still only attempts to actually PLAY a video when
    // called from paint() with that pane's lf slide visually active, so
    // playback timing/placement is unchanged — only the counter is decoupled.
    recapClockTick(slotClass);
    const slides = readySlides();
    if (slides.length < 2) { recapDirectorTick(slotClass); return; }
    const ni = (idx + 1) % slides.length;
    if (ni === 0 && slotClass === 'yank' && window._anchorMerged
        && typeof window._anchorSwap === 'function' && window._anchorSwap()){
      idx = 0;                                  // R13: lap complete → flip team pane
      recapDirectorTick(slotClass);
      return;
    }
    idx = ni;
    paint(slides, idx);
    recapDirectorTick(slotClass);   // runs every tick now (see fn comment) — the mlb-daily fallback fires even with no fresh final
  }, 12000);
  // tester hook: jump the stage to a named slide (repeated calls cycle through
  // duplicates, e.g. the two spotlight slides). Unused in production.
  const _reg = { slotClass, _jn:null, _ji:0, jump:(name)=>{
    const sl = readySlides(); const matches=[]; sl.forEach((el,k)=>{ if(el.dataset.slide===name) matches.push(k); });
    if(!matches.length) return;
    if(_reg._jn!==name){ _reg._jn=name; _reg._ji=0; } else { _reg._ji=(_reg._ji+1)%matches.length; }
    paint(sl, matches[_reg._ji]);
  }};
  (window.__lfRotations = window.__lfRotations || []).push(_reg);
}

// Compact inning-by-inning linescore for the recap card. Returns '' when the
// game carries no linescore data (off-day fallback, or a feed without it) so
// the card degrades cleanly to header · score · decisions.
function lfLinescoreHtml(g) {
  const ls = g && g.linescores;
  if (!ls || !Array.isArray(ls.away) || !ls.away.length) return '';
  const n = Math.max(ls.away.length, (ls.home||[]).length);
  const awayW = g.awayScore > g.homeScore, homeW = g.homeScore > g.awayScore;
  const inns = Array.from({length:n}, (_,i)=>`<span class="lf-ls-cell">${i+1}</span>`).join('');
  const row = (arr, abbr, R, isW) =>
    `<div class="lf-ls-row${isW?' w':''}"><span class="lf-ls-team">${abbr}</span>${
      Array.from({length:n},(_,i)=>`<span class="lf-ls-cell">${arr[i]??''}</span>`).join('')
    }<span class="lf-ls-r">${R}</span></div>`;
  return `<div class="lf-linescore">
    <div class="lf-ls-row lf-ls-head"><span class="lf-ls-team"></span>${inns}<span class="lf-ls-r">R</span></div>
    ${row(ls.away, g.awayAbbr, g.awayScore, awayW)}
    ${row(ls.home||[], g.homeAbbr, g.homeScore, homeW)}
  </div>`;
}

// W/L/S pitcher line for the last-final panel — sits below the score, filling
// 85% of the column width. Falls back to the old blank spacer (for visual
// balance against the result pill above) when no decision data is available.
function lfDecisionsHtml(decisions) {
  if (!decisions || !(decisions.win || decisions.loss)) return '<div class="lf-spacer"></div>';
  const items = [
    { lbl: 'W', cls: 'win',  p: decisions.win },
    { lbl: 'L', cls: 'loss', p: decisions.loss },
    { lbl: 'S', cls: 'save', p: decisions.save },
  ].filter(d => d.p && d.p.name);
  if (!items.length) return '<div class="lf-spacer"></div>';
  // Extended stat (record + ERA) dropped for readability at distance — the
  // W/L/S label + pitcher name is the glanceable part; the fine-print line was
  // well under the 25.9px floor. Name now carries the row.
  return `<div class="lf-decisions" data-fit="4.0" data-fit-min="3.6">
    ${items.map(d => `
      <div class="lf-decision-row ${d.cls}">
        <span class="lf-decision-label">${d.lbl}</span>
        <span class="lf-decision-name">${d.p.name}${d.p.record?` <span class="lf-decision-rec">(${d.p.record})</span>`:''}</span>
      </div>`).join('')}
  </div>`;
}

// ── Real pitcher decisions, sourced from the per-game summary endpoint ──
// (the bulk scoreboard feed used everywhere else has no decision data at all —
// confirmed via debug dump. This is a separate, targeted fetch that only runs
// for the 1-2 games that actually need it — NYY/NYM's last game — not all
// MLB games, to avoid hammering the summary endpoint unnecessarily.)
//
// Decision pitchers are tucked into boxscore.players[teamIdx].statistics
// [type='pitching'].athletes[].notes[], e.g. {type:'pitchingDecision', text:'W, 5-4'} —
// no key name hints at "decision" anywhere, hence the earlier debug dig.
const _decisionsCache = {};   // eventId -> {win,loss,save} | null
const _decisionsInFlight = new Set();

function parsePitchingDecisionNote(text) {
  const m = /^([A-Za-z]+),\s*(.+)$/.exec((text || '').trim());
  if (!m) return null;
  return { code: m[1].toUpperCase(), record: m[2].trim() };
}

function extractDecisionsFromBoxscore(boxscore, eventId) {
  let win = null, loss = null, save = null;
  if (MLB_DEBUG) {
    const allPitcherNotes = (boxscore?.players || []).flatMap(teamEntry => {
      const pitching = (teamEntry.statistics || []).find(s => s.type === 'pitching');
      return (pitching?.athletes || []).map(a => ({
        team: teamEntry.team?.abbreviation,
        name: a.athlete?.shortName || a.athlete?.displayName,
        notes: a.notes || [],
      }));
    });
    golfDebugLog(`[MLB DEBUG] event ${eventId}: all pitchers + their notes arrays:`, allPitcherNotes);
  }
  (boxscore?.players || []).forEach(teamEntry => {
    const pitching = (teamEntry.statistics || []).find(s => s.type === 'pitching');
    if (!pitching) return;
    const eraIdx = (pitching.names || []).indexOf('ERA');
    (pitching.athletes || []).forEach(a => {
      const note = (a.notes || []).find(n => n.type === 'pitchingDecision');
      if (!note) return;
      const parsed = parsePitchingDecisionNote(note.text);
      if (!parsed) return;
      const era = eraIdx >= 0 ? a.stats?.[eraIdx] : null;
      const info = {
        name: a.athlete?.shortName || a.athlete?.displayName || 'Unknown',
        record: parsed.record,
        era,
      };
      if (parsed.code === 'W') win = info;
      else if (parsed.code === 'L') loss = info;
      else if (parsed.code.startsWith('S')) save = info; // SV, S, etc.
    });
  });
  const result = (!win && !loss) ? null : { win, loss, save };
  if (MLB_DEBUG) golfDebugLog(`[MLB DEBUG] event ${eventId}: extracted decisions:`, result);
  return result;
}

async function fetchPitcherDecisions(eventId) {
  const url = `https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/summary?event=${eventId}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`summary http ${res.status}`);
  const data = await res.json();
  if (MLB_DEBUG) golfDebugLog(`[MLB DEBUG] summary fetch for event ${eventId} succeeded, boxscore present: ${!!data.boxscore}`);
  return extractDecisionsFromBoxscore(data.boxscore, eventId);
}

// ── Next-game fallback fetch ──────────────────────────────────────────────
// The 'next' rotation slide was fed only from the SAME-DAY scoreboard fetch
// (today's slate) — so it correctly showed today's game while one was
// upcoming, but had zero visibility into tomorrow's schedule. Once today's
// game went final (or on a true off-day), there was no data source for the
// real next matchup at all, and the slide silently fell back to "No game
// scheduled" — this is what read as "next game card not loading". This
// pulls the actual next scheduled game from MLB StatsAPI as a fallback,
// fire-and-forget + cached, same pattern as ensureDecisions/ensureTeamStats.
const MLB_TEAM_ID_TO_ABBR = {108:'LAA',109:'ARI',110:'BAL',111:'BOS',112:'CHC',113:'CIN',114:'CLE',115:'COL',116:'DET',117:'HOU',118:'KC',119:'LAD',120:'WSH',121:'NYM',133:'OAK',134:'PIT',135:'SD',136:'SEA',137:'SF',138:'STL',139:'TB',140:'TEX',141:'TOR',142:'MIN',143:'PHI',144:'ATL',145:'CWS',146:'MIA',147:'NYY',158:'MIL'};
const _nextGameCache = {};      // abbr -> {opp, side, timeLabel, network} | null
const _nextGameInFlight = new Set();

function fmtNextGameTimeLabel(d) {
  const now = new Date(), tomorrow = new Date(now); tomorrow.setDate(now.getDate() + 1);
  const timeStr = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  if (d.toDateString() === now.toDateString()) return `Tonight · ${timeStr}`;
  if (d.toDateString() === tomorrow.toDateString()) return `Tomorrow · ${timeStr}`;
  return `${d.toLocaleDateString('en-US', { weekday: 'short' })} · ${timeStr}`;
}

function ensureNextGame(abbr, teamMlbId, g, nextGame, slotClass) {
  if (!teamMlbId || abbr in _nextGameCache || _nextGameInFlight.has(abbr)) return;
  _nextGameInFlight.add(abbr);
  const today = new Date(), end = new Date(today); end.setDate(end.getDate() + 10);
  const fmt = d => d.toISOString().slice(0, 10);
  const url = `https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${teamMlbId}&startDate=${fmt(today)}&endDate=${fmt(end)}&hydrate=probablePitcher,broadcasts(all)`;
  proxyFetch(url)
    .then(data => {
      window._nextGameCacheAt = Date.now();   // debug-overlay stamp
      const games = (data.dates || []).flatMap(dd => dd.games || []);
      const now = Date.now();
      const upcoming = games.find(g2 => g2.status && g2.status.abstractGameState === 'Preview' && new Date(g2.gameDate).getTime() > now);
      if (upcoming) {
        const isHome = upcoming.teams.home.team.id === teamMlbId;
        const oppId = isHome ? upcoming.teams.away.team.id : upcoming.teams.home.team.id;
        // Probable pitchers (name only from this endpoint — record/ERA would
        // need a deeper person hydrate; the render degrades gracefully to name).
        const pp = t => { const n = t && t.probablePitcher && t.probablePitcher.fullName; return n ? { name: lfShortName(n) } : null; };
        const minePP = pp(isHome ? upcoming.teams.home : upcoming.teams.away);
        const oppPP  = pp(isHome ? upcoming.teams.away : upcoming.teams.home);
        // Broadcast network (hydrated): prefer national TV, else the team's own TV feed, else any TV.
        let nextNet = '';
        { const bc = Array.isArray(upcoming.broadcasts) ? upcoming.broadcasts : [];
          const tv = bc.filter(b => /tv/i.test(b.type || ''));
          const chosen = tv.find(b => b.isNational) || tv.find(b => b.homeAway === (isHome ? 'home' : 'away')) || tv[0];
          nextNet = chosen ? (chosen.name || chosen.callSign || '') : ''; }
        _nextGameCache[abbr] = {
          opp: MLB_TEAM_ID_TO_ABBR[oppId] || '',
          side: isHome ? 'vs' : '@',
          timeLabel: fmtNextGameTimeLabel(new Date(upcoming.gameDate)),
          network: nextNet,   // hydrated from broadcasts(all); falls back to '' (slide handles blank gracefully)
          pitchers: (minePP || oppPP) ? { mine: minePP, opp: oppPP } : null,
        };
      } else {
        _nextGameCache[abbr] = null;
      }
      // Patch the slot live so the fix is visible without waiting for the next
      // full refresh cycle. Re-renders with the SAME (g, nextGame) this call
      // was made with — renderLastFinalSlot re-checks _nextGameCache fresh
      // each call, so it'll pick up what was just cached.
      const row = document.getElementById('row-MLB');
      const slot = row?.querySelector(`.mlb-feat-slot.${slotClass}`);
      // R12: when the anchor is the merged NYY+NYM pane, a single-team re-render
      // here would clobber it — cache-only; the next 15-60s cycle rebuilds merged.
      if (slot && !(slotClass === 'yank' && window._anchorMerged)) slot.outerHTML = renderLastFinalSlot(abbr, g, nextGame, slotClass);
    })
    .catch(e => console.warn('[nextgame] fetch failed:', e && e.message))
    .finally(() => {
      _nextGameInFlight.delete(abbr);
      setTimeout(() => { delete _nextGameCache[abbr]; }, 30 * 60 * 1000); // refresh every 30 min
    });
}

// Fire-and-forget: populates the cache so the NEXT normal dashboard refresh
// (every 30-60s) picks up real decisions automatically. Not worth a manual
// DOM patch for a "yesterday" game that only changes once a day.
function ensureDecisions(eventId, abbr, g, nextGame, slotClass) {
  if (!eventId || eventId in _decisionsCache || _decisionsInFlight.has(eventId)) return;
  _decisionsInFlight.add(eventId);
  fetchPitcherDecisions(eventId)
    .then(d => {
      _decisionsCache[eventId] = d;
      // Patch just this one static panel directly — no need to refetch live
      // games/standings/etc. just to repaint a frozen "yesterday" score.
      const row = document.getElementById('row-MLB');
      const slot = row?.querySelector(`.mlb-feat-slot.${slotClass}`);
      if (slot && !(slotClass === 'yank' && window._anchorMerged)) slot.outerHTML = renderLastFinalSlot(abbr, g, nextGame, slotClass);  // R12: see nextgame guard
    })
    .catch(e => {
      console.warn('[MLB] decisions fetch failed:', e.message);
      if (MLB_DEBUG) golfDebugLog(`[MLB DEBUG] decisions fetch FAILED for event ${eventId}:`, e.message);
      _decisionsCache[eventId] = null;
    })
    .finally(() => _decisionsInFlight.delete(eventId));
}

function renderLastFinalSlot(abbr, g, nextGame, slotClass, opts) {
  // R12: opts.bare returns ONLY the lf/stand/next slides (no wrapper, no rail,
  // no stat slides, no rotation start, no active class) so the merged anchor
  // pane can compose both teams into one stage. sfx keeps ids unique per team.
  opts = opts || {};
  const sfx = opts.bare ? '-' + abbr : '';
  const cachedDecisions = g?.id != null ? _decisionsCache[g.id] : undefined;
  const decisions = cachedDecisions !== undefined ? cachedDecisions : g?.decisions;
  if (g?.id != null && cachedDecisions === undefined) ensureDecisions(g.id, abbr, g, nextGame, slotClass);
  if (MLB_DEBUG) golfDebugLog(`[MLB DEBUG] renderLastFinalSlot(${abbr}): using decisions:`, decisions, '(cache status:', cachedDecisions === undefined ? 'fetching' : 'resolved', ')');
  // g may be null — "no qualifying recent final" (off-day/pregame with the
  // last game too stale to recap, or no last game at all). Rather than
  // bailing to a static card, we just drop the lf slide and keep the rest of
  // the evergreen rotation (stand/next/spot/teamlead/hr/era) running.
  const hasRecap = !!g;
  const isNYY = abbr === 'NYY';
  const teamIsAway = hasRecap && g.awayAbbr === abbr;
  const oppAbbr   = hasRecap ? (teamIsAway ? g.homeAbbr : g.awayAbbr) : '';
  const teamScore = hasRecap ? (teamIsAway ? g.awayScore : g.homeScore) : null;
  const oppScore  = hasRecap ? (teamIsAway ? g.homeScore : g.awayScore) : null;
  const won       = hasRecap && teamScore > oppScore;

  const cached = isNYY ? _standingsCache['5'] : abbr==='NYM' ? _standingsCache['24'] : null;
  // Record: from the recap game if we have one, else look up the team's
  // current record from the standings cache so the left rail isn't blank.
  const standingsTeam = cached?.east?.find(t => t.abbr === abbr);
  const teamRecord = hasRecap
    ? (teamIsAway ? g.awayRecord : g.homeRecord)
    : (standingsTeam ? `${standingsTeam.w}-${standingsTeam.l}` : '');

  const logoSrc = LOGOS[`MLB:${abbr}`] ||
    `https://images.weserv.nl/?url=a.espncdn.com/combiner/i?img=/i/teamlogos/mlb/500/${abbr.toLowerCase()}.png&w=300&h=300&output=png`;

  // Innings label (e.g. Final/11)
  const inningsLabel = hasRecap && g.timeLabel && g.timeLabel.includes('/')
    ? g.timeLabel : 'Final';
  // Recap header: keep a header on THIS card (the game-recap card) and make it
  // convey recency with a concrete date, e.g. "Last Night · Jun 30 · Final/11".
  // Other rotating cards drop their pill (see .lf-slide-head restyle).
  const gDate = hasRecap && g.gameDate ? new Date(g.gameDate) : null;
  const dateStr = gDate && !isNaN(gDate) ? gDate.toLocaleDateString('en-US',{month:'short',day:'numeric'}) : '';
  // The last-game card carries NO header pill (like every other rotating card —
  // it's self-evidently a final via the abbrs/score/linescore). The recency +
  // result now live on the VIDEO recap's bottom caption; stash the facts here
  // so recapBadgeLabel() can build "YANKEES RECAP · Jul 1 · W 4–3 @ BOS".
  if (hasRecap) _lfRecapGame[abbr] = {
    won, teamScore, oppScore, oppAbbr, dateStr,
    side: teamIsAway ? '@' : 'vs',
  };

  const divCacheId = isNYY ? '5' : abbr==='NYM' ? '24' : null;
  const teamMlbId = isNYY ? 147 : abbr==='NYM' ? 121 : null;

  // Next game pill color
  let timePillCls = 'today';
  let nextTimeStr = '';
  let nextMatchup = '';
  let nextNetwork = '';
  let nextOpp = ''; let nextSide = '';
  let nextPit = null;   // normalized {mine, opp} probable pitchers for the fill
  if (nextGame) {
    const dayPart = (nextGame.timeLabel||'').split(' · ')[0]||'';
    nextTimeStr = (nextGame.timeLabel||'').split(' · ').pop();
    const oppAbb = nextGame.awayAbbr===abbr ? nextGame.homeAbbr : nextGame.awayAbbr;
    const atVs = nextGame.awayAbbr===abbr ? '@' : 'vs';
    nextOpp = oppAbb; nextSide = atVs;
    nextMatchup = `${atVs} ${oppAbb}`;
    nextNetwork = nextGame.network || '';
    if (nextGame.pitchers) {   // ESPN scoreboard provides full record + ERA
      const home = nextGame.homeAbbr === abbr;
      nextPit = { mine: home ? nextGame.pitchers.home : nextGame.pitchers.away,
                  opp:  home ? nextGame.pitchers.away : nextGame.pitchers.home };
    }
    timePillCls = /tonight|today/i.test(dayPart) ? 'today'
      : /tomorrow/i.test(dayPart) ? 'tomorrow' : 'future';
  } else if (teamMlbId) {
    // The same-day scoreboard fetch (nextGame's source) only ever has
    // visibility into TODAY's slate — once today's game is done (or on a
    // true off-day) there's no data for the real next matchup at all. Fall
    // back to the dedicated schedule fetch/cache; trigger it if we haven't yet.
    const cached = _nextGameCache[abbr];
    if (cached) {
      const dayPart = (cached.timeLabel||'').split(' · ')[0]||'';
      nextTimeStr = (cached.timeLabel||'').split(' · ').pop();

// mini-rail. Rotation is the existing yank rotation; stand slides carry
// data-div so paint() refreshes AL and NL East independently.
function renderAnchorIdleSlot(yg, mg, yNext, mNext){
  // R12b (panel feedback): NO combined rail — alternate the FULL single-team
  // pane, NYY then NYM, swapping every 36s (3 slide ticks). Each pane is the
  // untouched renderLastFinalSlot output; slotClass stays 'yank' so the one
  // rotation instance, director data-team lookup and in-place plumbing all
  // keep working. Args are stashed so the swap timer can rebuild between the
  // 15-60s data renders; the regular cycle's string-compare handles the rest.
  window._anchorMerged = true;
  window._anchorArgs = { yg, mg, yNext, mNext };
  if (!window._anchorTeam) window._anchorTeam = 'NYY';
  // R13: swap is LAP-DRIVEN, not wall-clock — the rotation interval calls
  // _anchorSwap() exactly when the current pane's slide index wraps, so every
  // visit shows each slide exactly once (the 36s timer drifted against the 12s
  // rotation phase and could repeat/starve slides indefinitely).
  window._anchorSwap = () => {
    if (!window._anchorMerged) return false;
    const a = window._anchorArgs; if (!a) return false;
    const row = document.getElementById('row-MLB');
    const slot = row && row.querySelector('.mlb-feat-slot.yank');
    if (!slot) return false;
    window._anchorTeam = window._anchorTeam === 'NYY' ? 'NYM' : 'NYY';
    const html = window._anchorTeam === 'NYY'
      ? renderLastFinalSlot('NYY', a.yg, a.yNext, 'yank')
      : renderLastFinalSlot('NYM', a.mg, a.mNext, 'yank');
    window._lastYankHtml = html;
    slot.outerHTML = html;
    const e = row.querySelector('.mlb-feat-slot.yank');
    if (e){ fitText(e); e.classList.add('slot-enter'); }
    return true;
  };
  return window._anchorTeam === 'NYY'
    ? renderLastFinalSlot('NYY', yg, yNext, 'yank')
    : renderLastFinalSlot('NYM', mg, mNext, 'yank');
}

// Parses a player's relative-to-par score string ("-7", "E", "+3") into a
// number for sorting/ranking. Treats unparseable values as worst-case (+999)
// so they sort to the bottom rather than crashing the sort.
function parsePar(score) {
  if (score === 'E' || score === 'e') return 0;
  const n = parseInt(score, 10);
  return Number.isFinite(n) ? n : 999;
}

// Standard golf-leaderboard tie convention: players with equal scores share
// the same position, written as "Tn" where n is the position of the first
// player in that tied group (e.g. two players tied for 4th are both "T4").
function assignPositions(players) {
  const sorted = [...players].sort((a, b) => parsePar(a.total) - parsePar(b.total));
  let rank = 1;
  for (let i = 0; i < sorted.length; i++) {
    if (i > 0 && parsePar(sorted[i].total) === parsePar(sorted[i - 1].total)) {
      sorted[i].position = sorted[i - 1].position; // same tie label as previous
    } else {
      rank = i + 1;
      const tieCount = sorted.filter(p => parsePar(p.total) === parsePar(sorted[i].total)).length;
      sorted[i].position = tieCount > 1 ? `T${rank}` : `${rank}`;
    }
  }
  return sorted;
}

// Finds the most recent round that has actually started (has a displayValue)
// and reports its score and "thru" hole count. ESPN keeps a placeholder
// entry like {period:4} for rounds that haven't started yet — those are
// skipped rather than mistaken for "thru 0".
function getCurrentRoundInfo(linescores) {
  const active = (linescores || []).filter(r => r && r.displayValue !== undefined && Array.isArray(r.linescores));
  if (!active.length) return { roundScore: null, thru: '-', started: false };
  const round = active[active.length - 1];
  const holes = round.linescores || [];
  // R30: a golf round is 18 holes. The feed may send ONLY the holes played so far,
  // so deriving totalHoles from holes.length made an 11-entry array read as "11/11 = F".
  // Treat the round as complete ONLY when 18 holes have values (or the round object
  // explicitly flags completion via displayValue with no in-progress hole).
  const holesPlayed = holes.filter(h => typeof h.value === 'number').length;
  const roundComplete = holesPlayed >= 18;
  const thru = roundComplete ? 'F' : String(holesPlayed);
  return {
    roundScore: round.displayValue,
    thru,
    started: holesPlayed > 0,   // R17: finished round (thru='F') still 'started' → show score not '-'
  };
}

// ESPN tucks each round's tee time in an unlabeled stat object — no key
// hints at "tee" at all, it's just the one entry in the stats array that
// has a displayValue but no numeric value (e.g. "Sun Jun 21 14:30:00 PDT 2026").
// This exists on every round (past rounds too, presumably as their original
// tee time), so we just need the round entry, regardless of whether it's
// already been played.
function findRoundTimestampString(roundEntry) {
  const stats = roundEntry?.statistics?.categories?.[0]?.stats || [];
  const hit = stats.find(s => s && typeof s.displayValue === 'string' && s.value === undefined);
  return hit ? hit.displayValue : null;
}

// Parses ESPN's "Sun Jun 21 14:30:00 PDT 2026" format into a real Date.
// IMPORTANT: the zone abbreviation ESPN attaches here (PDT/PST) is mislabeled
// for this event — the actual wall-clock numbers are already Eastern Time
// (confirmed: treating them as Pacific and converting produced tee times
// exactly 3 hours later than the real ones). So this deliberately ignores
// the zone token and treats the numerals as ET (EDT, since the tournament
// runs in June) rather than converting from Pacific.
// New Date(str) directly is also unsafe here regardless — Safari/WebKit is
// inconsistent with non-ISO formats and zone abbreviations — so this builds
// an explicit ISO 8601 string with a numeric offset instead.
function parseEspnTimestamp(str) {
  if (typeof str !== 'string') return null;
  const m = /^\w+ (\w{3}) (\d{1,2}) (\d{2}):(\d{2}):(\d{2}) \w{3} (\d{4})$/.exec(str.trim());
  if (!m) return null;
  const [, monStr, day, hh, mm, ss, year] = m;
  const months = { Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11 };
  const mon = months[monStr];
  if (mon === undefined) return null;
  const pad = n => String(n).padStart(2, '0');
  const iso = `${year}-${pad(mon + 1)}-${pad(day)}T${hh}:${mm}:${ss}-04:00`; // treat numerals as EDT
  const d = new Date(iso);
  return isNaN(d.getTime()) ? null : d;
}

// Finds the next round that hasn't been played yet (no linescores array) and
// extracts its hidden timestamp as that player's tee time for that round.
function findNextTeeTime(linescores) {
  const next = (linescores || []).find(r => r && !Array.isArray(r.linescores));
  if (!next) return null;
  const str = findRoundTimestampString(next);
  const d = parseEspnTimestamp(str);
  return d ? d.toISOString() : null;
}

// Recursively hunts the raw API payload for any key whose name contains
// "tee" (case-insensitive). NOTE: this misses ESPN's actual tee-time field,
// since that field has no telltale key name at all (see findNextTeeTime) —
// kept as a secondary check in case ESPN ever adds a properly-named field.
function scanForTeeTimeFields(obj, path = '', depth = 0, hits = []) {
  if (depth > 6 || obj === null || typeof obj !== 'object') return hits;
  if (Array.isArray(obj)) {
    if (obj.length > 25) return hits; // skip big arrays (156 competitors, 18 holes, etc.)
    obj.forEach((item, i) => scanForTeeTimeFields(item, `${path}[${i}]`, depth + 1, hits));
    return hits;
  }
  for (const key of Object.keys(obj)) {
    const fullPath = path ? `${path}.${key}` : key;
    if (/tee/i.test(key)) hits.push({ path: fullPath, value: obj[key] });
    scanForTeeTimeFields(obj[key], fullPath, depth + 1, hits);
  }
  return hits;
}

async function fetchUSOpenLeaderboard() {
  const url = `https://site.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard?event=${US_OPEN_EVENT_ID}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`golf http ${res.status}`);
  const data = await res.json();
  const comp = data?.events?.[0]?.competitions?.[0];
  if (GOLF_DEBUG) {
    // Full raw response stays console-only — too large to usefully render
    // on-screen on a phone. The on-screen panel gets the compact, useful bits.
    console.log('[GOLF DEBUG] raw response (full):', data);
    golfDebugLog('[GOLF DEBUG] events[0] keys:', data?.events?.[0] ? Object.keys(data.events[0]) : 'none');
    golfDebugLog('[GOLF DEBUG] competitions[0] keys:', comp ? Object.keys(comp) : 'none');
    golfDebugLog('[GOLF DEBUG] competitor count:', (comp?.competitors || []).length);
    golfDebugLog('[GOLF DEBUG] competitors[0] (full shape of one player):', comp?.competitors?.[0]);
    const teeHits = scanForTeeTimeFields(data);
    golfDebugLog(`[GOLF DEBUG] tee-time field scan (by key name): ${teeHits.length} matches found`, teeHits.slice(0, 20));
    const c0 = comp?.competitors?.[0];
    if (c0) {
      const nextRound = (c0.linescores || []).find(r => r && !Array.isArray(r.linescores));
      golfDebugLog('[GOLF DEBUG] next unplayed round entry (raw):', nextRound);
      golfDebugLog('[GOLF DEBUG] extracted timestamp string:', nextRound ? findRoundTimestampString(nextRound) : null);
      golfDebugLog('[GOLF DEBUG] parsed tee time (ISO):', findNextTeeTime(c0.linescores));
    }
  }
  const competitors = comp?.competitors || [];
  let players = competitors.map(c => {
    const athlete    = c.athlete || {};
    const roundInfo  = getCurrentRoundInfo(c.linescores);
    return {
      id: c.id,
      name: athlete.displayName || athlete.shortName || athlete.fullName || 'Unknown',
      headshot: athlete.headshot?.href ||
        (c.id ? `https://a.espncdn.com/i/headshots/golf/players/full/${c.id}.png` : null),
      flag: athlete.flag?.href || null,
      total: c.score ?? c.scoreToPar ?? 'E',
      thru: roundInfo.thru,
      roundScore: roundInfo.roundScore,
      teeTime: c.teeTime || c.status?.teeTime || athlete.teeTime || findNextTeeTime(c.linescores) || null,
      started: roundInfo.started,
    };
  });
  players = assignPositions(players);
  if (GOLF_DEBUG) {
    golfDebugLog(`[GOLF DEBUG] parsed ${players.length} players (first 3):`, players.slice(0, 3));
    if (players.length) {
      const missingHeadshot = players.filter(p => !p.headshot).length;
      const missingFlag     = players.filter(p => !p.flag).length;
      const missingTeeTime  = players.filter(p => !p.teeTime).length;
      golfDebugLog(`[GOLF DEBUG] ${missingHeadshot}/${players.length} missing headshot URL, ${missingFlag}/${players.length} missing flag, ${missingTeeTime}/${players.length} missing tee time`);
      golfDebugLog(`[GOLF DEBUG] sample row check — total="${players[0].total}" pos="${players[0].position}" thru="${players[0].thru}" round="${players[0].roundScore}" teeTime="${players[0].teeTime}"`);
    }
  }
  if (!players.length) throw new Error('golf: no players parsed');
  return players;
}

function golfHeadshotImg(p) {
  const fallback = `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=1a2233&color=ffffff&size=64`;
  const src = p.headshot || fallback;
  return `<img class="golf-headshot" src="${src}" alt="${p.name}" onerror="this.src='${fallback}'">`;
}

function golfFlagImg(p) {
  if (!p.flag) return '<span class="golf-flag" style="background:rgba(255,255,255,0.06);"></span>';
  return `<img class="golf-flag" src="${p.flag}" alt="" onerror="this.style.visibility='hidden'">`;
}

function golfRoundCell(p) {
  // After 8 AM ET, a player who hasn't started their round yet shows their
  // next tee time instead of a round score (which doesn't exist yet). This is
  // per-player, on purpose — different groups go off at different times, so
  // it's normal and correct for some players to show a tee time while others
  // already have a live/finished round score at the same moment.
  const past8 = nowET().getHours() >= 8;
  if (past8 && !p.started && p.teeTime) {
    const t = new Date(p.teeTime);
    const label = isNaN(t) ? p.teeTime
      : t.toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', timeZone:'America/New_York' });
    if (GOLF_DEBUG) golfDebugLog(`[GOLF DEBUG] ${p.name}: showing tee time "${label}" (past8=${past8}, started=${p.started})`);
    return `<span class="golf-round tee">${label}</span>`;
  }
  const rs = p.roundScore;
  if (GOLF_DEBUG) golfDebugLog(`[GOLF DEBUG] ${p.name}: showing round score "${rs}" (past8=${past8}, started=${p.started}, teeTime=${p.teeTime})`);
  return `<span class="golf-round">${rs===null||rs===undefined?'-':rs}</span>`;
}

function golfScoreClass(total) {
  const s = String(total);
  if (s.startsWith('-')) return 'under';
  if (s.startsWith('+')) return 'over';
  return '';
}

function renderGolfPane() {
  const all = (_golfCache && _golfCache.length) ? _golfCache : DEMO_GOLF;
  const players = all.slice(0, GOLF_LEADERBOARD_CAP);

  // players[] is already rank-sorted (assignPositions sorts ascending). The
  // leader(s) — anyone tied for the lowest score — get pinned in a fixed row
  // above the scroll area instead of looping with everyone else. If there's
  // a multi-way tie for the lead, all of them get pinned.
  const leadScore = players.length ? parsePar(players[0].total) : null;
  const leaders = players.filter(p => parsePar(p.total) === leadScore);
  const rest = players.slice(leaders.length);

  const pinnedHtml = leaders.map(p => golfRowHtml(p)).join('');
  const restHtml = rest.map(p => golfRowHtml(p)).join('');
