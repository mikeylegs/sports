let _golfScrollTimer = null;
let _golfHoldTimer = null;
// R101 GOLF SCROLL (Mike): the old loop duplicated the list and stopped at half the TRACK
// height — so the last entry ended up mid-pane with dead space below. New behavior:
// ONE pass, scroll until the LAST player sits at the BOTTOM of the visible pane, HOLD 5s,
// then advance to the next card. Stop position is computed from the PANE height, not the
// track height, which is what makes the final row land flush at the bottom.
function startGolfScroll() {
  clearInterval(_golfScrollTimer);
  clearTimeout(_golfHoldTimer);
  const track = document.getElementById('golfTrack');
  if (!track) return;
  const pane = track.parentElement;                 // .golf-pane-scroll (the visible window)
  let y = 0;
  const SPEED = 0.6;
  _golfScrollTimer = setInterval(() => {
    const trackH = track.scrollHeight;
    const paneH  = pane ? pane.clientHeight : 0;
    if (trackH <= 0 || paneH <= 0) return;
    // How far we can scroll before the track's BOTTOM aligns with the pane's bottom.
    const maxScroll = Math.max(0, trackH - paneH);
    // Short list that already fits → nothing to scroll; just hold, then advance.
    if (maxScroll === 0){ clearInterval(_golfScrollTimer); _golfHoldThenAdvance(); return; }
    y -= SPEED;
    if (Math.abs(y) >= maxScroll){
      track.style.transform = `translateY(${-maxScroll}px)`;   // land flush at the bottom
      clearInterval(_golfScrollTimer);
      _golfHoldThenAdvance();                                   // hold 5s, then next card
      return;
    }
    track.style.transform = `translateY(${y}px)`;
  }, 50);
}
// R101: hold the completed leaderboard for 5s, then refresh + restart.
// ⚠ SCOPE NOTE: this governs the #golfTrack scroll (startGolfScroll / the MLB-pane golf
// leaderboard). The WWS rotation advances a DIFFERENT element (.wws-g-scroll, a CSS
// animation — see the R13b watchdog in the rotation interval), so we do NOT try to drive
// the card flip from here; synthesizing an animationend on #golfTrack would be a no-op.
// What this DOES fix: the last player now lands flush at the bottom of the pane (was
// stopping mid-pane with dead space), then holds 5s before refreshing.
function _golfHoldThenAdvance(){
  clearTimeout(_golfHoldTimer);
  _golfHoldTimer = setTimeout(() => {
    try { refreshGolfLeaderboard(); } catch(_){}   // rebuilds pane + restarts the scroll
  }, 5000);
}

async function refreshGolfLeaderboard() {
  try {
    _golfCache = await fetchUSOpenLeaderboard();
    if (GOLF_DEBUG) golfDebugLog('[GOLF DEBUG] live fetch succeeded, cache updated with', _golfCache.length, 'players');
  } catch (e) {
    console.warn('[GOLF]', e.message);
    if (GOLF_DEBUG) golfDebugLog('[GOLF DEBUG] ERROR:', e.message);
    if (GOLF_DEBUG) golfDebugLog('[GOLF DEBUG] fetch FAILED — pane will render', _golfCache ? 'last good cache' : 'DEMO_GOLF fallback', e);
    // leave _golfCache as-is; renderGolfPane falls back to DEMO_GOLF if empty
  }
  const row = document.getElementById('row-MLB');
  const secSlot = row?.querySelector('.mlb-feat-slot.secondary');
  if (secSlot) secSlot.outerHTML = renderGolfPane();
  startGolfScroll();
}
// Refresh is primarily driven by completing a scroll lap (see startGolfScroll).
// This is purely a safety net in case the scroll loop ever stalls (e.g. tab
// backgrounded) — long interval so it doesn't fight with the lap-driven refresh.
setInterval(() => { if (isUSOpenActive()) refreshGolfLeaderboard(); }, 180000);

function renderMLBFullscreen(games, yesterdayGames=[]) {
  const shell = document.querySelector('.shell');
  shell.classList.add('mlb-full');

  // NHL and NBA rows are hidden (display:none) in this layout, but their
  // "top performers" overlay (.chip-performers) lives as a sibling of the
  // rows, absolutely-positioned against a rect captured before the layout
  // changed. Nothing repositions it once its row disappears, so it's left
  // floating wherever it last was. Clear it out (and its flip timer) here.
  document.querySelectorAll('.chip-performers').forEach(el => el.remove());
  ['NHL', 'NBA'].forEach(key => { if (perfFlip[key]) { clearInterval(perfFlip[key]); delete perfFlip[key]; } });

  const row = document.getElementById('row-MLB');
  const ca = document.getElementById('ca-MLB');
  if (ca) ca.style.display = 'none';
  document.querySelector('.logo-panel.mlb').style.display = 'none';

  // ── Sort games ──
  const sorted = [
    ...games.filter(g=>g.gameStatus==='live'),
    ...games.filter(g=>g.gameStatus==='upcoming'),
    ...games.filter(g=>g.gameStatus==='final'),
  ];

  const yankGame = (new URLSearchParams(location.search).get('nyyoff')==='1')
    ? null
    : sorted.find(g => g.awayAbbr==='NYY' || g.homeAbbr==='NYY') || null;
  const metGame = sorted.find(g =>
    (g.awayAbbr==='NYM' || g.homeAbbr==='NYM') && g !== yankGame) || null;
  const bestLive = sorted.filter(g =>
    g.gameStatus==='live' && g !== yankGame && g !== metGame
  ).sort((a,b) => {
    const inn = g => parseInt((g.timeLabel||'').match(/\d+/)?.[0]||0);
    const margin = g => Math.abs((g.awayScore||0)-(g.homeScore||0));
    return inn(b) - inn(a) || margin(a) - margin(b);
  })[0] || null;
  // While the US Open golf pane is occupying the Mets slot, the Mets game
  // (if any) shouldn't be pulled out into a dedicated slot — it just flows
  // into the normal NL crawl below like any other game.
  const golfActive = isUSOpenActive();
  // WWS takeover: any curated selections.json event active today claims the
  // Mets slot (golf still outranks it in-season). NYM drops into the NL crawl
  // below — identical plumbing to golfActive. NYY slot is never touched.
  // NYM clutch override: a live Mets game in the 8th+ with real leverage
  // (leverageIndex >= 0.5 ~= within 2 runs in the 8th) reclaims the slot from
  // WWS. LATCHED until that game ends — leverage oscillates pitch to pitch,
  // and without the latch the slot would flap between WWS and NYM on every
  // 15s render as the margin moves. Latch clears when the game leaves 'live'.
  const _metLive = (metGame && metGame.gameStatus === 'live') ? metGame : null;
  const _yLive = !!(yankGame && yankGame.gameStatus === 'live');
  // R12: latch only arms while NYY is ALSO live — otherwise the NYM live game
  // already holds the anchor and a slot-2 clutch card would duplicate it.
  // Latch also clears when NYY's game ends (NYM then migrates to the anchor).
  if (window._nymClutchGame && (!_metLive || _metLive.id !== window._nymClutchGame || !_yLive)) window._nymClutchGame = null;
  if (_yLive && _metLive && inningNum(_metLive) >= 8 && leverageIndex(_metLive) >= 0.5) window._nymClutchGame = _metLive.id;
  const nymClutch = !!window._nymClutchGame;
  // R12 topology: anchor = NYY live > NYM live > merged evergreen.
  // Slot-2 = golf > NYM clutch > perpetual WWS (curated events, else idle mix).
  const wwsIdle = !golfActive && !nymClutch && !(typeof wwsActive === 'function' && wwsActive().length > 0);
  const anchorGame = _yLive ? yankGame : (_metLive && !nymClutch ? _metLive : null);
  const nymInPane = nymClutch || (!!_metLive && !_yLive);
  const featIds = new Set([anchorGame?.id, nymClutch ? metGame?.id : null, (wwsIdle && bestLive) ? bestLive.id : null].filter(Boolean));
  const gridGames = sorted.filter(g => !featIds.has(g.id));

  // ── Chip modes for NYY and NYM ──
  const yankMode = getTeamChipMode('NYY', sorted, yesterdayGames);
  const metMode  = getTeamChipMode('NYM', sorted, yesterdayGames);

  // Find next game for each (first upcoming)
  const yankNext = sorted.find(g=>(g.awayAbbr==='NYY'||g.homeAbbr==='NYY')&&g.gameStatus==='upcoming') || null;
  const metNext  = sorted.find(g=>(g.awayAbbr==='NYM'||g.homeAbbr==='NYM')&&g.gameStatus==='upcoming') || null;
  const yankYest = yesterdayGames.find(g=>g.awayAbbr==='NYY'||g.homeAbbr==='NYY') || null;
  const metYest  = yesterdayGames.find(g=>g.awayAbbr==='NYM'||g.homeAbbr==='NYM') || null;

  // "Always rotate" non-live default: the lf recap slide qualifies only while
  // the last game is recent (~18h). No exact game-end timestamp is in the
  // data model, so this approximates with a clock cutoff — a 7-10pm start
  // ends ~10pm-1am, +18h lands mid-afternoon the next day. Same param
  // overrides as getTeamChipMode so ?lastfinal=1/?pregame=1 stay testable.
  const recapHour = new URLSearchParams(location.search).get('pregame')==='1' ? 14
    : new URLSearchParams(location.search).get('lastfinal')==='1' ? 6 : nowET().getHours();
  // R79: last-game recap shows from final until the NEXT game goes live — but capped at
  // 2 days stale (Mike: normal off-day OK, but not stale highlights through the All-Star
  // break). staleDays counts days since the game's date; ≤2 = still show.
  const _recapDaysSince = g => { if(!g||!g.gameDate) return 99; const d=(Date.now()-new Date(g.gameDate).getTime())/86400000; return d; };
  const _recapFresh = g => _recapDaysSince(g) <= 2;   // ≤2 days → eligible

  // ── Build featured slot HTML based on mode ──
  // Only 'live' (a game in progress right now) keeps the dedicated live
  // scoreboard card. Every other state — 'final' (today's game just ended),
  // 'lastFinal'/'pregame'/'offday' (no live game right now) — runs the
  // evergreen rotation so the pane never freezes on one static card. The lf
  // recap slide prefers TODAY's final (mode==='final') over yesterday's game,
  // and yesterday's is only used while still fresh.
  const yankSlotHtml = () => {          // R12: the ANCHOR pane (name kept — .yank plumbing throughout)
    if (_yLive){ window._anchorMerged = false; if(_wwsLiveEnabled()) startWwsLiveClock(); return mlbFeaturedSlotHtml(yankGame, 'yank', 'YANKEES'); }
    if (_metLive && !nymClutch){ window._anchorMerged = false; if(_wwsLiveEnabled()) startWwsLiveClock(); return mlbFeaturedSlotHtml(_metLive, 'yank', 'METS'); }
    // R79: show the last-game card+recap from final → next-game-live, capped at 2 days stale.
    const yRecap = yankMode === 'final' ? yankGame : (yankYest && _recapFresh(yankYest)) ? yankYest : null;
    const mRecap = metMode === 'final' ? metGame : (metYest && _recapFresh(metYest)) ? metYest : null;
    return renderAnchorIdleSlot(yRecap, mRecap, yankNext, metNext);
  };
  const metSlotHtml = () => {           // R12: slot-2 — golf > NYM clutch > perpetual WWS
    if (golfActive) return renderGolfPane();
    if (nymClutch && _metLive) return mlbFeaturedSlotHtml(_metLive, 'secondary', 'METS');
    return renderWwsSlot(wwsIdle ? bestLive : null);
  };
  const anchorMode = _yLive ? 'nyy-live' : (_metLive && !nymClutch) ? 'nym-live' : 'idle';
  const slot2Mode = golfActive ? 'golf' : nymClutch ? 'clutch' : 'wws';

  const isFirstRender = !row.querySelector('.mlb-header');

  if (isFirstRender) {
    // ── First render: build everything ──
    const header = document.createElement('div');
    header.className = 'mlb-header stagger-in';
    header.style.animationDelay = '0s';
    header.innerHTML = `
      <div class="mlb-header-live"><span class="hc-live none" id="hcLive">—</span></div>
      <div class="mlb-header-center">
        <span class="hc-date" id="hcDate">—</span>
        <span class="sb-sep"></span>
        <img class="mlb-header-logo" src="https://images.weserv.nl/?url=a.espncdn.com/combiner/i?img=/i/teamlogos/leagues/500/mlb.png&w=300&output=png&trim=10" alt="MLB" onerror="this.style.opacity=0">
        <span class="sb-sep"></span>
        <span class="hc-time" id="hcTime">—</span>
      </div>
      <div class="mlb-header-status">
        <div class="sb-dot" id="sbDot"></div>
        <span class="sb-txt" id="sbTxt">Connecting…</span>
        <div class="sb-sep"></div>
        <span class="sb-cd" id="sbCd">60s</span>
        <div class="sb-cd-bar"><div class="sb-cd-fill" id="sbCdFill"></div></div><span class="sb-stale">⟳ RECONNECTING</span>
        <div class="sb-sep"></div>
        <div class="audio-dot inactive" id="audioDot"></div>
      </div>`;
    row.appendChild(header);

    const featured = document.createElement('div');
    featured.className = 'mlb-featured stagger-in';
    featured.style.animationDelay = '0.12s';
    const _yH0 = yankSlotHtml(), _mH0 = metSlotHtml();
    featured.innerHTML = _yH0 + _mH0;
    window._lastYankHtml = _yH0; window._lastMetHtml = _mH0;
    window._yMode=anchorMode; window._mMode=slot2Mode;
    document.querySelectorAll('.mlb-feat-slot').forEach(e=>e.classList.add('slot-enter'));
    if(!document.getElementById('ambient-life')){const a=document.createElement('div');a.id='ambient-life';(document.querySelector('.shell')||document.body).appendChild(a);}
    window._mlbLiveCount=sorted.filter(g=>g.gameStatus==='live').length; updateLeverageGlow(sorted); checkBigMoments(sorted); try{BRAIN.evaluate('MLB',sorted);}catch(e){} try{b1bHydrateHits(sorted);}catch(e){} tweenScores();
    row.appendChild(featured);
    if (slot2Mode === 'wws') wwsFillSlides();   // R12: fills the mlbbest idle slide in place
    requestAnimationFrame(() => fitText(row));  // explicit first-render fit — autofit observer is installed after this render, so it would miss the initial insertion

    // ── AL/NL scrolling rows ──
    // Simple before-noon cutoff: show yesterday's whole slate until noon,
    // then switch to today's schedule. No per-matchup matching — just two
    // different source datasets, picked once. NYY/NYM excluded since their
    // games already have a dedicated featured slot above.
    const gridHour = new URLSearchParams(location.search).get('lastfinal')==='1' ? 6 : nowET().getHours();
    const gridIsPreNoon = gridHour < 12;
    const notFeaturedTeams = g => g.awayAbbr!=='NYY' && g.homeAbbr!=='NYY' &&
      ((g.awayAbbr!=='NYM' && g.homeAbbr!=='NYM') || !nymInPane);   // R12: NYM crawls unless it holds a pane
    const gridSource = (gridIsPreNoon ? yesterdayGames.filter(g=>g.gameStatus==='final') : gridGames).filter(notFeaturedTeams);
    const leagueOf = g => NL_TEAMS.has(g.homeAbbr) ? 'NL' : 'AL';
    const alGames = gridSource.filter(g => leagueOf(g)==='AL');
    const nlGames = gridSource.filter(g => leagueOf(g)==='NL');

    row.insertAdjacentHTML('beforeend', mlbSubleagueRowsShellHtml());
    row.querySelector('.mlb-subleague-rows')?.classList.add('stagger-in');
    if (row.querySelector('.mlb-subleague-rows')) row.querySelector('.mlb-subleague-rows').style.animationDelay = '0.24s';
    updateSubleaguePhased(alGames, nlGames);

    if (golfActive) refreshGolfLeaderboard();

    // Inject cached standings immediately, then fetch fresh
    injectStandings(_standingsCache['5'],  'NYY', 'nyy');
    injectStandings(_standingsCache['24'], 'NYM', 'nym');
    setTimeout(() => {
      updateStandings(fetchALEastStandings, 'NYY', 'nyy');
      updateStandings(fetchNLEastStandings, 'NYM', 'nym');
    }, 100);

    // Next game chips
    injectNextGame(sorted, 'NYY', 'nyy');
    injectNextGame(sorted, 'NYM', 'nym');

    // NOTE: a "rotate through other live games every 10s" timer used to live
    // here, but it captured slot2Candidates once at first render and never
    // refreshed it — so every 10s it overwrote the secondary slot with
    // frozen, increasingly-stale data (wrong inning, wrong score), fighting
    // against the main 30-60s refresh cycle which DOES recompute slot2Game
    // fresh every time. Removed: the regular refresh cycle below already
    // keeps the secondary slot correct (Mets game if playing, otherwise the
    // most interesting other live game) without this staleness risk. If
    // rotating through multiple other live games is wanted again, it needs
    // to pull from a freshly recomputed candidate list on each tick, not a
    // closure captured once at first render.

  } else {
    // ── Subsequent renders: update in place, never remove DOM ──

    // Update featured slots in place (only game data, leave ambient untouched).
    // The golf pane is intentionally skipped here — it owns its own refresh
    // cadence (tied to completing a scroll lap, see startGolfScroll), and
    // rebuilding it on every 30-60s dashboard tick would reset its scroll
    // position and fight with that. It was created once at first render and
    // keeps updating/scrolling itself from here on while golf mode is active.
    const yankSlot = row.querySelector('.mlb-feat-slot.yank');
    const secSlot  = row.querySelector('.mlb-feat-slot.secondary');
    const _yCh = window._yMode!==undefined && window._yMode!==anchorMode;
    const _mCh = window._mMode!==undefined && window._mMode!==slot2Mode;
    window._yMode=anchorMode; window._mMode=slot2Mode;
    // Live games take the cheap in-place patch (no string build, no subtree
    // teardown, no slot-wide autofit). Do NOT call yankSlotHtml() first — it
    // builds the full string and consumes the state maps the patch relies on.
    // Everything else (status change, lastFinal, delay, slot swap) falls back
    // to the original full-rebuild path.
    if (yankSlot) {
      if (anchorGame && !_yCh
          && updateFeaturedLiveInPlace(yankSlot, anchorGame)) {
        window._lastYankHtml = null;                  // force one full rebuild when it later goes non-live

// ── Standings cache — persists across re-renders ─────────────
const _standingsCache = {};
const _teamRecCache = {};   // abbr -> {wl, home, road}  (all 30 teams; for next-game opp record)

// ESPN's /apis/site/v2/.../standings endpoint only returns a stub — confirmed
// against ESPN's own API docs and a live fetch. The real data lives at
// /apis/v2/.../standings (no "site" segment). That corrected endpoint returns
// full *league* standings (all ~15 AL or ~15 NL teams in one flat list, ranked
// by overall seed) rather than pre-split by division, so we still need a
// client-side division roster to slice out just the 5 division teams and rank
// them by winPercent ourselves.
const DIVISION_ROSTERS = {
  '5':  ['NYY','TB','TOR','BAL','BOS'],   // AL East
  '24': ['ATL','PHI','WSH','MIA','NYM'],  // NL East
};

// Full league rosters for the AL/NL scrolling rows. Interleague games are
// bucketed by the home team's league.
const AL_TEAMS = new Set(['NYY','BOS','TOR','BAL','TB','CWS','CLE','DET','KC','MIN','HOU','SEA','TEX','LAA','OAK']);
const NL_TEAMS = new Set(['NYM','ATL','PHI','WSH','MIA','CHC','MIL','STL','CIN','PIT','LAD','SF','SD','ARI','COL']);

async function fetchDivStandings(groupId, teamAbbr, divLabel) {
  if (_standingsCache[groupId]) return _standingsCache[groupId];
  try {
    const url = `https://site.api.espn.com/apis/v2/sports/baseball/mlb/standings`;
    const data = await proxyFetch(url);
    window._divCacheAt = Date.now();          // debug-overlay stamp
    const roster = DIVISION_ROSTERS[groupId] || [];

    // ESPN returns one top-level group per league (AL/NL), each holding a flat
    // standings.entries list for every team in that league.
    const leagueGroups = data?.children || [];
    // cards pass 2 (#7): cache every team's overall + home/road record for next-game opponent line.
    leagueGroups.forEach(lg => (lg.standings?.entries || []).forEach(e => {
      const ab = normalizeAbbr('MLB', e.team?.abbreviation || '') || e.team?.abbreviation;
      if (!ab) return;
      const st = n => e.stats?.find(s => s.name === n);
      const w = st('wins')?.value, l = st('losses')?.value;
      const homeS = st('home'); const roadS = st('road') || st('away');
      _teamRecCache[ab] = {
        wl: (w != null && l != null) ? `${w}-${l}` : '',
        home: homeS?.displayValue || homeS?.summary || '',
        road: roadS?.displayValue || roadS?.summary || '',
      };
    }));
    let divEntries = [];
    for (const lg of leagueGroups) {
      const entries = lg.standings?.entries || [];
      const filtered = entries.filter(e => {
        const abbr = normalizeAbbr('MLB', e.team?.abbreviation || '') || e.team?.abbreviation;
        return roster.includes(abbr);
      });
      if (filtered.length) { divEntries = filtered; break; }
    }

    const east = divEntries.map(e => {
      const abbr = normalizeAbbr('MLB', e.team?.abbreviation || '?');
      const w = e.stats?.find(s=>s.name==='wins')?.value ?? 0;
      const l = e.stats?.find(s=>s.name==='losses')?.value ?? 0;
      const winPct = e.stats?.find(s=>s.name==='winPercent')?.value ?? (w+l ? w/(w+l) : 0);
      return { abbr, w, l, winPct };
    }).sort((a,b)=>b.winPct-a.winPct);

    const rankIdx = east.findIndex(t=>t.abbr===teamAbbr);
    const team = rankIdx>=0 ? east[rankIdx] : {w:0,l:0};
    const rank = rankIdx>=0 ? rankIdx+1 : 1;
    const ord = ['st','nd','rd','th'];
    const r = Math.min(rank-1, 3);
    const pos = `${rank}${ord[r]}`;
    const result = { record:`${team.w}–${team.l}`, div:`${pos} ${divLabel}`,
      east: east.map(({abbr,w,l})=>({abbr,w,l})) };
    _standingsCache[groupId] = result;
    setTimeout(() => delete _standingsCache[groupId], 10*60*1000);
    return result;
  } catch {
    const fallbacks = {
      'NYY': { record:'43–27', div:'1st AL East', east:[
        {abbr:'NYY',w:43,l:27},{abbr:'TB',w:41,l:27},{abbr:'TOR',w:34,l:38},{abbr:'BAL',w:34,l:39},{abbr:'BOS',w:29,l:40}]},
      'NYM': { record:'32–39', div:'5th NL East', east:[
        {abbr:'ATL',w:46,l:25},{abbr:'PHI',w:38,l:33},{abbr:'WSH',w:37,l:35},{abbr:'MIA',w:36,l:36},{abbr:'NYM',w:32,l:39}]},
    };
    return fallbacks[teamAbbr] || { record:'–', div:divLabel, east:[] };
  }
}

// Shared image-failure handler: most logo failures are transient network
// blips, not broken URLs (the URL construction is identical for every team).
// Retry once after a short delay, and only fall back to a text badge if it
// genuinely still fails — better than just vanishing into a blank gap.
function imgFallback(imgEl, abbr) {
  if (!imgEl.dataset.retried) {
    imgEl.dataset.retried = '1';
    const sep = imgEl.src.includes('?') ? '&' : '?';
    const retryUrl = imgEl.src + sep + '_retry=' + Date.now();
    setTimeout(() => { imgEl.src = retryUrl; }, 800);
    return;
  }
  imgEl.style.display = 'none';
  if (imgEl.parentNode && !imgEl.parentNode.querySelector('.logo-fallback-badge')) {
    const fallback = document.createElement('span');
    fallback.className = 'logo-fallback-badge';
    fallback.textContent = abbr || '?';
    imgEl.insertAdjacentElement('afterend', fallback);
  }
}

// ── Request health monitor ────────────────────────────────────
// Logs every API call to localStorage — viewable anytime by opening
// browser console and typing: showAPILog()
const LOG_KEY   = 'sports_dash_api_log';
const LOG_LIMIT = 500; // max entries kept

function logRequest(league, success, ms, note='') {
  let log = [];
  try { log = JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch {}
  log.push({
    ts:   new Date().toISOString(),
    league, success, ms,
    note: note || (success ? 'ok' : 'failed'),
  });
  // keep only last LOG_LIMIT entries
  if (log.length > LOG_LIMIT) log = log.slice(-LOG_LIMIT);
  try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); } catch {}
}

// Call showAPILog() in the browser console to see stats
window.showAPILog = function() {
  let log = [];
  try { log = JSON.parse(localStorage.getItem(LOG_KEY) || '[]'); } catch {}
  if (!log.length) { console.log('No API log entries yet.'); return; }

  const total      = log.length;
  const succeeded  = log.filter(e=>e.success).length;
  const failed     = total - succeeded;
  const successPct = ((succeeded/total)*100).toFixed(1);
  const avgMs      = Math.round(log.filter(e=>e.success).reduce((a,e)=>a+e.ms,0) / (succeeded||1));
  const last5fail  = log.slice(-50).filter(e=>!e.success).length;

  console.group('%c📡 Sports Dashboard API Health', 'font-size:14px;font-weight:bold;color:#22c55e;');
  console.log(`Total requests : ${total}`);
  console.log(`Success rate   : ${successPct}% (${succeeded} ok / ${failed} failed)`);
  console.log(`Avg response   : ${avgMs}ms`);
  console.log(`Recent failures: ${last5fail} in last 50 requests`);
  if (last5fail >= 5)  console.warn('⚠️  High failure rate — possible rate limiting');
  if (last5fail === 0) console.log('✅  No recent failures — looking healthy');
  console.log('\nLast 10 entries:');
  console.table(log.slice(-10).map(e=>({
    time:    e.ts.slice(11,19),
    league:  e.league,
    status:  e.success ? '✅' : '❌',
    ms:      e.ms,
    note:    e.note,
  })));
  console.groupEnd();
};

// Also expose a reset
window.clearAPILog = function() {
  localStorage.removeItem(LOG_KEY);
  console.log('API log cleared.');
};

// ── Local-date formatter for ESPN's dates= param ───────────────
// IMPORTANT: never use d.toISOString() for this — it converts to UTC first,
// which drifts from the user's actual calendar day for parts of the day
// (the same class of bug fixed in SEASON_CONFIG). Build the YYYYMMDD string
// from local Y/M/D components instead.
function localDateStr(d = new Date()) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}${m}${day}`;
}

// ── Next game lookup — fetch tomorrow + next 2 days to find next playoff game ──
const nextGameCache = {}; // key: 'LEAGUE:AWAY:HOME' → nextGame object

async function fetchNextGame(lg, awayAbbr, homeAbbr) {
  const key = `${lg.key}:${awayAbbr}:${homeAbbr}`;
  // Cache for 5 minutes
  if (nextGameCache[key] && nextGameCache[key].ts > Date.now() - 300000) {
    return nextGameCache[key].data;
  }
  try {
    const now = new Date();
    // Check next 4 days
    for (let i = 1; i <= 4; i++) {
      const d = new Date(now);
      d.setDate(d.getDate() + i);
      const dateStr = localDateStr(d);
      const url = `https://site.api.espn.com/apis/site/v2/sports/${lg.sport}/${lg.slug}/scoreboard?dates=${dateStr}&limit=100`;
      const data = await proxyFetch(url);
      const events = data.events || [];
      for (const ev of events) {
        const comps = ev.competitions?.[0]?.competitors || [];
        const abbrs = comps.map(c => normalizeAbbr(lg.key, c.team?.abbreviation || ''));
        if (abbrs.includes(awayAbbr) && abbrs.includes(homeAbbr)) {
          const broadcasts = ev.competitions?.[0]?.broadcasts || [];
          let network = broadcasts?.[0]?.names?.[0] || null;
          network = resolveNetwork(network, awayAbbr, homeAbbr);
          const gameDate = new Date(ev.date);
          const tomorrow = new Date(now); tomorrow.setDate(now.getDate()+1);
          const timeStr = gameDate.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
          let label;
          if (i===1) label='Tomorrow';
          else label=gameDate.toLocaleDateString('en-US',{weekday:'long'});
          const result = { label, time: timeStr, network };
          nextGameCache[key] = { ts: Date.now(), data: result };
          // Store actual Date for cutover calculation
          nextGameDate[lg.key] = gameDate;
          return result;
        }
      }
    }
  } catch(e) { console.warn('nextGame lookup failed:', e.message); }
  nextGameCache[key] = { ts: Date.now(), data: null };
  return null;
}

// Returns the raw Date of the next game (for cutover calculation)
// ── Yesterday scores — shown until noon on the day of the next game ──
const CUTOVER_HOUR = 12; // noon

// Per-league next game date cache (set when fetchNextGame resolves)
const nextGameDate = {}; // leagueKey → Date object of next game

function isBeforeCutover(leagueKey) {
  if (new URLSearchParams(window.location.search).get('yesterday') === '1') return true;
  const now = new Date();
  const ng = nextGameDate[leagueKey];
  if (ng) {
    const cutover = new Date(ng);
    cutover.setHours(CUTOVER_HOUR, 0, 0, 0);
    return now < cutover;
  }
  // No next game date known = offseason, never show yesterday
  return false;
}

function yesterdayDateStr() {
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return localDateStr(d);
}

async function fetchLeagueYesterday(lg) {
  const url = `https://site.api.espn.com/apis/site/v2/sports/${lg.sport}/${lg.slug}/scoreboard?limit=100&dates=${yesterdayDateStr()}&enable=leaders,linescores,probables`;
  const start = Date.now();
  try {
    const data = await proxyFetch(url);
    logRequest(lg.key, true, Date.now()-start, 'yesterday');
    // Only return finals
    return (data.events||[])
      .map(ev=>parseEvent(ev,lg.key))
      .filter(g=>g.gameStatus==='final');
  } catch(e) {
    logRequest(lg.key, false, Date.now()-start, e.message);
    return [];
  }
}

// ── Fetch ─────────────────────────────────────────────────────
async function fetchLeague(lg) {
  // IMPORTANT: always pass an explicit dates= param for "today." ESPN's bare
  // scoreboard endpoint (no dates param) has been observed to return a stale
  // default day rather than the actual current date — this was the root
  // cause of the dashboard appearing "stuck" on a previous day's slate.
  const url   = `https://site.api.espn.com/apis/site/v2/sports/${lg.sport}/${lg.slug}/scoreboard?limit=100&dates=${localDateStr()}&enable=leaders,linescores,probables`;
  const start = Date.now();
  try {
    const data = await proxyFetch(url);
    logRequest(lg.key, true, Date.now()-start);
    return (data.events||[]).map(ev=>parseEvent(ev,lg.key));
  } catch(e) {
    logRequest(lg.key, false, Date.now()-start, e.message);
    throw e;
  }
}

// getElementById only ever returns the first match in the document, but the
// status-badge markup is intentionally duplicated — once inside the normal
// ticker row, once inside MLB Fullscreen's own header — so each layout mode
// has its own copy to show/hide. Without this helper, every update below was
// silently landing on whichever copy happens to be the hidden one once MLB
// Fullscreen takes over, leaving the actually-visible badge (status text,
// countdown, audio dot) frozen on its initial markup forever.
function getAllById(id) {
  return document.querySelectorAll(`[id="${id}"]`);
}

function setStatus(state, count, refreshSecs, prefix='') {
  const dots = getAllById('sbDot');
  const txts = getAllById('sbTxt');
  const gcs  = getAllById('gameCount');
  if (state==='live') {
    dots.forEach(dot=>{ dot.style.background='#22c55e'; dot.style.boxShadow='0 0 6px rgba(34,197,94,0.8)'; });
    txts.forEach(txt=>{ txt.textContent = prefix ? 'Yesterday' : 'ESPN Live'; });
    gcs.forEach(gc=>{ gc.textContent = `${count} game${count!==1?'s':''}${prefix?'':' today'}`; });
  } else if (state==='error') {
    dots.forEach(dot=>{ dot.style.background='#ef4444'; dot.style.boxShadow='0 0 6px rgba(239,68,68,0.8)'; });
    txts.forEach(txt=>{ txt.textContent = 'Demo Mode'; });
    gcs.forEach(gc=>{ gc.textContent = ''; });
  } else {
    dots.forEach(dot=>{ dot.style.background='#e8c84a'; dot.style.boxShadow='0 0 6px rgba(232,200,74,0.8)'; });
    txts.forEach(txt=>{ txt.textContent = 'Updating…'; });
    gcs.forEach(gc=>{ gc.textContent = ''; });
  }
}

// ── Dynamic refresh rate ──────────────────────────────────────
// 30s when live games are in progress, 60s otherwise
// ── Sound engine ─────────────────────────────────────────────
// Audio files hosted in same GitHub repo as the dashboard
const SOUND_BASE = 'https://raw.githubusercontent.com/mikeylegs/sports/main/';
let audioUnlocked = false;
let _userMuted = true;   // R61: start muted (autoplay policy); dot click toggles. true=muted.
const sounds = {
  nhl: new Audio(SOUND_BASE + 'buzzer.wav'),
  nba: new Audio(SOUND_BASE + 'whistle.wav'),
};
// Pre-load
Object.values(sounds).forEach(s => { s.preload = 'auto'; s.volume = 0.8; });

// Browsers require a user gesture before playing audio
// First touch/click on the TV unlocks it for the session
// R61: click/tap toggles mute; first interaction also satisfies autoplay-gesture.
// Dot: active(green)=unmuted, inactive(grey)=muted.
function setAudioDot(){
  getAllById('audioDot').forEach(dot=>{
    dot.classList.toggle('active', !_userMuted);
    dot.classList.toggle('inactive', _userMuted);
    dot.title = _userMuted ? 'Muted \u2014 tap to unmute' : 'Unmuted \u2014 tap to mute';
  });
}
function toggleAudio(){
  audioUnlocked = true;
  _userMuted = !_userMuted;
  setAudioDot();
  try {
    if (_recapPlayer && _recapPlayer.mute){
      if (_userMuted){ _recapPlayer.mute(); }
      else { _recapPlayer.unMute(); _recapPlayer.setVolume(100); _recapUnmuted = true; }
    }
  } catch(_){}
}
document.addEventListener('click',      toggleAudio);
document.addEventListener('touchstart', toggleAudio);

// ── Sound gate — playoffs only ────────────────────────────────
// Only fires during playoff/Finals games to avoid 20 whistles on a random Tuesday
function shouldPlaySound(leagueKey) {
  // Check if any current game in this league is a playoff game
  const trackEl = document.getElementById(
    leagueKey === 'NHL' ? 'tNHL' : leagueKey === 'NBA' ? 'tNBA' : 'tMLB'
  );
  if (!trackEl) return false;
  // Look for series info in the rendered chips — if present it's a playoff game
  return !!trackEl.querySelector('.chip-series');
}

function playSound(leagueKey) {
  if (!audioUnlocked || _userMuted) return;   // R61: respect mute toggle
  if (!shouldPlaySound(leagueKey)) return;
  const snd = sounds[leagueKey.toLowerCase()];
  if (!snd) return;
  try {
    snd.currentTime = 0;
    snd.play().catch(e => console.warn('Audio play failed:', e.message));
  } catch(e) {
    console.warn('Audio error:', e.message);
  }
}

let countdown    = 60;
let currentRate  = 60;
let anyLive      = false;  // updated after each fetch

function getRefreshRate() { return anyLive ? 30 : 60; }

// Tracks whether NYY or NYM currently has a live game, kept fresh by the
// main fetch cycle below. Lets the fast MLB-only refresh (further down)
// decide whether to do anything without needing its own network call first.
let mlbDesignatedTeamsLive = false;

async function fetchAll() {
  setStatus('loading', 0, currentRate);
  let total=0, ok=false, liveCount=0;
  let anyYesterday = false;
  let mlbOk = false; // tracked separately: when MLB Fullscreen is the active
  // view, a healthy NHL/NBA fetch shouldn't be able to mask a silently-failing
  // MLB fetch (the one that actually matters when MLB Fullscreen is on screen)
  const forceDemo = new URLSearchParams(window.location.search).get('demo');

  for (const lg of LEAGUES) {
    try {
      // ?demo=nba or ?demo=all forces demo data for testing
      if (forceDemo === 'all' || forceDemo === lg.key.toLowerCase()) {
        renderTrack(lg, DEMO[lg.key]);
        if (lg.key === 'MLB' && getLayoutMode() === 'mlbFull') {
          renderMLBFullscreen(DEMO[lg.key], DEMO_YESTERDAY.MLB||[]);
        }
        total += DEMO[lg.key].length;
        ok = true;
        continue;
      }
      let games = await fetchLeague(lg);
      let yesterday = []; // declare here so always in scope
      // Offseason: if champion defined and today only has stale finals, clear to show champion screen
      if (CHAMPIONS[lg.key] && games.every(g => g.gameStatus === 'final')) {
        games = [];
      }
      const todayLive = games.some(g => g.gameStatus === 'live');

      // Skip yesterday logic entirely for leagues in offseason (champion defined)
      if (!todayLive && !CHAMPIONS[lg.key]) {
        yesterday = await fetchLeagueYesterday(lg);
        if (yesterday.length > 0) {
          yesterday.forEach(yg => {
            // Carry series info from today onto yesterday
            if (!yg.seriesSummary && !yg.roundTitle) {
              const match = games.find(tg =>
                (tg.awayAbbr === yg.awayAbbr || tg.homeAbbr === yg.homeAbbr ||
                 tg.awayAbbr === yg.homeAbbr || tg.homeAbbr === yg.awayAbbr) &&
                (tg.seriesSummary || tg.roundTitle)
              );
              if (match) {
                yg.seriesSummary = match.seriesSummary;
                yg.roundTitle    = match.roundTitle;
                yg.isPlayoffs    = match.isPlayoffs;
              }
            }
            // Attach nextGame directly from today's upcoming game — same two teams
            if (!yg.nextGame) {
              const nextUp = games.find(tg =>
                tg.gameStatus === 'upcoming' &&
                ((tg.awayAbbr === yg.awayAbbr && tg.homeAbbr === yg.homeAbbr) ||
                 (tg.awayAbbr === yg.homeAbbr && tg.homeAbbr === yg.awayAbbr))
              );
              if (nextUp) {
                const timeParts = nextUp.timeLabel.split(' · ');
                const label = timeParts[0] || 'Tonight';
                const time  = timeParts[1] || nextUp.timeLabel;
                yg.nextGame = { label, time, network: nextUp.network };
              }
            }
          });
          const hasPlayoffFinals = yesterday.some(g => g.seriesSummary || g.roundTitle || g.isPlayoffs);
          if (hasPlayoffFinals && isBeforeCutover(lg.key)) {
            games = yesterday;
            anyYesterday = true;
          } else if (lg.key !== 'MLB' && games.length > 0 && !games.some(g => g.gameStatus === 'upcoming') && yesterday.length > 0) {
            // Only show yesterday if today has SOME games (season active) — don't override offseason champion screen
            // Excluded for MLB: with 15 games/day, MLB's "no upcoming games today" almost
            // never means an off day — it usually means today's fetch was wrong (see the
            // explicit dates= param above). MLB Fullscreen already handles real per-team
            // off-days itself via the yesterday param, so the whole league list should
            // never get wholesale-replaced here.
            games = yesterday;
            anyYesterday = true;
          }
        }
      }

      renderTrack(lg, games);
      UCS_FEED[lg.key] = games;                       // R114: UCS reads, never mutates
      // MLB Fullscreen View
      if (lg.key === 'MLB') {
        mlbDesignatedTeamsLive = games.some(g =>
          (g.awayAbbr==='NYY'||g.homeAbbr==='NYY'||g.awayAbbr==='NYM'||g.homeAbbr==='NYM')
          && g.gameStatus==='live');
        const mode = getLayoutMode();
        if (mode === 'mlbFull') {
          renderMLBFullscreen(games, yesterday||[]);
        } else {
          teardownMLBFullscreen();
        }
      }
      total += games.length;
      liveCount += games.filter(g=>g.gameStatus==='live').length;
      ok = true;
      if (lg.key === 'MLB') mlbOk = true;
    } catch(e) {
      console.warn(`[${lg.key}]`, e.message);
      const fallback = DEMO[lg.key];
      renderTrack(lg, fallback);
      if (lg.key === 'MLB' && getLayoutMode() === 'mlbFull') {
        renderMLBFullscreen(fallback, []);
      }
    }
  }

  anyLive     = liveCount > 0;
  currentRate = getRefreshRate();
  countdown   = currentRate;

  const statusOk = (getLayoutMode() === 'mlbFull' && !forceDemo) ? mlbOk : ok;
  setStatus(statusOk?'live':'error', total, currentRate, anyYesterday ? 'Yesterday' : '');
  if (statusOk) window._lastDataAt = Date.now();
  document.getElementById('overlay').classList.add('gone');
}

function tick() {
  countdown--;
  if (countdown <= 0) { countdown = currentRate; fetchAll(); }
  getAllById('sbCd').forEach(el=>{ _setText(el, `${countdown}s`); });
  getAllById('sbCdFill').forEach(fill=>{ fill.style.width = `${(countdown / currentRate) * 100}%`; });
  updateStaleness();
  const _now=new Date();
  const _d=_now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}).toUpperCase();
  const _t=_now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  getAllById('hcDate').forEach(el=>_setText(el,_d));
  getAllById('hcTime').forEach(el=>_setText(el,_t));
  const _lc=window._mlbLiveCount||0;
  getAllById('hcLive').forEach(el=>{_setText(el,_lc>0?`${_lc} LIVE`:'NO GAMES LIVE');el.classList.toggle('none',_lc===0);});

  // ── Tick intermission countdowns every second ──────────────
  for (const key of Object.keys(intermissionStarts)) {
    const tracker    = intermissionStarts[key];
    const elapsed    = Math.floor((Date.now() - tracker.startedAt) / 1000);
    const isPlayoffs = true;
    const total      = getIntermissionLength(key, isPlayoffs);
    const remaining  = Math.max(0, total - elapsed);
    const remaining2 = getIntermissionCountdown(key, isPlayoffs);

    // Update countdown text
    document.querySelectorAll(`[data-int-key="${key}"]`).forEach(el => {
      el.textContent = remaining2 ? `Back in ${remaining2}` : 'Starting Soon';
    });

    // Swap warning/urgent classes on the parent chip-time element
    document.querySelectorAll(`[data-int-key="${key}"]`).forEach(el => {
      const chipTime = el.closest('.chip-time');
      if (!chipTime) return;
      chipTime.classList.remove('int','int-warning','int-urgent');
      if      (remaining <= 0)  chipTime.classList.add('live');
      else if (remaining <= 30) chipTime.classList.add('int-urgent');
      else if (remaining <= 60) chipTime.classList.add('int-warning');
      else                      chipTime.classList.add('int');
    });

    // Row-level urgent glow at 30s
    // Find the row by looking up which league track contains this game
    document.querySelectorAll('.league-row').forEach(row => {
      const hasGame = row.querySelector(`[data-int-key="${key}"]`);
      if (hasGame) {
        row.classList.toggle('int-urgent-glow', remaining > 0 && remaining <= 30);
      }
    });

    // At zero — trigger score flash, sound, and clean up tracker
    if (remaining === 0) {
      document.querySelectorAll('.league-row').forEach(row => {
        if (row.querySelector(`[data-int-key="${key}"]`)) {
          row.classList.remove('int-urgent-glow');
          row.classList.add('score-flash');
          setTimeout(() => row.classList.remove('score-flash'), 1300);
          // Fire the sound — detect league from row id
          const leagueKey = row.id.replace('row-','');
          playSound(leagueKey);
        }
      });
      delete intermissionStarts[key];
    }
  }
}

// Faster refresh, scoped only to the NYY/NYM featured panels while one of
// them is actually live — runs on its own independent timer, completely
// separate from the main 30s/60s cycle above (which keeps governing
// everything else: NHL, NBA, and the AL/NL rows, unaffected by this).
// Gated on mlbDesignatedTeamsLive so it costs nothing (no network call at
// all) outside of an actual live NYY/NYM game.
async function fetchMLBLiveFast() {
  if (!mlbDesignatedTeamsLive) return;
  if (getLayoutMode() !== 'mlbFull') return;
  const mlbLg = LEAGUES.find(l => l.key === 'MLB');
  if (!mlbLg) return;
  try {
    const games = await fetchLeague(mlbLg);
    mlbDesignatedTeamsLive = games.some(g =>
      (g.awayAbbr==='NYY'||g.homeAbbr==='NYY'||g.awayAbbr==='NYM'||g.homeAbbr==='NYM')
      && g.gameStatus==='live');
    // Pass [] for yesterdayGames: a live game means we're well past the
    // before-noon window where that data would even be used.
    renderMLBFullscreen(games, []);
  } catch(e) {
    // Silent — the main cycle will pick it back up on its own schedule
    // regardless, this is purely a bonus for responsiveness while live.
  }
}
// Live refresh cadence: dropped 15s -> 5s to cut poll-gap lag. Source here is
// ESPN scoreboard; if the baseline at 5s is still too laggy, the next lever is
// switching the featured live game to statsapi feed/live (timestamps-driven),
// which the probe measured at a ~2-10s floor.
setInterval(fetchMLBLiveFast, 5000);

if ('wakeLock' in navigator) navigator.wakeLock.request('screen').catch(()=>{});

// ── RAF scroll engine ─────────────────────────────────────────
// Tracks position per league in JS — innerHTML changes never reset it
const scrollPos = {
  NHL: { x:0, halfW:0, active:false },
  NBA: { x:0, halfW:0, active:false },
  MLB: { x:0, halfW:0, active:false },
  AL:  { x:0, halfW:0, active:false },
  NL:  { x:0, halfW:0, active:false },
  LG:  { x:0, halfW:0, active:false },
};
const TRACK_IDS = { NHL:'tNHL', NBA:'tNBA', MLB:'tMLB', AL:'tAL', NL:'tNL', LG:'tLG' };

let rafLast = null;
function rafScroll(ts) {
  if (rafLast !== null) {
    const dt = (ts - rafLast) / 1000;
    for (const key of ['NHL','NBA','MLB','AL','NL','LG']) {
      const s = scrollPos[key];
      if (!s.active || s.halfW <= 0) continue;
      const el = document.getElementById(TRACK_IDS[key]);
      if (!el) continue;
      s.x -= (key==='AL'||key==='NL'||key==='LG' ? SUBLEAGUE_SPEED : SPEED) * dt;
      if (s.x <= -s.halfW) s.x += s.halfW;
      el.style.transform = `translateX(${s.x}px)`;
    }
  }
  rafLast = ts;
  requestAnimationFrame(rafScroll);
}
requestAnimationFrame(rafScroll);

// Seed demo intermission — 4 minutes elapsed so ~13 min remaining shows on load
intermissionStarts['nhl-1-int1'] = { startedAt: Date.now() - (4 * 60 * 1000), afterPeriod: 1 };

// Route league logos through weserv proxy
document.querySelectorAll('.league-logo').forEach(img => {
  const orig = img.src;
  if (orig && !orig.includes('weserv')) {
    img.src = `https://images.weserv.nl/?url=${encodeURIComponent(orig)}&w=240&output=png`;
  }
});

tick(); setInterval(tick, 1000); fetchAll();

// Going into/out of fullscreen (or any viewport resize) changes the actual
// rendered pixel dimensions of the AL/NL crawl areas, but the scroll math in
// setupSubleagueRow (halfW, repetition count) is measured once in pixels and
// cached — it doesn't auto-update just because CSS reflows. Re-run it against
// the new dimensions whenever the viewport changes, debounced so a window
// drag doesn't trigger dozens of re-measurements.
// ── Autofit: scale [data-fit] text to fill its box, capped at a cqh ceiling.
// Ceiling/floor are in cqh (same unit as the layout), resolved against the MLB
// size-container height. Shrinks ONLY when content would overflow, so short
// strings sit at the ceiling and long ones step down — no clipping at any
// string length, and no dependence on which font actually loaded.
function fitText(scope){
  const cont = document.getElementById('row-MLB');
  const baseH = (cont && cont.clientHeight) || window.innerHeight || 720;
  const els = (scope || document).querySelectorAll('[data-fit]');
  els.forEach(el => {
    const maxCqh = parseFloat(el.dataset.fit);
    if (!maxCqh) return;
    const minCqh = parseFloat(el.dataset.fitMin) || maxCqh * 0.45;
    const maxPx = maxCqh / 100 * baseH;
    const minPx = minCqh / 100 * baseH;
    el.style.fontSize = maxPx + 'px';
    const fits = () => el.scrollWidth <= el.clientWidth + 0.5 &&
                       el.scrollHeight <= el.clientHeight + 1;
    if (!fits()) {
      let lo = minPx, hi = maxPx, best = minPx;
      for (let i = 0; i < 14; i++){
        const mid = (lo + hi) / 2;
        el.style.fontSize = mid + 'px';
        if (fits()) { best = mid; lo = mid; } else { hi = mid; }
      }
      el.style.fontSize = best + 'px';
    }
  });
}
let _fitTimer = null;
function _setText(el,v){ const n=el.firstChild; if(n && n.nodeType===3){ if(n.nodeValue!==v) n.nodeValue=v; } else { el.textContent=v; } }
function scheduleFit(){
  clearTimeout(_fitTimer);
  _fitTimer = setTimeout(() => fitText(document.getElementById('row-MLB')), 80);
}
(function initAutofit(){
  const row = document.getElementById('row-MLB');
  // childList only (not attributes) so fitText's own font-size writes never re-trigger it
  // Header date/time/countdown tick every second, but they update via nodeValue
  // (characterData), which this childList-only observer ignores — so the per-second
  // ticks no longer trigger a full-row refit (which used to hitch the AL/NL crawl).
  if (row) new MutationObserver(scheduleFit).observe(row, {childList:true, subtree:true});
  window.addEventListener('resize', scheduleFit);
  document.addEventListener('fullscreenchange', scheduleFit);
})();

let subleagueResizeTimer = null;
function remeasureSubleagueRows() {
  clearTimeout(subleagueResizeTimer);
  subleagueResizeTimer = setTimeout(() => {
    if (document.getElementById('tLG')) { if (scrollPos.LG) scrollPos.LG.x = 0; setupSubleagueRow('LG', _subGames[_subPhase] || [], true); }
  }, 250);
}
window.addEventListener('resize', remeasureSubleagueRows);
document.addEventListener('fullscreenchange', remeasureSubleagueRows);
document.addEventListener('webkitfullscreenchange', remeasureSubleagueRows);

AUTOFIT ENGINE (added; search "function fitText")
  Element with data-fit="<cqh ceiling>" (optional data-fit-min) scales to fill
  its box up to the ceiling, shrinking only if it would overflow. Runs via a
  MutationObserver on #row-MLB and on resize/fullscreenchange, plus an explicit
  call inside setupSubleagueRow before scroll measurement.
  WHY: it measures the REAL rendered font, so it is font-agnostic and clip-proof
  at any string length. Applied to: lf-abbr, lf-next-matchup, lf-decisions (whole
  line), mlb-feat-abbr, mlb-feat-pbline, feat-pg-abbr, mlb-card-abbr, mlb-card-status.

VERIFICATION WORKFLOW (how every change was checked)
  Offline Playwright (chromium) renders at viewport 1280x720, device_scale_factor
  1.5, ALL network blocked. Network off => Inter not loaded => falls back to
  DejaVu Sans, which is WIDER than Inter. So "fits in DejaVu => fits in Inter":
  a conservative no-clip oracle. A DOM scan flags scrollWidth>clientWidth (with
  overflow hidden/ellipsis) or scrollHeight>clientHeight. The residual ~+9px on
  the NYM .lf-wrap in those reports is this DejaVu margin, NOT a real clip.
