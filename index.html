<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<!-- R54: kill stale-cache confusion (GitHub Pages caches per-URL incl query strings, so
     ?debug=1 could serve an older index.html than the bare URL). Force always-fresh. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Sports Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#0a0c12;overflow:hidden;cursor:none;font-family:'Inter',sans-serif;}
.shell{width:100vw;height:100vh;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:50% 50%;position:relative;transition:grid-template-rows 0.4s ease;}

/* ── Animated background ── */
.shell::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 50%,rgba(30,107,184,0.04) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 50%,rgba(200,16,46,0.04) 0%,transparent 60%),
    radial-gradient(ellipse at 50% 0%,rgba(0,45,114,0.05) 0%,transparent 50%);
  animation:bgDrift 18s ease-in-out infinite alternate;
}
@keyframes bgDrift{
  0%  {opacity:0.6;transform:scale(1) translateY(0);}
  50% {opacity:1;  transform:scale(1.05) translateY(-10px);}
  100%{opacity:0.7;transform:scale(1) translateY(5px);}
}

/* ── Quadrant placement ── */
#row-NHL{grid-column:1;grid-row:1;}
#row-NBA{grid-column:2;grid-row:1;}
#row-MLB{grid-column:1/-1;grid-row:2;container-type:size;container-name:mlb-row;}

/* ── League row tints ── */
.row-nhl{background:linear-gradient(to right,rgba(30,107,184,0.14) 0%,rgba(30,107,184,0.05) 50%,transparent 100%);}
.row-nba{background:linear-gradient(to right,rgba(200,16,46,0.14) 0%,rgba(200,16,46,0.05) 50%,transparent 100%);}
.row-mlb{background:linear-gradient(to right,rgba(0,80,200,0.12) 0%,rgba(0,80,200,0.04) 50%,transparent 100%);}

/* ── Separators ── */
.league-row.row-nhl{border-right:1px solid rgba(30,107,184,0.25);border-bottom:2px solid rgba(255,255,255,0.07);}
.league-row.row-nba{border-bottom:2px solid rgba(255,255,255,0.07);}
.league-row.row-mlb{border-bottom:none;}

/* ── League rows ── */
.league-row{
  display:flex;align-items:stretch;min-height:0;min-width:0;overflow:hidden;
  position:relative;transition:background 1.5s ease;z-index:1;

}

.league-row.ot-glow{animation:otPulse 3s ease-in-out infinite;}
@keyframes otPulse{0%,100%{background:transparent;}50%{background:rgba(251,191,36,0.04);}}
.league-row.score-flash{animation:scoreFlash 1.2s ease-out forwards;}
@keyframes scoreFlash{0%{background:rgba(255,255,255,0.08);}40%{background:rgba(251,191,36,0.1);}100%{background:transparent;}}

/* ── Heartbeat mode — close game in final minutes ── */
/* Level 1: within 5 min, margin ≤ 2 — slow pulse */
.league-row.hb-1{animation:hbPulse1 2.5s ease-in-out infinite;}
@keyframes hbPulse1{0%,100%{background:transparent;}50%{background:rgba(255,255,255,0.025);}}
/* Level 2: within 2 min, margin ≤ 1 — medium pulse */
.league-row.hb-2{animation:hbPulse2 1.5s ease-in-out infinite;}
@keyframes hbPulse2{0%,100%{background:transparent;}50%{background:rgba(255,255,255,0.04);}}
/* Level 3: within 1 min, tied or 1 goal — fast heartbeat */
.league-row.hb-3{animation:hbPulse3 0.8s ease-in-out infinite;}
@keyframes hbPulse3{0%,100%{background:transparent;}50%{background:rgba(255,255,255,0.06);}}

/* ── Logo panel — Option A: full bleed ── */
.logo-panel{
  width:14.8vh;flex-shrink:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:8px;padding:12px 16px;
  position:relative;
  z-index:2;
}
.logo-panel.nhl{background:linear-gradient(to right,#0e2d56 0%,#091e3a 30%,transparent 100%);}
.logo-panel.nba{background:linear-gradient(to right,#4f0d1a 0%,#360910 30%,transparent 100%);}
.logo-panel.mlb{background:linear-gradient(to right,#0b1d3e 0%,#071228 30%,transparent 100%);position:relative;}
.league-logo.mlb-logo{width:150px;height:150px;}
.league-logo.nhl-logo{
  filter:drop-shadow(0 0 18px rgba(30,107,184,0.4));
  animation:glowNHL 4s ease-in-out infinite;
}
.league-logo.nba-logo{
  filter:drop-shadow(0 0 18px rgba(200,16,46,0.4));
  animation:glowNBA 4s ease-in-out infinite;
}
.league-logo.mlb-logo{
  filter:drop-shadow(0 0 18px rgba(0,80,200,0.4));
  animation:glowMLB 4s ease-in-out infinite;
}
@keyframes glowNHL{
  0%,100%{filter:drop-shadow(0 0 12px rgba(30,107,184,0.25));}
  50%    {filter:drop-shadow(0 0 28px rgba(30,107,184,0.65));}
}
@keyframes glowNBA{
  0%,100%{filter:drop-shadow(0 0 12px rgba(200,16,46,0.25));}
  50%    {filter:drop-shadow(0 0 28px rgba(200,16,46,0.65));}
}
@keyframes glowMLB{
  0%,100%{filter:drop-shadow(0 0 12px rgba(0,80,200,0.25));}
  50%    {filter:drop-shadow(0 0 28px rgba(0,80,200,0.65));}
}
.league-logo-fb{font-size:64px;font-weight:900;letter-spacing:2px;color:rgba(255,255,255,0.2);}

/* ── Crawl ── */
.crawl-area{
  flex:1;overflow:hidden;display:flex;align-items:center;
  position:relative;min-width:0;background:transparent;
}
/* Mask only applied when scrolling — single game rows get no-mask class */
.crawl-area.scrolling{
  -webkit-mask-image:linear-gradient(to right, transparent 0%, black 140px, black calc(100% - 60px), transparent 100%);
  mask-image:linear-gradient(to right, transparent 0%, black 140px, black calc(100% - 60px), transparent 100%);
}
.fade-l{display:none;}
.fade-r{display:none;}

/* fade-l is now minimal — panel background handles the blend */
#fl-NHL{background:none;}
#fl-NBA{background:none;}
#fl-MLB{background:none;}
.track{display:flex;align-items:center;height:100%;white-space:nowrap;padding:0 32px;will-change:transform;}
@keyframes sNHL{from{transform:translateX(0);}to{transform:translateX(-50%);}}
@keyframes sNBA{from{transform:translateX(0);}to{transform:translateX(-50%);}}
@keyframes sMLB{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* ── Chip ── */
.chip{display:inline-flex;align-items:center;justify-content:flex-start;gap:36px;flex-shrink:0;height:100%;padding-left:24px;padding-right:96px;margin-right:96px;border-right:3px solid var(--chip-div,rgba(255,255,255,0.06));}
.chip:only-child{border-right:none;padding-right:0;margin-right:0;}
.chip.final-chip{gap:28px;max-width:calc(100vw - 260px);}
/* Single pinned final: spread contents evenly, reserve right side for performers overlay */
.crawl-area:not(.scrolling) .chip.final-chip{width:100%;max-width:none;justify-content:space-evenly;padding-right:480px;margin-right:0;border-right:3px solid var(--chip-div,rgba(255,255,255,0.06));}
.crawl-area:not(.scrolling) .chip:not(.final-chip){width:100%;max-width:none;justify-content:space-evenly;padding-right:48px;margin-right:0;border-right:3px solid var(--chip-div,rgba(255,255,255,0.06));}
.crawl-area:not(.scrolling) .chip:last-child{border-right:none;}
.crawl-area:not(.scrolling) .chip.mlb-pregame-chip{justify-content:flex-start;padding:0;padding-right:0;}

.chip-status{font-size:2.2vh;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:1.0vh 2.4vh;border-radius:30px;flex-shrink:0;min-width:14.8vh;text-align:center;}
.s-live{background:rgba(239,68,68,0.15);color:#f87171;}
.s-soon{background:rgba(52,211,153,0.08);color:#34d399;border:1px solid rgba(52,211,153,0.2);}
.s-final{background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.2);}

/* ── Teams block ── */
.chip-teams{display:flex;flex-direction:column;gap:12px;min-width:320px;}
.chip-teams.final{min-width:0;}
.chip-team{display:flex;align-items:center;gap:22px;}
.t-logo{width:9.3vh;height:9.3vh;object-fit:contain;flex-shrink:0;}
.t-logo-fb{width:9.3vh;height:9.3vh;border-radius:12px;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;font-size:2.2vh;font-weight:700;color:rgba(255,255,255,0.3);flex-shrink:0;}

/* Name + record stack */
.t-name-group{display:flex;flex-direction:column;gap:3px;width:21.1vh;}
.chip-teams.final .t-name-group{width:19.4vh;}
.chip-teams.final .chip-team{gap:20px;}
.t-abbr{font-size:5.9vh;font-weight:700;color:rgba(255,255,255,0.45);letter-spacing:1px;line-height:1;}
.t-abbr.w{color:#fff;}
.t-meta{display:flex;align-items:center;gap:8px;}
.t-record{font-size:1.8vh;font-weight:500;color:rgba(255,255,255,0.2);letter-spacing:0.3px;}
.t-seed{font-size:1.7vh;font-weight:700;color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.07);padding:2px 10px;border-radius:5px;letter-spacing:0.5px;}

.t-score{font-size:7.8vh;font-weight:800;color:rgba(255,255,255,0.18);min-width:9.4vh;text-align:right;font-variant-numeric:tabular-nums;line-height:1;transition:color 0.3s;}
.t-score.w{color:#fff;}
/* Winning score glows in team color — set via inline style on the element */
.t-score.w.glow{text-shadow:0 0 24px var(--team-color,rgba(255,255,255,0.4)),0 0 48px var(--team-color,rgba(255,255,255,0.2));}
.t-score.flashing{animation:scorePop 1s ease-out forwards;}
@keyframes scorePop{0%{color:#fbbf24;transform:scale(1.18);}60%{color:#fff;transform:scale(1.05);}100%{color:#fff;transform:scale(1);}}
.chip-sep{width:100%;height:1px;background:rgba(255,255,255,0.05);}

/* Live pulse ring around team logos */
.t-logo-wrap{position:relative;flex-shrink:0;}
.t-logo{width:100px;height:100px;object-fit:contain;flex-shrink:0;position:relative;z-index:1;}
.t-logo-fb{width:100px;height:100px;border-radius:12px;background:rgba(255,255,255,0.07);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:rgba(255,255,255,0.3);flex-shrink:0;}
.t-logo-ring{
  position:absolute;inset:-6px;border-radius:14px;
  border:2px solid transparent;
  opacity:0;transition:opacity 0.5s;
}
.live-ring .t-logo-ring{
  opacity:1;
  animation:ringPulse 2.5s ease-in-out infinite;
}
@keyframes ringPulse{
  0%,100%{opacity:0.2;transform:scale(1);}
  50%{opacity:0.7;transform:scale(1.04);}
}

/* ── MLB row — scales with viewport via vh units ── */
#row-MLB .t-abbr{font-size:14.1cqh;}
#row-MLB .t-score{font-size:18.8cqh;min-width:22.9cqh;}
#row-MLB .t-record{font-size:4.3cqh;}
#row-MLB .t-seed{font-size:3.9cqh;}
#row-MLB .t-logo{width:22.3cqh;height:22.3cqh;}
#row-MLB .t-logo-fb{width:22.3cqh;height:22.3cqh;}
#row-MLB .chip-status{font-size:5.4cqh;padding:2.3cqh 5.4cqh;min-width:34.6cqh;}
#row-MLB .chip-time-label{font-size:5.7cqh;}
#row-MLB .chip-time-value{font-size:11.3cqh;}
#row-MLB .chip-time-upcoming-label{font-size:5.7cqh;padding:1.3cqh 4.3cqh;}
#row-MLB .ls-hcell{font-size:3.8cqh;width:13.9cqh;}
#row-MLB .ls-hcell.t{width:17.9cqh;}
#row-MLB .ls-cell{font-size:7.7cqh;width:13.9cqh;}
#row-MLB .ls-cell.t{font-size:12.5cqh;width:17.9cqh;}
#row-MLB .chip-teams{min-width:71.4cqh;}
#row-MLB .t-name-group{width:50.9cqh;}
#row-MLB .sit-diamond{width:37.5cqh;height:30cqh;}
#row-MLB .sit-divider{height:30cqh;}
#row-MLB .sit-bso{gap:4.5cqh;}
#row-MLB .bso-lbl{font-size:7.5cqh;width:7.5cqh;}
#row-MLB .bso-dot{width:7.5cqh;height:7.5cqh;}
#row-MLB .bso-dots{gap:2.8cqh;}
.chip-time{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0;min-width:21.3vh;}
.chip-time-label{font-size:2.4vh;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.2);text-align:center;transition:color 0.8s ease;}
.chip-time-value{font-size:4.6vh;font-weight:600;color:rgba(255,255,255,0.3);letter-spacing:0.3px;line-height:1.2;text-align:center;transition:color 0.8s ease;}
.chip-time.live .chip-time-value{color:#f87171;}
.chip-time.live .chip-time-label{color:rgba(248,113,113,0.5);}

/* ── MLB situation display (Option C — inline next to time) ── */
.chip-time-sit{display:flex;align-items:center;gap:20px;flex-shrink:0;}
.sit-divider{width:1px;height:13.0vh;background:rgba(255,255,255,0.06);}
.sit-block{display:flex;flex-direction:row;align-items:center;gap:14px;}
.sit-diamond{display:block;overflow:visible;width:13.9vh;height:11.1vh;}
.sit-bso{display:flex;flex-direction:column;gap:14px;}
.bso-col{display:flex;align-items:center;gap:12px;}
.bso-lbl{font-size:2.0vh;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.25);width:2.0vh;}
.bso-dots{display:flex;gap:0.8vh;}
.bso-dot{width:2.0vh;height:2.0vh;border-radius:50%;background:rgba(255,255,255,0.06);border:1.5px solid rgba(255,255,255,0.15);}
.bso-dot.on-b{background:#34d399;border-color:#34d399;box-shadow:0 0 8px rgba(52,211,153,0.9),0 0 16px rgba(52,211,153,0.5);}
.bso-dot.on-s{background:#fbbf24;border-color:#ffd700;box-shadow:0 0 8px rgba(251,191,36,0.9),0 0 16px rgba(251,191,36,0.5);}
.bso-dot.on-o{background:#f87171;border-color:#ef4444;box-shadow:0 0 8px rgba(248,113,113,0.9),0 0 16px rgba(239,68,68,0.5);}
.chip-time.int .chip-time-label{color:rgba(122,179,245,0.6);transition:color 0.8s ease;}
.chip-time.int .chip-time-value{color:#7ab3f5;font-size:38px;transition:color 0.8s ease;}

/* Intermission — 60s warning: shifts to amber with slow pulse */
.chip-time.int-warning .chip-time-label{color:rgba(251,191,36,0.7);transition:color 0.8s ease;}
.chip-time.int-warning .chip-time-value{color:#fbbf24;font-size:38px;animation:intWarnPulse 2s ease-in-out infinite;transition:color 0.8s ease;}
@keyframes intWarnPulse{
  0%,100%{opacity:0.7;}
  50%{opacity:1;}
}

/* Intermission — 30s urgent: orange-red, faster pulse */
.chip-time.int-urgent .chip-time-label{color:rgba(251,146,60,0.8);transition:color 0.5s ease;}
.chip-time.int-urgent .chip-time-value{color:#fb923c;font-size:38px;animation:intUrgentPulse 0.8s ease-in-out infinite;transition:color 0.5s ease;}
@keyframes intUrgentPulse{
  0%,100%{opacity:0.6;transform:scale(1);}
  50%{opacity:1;transform:scale(1.03);}
}

/* Row-level urgent glow when 30s remaining */
.league-row.int-urgent-glow{animation:rowUrgentGlow 0.8s ease-in-out infinite;}
@keyframes rowUrgentGlow{
  0%,100%{background:transparent;}
  50%{background:rgba(251,146,60,0.04);}
}
.chip-time-upcoming-label{font-size:26px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;padding:6px 20px;border-radius:20px;background:rgba(52,211,153,0.08);color:#34d399;border:1px solid rgba(52,211,153,0.25);text-align:center;}

/* ── Series ── */
.chip-series{display:flex;flex-direction:column;gap:8px;flex-shrink:0;min-width:220px;border-left:1px solid rgba(255,255,255,0.06);padding-left:48px;margin-left:16px;}
.series-round{font-size:21px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.2);white-space:nowrap;}
.series-record{font-size:36px;font-weight:600;color:rgba(255,255,255,0.55);letter-spacing:0.3px;line-height:1.3;white-space:nowrap;}

/* ── Next game indicator — sits below series record ── */
.series-next{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:4px;}


/* ── Last Final chip (pre-noon / post-game) ── */
.lf-wrap{
  width:100%;height:100%;
  display:flex;flex-direction:row;align-items:stretch;
  position:relative;overflow:hidden;
  box-sizing:border-box;
}
.lf-left{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2.6cqh;flex-shrink:0;width:33.333%;
  border-right:1px solid rgba(255,255,255,0.08);
  padding:3cqh 1cqh;
}
.lf-logo{width:36cqh;height:36cqh;max-width:100%;object-fit:contain;}
.lf-abbr{font-size:16cqh;font-weight:900;color:#fff;letter-spacing:-0.5px;line-height:1.12;display:block;max-width:100%;overflow:hidden;white-space:nowrap;text-align:center;}
.lf-record{font-size:8.4cqh;font-weight:700;color:rgba(255,255,255,0.65);white-space:nowrap;letter-spacing:-0.15cqh;padding:0 0.5cqh;}
.lf-center{
  width:41%;flex-shrink:0;min-width:0;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;
  padding:3cqh 1cqh;overflow:hidden;position:relative;
  border-right:1px solid rgba(255,255,255,0.08);
}
.lf-center-view.active{opacity:1;pointer-events:auto;}
.lf-stand-row.leader{background:linear-gradient(90deg,rgba(52,211,153,0.14),transparent);border-left:2px solid #34d399;}
.lf-stand-row.leader .lf-stand-team{color:#fff;}
.lf-stand-row.leader .lf-stand-rec{color:#34d399;}
.lf-score-row{
  flex:none;display:flex;align-items:center;justify-content:center;gap:0;width:95%;margin:0 auto;overflow:hidden;
}
/* The last-final ("recap") card stacks header · score · linescore · decisions.
   Center the stack with even gaps instead of space-between so it never floats
   with a dead band in the middle (the old flex:1 score-row left a big void). */
.lf-slide[data-slide="lf"]{justify-content:center;gap:2.4cqh;}
/* Compact inning-by-inning linescore — fills the recap card and shows HOW the
   game went, not just the final. Hidden entirely when no linescore data. */
.lf-linescore{width:94%;margin:0 auto;display:flex;flex-direction:column;gap:0.6cqh;flex-shrink:0;
  border-top:1px solid rgba(255,255,255,0.08);border-bottom:1px solid rgba(255,255,255,0.08);padding:1.1cqh 0;}
.lf-ls-row{display:flex;align-items:center;width:100%;}
.lf-ls-team{width:9cqh;padding-right:1cqh;text-align:left;font-size:3.6cqh;font-weight:800;color:rgba(255,255,255,0.6);flex-shrink:0;letter-spacing:0.3px;}
.lf-ls-row.w .lf-ls-team{color:#fff;}
.lf-ls-cell{flex:1;text-align:center;font-size:3.6cqh;font-weight:600;color:rgba(255,255,255,0.55);font-variant-numeric:tabular-nums;min-width:0;}
.lf-ls-r{width:5.5cqh;text-align:center;font-size:4.2cqh;font-weight:900;color:rgba(255,255,255,0.85);flex-shrink:0;font-variant-numeric:tabular-nums;}
.lf-ls-row.w .lf-ls-r{color:#fff;}
.lf-ls-head .lf-ls-cell,.lf-ls-head .lf-ls-r{font-size:3.6cqh;font-weight:700;color:rgba(255,255,255,0.32);}
.lf-score-col{display:flex;flex-direction:column;align-items:center;gap:1cqh;flex:1;min-width:0;overflow:visible;}
.lf-score-abbr{font-size:4cqh;font-weight:800;letter-spacing:0.5px;}
.lf-score-abbr.w{color:#fff;}
.lf-score-abbr.l{color:rgba(255,255,255,0.35);}
/*R41*/.lf-score-num{font-size:15cqh;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;width:100%;text-align:center;overflow:visible;}
.lf-score-num.w{color:#fff;}
.lf-score-num.l{color:rgba(255,255,255,0.18);}
.lf-dash{font-size:7cqh;font-weight:300;color:rgba(255,255,255,0.15);flex-shrink:0;margin-top:6cqh;}
.lf-spacer{height:4cqh;}
.lf-decisions{
  width:98%;margin:2.4cqh auto 0;flex-shrink:0;font-size:3.6cqh;
  display:flex;flex-direction:column;gap:0.55em;
}
.lf-decision-row{display:flex;align-items:baseline;gap:0.45em;width:100%;}
.lf-decision-rec{font-weight:600;color:rgba(255,255,255,0.45);}
.lf-decision-label{font-size:0.9em;font-weight:800;letter-spacing:0.5px;flex-shrink:0;width:1.2em;text-align:center;}

   here cqh=7.2px and cqw=12.8px. The sandbox used a 360px-tall container (cqh
   =3.6px), so every cqh value below is the sandbox number HALVED to render at
   the same physical size and fit the ~410px featured area (prevents the 5th

.lf-stage{flex:1;min-width:0;position:relative;overflow:hidden;}
/* Wide World of Sports slides */
.lf-wws-row{display:flex;align-items:center;justify-content:center;gap:2.2cqh;margin-top:1cqh;}
.lf-wws-side{display:flex;flex-direction:column;align-items:center;gap:0.8cqh;min-width:0;}
.lf-wws-logo{width:12cqh;height:12cqh;object-fit:contain;}
.lf-wws-name{font-size:4cqh;font-weight:800;color:rgba(255,255,255,0.75);}

.lf-wws-title{font-size:5cqh;font-weight:800;color:#fff;text-align:center;margin-top:2cqh;padding:0 2cqh;}
.lf-wws-status{font-size:3.6cqh;font-weight:600;color:rgba(255,255,255,0.55);text-align:center;margin-top:1.6cqh;}

.wws-full{width:100%;height:100%;}

/* soccer: banner top (flex:0), row auto-margins to center in the middle, countdown order:99 stays bottom */
.wws-full .lf-slide:has(.wws-soc-row) .wws-banner{flex:0 0 auto;}
.wws-full .lf-slide:has(.wws-soc-row) .wws-soc-group{margin-top:auto;margin-bottom:auto;}

/*R47*/.wws-full .wws-soc-row{flex:0 0 auto;}
.wws-full .wws-tn-rows{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;gap:1cqh;}
/* R12b: soccer pregame — time vertically centered between flags */
.wws-soc-row.pre{align-items:center;padding-top:0;}
.wws-soc-row.pre .wws-tm-mid{display:flex;align-items:center;justify-content:center;}
.wws-soc-prestack{display:flex;flex-direction:column;align-items:center;gap:1.6cqh;}
.wws-soc-row.pre .wws-tm-name{font-size:6cqh;}
/*R45*/.wws-soc-row.pre .wws-soc-pre{font-size:8cqh;line-height:1;white-space:nowrap;}
/*R49*/.wws-soc-net .net-logo{height:7.8cqh;}
.wws-count{font-size:3.2cqh;font-weight:700;letter-spacing:0.04em;color:rgba(255,255,255,0.55);text-transform:uppercase;}
.wws-count-btm{order:99;align-self:center;font-size:5cqh;font-weight:800;color:rgba(255,255,255,0.8);padding-bottom:1.4cqh;letter-spacing:0.03em;}
.wws-banner{display:flex;align-items:stretch;flex-shrink:0;min-width:0;background:rgba(255,255,255,0.05);border-radius:1.4cqh;overflow:hidden;margin:0.6cqh 1cqh 0;}
.wws-banner-bar{width:1.1cqh;background:#d4af37;flex-shrink:0;}
.wws-banner-txt{padding:0.9cqh 1.8cqh;min-width:0;flex:1;}
.wws-banner-logo{height:9cqh;width:auto;align-self:center;margin:0 1.6cqh 0 0.8cqh;flex-shrink:0;object-fit:contain;}
.wws-banner-title{font-size:3.9cqh;font-weight:900;letter-spacing:0.15cqh;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wws-banner-venue{font-size:3.6cqh;font-weight:600;color:rgba(255,255,255,0.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wws-flag{width:5.2cqh;height:3.6cqh;object-fit:cover;border-radius:0.5cqh;flex-shrink:0;}
.wws-face-fallback{display:inline-flex;align-items:center;justify-content:center;background:#1d2f54;color:#fff;font-weight:800;}
.wws-tn-rows{display:flex;flex-direction:column;gap:2cqh;padding:2.4cqh 2cqh 0;}
.wws-tn-row{display:flex;align-items:center;gap:1.6cqh;min-width:0;}
.wws-tn-head{width:9cqh;height:9cqh;border-radius:50%;object-fit:cover;border:0.3cqh solid rgba(255,255,255,0.3);flex-shrink:0;font-size:5cqh;}
.wws-tn-name{font-size:4cqh;font-weight:900;color:rgba(255,255,255,0.8);flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wws-tn-name.w{color:#fff;}
.wws-serve{width:1.8cqh;height:1.8cqh;border-radius:50%;background:#34d399;flex-shrink:0;}
.wws-tn-sets{display:flex;gap:1.2cqh;flex-shrink:0;margin-left:1.5cqh;font-variant-numeric:tabular-nums;}
.wws-tn-set{font-size:5.8cqh;font-weight:900;color:rgba(255,255,255,0.45);min-width:4.4cqh;text-align:center;font-variant-numeric:tabular-nums;}
.wws-tn-set.won{color:#fff;}
.wws-tn-set.hot{color:#d4af37;}
.wws-g-row{display:flex;align-items:center;gap:1.4cqh;padding:0.8cqh 2cqh;}
/* R67: golf pregame card */
.wws-gp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8cqh;height:100%;padding:1cqh 3cqh 3cqh;text-align:center;}
.wws-gp-icon{font-size:15cqh;line-height:1;filter:drop-shadow(0 0 2cqh rgba(74,222,128,0.4));}
.wws-gp-name{font-size:5.2cqh;font-weight:800;color:#fff;line-height:1.05;}
.wws-gp-course{font-size:3.8cqh;font-weight:600;color:rgba(255,255,255,0.55);}
.wws-gp-count{font-size:4.4cqh;font-weight:900;color:rgba(255,255,255,0.85);background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.25);border-radius:100px;padding:1cqh 3cqh;margin-top:0.4cqh;}
.wws-gp-marquee{font-size:3.2cqh;font-weight:600;color:rgba(255,255,255,0.5);line-height:1.3;}
.wws-gp-marquee b{color:rgba(255,255,255,0.8);font-weight:800;}
.wws-g-row.lead{background:rgba(212,175,55,0.12);border-radius:1cqh;margin:1cqh 0 0;}
.wws-g-row.lead .wws-g-pos,.wws-g-row.lead .wws-g-tot{color:#d4af37;}
.wws-g-pos{font-size:4.2cqh;font-weight:900;color:rgba(255,255,255,0.5);min-width:4.6cqh;text-align:center;}
.wws-g-name{font-size:4.2cqh;font-weight:800;color:#fff;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.wws-g-tot{font-size:5cqh;font-weight:900;color:#e7ecf5;font-variant-numeric:tabular-nums;}
.wws-g-tot{min-width:9cqh;text-align:right;font-variant-numeric:tabular-nums;}
.wws-g-thru{font-size:4.2cqh;font-weight:700;color:rgba(255,255,255,0.7);min-width:15cqh;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
.wws-g-rd{font-size:4.2cqh;font-weight:700;color:rgba(255,255,255,0.85);min-width:8cqh;text-align:right;font-variant-numeric:tabular-nums;}
.wws-g-head{padding:0.2cqh 2cqh;border-bottom:1px solid rgba(255,255,255,0.12);}
.wws-g-head span{font-size:2.8cqh!important;font-weight:800;letter-spacing:0.08em;color:rgba(255,255,255,0.45)!important;}
.wws-g-scrollwrap{overflow:hidden;flex:1;position:relative;margin-top:0.6cqh;}
.wws-g-scroll{animation:wwsGolfScroll linear 1 forwards;}
@keyframes wwsGolfScroll{0%,8%{transform:translateY(0);}92%,100%{transform:translateY(calc(-100% + 30cqh));}}
.wws-tm-row{display:flex;align-items:center;justify-content:space-around;padding:2.4cqh 1.5cqh 0;}

.wws-tm-rec{font-size:3.6cqh;font-weight:700;color:rgba(255,255,255,0.5);}
.wws-tm-mid{display:flex;flex-direction:column;align-items:center;gap:1cqh;flex-shrink:0;}
.wws-hero{font-size:12.5cqh;font-weight:900;color:#fff;line-height:1;font-variant-numeric:tabular-nums;}
.wws-pens{font-size:3.9cqh;font-weight:900;color:#d4af37;border:0.28cqh solid #d4af37;background:rgba(212,175,55,0.16);border-radius:3cqh;padding:0.5cqh 2.2cqh;}
.wws-sit{font-size:3.6cqh;font-weight:800;color:#34d399;border:0.28cqh solid #34d399;background:rgba(52,211,153,0.12);border-radius:3cqh;padding:0.4cqh 2cqh;}
.lf-wws-status.live{color:#34d399;}
.wws-soc-crest{width:23cqh;height:23cqh;}
/* R74: tennis pregame has lots of vertical space — bigger headshots + a larger weekday line */
.wws-tn-rows.pre .wws-tn-head{width:15cqh;height:15cqh;}   /* R74: tennis pregame has space — bigger headshots */
.wws-tn-rows.pre .wws-tn-row{padding:2.2cqh 0;}
.wws-pre-when{font-size:4.6cqh!important;font-weight:800!important;color:rgba(255,255,255,0.82)!important;margin-top:2.4cqh!important;letter-spacing:0.3px;}
.wws-soc-name{font-size:4.8cqh;}
.wws-soc-hero{font-size:14cqh;}
/*R53*/.wws-hero-dash{font-size:0.7em;font-weight:700;color:rgba(255,255,255,0.5);margin:0 0.12em;vertical-align:0.1em;}
.wws-soc-clock{font-size:4.6cqh;font-weight:900;color:rgba(255,255,255,0.7);margin-top:0.6cqh;}
.wws-soc-clock.live{color:#34d399;}
.wws-soc-pre{font-size:9.5cqh;color:#fbbf24;}
/*R46*/.wws-soc-row{align-items:center;padding-top:0;justify-content:space-evenly;gap:2cqh;}
.wws-soc-row.has-scorers{align-items:flex-start;padding-top:1cqh;}
.wws-soc-row .wws-tm-mid{padding:0 2.5cqh;}
/* R44 separate scorers block: full-width, 2 cols (away-left / home-right), below a divider */
/*R47*/.wws-soc-scorers{padding:2.4cqh 3cqh 0;}
/*R47*/.wws-soc-sdiv{height:1px;background:rgba(255,255,255,0.12);margin:0 0 1.4cqh;}
.wws-soc-scols{display:flex;gap:3cqh;padding-top:1.8cqh;}
.wws-soc-scol{flex:1;min-width:0;display:flex;flex-direction:column;gap:0.7cqh;}
.wws-soc-scol.right{align-items:flex-end;text-align:right;}
.wws-soc-goal{font-weight:700;color:rgba(255,255,255,0.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.15;}
.wws-soc-added{color:#fbbf24;}
.wws-banner-title{letter-spacing:0.3cqh;}
.lf-slide{
  position:absolute;inset:0;padding:1.25cqh 1.5cqh 2.5cqh;
  display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:0.9cqh;
  opacity:0;pointer-events:none;transition:opacity 0.55s ease;
}
.lf-slide.active{opacity:1;pointer-events:auto;}
/*R41*/.lf-slide-head{font-size:4.4cqh;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,0.5);align-self:center;width:auto;max-width:96%;text-align:center;padding:0.2cqh 0 0.4cqh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0;}
.lf-dots{position:absolute;bottom:0.8cqh;left:0;right:0;display:flex;justify-content:center;gap:0.4cqh;z-index:5;}
.lf-dot{width:0.45cqh;height:0.45cqh;border-radius:50%;background:rgba(255,255,255,0.18);transition:background 0.3s;}
.lf-dot.active{background:#fff;}

.lf-stand3{display:flex;flex-direction:column;gap:0.6cqh;width:100%;flex:1;justify-content:space-between;}

.lf-stand3-head{padding:0 0.9cqh 0.35cqh;font-size:3.6cqh;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:rgba(255,255,255,0.4);}
/*R48*/.lf-stand3-head span:nth-child(2){text-align:right;letter-spacing:0;padding-right:0.6cqh;}
.lf-stand3-head span:nth-child(3){text-align:right;letter-spacing:0;padding-right:0.9cqh;}
/*R43*/.lf-stand3-row{padding:0.9cqh 0.9cqh;border-radius:6px;font-size:3.9cqh;}

.lf-stand3-logo{width:6cqh;height:6cqh;object-fit:contain;flex-shrink:0;}
.lf-stand3-row.me .lf-stand3-team{color:#fff;}
/*R43*/.lf-stand3-rec{color:rgba(255,255,255,0.55);font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
/*R43*/.lf-stand3-gb{color:rgba(255,255,255,0.45);font-weight:800;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;}
.lf-stand3-row.me .lf-stand3-rec,.lf-stand3-row.me .lf-stand3-gb{color:#fff;}
/* player spotlight */
.lf-player{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:1.2cqh;width:100%;flex:1;padding:1.5cqh 0 0.5cqh;}

.lf-player-label{font-size:2.4cqh;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.45);}

.lf-leader-name{font-weight:700;color:#fff;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* ── Probable pitchers (MLB upcoming) ── */
.chip-pitchers{display:flex;flex-direction:column;gap:14px;flex-shrink:0;border-left:1px solid rgba(255,255,255,0.06);padding-left:36px;margin-left:8px;}
.pitchers-label{font-size:17px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.18);}
.pitcher-row{display:flex;align-items:center;gap:16px;}
.pitcher-photo{width:72px;height:72px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,0.06);flex-shrink:0;}
.pitcher-photo-fb{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.06);flex-shrink:0;}
.pitcher-info{display:flex;flex-direction:column;gap:4px;}
.pitcher-name{font-size:28px;font-weight:700;color:rgba(255,255,255,0.75);white-space:nowrap;}
.pitcher-stats{font-size:20px;font-weight:500;color:rgba(255,255,255,0.3);white-space:nowrap;}
.chip-linescore{display:flex;flex-direction:column;gap:6px;flex-shrink:0;border-left:1px solid rgba(255,255,255,0.06);padding-left:32px;}
.ls-header{display:flex;margin-bottom:6px;align-items:center;}
.ls-hcell{font-size:1.6vh;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.2);width:5.7vh;text-align:center;}
.ls-hcell.t{color:rgba(255,255,255,0.4);width:80px;margin-left:24px;}
.ls-row{display:flex;align-items:center;}
.ls-cell{font-size:3.1vh;font-weight:600;width:5.7vh;text-align:center;color:rgba(255,255,255,0.3);line-height:1.2;}
.ls-cell.t{font-size:5.2vh;font-weight:800;width:7.4vh;line-height:1;margin-left:2.2vh;}
.ls-cell.t.w{color:#fff;}
.ls-sep{width:100%;height:1px;background:rgba(255,255,255,0.05);margin:4px 0;}
.chip-performers{
  position:absolute;right:0;
  display:flex;flex-direction:column;justify-content:center;gap:18px;
  background:linear-gradient(to right,transparent 0%,rgba(8,10,16,0.95) 60px);
  border-left:none;
  padding:20px 32px 20px 60px;
  z-index:30;
  pointer-events:none;
  overflow:visible;
  max-width:420px;
}
.perf-label{font-size:17px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.25);margin-bottom:5px;}
.perf-row{display:flex;align-items:center;gap:16px;}
.perf-stars{font-size:15px;letter-spacing:-2px;width:62px;text-align:right;flex-shrink:0;filter:drop-shadow(0 0 3px rgba(251,191,36,0.5));}
.perf-photo{width:70px;height:70px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,0.06);flex-shrink:0;}
.perf-info{display:flex;flex-direction:column;gap:4px;}
.perf-name{font-size:30px;font-weight:700;color:rgba(255,255,255,0.8);white-space:nowrap;}
.perf-stat{font-size:21px;font-weight:500;color:rgba(255,255,255,0.4);white-space:nowrap;}
/* Two-page flip: performers ⇄ series info. Page 1 always defines panel size; only opacity animates */
.perf-page{transition:opacity 1.2s ease;display:flex;flex-direction:column;gap:14px;}
.perf-page.hidden-page{opacity:0;pointer-events:none;}
.perf-page.series-page{position:absolute;inset:0;padding:20px 32px 20px 60px;align-items:center;justify-content:center;gap:12px;}
.perf-series-record{font-size:34px;font-weight:700;color:rgba(255,255,255,0.7);white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis;}
/* ── W/L/S pitcher decisions (MLB final) ── */
.chip-decisions{display:flex;flex-direction:column;gap:10px;flex-shrink:0;border-left:1px solid rgba(255,255,255,0.06);padding-left:32px;margin-left:8px;}
.decision-row{display:flex;align-items:center;gap:12px;}
.decision-lbl{font-size:16px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;width:44px;flex-shrink:0;}
.decision-lbl.win {color:rgba(52,211,153,0.7);}
.decision-lbl.loss{color:rgba(239,68,68,0.6);}
.decision-lbl.save{color:rgba(251,191,36,0.6);}
.decision-photo{width:44px;height:44px;border-radius:50%;object-fit:cover;background:rgba(255,255,255,0.06);flex-shrink:0;}
.decision-info{display:flex;flex-direction:column;gap:2px;}
.decision-name{font-size:22px;font-weight:700;color:rgba(255,255,255,0.7);white-space:nowrap;}
.decision-stat{font-size:16px;font-weight:500;color:rgba(255,255,255,0.3);white-space:nowrap;}

.last-play{display:flex;align-items:center;gap:18px;flex-shrink:0;min-width:0;border-left:1px solid rgba(255,255,255,0.06);padding-left:40px;overflow:visible;}
.last-play-icon{font-size:36px;flex-shrink:0;line-height:1;}
.last-play-text{display:flex;flex-direction:column;gap:6px;min-width:0;}
.last-play-label{font-size:18px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.2);}
.last-play-primary{font-size:32px;font-weight:700;color:rgba(255,255,255,0.8);white-space:nowrap;line-height:1.2;}
.last-play-secondary{font-size:24px;font-weight:500;color:rgba(255,255,255,0.35);white-space:nowrap;line-height:1.2;letter-spacing:0.2px;}

/* ── Network bug — sits below time in upcoming chips ── */

/* ══════════════════════════════════════════════════════════════
   MLB FULLSCREEN VIEW
   Shell switches to single-column when layout mode = mlbFull
   ══════════════════════════════════════════════════════════════ */
.shell.mlb-full{
  grid-template-columns:1fr;
  grid-template-rows:8% 57% 35%;
}
.shell.mlb-full #row-NHL,
.shell.mlb-full #row-NBA{ display:none; }
.shell.mlb-full #row-MLB{
  grid-column:1;grid-row:1/-1;
  display:flex;flex-direction:column;
  container-type:size;container-name:mlb-full-shell;
}

/* ── MLB header bar ── */
:root{
  /* spacing scale (container-height units) */
  --sp-1:0.5cqh;--sp-2:1cqh;--sp-3:1.5cqh;--sp-4:2cqh;--sp-5:3cqh;--sp-6:4cqh;
  /* shared outer inset so header + featured edges line up down the board */
  --edge:3cqh;
  /* corner radii */
  --r-sm:8px;--r-md:14px;--r-pill:999px;
  /* elevation */
  --elev-1:0 0.4cqh 2cqh rgba(0,0,0,0.4);--elev-2:0 0.8cqh 3cqh rgba(0,0,0,0.5);
  /* palette (rgb triplets for rgba() use) */
  --c-nyy:0,48,135;--c-nym:252,89,16;--c-alert:245,158,11;--c-live:74,222,128;
  --c-text:#fff;--c-muted:rgba(255,255,255,0.4);
}
.mlb-header{
  height:9.5cqh;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  position:relative;
  background:linear-gradient(to bottom,rgba(0,45,114,0.35) 0%,rgba(0,45,114,0.1) 100%);
  border-bottom:1px solid rgba(0,80,200,0.2);
}
.mlb-header-logo{
  height:90%;width:auto;object-fit:contain;
  animation:mlbHeaderGlow 4s ease-in-out infinite;
}
@keyframes mlbHeaderGlow{
  0%,100%{filter:drop-shadow(0 0 8px rgba(0,80,200,0.4));}
  50%{filter:drop-shadow(0 0 22px rgba(0,80,200,0.9));}
}
.mlb-header-status{
  position:absolute;right:var(--edge);
  display:flex;align-items:center;gap:var(--sp-2);
}
.mlb-header-live{position:absolute;left:var(--edge);display:flex;align-items:center;}
.mlb-header-center{height:100%;display:flex;align-items:center;gap:var(--sp-3);}
.hc-date,.hc-time{font-size:32px;font-weight:700;letter-spacing:1px;color:rgba(255,255,255,0.5);font-variant-numeric:tabular-nums;}
.hc-time{color:#fff;}
.hc-live{font-size:32px;font-weight:700;letter-spacing:1px;color:rgb(var(--c-live));text-transform:uppercase;white-space:nowrap;}
.hc-live.none{color:rgba(255,255,255,0.3);}
/* Right-hand status zone (.mlb-header-status) scaled up in lockstep with
   the taller 9.5cqh header. Scoped to .mlb-header so the generic per-row
   status-bug (shared sb-* classes, used off-season) is untouched. */
.mlb-header .sb-txt,.mlb-header .sb-cd{font-size:30px;}
.mlb-header .sb-stale{font-size:28px;}
.mlb-header .sb-sep{height:26px;}
.mlb-header .sb-dot{width:14px;height:14px;}
.mlb-header .sb-cd-bar{width:64px;height:4px;}

/* ── Featured game panel ── */
.mlb-featured{
  flex:1 1 auto;min-height:0;
  display:grid;
  grid-template-columns:50% 50%;
  position:relative;
  overflow:hidden;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.mlb-feat-slot{
  display:flex;flex-direction:row;align-items:center;
  padding:0 var(--edge);gap:var(--sp-4);
  position:relative;
  transition:opacity 0.6s ease;
  overflow:hidden;
  min-width:0;box-sizing:border-box;
}
.mlb-feat-slot.yank{
  border-right:2px solid rgba(0,48,135,0.35);
  background:linear-gradient(to right,rgba(0,48,135,0.15) 0%,transparent 70%);
}
.mlb-feat-slot.secondary{
  background:linear-gradient(to right,rgba(255,255,255,0.03) 0%,transparent 70%);
}
@keyframes levpulse{0%,100%{opacity:0.55}50%{opacity:1}}
@keyframes tkopop{0%{transform:scale(0.92);opacity:0}100%{transform:scale(1);opacity:1}}
.lev-glow{position:fixed;top:9.5%;height:57%;width:50%;z-index:60;pointer-events:none;opacity:0;transition:opacity 0.8s ease,box-shadow 0.8s ease;}
#mlb-takeover{position:fixed;top:9.5%;width:50%;height:73.5%;z-index:70;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(11,42,94,0.985),rgba(5,10,20,1));backdrop-filter:blur(6px);pointer-events:none;box-sizing:border-box;padding:0 4cqh;}
#mlb-takeover.show{display:flex;animation:tkopop 0.4s ease-out;}
/* R36: WC goal takeover (Design A — broadcast split) */
#mlb-takeover.tko-wc{padding:0;background:#05070d;overflow:hidden;container-type:size;}
#mlb-takeover.tko-wc .tkoA-bgflag{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1;animation:tkoFlagIn 0.5s ease-out;}
#mlb-takeover.tko-wc .tkoA-scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,10,20,0.35),rgba(5,10,20,0.72));}
#mlb-takeover.tko-wc .tkoA-accent{position:absolute;left:0;top:0;height:100%;width:1.4cqh;}
#mlb-takeover.tko-wc .tkoA-sweep{position:absolute;top:0;left:0;height:100%;width:40%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,0.07),transparent);animation:tkoSweep 1.6s ease-out;}
#mlb-takeover.tko-wc .tkoA-inner{position:relative;display:flex;align-items:center;gap:6cqh;width:100%;box-sizing:border-box;padding:0 7cqh;animation:tkopop 0.5s ease-out;}
#mlb-takeover.tko-wc .tkoA-headwrap{width:34cqh;height:34cqh;border-radius:50%;flex-shrink:0;position:relative;padding:0.9cqh;box-shadow:0 2cqh 6cqh rgba(0,0,0,0.55);}
#mlb-takeover.tko-wc .tkoA-headwrap img{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#0b1220;}
#mlb-takeover.tko-wc .tkoA-txt{display:flex;flex-direction:column;gap:1.2cqh;align-items:flex-start;flex:1;min-width:0;}
#mlb-takeover.tko-wc .tkoA-kicker{font-size:4.6cqh;letter-spacing:0.7cqh;font-weight:800;text-transform:uppercase;}
#mlb-takeover.tko-wc .tkoA-goal{font-size:18cqh;white-space:nowrap;max-width:100%;overflow:hidden;font-weight:900;line-height:0.82;letter-spacing:-0.6cqh;color:#fff;text-shadow:0 1cqh 5cqh rgba(0,0,0,0.6);}
#mlb-takeover.tko-wc .tkoA-scorer{font-size:6.4cqh;font-weight:800;color:#fff;display:flex;align-items:center;gap:1.6cqh;max-width:100%;min-width:0;}
#mlb-takeover.tko-wc .tkoA-ball{font-size:5cqh;}
#mlb-takeover.tko-wc .tkoA-subtxt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
#mlb-takeover.tko-wc .tkoA-band{position:absolute;left:0;right:0;bottom:0;height:20cqh;display:flex;align-items:center;justify-content:center;gap:3.4cqh;background:linear-gradient(to top,rgba(0,0,0,0.62),transparent);animation:tkopop 0.6s ease-out;}
#mlb-takeover.tko-wc .tkoA-nm{font-size:6.4cqh;font-weight:800;color:rgba(255,255,255,0.62);letter-spacing:0.2cqh;}
/*R44*/#mlb-takeover.tko-wc .tkoA-sc{font-size:13cqh;font-weight:900;color:#fff;line-height:1;}
#mlb-takeover.tko-wc .tkoA-dash{font-size:7cqh;font-weight:700;color:rgba(255,255,255,0.35);}
#mlb-takeover.tko-wc .tkoA-wash{position:absolute;inset:0;}
#mlb-takeover.tko-wc .tkoA-wm{position:absolute;right:-6cqh;top:50%;transform:translateY(-50%);height:120cqh;width:auto;opacity:0.06;filter:grayscale(0.15);pointer-events:none;}
#mlb-takeover.tko-wc .tkoA-goal-lg{font-size:22cqh;}
#mlb-takeover.tko-wc .tkoA-logowrap{display:flex;align-items:center;justify-content:center;}
#mlb-takeover.tko-wc .tkoA-logo{width:74%;height:74%;border-radius:0;object-fit:contain;background:none;}
/*R47*/#mlb-takeover.tko-wc .tkoA-chips{display:flex;flex-wrap:nowrap;gap:1.2cqh;margin-top:1.6cqh;}
/*R47*/#mlb-takeover.tko-wc .tkoA-chip{font-size:4.4cqh;font-weight:900;color:#fff;white-space:nowrap;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.22);border-radius:100px;padding:1cqh 2.2cqh;letter-spacing:0.05cqh;}
@keyframes tkoFlagIn{0%{transform:translateY(-50%) scale(1.15);opacity:0}100%{transform:translateY(-50%) scale(1);opacity:0.16}}
@keyframes tkoSweep{0%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
#mlb-takeover.left{left:0;}
#mlb-takeover.right{left:50%;}
#mlb-takeover .tko-team{font-size:4.4cqh;font-weight:800;letter-spacing:0.9cqh;margin-bottom:1cqh;}
#mlb-takeover .tko-headline{font-size:14cqh;font-weight:900;color:#fff;line-height:0.9;letter-spacing:-0.4cqh;text-shadow:0 0.6cqh 4cqh rgba(0,0,0,0.6);}
#mlb-takeover .tko-sub1{font-size:4cqh;font-weight:800;color:#fff;margin-top:1.4cqh;text-align:center;max-width:94%;}
#mlb-takeover .tko-sub2{font-size:4cqh;font-weight:600;color:rgba(255,255,255,0.72);margin-top:0.6cqh;}
.mlb-feat-slot.has-wp{padding-bottom:5.5cqh;}
.mlb-feat-wp{position:absolute;left:3cqh;right:3cqh;bottom:1.2cqh;z-index:5;}
.mlb-feat-wp .wp-bar{display:flex;height:4cqh;border-radius:1cqh;overflow:hidden;box-shadow:0 0.4cqh 2cqh rgba(0,0,0,0.4);}
.mlb-feat-wp .wp-seg{display:flex;align-items:center;justify-content:space-between;gap:0.8cqh;padding:0 1.4cqh;min-width:0;overflow:hidden;white-space:nowrap;}
.mlb-feat-wp .wp-abbr,.mlb-feat-wp .wp-pct{font-weight:900;font-size:3.6cqh;color:#fff;}
.mlb-feat-wp .wp-seg.dim .wp-abbr,.mlb-feat-wp .wp-seg.dim .wp-pct{color:rgba(255,255,255,0.7);}
.mlb-feat-score,.mlb-feat-record,.mlb-card-score,.lf-score,.lf-record,.mlb-feat-wp .wp-pct,.mlb-amb-record,.sb-cd,.chip-time-value{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
.mlb-feat-score{position:relative;}
.mlb-feat-score.score-just-changed::after{content:'';position:absolute;inset:-12%;border-radius:50%;border:0.45cqh solid rgba(251,191,36,0.7);animation:scoreripple 1.1s ease-out forwards;pointer-events:none;}
@keyframes scoreripple{0%{transform:scale(0.55);opacity:0.85;}100%{transform:scale(1.9);opacity:0;}}
.mlb-feat-slot{transition:opacity 0.45s ease;}
.slot-enter{animation:slotfade 0.5s ease;}
@keyframes slotfade{from{opacity:0;}to{opacity:1;}}
#ambient-life{position:fixed;inset:0;z-index:55;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(55% 45% at 32% 34%,rgba(80,140,255,0.04),transparent 70%);animation:ambientdrift 16s ease-in-out infinite;}
@keyframes ambientdrift{0%{transform:translate(0,0) scale(1);opacity:0.35;}50%{transform:translate(5%,3%) scale(1.1);opacity:0.65;}100%{transform:translate(0,0) scale(1);opacity:0.35;}}
.mlb-feat-delay-badge{display:inline-flex;align-items:center;background:rgba(245,158,11,0.16);border:1px solid rgba(245,158,11,0.5);color:#f59e0b;font-size:3.6cqh;font-weight:800;letter-spacing:2px;padding:0.7cqh 2.4cqh;border-radius:14px;}
.mlb-feat-delay-reason{font-size:3.6cqh;color:rgba(255,255,255,0.62);margin-top:1.6cqh;font-weight:600;text-align:center;}
.sb-stale{display:none;color:#f59e0b;font-weight:700;font-size:17px;letter-spacing:1.5px;margin-left:10px;animation:pulse 2s infinite;}
.shell.stale .sb-stale{display:inline-block;}
.shell.stale .sb-dot{background:#f59e0b !important;box-shadow:0 0 6px #f59e0b;}
.shell.stale #row-MLB{opacity:0.5;filter:saturate(0.55);transition:opacity .6s ease,filter .6s ease;}
#mlb-takeover .tko-statcast{margin-top:1.8cqh;display:flex;gap:1.2cqh;}
#mlb-takeover .sc-chip{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);border-radius:10px;padding:0.7cqh 1.6cqh;font-size:3.15cqh;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;letter-spacing:0.5px;}

/* ── 7c · Recap video viewer (House of Highlights + MLB daily) ──
   Centered 16:9 viewer over a dimmed backdrop. Emerges (scale+fade), plays,
   then dissolves back to the board. Placement is intentionally board-centered
   for now; can be repositioned to a pane later without touching the player. */
#mlb-recap{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,rgba(5,10,20,0.82),rgba(2,5,12,0.95));
  opacity:0;transition:opacity 0.6s ease;pointer-events:none;}
#mlb-recap.show{display:flex;opacity:1;}
#mlb-recap .recap-frame{position:absolute;inset:0;width:100%;height:100%;border-radius:0;overflow:hidden;
  background:#000;
  transform:scale(1.03);opacity:0;transition:transform 0.6s cubic-bezier(.22,1,.36,1),opacity 0.5s ease;}
/* Video appears as soon as the viewer emerges — instant load (brief YouTube
   title flash is accepted in exchange for no black-screen delay). */
#mlb-recap.show .recap-frame{transform:scale(1);opacity:1;}
#mlb-recap .recap-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
#mlb-recap .recap-cap{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:1.6vh;
  padding:4vh 3vh 2.2vh;background:linear-gradient(to top,rgba(0,0,0,0.78),transparent);
  pointer-events:none;opacity:0;transition:opacity 0.5s ease 0.3s;}
#mlb-recap.show .recap-cap{opacity:1;}
#mlb-recap .recap-badge{font-size:3.5vh;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;
  padding:1vh 2.4vh;border-radius:12px;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.22);color:#fff;white-space:nowrap;flex-shrink:0;}
#mlb-recap .recap-spinner{position:absolute;top:50%;left:50%;width:6vh;height:6vh;margin:-3vh 0 0 -3vh;border-radius:50%;
  border:0.5vh solid rgba(255,255,255,0.18);border-top-color:rgba(255,255,255,0.8);animation:recapSpin 0.9s linear infinite;}
#mlb-recap.show .recap-spinner{opacity:0;transition:opacity 0.2s ease;}
@keyframes recapSpin{to{transform:rotate(360deg);}}
/* Pane glow: a positioned overlay placed over the team's pane (sized to its
   on-screen rect in JS), so it paints ON TOP of the pane's content and is not
   clipped by parents or wiped when the slot re-renders. */
.recap-glow-fx{position:fixed;z-index:88;pointer-events:none;border-radius:1.5vh;
  box-shadow:inset 0 0 7vh 1.2vh var(--recap-glow),0 0 9vh 2.5vh var(--recap-glow);
  outline:0.4vh solid var(--recap-glow);outline-offset:-0.4vh;
  opacity:0;animation:recapGlowFx 0.6s ease-in-out 3;}   /* R79: glow 3x (was 2) */
@keyframes recapGlowFx{0%{opacity:0;}50%{opacity:1;}100%{opacity:0;}}

/* ── US Open golf pane (temporary swap-in for the Mets slot) ── */
.golf-pane{display:flex;flex-direction:column;align-items:stretch;width:100%;height:100%;padding:1.6cqh 2.2cqh;gap:1.1cqh;overflow:hidden;box-sizing:border-box;}
.golf-pane-header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1.8cqh;flex-shrink:0;padding-bottom:0.6cqh;border-bottom:1px solid rgba(255,255,255,0.08);}
.golf-pane-logo-pga{height:9.5cqmin;width:auto;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 0 8px rgba(255,255,255,0.15));}
.golf-pane-logo-uso{height:9.5cqmin;width:9.5cqmin;object-fit:contain;border-radius:50%;flex-shrink:0;filter:drop-shadow(0 0 10px rgba(255,255,255,0.2));}
.golf-pane-titles{display:flex;flex-direction:column;align-items:center;gap:0.3cqh;min-width:0;text-align:center;}
.golf-pane-title{font-size:4.6cqh;font-weight:800;color:#fff;letter-spacing:0.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.golf-pane-sub{font-size:2.2cqh;font-weight:500;color:rgba(255,255,255,0.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
/* ── Shared column template — defined ONCE, used by both the header and every
   data row via the same .golf-cols-grid class, so they cannot drift apart. ── */
.golf-cols-grid{display:grid;grid-template-columns:4.5cqh 1fr 7cqh 6cqh 13cqh;column-gap:1.6cqh;align-items:center;}
.golf-pane-cols{padding:0.3cqh 0.8cqh;flex-shrink:0;font-size:1.7cqh;font-weight:700;letter-spacing:0.6px;color:rgba(255,255,255,0.3);text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,0.06);}
.golf-pane-cols span{min-width:0;}
.golf-pane-cols .golf-col-total,.golf-pane-cols .golf-col-thru,.golf-pane-cols .golf-col-round{text-align:right;}
.golf-pane-pinned{flex-shrink:0;background:linear-gradient(to right,rgba(52,211,153,0.07),transparent 60%);border-bottom:1px solid rgba(52,211,153,0.18);}
.golf-pane-pinned .golf-row{border-bottom:1px solid rgba(52,211,153,0.1);}
.golf-pane-pinned .golf-row:last-child{border-bottom:none;}
.golf-pane-scroll{flex:1;min-height:0;overflow:hidden;position:relative;
  -webkit-mask-image:linear-gradient(to bottom, transparent 0%, black 14%, black calc(100% - 30px), transparent 100%);
  mask-image:linear-gradient(to bottom, transparent 0%, black 14%, black calc(100% - 30px), transparent 100%);}
.golf-track{display:flex;flex-direction:column;will-change:transform;}
.golf-row{padding:1.3cqh 0.8cqh;border-bottom:1px solid rgba(255,255,255,0.05);}
.golf-pos{font-size:2.5cqh;font-weight:700;color:rgba(255,255,255,0.4);min-width:0;}
.golf-player-cell{min-width:0;display:flex;align-items:center;gap:1.1cqh;}
.golf-headshot{width:6.4cqh;height:6.4cqh;border-radius:50%;object-fit:cover;flex-shrink:0;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.1);}
.golf-flag{width:3.6cqh;height:3.6cqh;border-radius:50%;object-fit:cover;flex-shrink:0;border:1px solid rgba(255,255,255,0.18);background:#0d1018;}
.golf-name{flex:1;min-width:0;font-size:2.7cqh;font-weight:600;color:rgba(255,255,255,0.78);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.golf-name.major-winner{color:#ffd56b;text-shadow:0 0 12px rgba(255,213,107,0.4);}
.golf-score{text-align:right;font-size:2.9cqh;font-weight:800;color:#fff;min-width:0;font-variant-numeric:tabular-nums;}
.golf-score.under{color:#5fd97a;}
.golf-score.over{color:#ff8a80;}
.golf-thru{text-align:right;font-size:2.3cqh;color:rgba(255,255,255,0.45);min-width:0;font-variant-numeric:tabular-nums;}
.golf-round{text-align:right;font-size:2.3cqh;color:rgba(255,255,255,0.45);min-width:0;font-variant-numeric:tabular-nums;white-space:nowrap;}
.golf-round.tee{
  color:#34d399;font-weight:700;font-size:2cqh;letter-spacing:0.3px;white-space:nowrap;
  background:rgba(52,211,153,0.1);border:1px solid rgba(52,211,153,0.25);
  border-radius:20px;padding:0.4cqh 1cqh;display:inline-block;justify-self:end;
}
/* Ambient/off-day state */
.mlb-feat-slot.ambient{
  justify-content:flex-start;
  background:linear-gradient(135deg,rgba(0,48,135,0.08) 0%,transparent 60%);
  padding:3cqh 4cqh;gap:0;
}
.mlb-feat-team-logo{height:15cqmin;width:15cqmin;object-fit:contain;flex-shrink:0;filter:drop-shadow(0 0 6px rgba(255,255,255,0.15));
  animation:featLogoGlow 4s ease-in-out infinite;}
@keyframes featLogoGlow{
  0%,100%{filter:drop-shadow(0 0 8px rgba(255,255,255,0.1));}
  50%{filter:drop-shadow(0 0 22px rgba(255,255,255,0.35));}
}
.mlb-feat-teams{display:flex;flex-direction:column;gap:var(--sp-3);flex:1;min-width:0;}
.mlb-feat-team-row{display:flex;align-items:center;gap:var(--sp-4);width:100%;}
.mlb-feat-team-info{display:flex;flex-direction:column;flex:1;min-width:0;gap:var(--sp-1);}
.mlb-feat-abbr{font-size:min(9cqmin, 6cqw);font-weight:900;color:rgba(255,255,255,0.45);letter-spacing:-1px;line-height:1;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mlb-feat-abbr.w{color:#fff;}
.mlb-feat-abbr.desig{color:#fff;}
.mlb-feat-record{font-size:3.6cqh;color:rgba(255,255,255,0.4);font-weight:500;}
.mlb-feat-score{font-size:13cqmin;font-weight:900;color:rgba(255,255,255,0.2);
  min-width:10cqmin;text-align:right;font-variant-numeric:tabular-nums;line-height:1;transition:color 0.3s;flex-shrink:0;}
.mlb-feat-score.w{color:#fff;}
.mlb-feat-score.w.glow{text-shadow:0 0 24px var(--team-color,rgba(255,255,255,0.4));}
.mlb-feat-sep{width:100%;height:1px;background:rgba(255,255,255,0.05);}
.mlb-feat-status{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:var(--sp-2);flex-shrink:0;min-width:18cqh;max-width:39cqh;padding:0 var(--sp-2);
  overflow:hidden;
}
.mlb-feat-time-label{font-size:4.6cqh;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(255,255,255,0.2);text-align:center;}
.mlb-feat-time-value.live{color:#f87171;}
.mlb-feat-time-label.live{color:#FF6B6B;}
.mlb-feat-final-badge{font-size:3.6cqh;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,0.25);padding:0.8cqh 2cqh;border-radius:20px;
  background:rgba(255,255,255,0.05);}
/* Green pill labels */
.mlb-status-pill{
  display:inline-flex;align-items:center;justify-content:center;
  background:rgba(52,211,153,0.12);color:#34d399;
  border:1px solid rgba(52,211,153,0.3);
  border-radius:20px;padding:0.6cqh 2cqh;
  font-size:2.2cqh;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;
}
.mlb-feat-label.yank-lbl{color:rgba(0,130,220,0.5);}

/* Situation block inside featured */
.mlb-feat-sit{display:flex;align-items:center;gap:1.5cqh;}
#row-MLB .mlb-feat-sit .sit-divider{height:22cqh;}
#row-MLB .mlb-feat-sit .sit-diamond{width:15cqmin;height:11.8cqmin;}
#row-MLB .mlb-feat-sit .sit-bso{gap:1.4cqh;}
#row-MLB .mlb-feat-sit .bso-lbl{font-size:2.6cqmin;width:2.6cqmin;}
#row-MLB .mlb-feat-sit .bso-dot{width:2.6cqmin;height:2.6cqmin;}
#row-MLB .mlb-feat-sit .bso-dots{gap:0.7cqh;}

/* Pitcher strip below teams in featured */
.mlb-feat-pitcher{
  display:flex;align-items:center;gap:1.2cqh;margin-top:0.8cqh;
  font-size:3.6cqh;font-weight:600;
}
.mlb-feat-pitcher-photo{width:5cqh;height:5cqh;border-radius:50%;object-fit:cover;
  background:rgba(255,255,255,0.08);}
.mlb-feat-pitcher-name{color:rgba(255,255,255,0.5);}
.mlb-feat-pitcher-stat{color:rgba(255,255,255,0.28);}

/* Live in-game: batter/pitcher featured block (round-10 note 4) */
.mlb-feat-pbline .mlb-feat-pb-name{font-size:inherit;margin:0;}
.mlb-feat-pb-name{font-size:5.6cqh;font-weight:800;color:rgba(255,255,255,0.85);line-height:1.25;}
.mlb-feat-pb-stat{font-size:3.6cqh;font-weight:600;color:rgba(255,255,255,0.5);margin:0.1cqh 0 0.7cqh;}
.mlb-feat-pbline div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mlb-feat-pbline{
  font-size:5.2cqh;font-weight:700;color:rgba(255,255,255,0.8);
  margin-top:0.6cqh;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;
}
/* Live in-game: small network pill at top of the status column */
.mlb-feat-net-center{display:flex;justify-content:center;align-items:center;}
.mlb-feat-statusline{display:flex;align-items:center;justify-content:center;gap:2cqh;flex-wrap:wrap;}
.mlb-feat-statusline .net-logo{height:8cqh;max-width:24cqh;object-fit:contain;opacity:0.95;}
.mlb-feat-net-pill{
  font-size:3.6cqh;font-weight:700;letter-spacing:1px;
  background:rgba(255,255,255,0.07);color:rgba(255,255,255,0.45);
  padding:0.5cqh 1.8cqh;border-radius:10px;
}
/* Live in-game: last-play callout under the situation block */
.mlb-feat-lastplay{
  margin-top:1cqh;padding:1cqh 1.5cqh;max-width:100%;
  background:rgba(255,255,255,0.04);border-left:2px solid rgba(0,80,200,0.5);
  border-radius:0 6px 6px 0;
}
.mlb-feat-lp-primary{font-size:3.9cqh;font-weight:700;color:rgba(255,255,255,0.82);line-height:1.3;}
.mlb-feat-lp-secondary{font-size:3.6cqh;font-weight:500;color:rgba(255,255,255,0.4);margin-top:0.3cqh;}

/* Ambient two-column layout */
.mlb-amb-left{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:2cqh;flex-shrink:0;width:39cqh;height:100%;
  border-right:1px solid rgba(255,255,255,0.09);
  padding-right:4cqh;
}
.mlb-ambient-logo{height:26cqh;width:26cqh;object-fit:contain;
  animation:featLogoGlow 4s ease-in-out infinite;}
/* NYY logo — global white outline + glow applied everywhere */
.nyy-logo{
  animation:yankLogoGlow 4s ease-in-out infinite;
}
@keyframes yankLogoGlow{
  0%,100%{filter:drop-shadow(0 0 1px rgba(255,255,255,0.9))
                 drop-shadow(0 0 3px rgba(255,255,255,0.5))
                 drop-shadow(0 0 10px rgba(0,80,200,0.5));}
  50%{filter:drop-shadow(0 0 2px rgba(255,255,255,1))
             drop-shadow(0 0 5px rgba(255,255,255,0.8))
             drop-shadow(0 0 20px rgba(0,80,200,0.8));}
}
.mlb-ambient-name{font-size:12cqh;font-weight:900;color:#fff;letter-spacing:-1px;line-height:1;}
.mlb-amb-record{font-size:4cqh;font-weight:600;color:rgba(255,255,255,0.45);}
.mlb-amb-right{
  display:flex;flex-direction:column;justify-content:center;
  align-items:center;
  gap:0;flex:1;padding-left:4cqh;height:100%;
}
.mlb-amb-div-label{
  font-size:2.8cqh;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:#34d399;
  background:rgba(52,211,153,0.12);
  border:1px solid rgba(52,211,153,0.3);
  border-radius:20px;
  padding:0.8cqh 2.5cqh;
  text-align:center;align-self:center;
  margin-bottom:1.5cqh;
}
.mlb-amb-standings{display:flex;flex-direction:column;gap:0;margin-bottom:2cqh;width:100%;}
.mlb-amb-head{display:grid;grid-template-columns:1fr 1fr 1fr;column-gap:0.5cqh;width:100%;padding:0 0 0.6cqh 1cqh;border-left:3px solid transparent;border-bottom:1px solid rgba(255,255,255,0.14);margin-bottom:0.3cqh;}
.mlb-amb-head span{font-size:1.9cqh;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.3);}
.mlb-amb-head span:nth-child(2){text-align:center;}
.mlb-amb-head span:nth-child(3){text-align:right;}
.mlb-amb-row{display:grid;grid-template-columns:1fr 1fr 1fr;column-gap:0.5cqh;align-items:center;width:100%;padding:0.8cqh 0 0.8cqh 1cqh;border-left:3px solid transparent;border-bottom:1px solid rgba(255,255,255,0.07);}
.mlb-amb-row:last-child{border-bottom:none;}

.mlb-amb-team{font-size:4.2cqh;font-weight:500;color:rgba(255,255,255,0.35);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mlb-amb-team.me{font-weight:800;color:#fff;}

.mlb-amb-rec{font-size:4.2cqh;font-weight:500;color:rgba(255,255,255,0.28);text-align:center;}

.mlb-amb-gb{font-size:3.5cqh;font-weight:500;color:rgba(255,255,255,0.3);text-align:right;font-variant-numeric:tabular-nums;}
.mlb-amb-gb.me{color:rgba(255,255,255,0.6);}
.mlb-amb-rec.me{font-weight:700;color:rgba(255,255,255,0.7);}
.mlb-amb-next-section{
  display:flex;flex-direction:column;align-items:center;
  gap:1.2cqh;padding-top:2cqh;
  border-top:1px solid rgba(255,255,255,0.07);
}
.mlb-amb-next-label{
  font-size:2cqh;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;
  color:rgba(255,255,255,0.25);
}
.mlb-card{
  display:flex;flex-direction:row;align-items:center;justify-content:flex-start;
  flex-shrink:0;width:auto;margin:0 3.2cqh;
  gap:2.2cqh;padding:1.4cqh 2.6cqh;
  position:relative;
  background:rgba(255,255,255,0.035);border:1px solid rgba(255,255,255,0.07);border-radius:2.2cqh;
  transition:background 0.3s;
}
.mlb-card.desig-game{
  border:1px solid rgba(255,215,0,0.28);
  background:rgba(255,215,0,0.05);
}
/* "@" tie between the two teams of a matchup — dim, small, baseball-native */
.mlb-card-at{font-size:3.4cqh;font-weight:700;color:rgba(255,255,255,0.28);flex:none;line-height:1;padding:0 0.2cqh;}
.mlb-card-abbr{font-size:6cqh;font-weight:800;color:rgba(255,255,255,0.55);letter-spacing:0.3px;
  flex:none;max-width:20cqh;text-align:left;overflow:hidden;white-space:nowrap;line-height:1;}
.mlb-card-abbr.w{color:#fff;}
.mlb-card-status{font-size:4.6cqh;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;
  color:rgba(255,255,255,0.4);text-align:left;align-self:center;flex-shrink:0;
  white-space:nowrap;padding-left:var(--sp-1);line-height:1;}
.mlb-card-status.live{color:#4ade80;}
.mlb-card-status.upcoming{color:rgba(52,211,153,0.65);}

/* ── Single-league crawl: stacked matchup card (away over home), reinstated
   FINAL/inning status, larger fonts. One league shown at a time. ── */
.mlb-card2{display:flex;align-items:center;gap:2.6cqh;flex:none;padding:0 3cqh;height:100%;
  border-right:3px solid var(--card-div,rgba(255,255,255,0.06));}
/*R41*/.mlb-card2-teams{display:flex;flex-direction:column;justify-content:center;gap:1.4cqh;min-width:20cqh;}
/*R41*/.mlb-card2-row{display:flex;align-items:center;gap:1.8cqh;}
.mlb-card2-logo{width:6.4cqh;height:6.4cqh;object-fit:contain;flex-shrink:0;}
/*R41*/.mlb-card2-abbr{font-size:5.2cqh;font-weight:800;color:rgba(255,255,255,0.5);letter-spacing:0.3px;
  min-width:9.5cqh;flex:1;line-height:1;white-space:nowrap;}
.mlb-card2-abbr.w{color:#fff;}
/*R41*/.mlb-card2-score{font-size:6.2cqh;font-weight:900;color:rgba(255,255,255,0.32);
  font-variant-numeric:tabular-nums;width:8cqh;min-width:8cqh;text-align:right;line-height:1;flex-shrink:0;}
.mlb-card2-score.w{color:#fff;}
.mlb-card2-status{font-size:4.4cqh;font-weight:800;letter-spacing:0.5px;text-transform:uppercase;
  color:rgba(255,255,255,0.42);white-space:nowrap;line-height:1;align-self:center;padding-left:1cqh;}
.mlb-card2-status.live{color:#4ade80;}
.mlb-card2-status.upcoming{color:rgba(52,211,153,0.7);}
/*R41: vertical AL/NL seam between leagues in the merged crawl (replaces the logo-heavy badge concept — minimal footprint, still meaningful) */
.mlb-lg-band{width:5px;flex-shrink:0;align-self:stretch;}
.mlb-lg-band.al{background:#e4002b;box-shadow:0 0 10px rgba(228,0,43,0.6);}
.mlb-lg-band.nl{background:#3b7dd8;box-shadow:0 0 10px rgba(59,125,216,0.6);}
/* Pinned league logo (crossfades AL↔NL as the displayed set switches) */
.mlb-subleague-row.single{flex:1;min-height:0;display:flex;align-items:stretch;overflow:hidden;}
.mlb-league-logo{display:none!important;}
.mlb-league-logo--x{width:15cqh;flex-shrink:0;position:relative;z-index:2;display:flex;
  align-items:center;padding-left:var(--edge);}
.mlb-league-logo-img{position:absolute;left:var(--edge);width:12cqh;height:12cqh;object-fit:contain;
  opacity:0;transition:opacity 0.9s ease;
  filter:drop-shadow(0 0 3px rgba(255,255,255,0.6)) drop-shadow(0 0 7px rgba(255,255,255,0.35)) brightness(1.12);}
.mlb-league-logo-img.active{opacity:1;}
.mlb-subleague-track#tLG{transition:opacity 0.45s ease-in-out;}

/* ── AL/NL scrolling sub-rows (same scroll/dissolve technique as the
   original NHL/NBA/MLB ticker rows: logo panel + masked crawl + JS-driven
   duplicated track, see rafScroll/scrollPos) ── */
.mlb-subleague-rows{display:flex;flex-direction:column;flex:0 0 17cqh;min-height:0;}
.mlb-subleague-row{
  flex:1;min-height:0;display:flex;align-items:stretch;
  border-bottom:1px solid rgba(255,255,255,0.05);overflow:hidden;
}
.mlb-subleague-row:last-child{border-bottom:none;}
.mlb-league-logo.merged{display:none;}
.mlb-subleague-txt{font-size:5cqh;font-weight:900;letter-spacing:0.5px;line-height:1;}
.mlb-subleague-label.al .mlb-subleague-bar{background:#e4002b;box-shadow:0 0 12px rgba(228,0,43,0.5);}
.mlb-subleague-label.al .mlb-subleague-txt{color:#e4002b;}
.mlb-subleague-label.nl .mlb-subleague-bar{background:#3b7dd8;box-shadow:0 0 12px rgba(59,125,216,0.5);}
.mlb-subleague-label.nl .mlb-subleague-txt{color:#3b7dd8;}
.mlb-subleague-crawl{
  flex:1;overflow:hidden;display:flex;align-items:center;position:relative;min-width:0;
  -webkit-mask-image:linear-gradient(to right, transparent 0%, black 60px, black calc(100% - 30px), transparent 100%);
  mask-image:linear-gradient(to right, transparent 0%, black 60px, black calc(100% - 30px), transparent 100%);
}
.mlb-subleague-track{display:flex;align-items:center;height:100%;white-space:nowrap;padding:0 1cqh;will-change:transform;}

/* Rotation fade transition */
.mlb-feat-slot{transition:opacity 0.5s ease;}
.mlb-feat-slot.fading{opacity:0;}

.no-games{display:flex;align-items:center;justify-content:center;height:100%;gap:28px;padding:0 60px;}
.no-games-icon{font-size:72px;opacity:0.15;flex-shrink:0;}
.no-games-text{display:flex;flex-direction:column;gap:8px;}
.no-games-title{font-size:44px;font-weight:700;color:rgba(255,255,255,0.12);letter-spacing:0.5px;}
.no-games-sub{font-size:26px;font-weight:500;color:rgba(255,255,255,0.06);letter-spacing:0.3px;}

/* ── Status bug — pinned to bottom of MLB logo panel ── */
.status-bug{
  position:absolute;bottom:12px;left:0;right:0;
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:0 12px;
}
.sb-dot{width:11px;height:11px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px rgba(34,197,94,0.7);animation:pulse 2s infinite;flex-shrink:0;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
.sb-txt{font-size:27px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(255,255,255,0.35);}
.sb-sep{width:1px;height:18px;background:rgba(255,255,255,0.12);}
.sb-cd{font-size:19px;font-weight:600;color:rgba(255,255,255,0.25);font-variant-numeric:tabular-nums;}
.sb-cd-bar{width:52px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;overflow:hidden;}
.sb-cd-fill{height:100%;background:#3b82f6;border-radius:1px;transition:width 1s linear;}

/* ── Audio status dot ── */
.audio-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
  transition:background 0.5s ease, box-shadow 0.5s ease;
}
.audio-dot.inactive{
  background:#ef4444;
  box-shadow:0 0 6px rgba(239,68,68,0.7);
  animation:audioPulse 1.5s ease-in-out infinite;
}
.audio-dot.active{
  background:#22c55e;
  box-shadow:0 0 6px rgba(34,197,94,0.7);
  animation:none;
}
@keyframes audioPulse{0%,100%{opacity:0.4;}50%{opacity:1;}}

/* ── Overlay ── */
.overlay{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0c12;z-index:200;gap:14px;transition:opacity 0.5s;}
.overlay.gone{opacity:0;pointer-events:none;}
.spin{width:30px;height:30px;border:2px solid rgba(255,255,255,0.06);border-top-color:#3b82f6;border-radius:50%;animation:sp 0.7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.ov-txt{font-size:16px;font-weight:600;letter-spacing:2px;color:rgba(255,255,255,0.2);text-transform:uppercase;}

/* ═══════════════════════════════════════════════════════════════
   COLOR SYSTEM — status language, network badges, team accents
   ═══════════════════════════════════════════════════════════════ */

/* Live / final color language, layered onto existing pill components.
   Upcoming already uses the teal accent (#34d399) — left as-is. */
.mlb-status-pill.is-live{background:rgba(255,77,77,0.15);color:#FF6B6B;border-color:rgba(255,77,77,0.4);}
.mlb-status-pill.is-final{background:rgba(148,163,184,0.12);color:#94A3B8;border-color:rgba(148,163,184,0.25);}
.mlb-status-pill{transition:background 0.5s ease,color 0.5s ease,border-color 0.5s ease;}
.mlb-card-status.live{color:#FF6B6B;}
.mlb-card-status{color:#94A3B8;transition:color 0.5s ease;}
.mlb-card-status.upcoming{color:rgba(52,211,153,0.7);}


/* Network badges — color-coded by actual channel brand instead of uniform gray */
.net-yes{background:rgba(12,35,64,0.9)!important;color:#fff!important;border-color:#1c3a6b!important;}
.net-sny{background:rgba(255,89,16,0.18)!important;color:#FF8A4C!important;border-color:rgba(255,89,16,0.4)!important;}
.net-espn{background:rgba(211,0,5,0.18)!important;color:#FF5A5F!important;border-color:rgba(211,0,5,0.4)!important;}
.net-fox{background:rgba(0,82,204,0.18)!important;color:#5B9BFF!important;border-color:rgba(0,82,204,0.4)!important;}
.net-tbs{background:rgba(211,0,5,0.18)!important;color:#FF5A5F!important;border-color:rgba(211,0,5,0.4)!important;}
.net-fs1{background:rgba(0,82,204,0.18)!important;color:#5B9BFF!important;border-color:rgba(0,82,204,0.4)!important;}
.net-mlbtv{background:rgba(52,211,153,0.12)!important;color:#34d399!important;border-color:rgba(52,211,153,0.35)!important;}
.net-apple{background:rgba(255,255,255,0.1)!important;color:#fff!important;border-color:rgba(255,255,255,0.25)!important;}
.net-prime{background:rgba(0,168,225,0.18)!important;color:#5BC8F2!important;border-color:rgba(0,168,225,0.4)!important;}
.net-abc{background:rgba(20,20,20,0.5)!important;color:#fff!important;border-color:rgba(255,255,255,0.25)!important;}
.net-tnt{background:rgba(255,165,0,0.18)!important;color:#FFB454!important;border-color:rgba(255,165,0,0.4)!important;}
.net-nbc{background:rgba(140,80,210,0.18)!important;color:#C9A4F5!important;border-color:rgba(140,80,210,0.4)!important;}
.net-peacock{background:rgba(140,80,210,0.18)!important;color:#C9A4F5!important;border-color:rgba(140,80,210,0.4)!important;}

/* Team-color background wash — applied via inline --slot-color custom property
   wherever a featured/ambient slot wants to tint toward an actual team color
   instead of the previous one-size-fits-all white/navy wash. */
.mlb-feat-slot.team-tinted{
  background:linear-gradient(120deg, color-mix(in srgb, var(--slot-color,#0C2340) 22%, transparent) 0%, transparent 75%);
}

/* Rest-of-league / AL-NL cards: home-team color accent as an inset shadow so
   it respects the chip's rounded corners (a hard border-left clipped the radius). */
.mlb-card{box-shadow:inset 0.7cqh 0 0 -0.2cqh var(--card-color, transparent);}

/* Standings: division leader gets a faint green wash + accent instead of
   blending into the same gray row as everyone else */
.mlb-amb-row.leader{
  background:linear-gradient(90deg, rgba(52,211,153,0.14), transparent);
  border-left-color:#34d399;border-radius:4px 0 0 4px;
}

.mlb-amb-row.leader .mlb-amb-rec{color:#34d399;}

/* ═══════════════════════════════════════════════════════════════
   ANIMATION SYSTEM
   ═══════════════════════════════════════════════════════════════ */

/* 1. Score-change flash — only applied when a score genuinely just changed
   (see lastKnownScores tracking in JS), not on routine re-renders. */
.mlb-feat-score.score-just-changed{animation:scoreFlash 1.1s ease-out;}
@keyframes scoreFlash{
  0%{transform:scale(1.35);color:#fff;text-shadow:0 0 30px rgba(255,255,255,0.9);}
  100%{transform:scale(1);}
}

/* 2. B-S-O dot light-up — only the dot that just turned on plays this; dots
   already lit from a previous render stay steady. */
.bso-dot.dot-just-lit{animation:dotPop 0.45s cubic-bezier(.34,1.56,.64,1);}
@keyframes dotPop{0%{transform:scale(0.3);opacity:0.3;}60%{transform:scale(1.25);}100%{transform:scale(1);}}

/* 3. Base-runner glow ramp — a base that just became occupied eases its glow
   in rather than snapping on; an already-occupied base stays steady. */
.sit-base{transition:none;}
.sit-base.base-just-lit{animation:baseGlowRamp 0.6s ease-out;}
@keyframes baseGlowRamp{
  0%{opacity:0.25;}
  100%{opacity:1;}
}

/* 4. Status cross-fade — see .mlb-status-pill/.mlb-card-status transitions above */

/* 5. Page-load stagger — applied only on first render via JS adding
   .stagger-in to freshly-mounted rows, with an index-based delay set inline. */
.stagger-in{animation:staggerIn 0.5s ease-out both;}
@keyframes staggerIn{
  0%{opacity:0;transform:translateY(6px);}
  100%{opacity:1;transform:translateY(0);}
}

/* 6. Countdown bar already animates smoothly via the existing
   `transition:width 1s linear` on .sb-cd-fill — no change needed there. */

/* 7. Leader micro-glow — slow breathing glow on whichever team is currently
   ahead, layered onto the existing winning-score glow treatment. */
.mlb-feat-score.w.glow{animation:leaderBreathe 5s ease-in-out infinite;}
@keyframes leaderBreathe{
  0%,100%{text-shadow:0 0 16px var(--team-color,rgba(255,255,255,0.35));}
  50%{text-shadow:0 0 32px var(--team-color,rgba(255,255,255,0.6));}
}

/* 8. Ambient background drift — extremely slow, barely-perceptible gradient
   angle drift on team-tinted slot backgrounds, so the screen feels alive
   without ever drawing attention to itself. */
.mlb-feat-slot.team-tinted{animation:ambientDrift 26s ease-in-out infinite;}
@keyframes ambientDrift{
  0%,100%{background-position:0% 50%;}
  50%{background-position:8% 50%;}
}

/* ══════════════════════════════════════════════════════════════════════════════
   R113 · THE BLACK BOX — always-on error trap.  MUST STAY THE FIRST CODE IN THIS
   SCRIPT. Do not move it, do not gate it behind a flag.
   ------------------------------------------------------------------------------
   WHY: an uncaught top-level ReferenceError HALTS the entire script. When that
   happened (r111, ?golftest/?mlbtest → TDZ on _golfDebugPanel), fetchAll() never
   ran, the boot overlay never lifted, and the panel sat on "Loading scores…"
   forever — looking exactly like a network hang. Four rounds of theories died on
   that. The error was in the console the whole time. The panel must SAY SO ITSELF.

   BEHAVIOUR
     - healthy  → completely invisible. Zero cost.
     - error    → a red ⚠ badge appears top-right, unprompted. Tap/see it, done.
     - ?console=1 → full scrolling log of every error, warn, and boot event.
     - boot stall → if the overlay hasn't lifted in 25s, it says BOOT STALLED and
       names the last error. Catches hangs, not just throws.
   Deliberately dependency-free and defensive: it runs BEFORE everything, so it
   cannot assume the DOM, any const, or any helper exists yet.
   ══════════════════════════════════════════════════════════════════════════════ */
(function () {
  var SHOW = /[?&]console=1/.test(location.search);
  var buf = [], errCount = 0, panel = null, badge = null;

  function stamp() {
    var d = new Date();
    return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+':'+('0'+d.getSeconds()).slice(-2);
  }
  function push(kind, msg) {
    buf.push({ k: kind, t: stamp(), m: String(msg).slice(0, 400) });
    if (buf.length > 200) buf.shift();
    if (kind === 'ERR') errCount++;
    render();
  }

  function render() {
    if (!document.body) return;                       // too early — replayed on DOM ready
    if (errCount && !badge) {
      badge = document.createElement('div');
      badge.style.cssText = 'position:fixed;top:8px;right:8px;z-index:100000;background:#7f1d1d;'
        + 'color:#fecaca;border:2px solid #ef4444;border-radius:6px;padding:6px 10px;'
        + 'font:bold 13px/1.3 monospace;box-shadow:0 2px 12px #000;max-width:44vw;';
      document.body.appendChild(badge);
    }
    if (badge) {
      var last = null;
      for (var i = buf.length - 1; i >= 0; i--) if (buf[i].k === 'ERR') { last = buf[i]; break; }
      badge.textContent = '\u26A0 ' + errCount + ' JS ERROR' + (errCount > 1 ? 'S' : '')
        + (last ? ' \u2014 ' + last.m.slice(0, 90) : '') + '   [?console=1 for detail]';
    }
    if (!SHOW) return;
    if (!panel) {
      // hudMake is a hoisted function declaration, so it exists even if a top-level
      // throw happened before its definition line. That is deliberate — the Black Box
      // must work in exactly the situation where the rest of the script died.
      panel = (typeof hudMake === 'function')
        ? hudMake('blackbox-hud', 'CONSOLE — errors & warnings', 'left:8px;bottom:8px;width:60vw;').body
        : (function(){ const p = document.createElement('div');
            p.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:100000;width:60vw;'
              + 'max-height:52vh;overflow:auto;background:rgba(0,0,0,.92);border:1px solid #64748b;'
              + 'border-radius:6px;padding:8px;font:11px/1.45 monospace;color:#cbd5e1;white-space:pre-wrap;';
            document.body.appendChild(p); return p; })();
    }
    var out = 'CONSOLE HUD \u2014 ' + (typeof BUILD_MARKER !== 'undefined' ? BUILD_MARKER : '(pre-marker)')
            + '  \u00b7  ' + errCount + ' error(s)\n' + '\u2500'.repeat(60) + '\n';
    for (var j = 0; j < buf.length; j++) {
      var e = buf[j];
      var c = e.k === 'ERR' ? '#f87171' : e.k === 'WARN' ? '#fbbf24' : '#64748b';
      out += e.t + ' ';
      panel.innerHTML = '';                            // rebuilt below as nodes (no HTML injection)
      void c;
    }
    panel.textContent = '';
    var head = document.createElement('div');
    head.style.cssText = 'color:#e2e8f0;font-weight:bold;margin-bottom:4px';
    head.textContent = 'CONSOLE HUD \u2014 ' + (typeof BUILD_MARKER !== 'undefined' ? BUILD_MARKER : '(pre-marker)')
      + '  \u00b7  ' + errCount + ' error(s)';
    panel.appendChild(head);
    for (var k = 0; k < buf.length; k++) {
      var ev = buf[k], row = document.createElement('div');
      row.style.color = ev.k === 'ERR' ? '#f87171' : ev.k === 'WARN' ? '#fbbf24' : '#94a3b8';
      row.textContent = ev.t + '  ' + ev.k + '  ' + ev.m;
      panel.appendChild(row);
    }
    panel.scrollTop = panel.scrollHeight;
  }

  window.addEventListener('error', function (e) {
    push('ERR', (e.message || 'error') + (e.filename ? '  @' + String(e.filename).split('/').pop() + ':' + e.lineno : ''));
  });

    var r = e.reason;

  console.error = function () { push('ERR',  [].join.call(arguments, ' ')); _err.apply(console, arguments); };
  console.warn  = function () { push('WARN', [].join.call(arguments, ' ')); _warn.apply(console, arguments); };

  document.addEventListener('DOMContentLoaded', render);   // replay anything buffered pre-body

  // ── boot-stall watchdog: the symptom we actually SAW ─────────────────────────
  setTimeout(function () {
    var ov = document.getElementById('overlay');
    if (ov && !ov.classList.contains('gone')) {

// AbortSignal.timeout is not supported on older TV browsers — use this instead
function fetchWithTimeout(url, ms) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), ms);
  return fetch(url, { signal: controller.signal })
    .then(r => { clearTimeout(timer); return r; })
    .catch(e => { clearTimeout(timer); throw e; });
}

// R60: text variant for non-JSON (RSS/XML). proxyFetch hardcodes JSON parsing.
async function proxyFetchText(url) {
  try { const res = await fetchWithTimeout(url, window._auditing ? 5000 : 8000); if (res.ok) return await res.text(); } catch(e){}   // R132: shorter direct-attempt timeout during audits
  for (const proxy of PROXIES) {
    try {
      const res = await fetchWithTimeout(proxy(url), window._auditing ? 6000 : 10000);   // R132: audits abandon a flaky proxy fast; live panel stays patient
      if (!res.ok) continue;
      const text = await res.text();
      // allorigins-style wrappers return {contents:"..."}; unwrap if present, else raw.
      try { const w = JSON.parse(text); if (w && typeof w.contents === 'string') return w.contents; } catch(_){}
      return text;
    } catch(e){}
  }
  return null;
}

function hudMake(id, title, posCss){

    + 'max-height:70vh;box-shadow:0 8px 30px rgba(0,0,0,.6);' + (posCss || 'left:8px;top:8px;width:52vw;');

  const bar = document.createElement('div');
  bar.style.cssText = 'display:flex;align-items:center;gap:6px;padding:6px 8px;'
    + 'border-bottom:1px solid #334155;flex:none;';
