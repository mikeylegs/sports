/* ── POST-FINAL RECAP DELAY prober ──────────────────────────────────────────
   ★★ R118b — THE FIRST CUT OF THIS WAS GARBAGE, AND IT MATTERS WHY.
   It started a stopwatch the moment it NOTICED a game was final — so on every page
   reload it "discovered" that Saturday's game was FINAL, instantly found the recap
   (which had existed for days), and logged "RECAP APPEARED after 0.0 min". Three
   identical junk rows for the same gamePk. It wasn't measuring the post-final delay;
   it was measuring how long it takes to notice a race that finished days ago.

   ★ A POST-FINAL DELAY IS ONLY MEASURABLE IF YOU WITNESS THE TRANSITION.
   So: we must see the game NOT-final FIRST (live or upcoming), in this session, and
   only then start the clock. And "already measured this gamePk" must PERSIST across
   reloads, or the panel's auto-refresh re-arms it forever.

   ⚠ CONSEQUENCE, STATED HONESTLY: this now produces NOTHING until a game actually
   ends while the panel is watching — i.e. THURSDAY NIGHT. That is correct. A number
   we didn't earn is worse than no number.                                          */
const TKO_DELAY_KEY = 'tkoDelayDone_v1';
const tkoDelayDone = () => { try { return JSON.parse(localStorage.getItem(TKO_DELAY_KEY)||'{}'); } catch(_){ return {}; } };
const tkoDelayMark = (pk,v) => { try { const d = tkoDelayDone(); d[pk]=v; localStorage.setItem(TKO_DELAY_KEY, JSON.stringify(d)); } catch(_){} };

if (TKO_MEASURE) {
  const _watching = {};        // gamePk -> { sawLiveAt, finalAt, rec, done }
  setInterval(async () => {
    for (const team of (UCS_CFG.MLB_TEAMS || [])){
      try {
        const g = await ucsMlbGame(team);
        if (!g) continue;
        const pk = g.gamePk;
        const done = tkoDelayDone();

        // 1. game is NOT final → arm it. THIS is the only legitimate entry point.
        if (g.gameStatus !== 'final'){
          if (!_watching[pk]) _watching[pk] = { sawLiveAt: Date.now(), armed: true };
          continue;
        }

        // 2. game IS final. Did we WITNESS it go final? If we never saw it live in
        //    this session, we CANNOT measure the delay — say so and move on.
        if (done[pk]) continue;                       // already handled, survives reloads
        const w = _watching[pk];
        if (!w || !w.armed){
          tkoDelayMark(pk, 'not-witnessed');          // never log a number we didn't earn
          continue;
        }

        // 3. we watched it go final. START THE CLOCK (once).
        if (!w.finalAt){
          w.finalAt = Date.now();
          w.rec = tkoLogStart({ team, type:'RECAP-DELAY', clock:new Date().toLocaleTimeString(),
                                playDesc:'WITNESSED game go FINAL (gamePk '+pk+')',
                                polls:0, outcome:'clock started — waiting for the recap to be cut…' });
        }
        if (w.done) continue;
        w.rec.polls = (w.rec.polls||0) + 1;
        _mlbContentCache.delete(pk);
        const r = await mlbRecap(team, pk);
        if (r){
          w.done = true;
          const mins = ((Date.now() - w.finalAt) / 60000).toFixed(1);
          tkoDelayMark(pk, mins);
          tkoLogUpdate(w.rec, { outcome:'★ RECAP CUT ' + mins + ' MIN AFTER FINAL', clipTitle:r.title,
                                delayMin: mins });
        } else tkoLogUpdate(w.rec, {});
      } catch(_){}
    }
  }, 60000);
}

function playCompanionClip(clip){
  if (!clip || !clip.url) return;
  // R117: was `if (_recapActive) return;` — THAT was the hole. The companion is the
  // payoff of a takeover; it must WIN, not defer. Preempt silently and take the slot.
  if (_recapActive) _recapPreempt();
  _recapActive = true; _recapRevealed = false; window._recapActiveSince = Date.now();   // r148 watchdog stamp
  try {
    const el = recapOverlay();
    const badge = el.querySelector('.recap-badge');
    if (badge) badge.textContent = 'THAT PLAY · ' + (clip.lagS != null ? clip.lagS + 's' : '');
    const host = document.getElementById('recap-player');
    if (!host){ _recapActive = false; window._recapActiveSince = 0; return; }
    host.querySelectorAll('video').forEach(n => n.remove());
    const v = document.createElement('video');
    v.src = clip.url; v.playsInline = true; v.preload = 'auto';
    v.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;background:#000;';
    v.onplaying = () => revealRecap();
    v.onended   = () => endRecap();
    v.onerror   = () => endRecap();
    host.appendChild(v);
    window._recapMp4 = v;
    window._tkoCompanion = 'PLAYING: ' + clip.title + ' (' + clip.lagS + 's)';
    v.play().catch(() => { v.muted = true; v.play().catch(() => endRecap()); });
  } catch(e){ _recapActive = false; window._recapActiveSince = 0; }
}

function endRecap(){
  clearTimeout(window._recapCapT);
  const el = document.getElementById('mlb-recap');
  if (!el) return;
  _recapActive = false;
  clearTimeout(_recapTimer); clearTimeout(_recapRevealTimer); clearTimeout(_recapKick); _recapRevealed = false;
  el.classList.remove('show'); el.classList.remove('playing');
  /* ★ r158 — ONE PLAYER FOR THE WHOLE SESSION WAS THE BUG. new YT.Player() ran once and
     every later clip went through loadVideoById on that same instance, so its onReady/
     onStateChange/onError closures stayed bound to the FIRST video forever. Log proof
     (7/19): at 15:44:08 and 15:47:20 the panel logged PLAYER-ERROR 150 for 534ImdA5KFw
     while the clip actually dispatched was x5fosNlz0nw — stale handlers blacklisting the
     wrong ids off a stale state machine. player-probe.html reached PLAYING on this same
     wall machine with the identical construction; the one thing it did differently was
     build a FRESH player. Destroy at the end of every recap and rebuild the host div
     (destroy() removes the iframe that replaced it). ~200ms per clip for correct
     handlers, correct blacklisting, and the configuration that provably plays. */
  try { _recapPlayer && _recapPlayer.stopVideo && _recapPlayer.stopVideo(); } catch(_){}
  try { _recapPlayer && _recapPlayer.destroy && _recapPlayer.destroy(); } catch(_){}
  _recapPlayer = null;
  _resetRecapHost();
  try { if (window._recapMp4){ window._recapMp4.pause(); window._recapMp4.remove(); window._recapMp4 = null; } } catch(_){}
  if (typeof RECAP._onEnd === 'function'){ const cb = RECAP._onEnd; RECAP._onEnd = null; setTimeout(cb, 650); }
}
/* r158: YT.Player REPLACES its target element with an iframe, and destroy() removes that
   iframe outright — so #recap-player must be rebuilt before the next mount. Also repairs
   the case where the id sits on an iframe rather than a div, which silently broke the mp4
   path: that path appends a <video> into #recap-player, and an iframe renders no children. */
function _resetRecapHost(){
  try {
    const el = document.getElementById('mlb-recap'); if (!el) return;
    const frame = el.querySelector('.recap-frame'); if (!frame) return;
    let host = document.getElementById('recap-player');
    if (host && host.tagName !== 'DIV'){ host.remove(); host = null; }
    if (!host){
      const d = document.createElement('div'); d.id = 'recap-player';
      frame.insertBefore(d, frame.firstChild);
    } else host.innerHTML = '';
  } catch (_) {}
}
function revealRecap(){
  if (_recapRevealed) return; _recapRevealed = true;
  const el = document.getElementById('mlb-recap'); if (el) el.classList.add('playing');
}

// ── YTLT: YouTube Logging Tool (R85) ─────────────────────────────────────────
// Captures every video the director plays: time, source, title, videoId, bottom
// label, and (when known) length. Feeds the ?ytlog=1 HUD panel + a downloadable
// rolling log (window.ytltDump() → copies JSON; or the on-screen COPY LOG button).
window.YTLT = { log: [], cap: 300 };   // rolling, capped at 300 entries
function ytltRecord(entry){
  const e = Object.assign({ t: new Date().toISOString() }, entry);
  YTLT.log.push(e);
  if (YTLT.log.length > YTLT.cap) YTLT.log.shift();
  if (window._ytlog) ytltRenderHud();
}
function ytltRenderHud(){
  let el = document.getElementById('ytlt-hud');
  if (!el){
    el = document.createElement('div'); el.id = 'ytlt-hud';
    el.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:99999;max-width:46vw;max-height:44vh;overflow:auto;background:rgba(0,0,0,0.86);color:#8ef;font:11px/1.35 ui-monospace,Menlo,monospace;padding:8px 10px;border:1px solid #2a6;border-radius:8px;white-space:pre-wrap';
    document.body.appendChild(el);
  }
  const rows = YTLT.log.length
    ? YTLT.log.slice(-14).reverse().map(e=>{
        const tm = e.t.slice(11,19);
        // R102: SCORE entries render as a mini scoreboard so Mike never needs the console.
        if (e.note === 'SCORE' && e.scoreDebug){
          const hdr = `${tm} [${e.source}] ── SCORE ──`;
          const lines = e.scoreDebug.slice(0,4).map((r,i) => {
            const mark = i===0 ? '▶' : ' ';
            const flags = `${r.fullGame?'FG ':''}${r.fav?'FAV ':''}`.trim();
            return `  ${mark} ${String(r.score).padStart(6)}  ${String(r.ageH).padStart(5)}h ${flags.padEnd(7)} ${(r.title||'').slice(0,42)}`;
          }).join('\n');
          return hdr + '\n' + lines;
        }
        const len = e.lengthSec ? `${e.lengthSec}s` : '—';
        return `${tm} [${e.source}] ${(e.title||'').slice(0,52)}\n         id:${e.videoId||'—'} len:${len} btm:"${(e.bottom||'').slice(0,28)}"${e.note?' · '+e.note:''}`;
      }).join('\n')
    : '(waiting for first director video… — add ?ticks=1 to speed it up)';
  // R108: collapsible (Mike). Keep the collapse state across the 1s re-render.
  const wasCollapsed = window._ytltCollapsed === true;
  el.innerHTML = `<b style="color:#6f6">▤ YTLT — director video log (${YTLT.log.length})</b> `
    + `<button onclick="window._ytltCollapsed=!window._ytltCollapsed;ytltRenderHud()" style="float:right;margin-left:5px;background:#173;color:#8f8;border:1px solid #2a6;border-radius:4px;font:10px monospace;cursor:pointer;padding:1px 6px">${wasCollapsed?'▶':'▼'}</button>`
    + `<button onclick="ytltCopy()" style="float:right;background:#173;color:#8f8;border:1px solid #2a6;border-radius:4px;font:10px monospace;cursor:pointer;padding:1px 6px">COPY LOG</button>`
    + (wasCollapsed ? '' : `\n\n` + rows);
}
function ytltCopy(){
  const txt = JSON.stringify(YTLT.log, null, 2);
  try { navigator.clipboard.writeText(txt); } catch(_){}
  // also drop as a downloadable file
  try {
    const blob = new Blob([txt], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `ytlt-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
    a.click();
  } catch(_){}
}
window.ytltDump = () => { try{navigator.clipboard.writeText(JSON.stringify(YTLT.log,null,2));}catch(_){}; return YTLT.log; };

/* Play one recap source. opts.onEnd fires after dissolve (for sequencing).
   Returns true if a video started, false if nothing was found / errored. */
/* ══════════════════════════════════════════════════════════════════════════════
   R115 · resolveVideo(sourceId)  —  THE VIDEO CONTRACT.
   ------------------------------------------------------------------------------
   The CALLER declares WHAT IT WANTS (a source). A RESOLVER answers with a TYPED
   MEDIA DESCRIPTOR. The player supplies the matching element.

       { kind:'mp4'|'iframe', url|videoId, title, exact, source }

   ★ kind  tells the RENDERER what to build.
   ★ exact tells the SYSTEM what to believe:
       MLB     → queried by gamePk.  CANNOT be wrong.        exact:true
       YouTube → searched by string. OFTEN wrong.            exact:false
   Element type is trivia. TRUST LEVEL is what changes behaviour — whether a card
   may promote its own lifecycle on the strength of a video, whether the Brain may
   fire a companion clip, whether "no video" means stay static or go find filler.

   ★ THE FALLBACK SEAM IS THE WHOLE POINT: MLB null → the EXISTING YouTube path,
   untouched. Every non-MLB source behaves exactly as it did before this commit.
   findRecap() and its gates/scoring/regex are NOT rewritten — they are simply now
   REACHED THROUGH here, which is what quarantines them.

   ★ THE TEST THIS MUST PASS: when UCS lands, it calls resolveVideo() and
   playMedia() UNCHANGED. If UCS has to wrap or modify either, this was a hack.
   ══════════════════════════════════════════════════════════════════════════════ */
const RECAP_MLB_TEAM = { 'hoh-nyy': 'NYY', 'hoh-nym': 'NYM' };

let _mp4RecapExists = false;   // r167: set per resolveVideo call, read at the YouTube fallthrough
async function resolveVideo(sourceId){
  _mp4RecapExists = false;
  // r170: a pinned source may carry an expiry so one-off event pins retire themselves.
  try { const _sx = RECAP.sources[sourceId];
        if (_sx && _sx.expiresAt && Date.now() > new Date(_sx.expiresAt).getTime()){
          window._recapFailReason = 'PIN EXPIRED (' + sourceId + ' — remove this source)';
          return null;
        } } catch(_){}
  sourceId = RECAP_ALIAS[sourceId] || sourceId;

  // 1. MLB — exact. Queried, not searched.
  const team = RECAP_MLB_TEAM[sourceId];
  if (team){
    try {
      // A recap only exists for a FINAL game. ucsMlbGame prioritizes live/imminent, so
      // on a game day it returns TODAY's un-played game — handing that pk to mlbRecap
      // finds no recap → falls through to YouTube → generic "Top Plays" substitutes for
      // the team recap (Mike's recurring hoh-nym miss). Pass the pk ONLY when the matchup
      // is final; otherwise pass null so mlbRecap resolves the last final itself.
      const _um = (typeof ucsMlbGame === 'function') ? await ucsMlbGame(team) : null;
      const pk = (_um && _um.gameStatus === 'final') ? _um.gamePk : null;
      const r = await mlbRecap(team, pk);
      if (r) _mp4RecapExists = true;   // r167: remember it EXISTS even if cooldown blocks serving it
      if (r){
        // A4 (r141): mp4 recaps bypass the pool's SEEN gate (no videoId), so the
        // same gamePk recap was re-served every hoh-nym turn (Mike's looping bug).
        // Throttle by gamePk on the same 12-min window YouTube team recaps use: if
        // shown recently, DON'T return the mp4 — fall through to YouTube, and if that
        // also yields, resolveVideo returns null → filler (Mike's yield rule holds).
        const _mk = 'mlb:' + r.gamePk;
        const _shown = _recapShownAt[_mk];
        if (_shown && (Date.now() - _shown) < 12*60000){
          window._recapFailReason = 'MP4-COOLDOWN (recap shown <12m ago — advancing past re-serve)';
        } else {
          window._recapVia = 'mlb';
          return { kind:'mp4', url:r.url, title:r.title, lengthSec:_hmsToSec(r.duration),
                   exact:true, source:'mlb', gamePk:r.gamePk };
        }
      }
    } catch(_){}
    // no recap cut yet → fall through. NOT an error.
  }

  // 2. YouTube — best-effort. The existing director, unchanged, just reached through here.
  const v = await findRecap(sourceId);
  if (!v) return null;
  /* ★ r167 (Mike, 7/20): "never want the full length recap when the shorter one is
     available." The MP4-COOLDOWN path was serving exactly that — the 3-minute MLB cut
     plays, and two minutes later the same source falls through to YouTube and serves
     "METS vs. PHILLIES: Official Full Game Highlights", 11.3 minutes of the same game.
     Not a scoring bug: that clip won because WINDOW 36h had killed 9 of 10 items and it
     was the last one standing, already carrying -4 and -6 penalties.
     When a short MLB cut exists for this game, the long full-game version is never the
     right answer — yield to filler and let the mp4 come back after its cooldown. Only
     "Official Full Game Highlights" titles are suppressed; a punchy moment clip from the
     same game (Chisholm's homer, 5.8m) still plays. */
  if (_mp4RecapExists && /official full game (?:two )?highlights/i.test(v.title || '')){
    window._recapFailReason = 'FULL-GAME SUPPRESSED (short MLB recap exists for this game — r167)';
    return null;
  }
  window._recapVia = 'youtube';
  return Object.assign({}, v, { kind:'iframe', exact:false, source:'youtube' });
}
function _hmsToSec(hms){
  if (!hms) return null;
  const p = String(hms).split(':').map(Number);
  return p.length === 3 ? p[0]*3600 + p[1]*60 + p[2] : null;
}

async function playRecap(sourceId, opts){
  opts = opts || {};
  sourceId = RECAP_ALIAS[sourceId] || sourceId;
  const src = RECAP.sources[sourceId];
  if (!src){ console.warn('[recap] no such source', sourceId); return false; }
  if (_recapActive) return false;          // one recap at a time — HARD guard
  _recapActive = true; _recapRevealed = false; window._recapActiveSince = Date.now();   // r148: stamp for the stuck-active watchdog
                                                 // claim synchronously, BEFORE any await,
                                                 // so a second director tick during the
                                                 // findRecap/loadYTIframeApi await can't
                                                 // spin up a second player on #recap-player
                                                 // (that race was the "stuck on play icon").
  try {
    // R15: resolve the video BEFORE glowing. Glowing first meant an ineligible
    // source (e.g. WC with no finished match today) flashed its pane, then bailed
    // on the null video — the "WC flashing" bug. No video → no glow, no flash.
    let [video] = await Promise.all([ resolveVideo(sourceId), loadYTIframeApi() ]);
    // R58: MLB pool empty → try the source's HoH fallback before giving up.
    if (!video && src.fallback){ try { video = await resolveVideo(src.fallback); } catch(_){} }
    if (!video){ _dormancyNote(sourceId, false);   // r146: count the miss toward suppression
                 ytltRecord({ source:sourceId, note: (window._recapFailReason || 'NO VIDEO (unknown)') + _dormancySuffix(sourceId) }); window._recapFailReason = null; _recapActive = false; if (opts.onNoVideo) opts.onNoVideo(); return false; }
    if (video.videoId) _recapShownAt[video.videoId] = Date.now();   // R57: stamp for anti-monotony scoring
    else if (video.kind === 'mp4' && video.gamePk) _recapShownAt['mlb:' + video.gamePk] = Date.now();   // A4: mp4 recaps have no videoId — key the cooldown by gamePk
    _dormancyNote(sourceId, true);    // r146: source produced — clear any suppression
    _markServed(_servedKey(video));   // global recent-served ring (mp4 keyed by gamePk)
    ytltRecord({ source:sourceId, title:video.title, videoId:video.videoId,
                 bottom:recapBadgeLabel(sourceId), lengthSec:video.lengthSec||null,
                 published:video.published||null });   // R85 YTLT: log the chosen video

    // Video confirmed → NOW glow the relevant pane, then emerge into the player.
    if (src.slot) recapGlow(src.slot, src.glow || 'rgba(255,255,255,0.95)');

    const el = recapOverlay();
    el.querySelector('.recap-badge').textContent = recapBadgeLabel(sourceId);
    RECAP._onEnd = opts.onEnd || null;

    const start = () => {
      _recapUnmuted = false; _recapAudioBlocked = false;
      if (RECAP.director.maxMs > 0){                       // R14b: debug length cap
        clearTimeout(window._recapCapT);
        window._recapCapT = setTimeout(() => { try { endRecap(); } catch(_){} }, RECAP.director.maxMs);
      }
      // ★ R115 — kind branch. An MLB clip is a bare .mp4 and needs a <video>.
      // The YouTube path below is COMPLETELY UNTOUCHED. No `if (isMLB)` leaks into it.
      if (video.kind === 'mp4'){
        const host = document.getElementById('recap-player');
        if (host){
          host.querySelectorAll('video').forEach(n => n.remove());
          const v = document.createElement('video');
          v.src = video.url;
          v.playsInline = true; v.preload = 'auto';
          v.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;background:#000;';
          v.onplaying = () => revealRecap();
          v.onended   = () => endRecap();
          v.onerror   = () => {
            const c = v.error && v.error.code;   // 1 abort · 2 network · 3 decode · 4 src-unsupported
            window._recapEvt = 'mp4 ERROR ' + (c || '?');
            ytltRecord({ source: sourceId, title: video.title, note: 'MP4-ERROR ' + (c || '?') });
            endRecap();
          };
          // A2 (r141): DIAGNOSE-ONLY instrumentation for the Alvarez won't-autoplay bug.
          // The id:— len:390s entries ARE this mp4 branch (mlbRecap has no videoId).
          // Record the element lifecycle so the ?ytlog=1 HUD shows exactly where a
          // failing recap dies (network stall vs decode vs autoplay-reject). Listeners
          // + a record-only stall probe — NO playback behavior changed.
          ['loadstart','waiting','stalled','suspend','canplay'].forEach(ev =>
            v.addEventListener(ev, () => { window._recapEvt = 'mp4 ' + ev; }));
          const _mp4StallT = setTimeout(() => {
            if (!_recapRevealed && window._recapMp4 === v)
              ytltRecord({ source: sourceId, title: video.title,
                           note: 'MP4-STALL — no playing after 12s (last evt: ' + (window._recapEvt||'none') + ')' });
          }, 12000);
          v.addEventListener('playing', () => clearTimeout(_mp4StallT), { once: true });
          host.appendChild(v);
          window._recapMp4 = v;
          // autoplay policy: try with sound; on rejection retry muted so playback is
          // NEVER lost. Same behaviour proven in player-test.html.
          v.play().catch(() => { v.muted = true; v.play().catch(() => endRecap()); });
        }
        return;                                   // ← YouTube path not entered at all
      }

      _resetRecapHost();   // r158: never mount onto a leftover iframe or a dirty div
      const kick = () => { try { _recapPlayer && _recapPlayer.mute(); _recapPlayer && _recapPlayer.playVideo(); } catch(_){} };
      if (_recapPlayer && _recapPlayer.loadVideoById){
        _recapPlayer.loadVideoById(video.videoId);
        kick();   // start muted; unmute after PLAYING
      } else {
        _recapPlayer = new YT.Player('recap-player', {
          videoId: video.videoId,
          playerVars: { autoplay:1, mute:1, controls:0, rel:0, modestbranding:1, playsinline:1, iv_load_policy:3, disablekb:1, fs:0 },
          events: {
            onReady: (e) => kick(),
            onStateChange: (e) => {
              if (e.data === YT.PlayerState.PLAYING) {
                /* r168 (Mike, 7/20): a pause-button overlay flashes as the clip loads.
                   YouTube paints its own control UI for a beat when playVideo() takes
                   effect, and we were revealing on the very first PLAYING event, so the
                   flash landed on screen. Hold the curtain ~300ms and it happens behind
                   it. Costs 0.3s against a DEAD AIR budget measured in tens of seconds.
                   mp4 recaps reveal immediately (v.onplaying) — no iframe, no flash. */
                setTimeout(revealRecap, 300);
                if (!_recapUnmuted && !_userMuted){ _recapUnmuted = true; applyRecapAudio(e.target); }   // R61: only auto-unmute if not user-muted
              } else if (e.data === YT.PlayerState.PAUSED && _recapUnmuted && !_recapAudioBlocked) {
                // Browser blocked the unmute by pausing (no kiosk autoplay flag /
                // no user gesture). Re-mute and resume so playback is never lost;
                // don't attempt audio again for this video.
                _recapAudioBlocked = true;
                try { e.target.mute(); e.target.playVideo(); } catch(_){}
              } else if (e.data === YT.PlayerState.ENDED) {
                // Ad→content handoffs can emit a bogus ENDED before the actual
                // video has played (seen live: ad finishes → viewer dismissed).
                // Only honor ENDED if we're actually at/near the end of the
                // content; otherwise re-kick playback and stay up.
                let cur = 0, dur = 0;
                try { cur = e.target.getCurrentTime() || 0; dur = e.target.getDuration() || 0; } catch(_){}
                if (dur > 0 && cur < dur - 10) {
                  window._recapEvt = `spuriousEND ${Math.round(cur)}/${Math.round(dur)}s`;
                  try { e.target.playVideo(); } catch(_){}
                } else endRecap();
              }
              window._recapEvt = `state ${e.data} @${Math.round(Date.now()/1000)%10000}`;
            },
            onError: (e) => {
              const code = e && e.data;
              window._recapEvt = `ERROR ${code}`;
              console.warn('[recap] player error', code);
              if (code !== 150 && code !== 101)   // 150/101 get their own richer line below
                ytltRecord({ source: sourceId, title: video.title, videoId: video.videoId,
                             note: 'PLAYER-ERROR ' + code });
              // R129: 150 = "embedding disabled by owner", 101 = "playback disabled on other
              // sites" — both mean this exact video will NEVER play here. Blacklist the ID so
              // the pool gate skips it next time instead of re-picking and re-failing.
              if ((code === 150 || code === 101) && video && video.videoId){
                _markDeadId(video.videoId);   // r154: persists across reloads
                ytltRecord({ source: sourceId, title: video.title, videoId: video.videoId,
                             note: 'PLAYER-ERROR ' + code + ' — embedding disabled; blacklisted 30d (r154)' });
                console.warn('[recap] blacklisted dead video', video.videoId, '(embedding disabled, persisted)');
              }
              endRecap();
            },
          },
        });
      }
      // ONE-SHOT watchdog: if the player is still parked on the poster/cued a
      // moment after mount, nudge it a single time. (The old per-state-change
      // re-issue caused a playVideo storm → perpetual re-buffer = frantic YT
      // spinner. A single deferred kick fixes the stuck-poster case without a loop.)
      clearTimeout(_recapKick);
      _recapKick = setTimeout(() => {
        try {
          const st = _recapPlayer && _recapPlayer.getPlayerState ? _recapPlayer.getPlayerState() : 1;
          if (st === -1 || st === 5) kick();   // only unstarted(-1)/cued(5) — never mid-buffer/playing
          // Non-kiosk fallback (phones, Low Power Mode): if even the muted kick
          // won't start it, a real tap is the only way — and since it's a user
          // gesture, start UNMUTED so the tap also delivers audio.
          setTimeout(() => {
            try {
              const st2 = _recapPlayer && _recapPlayer.getPlayerState ? _recapPlayer.getPlayerState() : 1;
              if (st2 === -1 || st2 === 5) {
                const ov = el;   // #mlb-recap overlay (in scope from playRecap)
                ov.addEventListener('click', () => {
                  try { _recapPlayer.unMute(); _recapPlayer.setVolume(100); _recapPlayer.playVideo(); _recapUnmuted = true; } catch(_){}
                }, { once: true });
              }
            } catch(_){}
          }, 2000);
        } catch(_){}
      }, 1500);
    };
    /* ★ r157 — MOUNT AFTER PAINT. #mlb-recap is display:none until the line below, and
       r156 and earlier called start() in the SAME synchronous task that added .show —
       so YT.Player (or loadVideoById on the reused player) ran inside a subtree the
       browser had not yet laid out or painted. Chrome cues such a player and refuses to
       start it: state 5 forever, no error, which is exactly the wall's 7/19 log where
       mlb-allgames, fifa-fill, hoh-nym and golf-fill ALL stalled at 15s while the mp4
       path (a plain <video>, no iframe) played fine.
       Proven by player-probe.html on the wall machine: the panel's exact YT.Player
       construction reaches PLAYING there, in a container that was visible from the
       start. Same code, same browser, same clip — only the paint state differed.
       Two rAFs: the first fires before the paint that follows .show, the second after
       it, so the player is always built into a genuinely rendered container. Falls back
       to a plain call if rAF is unavailable. */
    setTimeout(() => {
      el.classList.add('show');
      if (typeof requestAnimationFrame === 'function')
        requestAnimationFrame(() => requestAnimationFrame(() => { try { start(); } catch(_){} }));
      else start();
    }, src.slot ? 1250 : 250);

    /* r154 YT-STALL — mirrors the existing MP4-STALL. An embedding-disabled video sits
       on its poster until YouTube reports error 150, which on 7/18 took long enough to
       look like an autoplay failure. If we're still unstarted(-1)/cued(5) 15s after
       mount, log it and move on. Deliberately NOT firing on buffering(3) — a slow
       connection deserves patience; a player that never left the gate does not. */
    clearTimeout(_recapYtStall);
    _recapYtStall = setTimeout(() => {
      try {
        if (_recapRevealed || video.kind === 'mp4') return;
        const st = _recapPlayer && _recapPlayer.getPlayerState ? _recapPlayer.getPlayerState() : null;
        /* r171 — BUFFERING ALSO WEDGES. r154 deliberately spared state 3 ("a slow
           connection deserves patience"), but the 7/20 log shows the cost: two recaps
           held _recapActive for 289s and 240s and were only freed by the r148 watchdog,
           i.e. 4–5 minutes of dead wall each. A player that has not produced a frame
           15s after mount is not being patient, it is stuck. Buffering now counts —
           but only if nothing has revealed, so a clip that started and later rebuffers
           mid-play is untouched. */
        if (st === -1 || st === 5 || st === 3){
          /* ★ r156 — QUARANTINE REMOVED. r155 assumed a stall meant a bad video. The
             7/19 15:15–15:20 log disproved it: mlb-allgames, fifa-fill, hoh-nym AND
             golf-fill all stalled at exactly 15s in state 5 (CUED), while the ONE clip
             that played was an mp4 (no videoId, different code path). YouTube playback
             is failing wholesale, so quarantining on stall was blacklisting the entire
             library 6 hours at a time and draining the pool. Log it, never punish for
             it — only a real 150/101 from the player earns a blacklist. */
          ytltRecord({ source: sourceId, title: video.title, videoId: video.videoId,
                       note: 'YT-STALL — still ' + (st === -1 ? 'unstarted' : st === 3 ? 'buffering' : 'cued') + ' after 15s (last evt: ' + (window._recapEvt||'none') + ') — NOT quarantined (r156)' });
          endRecap();
        }
      } catch (_) {}
    }, 15000);

    // hard safety cap so a stuck/unended video always dissolves (tune live)
    clearTimeout(_recapTimer);
    _recapTimer = setTimeout(endRecap, (opts.maxMs || 30 * 60 * 1000));   // full game recaps run long
    return true;
  } catch(e){
    console.warn('[recap] playRecap failed:', e && e.message);
    _recapActive = false; window._recapActiveSince = 0;          // release so the director can retry next cycle
    return false;
  }
}

/* Play a list of sources back-to-back (placements TBD).
   e.g. playRecapSequence(['hoh-nyy','mlb-daily','hoh-nym']) */
async function playRecapSequence(ids){
  ids = (ids || []).slice();
  if (!ids.length || _recapActive) return;
  const next = async () => {
    const id = ids.shift();
    if (!id) return;
    const started = await playRecap(id, { onEnd: next });
    if (!started) next();          // skip sources with no video, keep the chain moving
  };
  next();
}

/* ═══════════════════════════════════════════════════════════════════════
   THE BRAIN — moment detector (P1: detection + priority + debug output only;
   no visual firing yet — that's P2/P3). Multi-sport by design: a generic
   core + per-sport plug-in modules (MLB now; NHL/NBA/NFL later, same shape).
   Enable debug read-out with ?brain=1 (prints decisions to the debug overlay).
   ═══════════════════════════════════════════════════════════════════════ */

// Star roster — MLB Network "Top 100 Players Right Now for 2026" (flat: all = star).
// Matched by last name (ESPN lastPlay/batter strings are "F. Lastname" or full).
// Curated + seasonal (set-and-forget). Mike's teams get an ALWAYS-bump separately.
// MLB Network "Top 100 Right Now 2026" (flat). Stored ACCENT-FOLDED (no diacritics);
// brainIsStar() folds the incoming name the same way, so Ramírez/Ramirez both match one entry.
// Audited R55: removed Doncic (NBA typo), Gunnar (first name — Henderson covers him),
// Smith/Anderson/Jackson/Stubbs (surnames too generic → false-positive takeovers), Fried dupe.
const MLB_STARS = new Set([
  'Ohtani','Judge','Witt','Raleigh','Ramirez','Soto','Skubal','Skenes','Guerrero','Henderson',
  'Lindor','De La Cruz','Carroll','Alvarez','Crochet','Wheeler','Tucker','Harper','Betts','Freeman',
  'Machado','Bregman','Devers','Acuna','Riley','Olson','Turner','Bichette',
  'Seager','Semien','Rutschman','Buxton','Woodruff','Sale','Fried','Gilbert','Castillo',
  'Burnes','Webb','Nola','Gallen','Kirby','Bello','Greene','Rodriguez','Chourio',
  'Merrill','Langford','Holliday','Mayer','Kurtz','Wood','Yamamoto','Imanaga','Cease',
  'Snell','Glasnow','King','Peralta','Clase','Duran','Hader','Diaz','Williams',
  'Chapman','Yelich','Contreras','Alonso','Nimmo','Marte','Arraez','Kwan','Naylor',
  'Robert','Adell','Trout','Rooker','Kjerstad','Westburg','Mountcastle','Chisholm','Volpe',
  'Rice','Rodon','Edman','Realmuto','Schwarber'
]);
const BRAIN_MY_TEAMS = new Set(['NYY','NYM','NYR','NYK']);

// last-name extractor from ESPN play/batter strings ("A. Judge homered", "Aaron Judge")
function brainLastName(s){
  if(!s) return '';
  const m = String(s).match(/\b([A-Z][a-zà-ÿ'’-]+)(?:\s+(?:homered|singled|doubled|tripled|reached|walked|struck))/);
  if(m) return m[1];
  const toks = String(s).replace(/\([^)]*\)/g,'').trim().split(/\s+/);
  return toks.length ? toks[toks.length-1].replace(/[^A-Za-zà-ÿ'’-]/g,'') : '';
}
function brainFold(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,''); }
function brainIsStar(name){ const ln=brainFold(brainLastName(name)); return !!ln && MLB_STARS.has(ln); }

// ── MLB moment module: game-state → array of {tier, type, meta} candidates ──
// tiers: 3=TAKEOVER, 2=PIN, 1=MENTION. urgency 0..1 (later inning / higher leverage).
function mlbMoments(g){
  const out = [];
  const s   = g.situation || {};
  const mine = BRAIN_MY_TEAMS.has(g.awayAbbr) || BRAIN_MY_TEAMS.has(g.homeAbbr);
  const live = g.gameStatus === 'live';
  const fin  = g.gameStatus === 'final';
  const inn  = s.inning || parseInt((g.timeLabel||'').match(/(\d+)/)?.[1]||'0',10) || 0;
  const half = (s.half||'').toLowerCase();               // 'top'|'bot'|...
  const aS = g.awayScore ?? 0, hS = g.homeScore ?? 0;
  const diff = Math.abs(aS - hS);
  const push = (tier,type,meta={}) => out.push({tier,type,urgency:meta.urgency??0,star:!!meta.star,mine,meta:{...meta, game:`${g.awayAbbr}@${g.homeAbbr}`}});

  // ── NO-HITTER / PERFECT GAME (the flagship) ──
  // pitching team = the one NOT batting. Batting team's hits tells us.
  if (live && inn >= 5) {
    // which side is batting? top = away bats, bot = home bats
    const awayBatting = half.startsWith('top') || half.startsWith('mid');
    const battingHits = awayBatting ? s.awayHits : s.homeHits;
    const battingErr  = awayBatting ? s.awayErrors : s.homeErrors;
    // hits of BOTH teams — a no-no is about the team being no-hit (either).
    // B1 (r141) NULL-GUARD: only a REAL numeric 0 is a no-hitter. ESPN's competitor.hits
    // is undefined live (→ situation.awayHits=null); === 0 already excludes null, but make
    // it explicit so no future refactor (loose ==, ?? 0, || 0) can turn missing data into a
    // phantom no-hit bid. When the hits-source plumbing lands, this stays correct.
    const _isNoHit = v => (typeof v === 'number' && v === 0);
    const noHitAway = _isNoHit(s.awayHits);
    const noHitHome = _isNoHit(s.homeHits);
    [ [noHitAway, s.awayErrors, g.awayAbbr, g.homeAbbr],
      [noHitHome, s.homeErrors, g.homeAbbr, g.awayAbbr] ].forEach(([noHit,errs,heldAbbr,pitchAbbr])=>{
      if (noHit === true && inn >= 6) {
        const perfect = (errs === 0);              // approx (walks not in scoreboard payload — refine via summary endpoint in P3)
        const label = perfect ? 'PERFECT GAME' : 'NO-HITTER';
        const urg = Math.min(1, (inn-5)/4);        // 6th→0.25 ... 9th→1
        if (inn >= 9 || fin)      push(perfect?3:3, perfect?'perfect_game':'no_hitter', {label, pitchAbbr, heldAbbr, inning:inn, urgency:1, note:'completed/9th'});
        else if (inn >= 8)        push(2, perfect?'perfect_game_watch':'no_hitter_watch', {label, pitchAbbr, heldAbbr, inning:inn, urgency:urg, escalate:true});
        else                      push(2, perfect?'perfect_game_watch':'no_hitter_watch', {label, pitchAbbr, heldAbbr, inning:inn, urgency:urg});
      }
    });
  }

  // ── HOME RUN (from lastPlay) ──
  if (live && g.lastPlay && /homer|home run|grand slam/i.test(g.lastPlay.primary||'')) {
    const nm  = g.lastPlay.primary;
    const star = brainIsStar(nm);
    const slam = /grand slam/i.test(nm);
    if (mine)      push(3,'hr_myteam',{label:'HOME RUN', who:nm, urgency:0.6});
    else if (slam) push(star?3:2,'grand_slam',{label:'GRAND SLAM', who:nm, star, urgency:0.7});
    else if (star) push(3,'hr_star',{label:'HOME RUN', who:nm, star:true, urgency:0.5});
    else           push(1,'hr',{label:'HR', who:nm, urgency:0.2});
  }

  // ── WALK-OFF (final, home team won in last at-bat) ──
  if (fin && hS > aS && inn >= 9) {
    // heuristic: home win, game ended in bottom of 9th+ — ESPN lastPlay often says "walk-off"
    const wo = /walk-?off/i.test(g.lastPlay?.primary||'') || (half.startsWith('bot') && inn>=9);
    if (wo) push(3,'walkoff',{label:'WALK-OFF', who:g.lastPlay?.primary||'', urgency:1, team:g.homeAbbr});
  }

  // ── CLOSE & LATE (tied or within 1, 9th+) ──
  if (live && inn >= 9 && diff <= 1) {
    push(2,'close_late',{label: diff===0?'TIED · LATE':'ONE-RUN · LATE', inning:inn, urgency:Math.min(1,0.6+(inn-9)*0.1)});
  }
  // bases loaded, 2 outs, 8th+, close
  if (live && inn >= 8 && diff <= 2 && s.onFirst && s.onSecond && s.onThird && s.outs === 2) {
    push(2,'bases_loaded_late',{label:'BASES LOADED', inning:inn, urgency:0.85});
  }
  // extra innings
  if (live && inn >= 10) push(2,'extra_innings',{label:`${inn}TH INNING`, inning:inn, urgency:0.75});

  // ── LEAD CHANGE (myteam re-enable; generic mention) ──
  if (live && g._leadChanged) {
    if (mine) push(3,'lead_change_myteam',{label:'LEAD CHANGE', urgency:0.5});
    else      push(1,'lead_change',{label:'lead change', urgency:0.2});
  }

  // ── FINALS ──
  if (fin) {
    if (mine) push(3,'final_myteam',{label:'FINAL', score:`${g.awayAbbr} ${aS}-${hS} ${g.homeAbbr}`, urgency:0.3});
    else      push(1,'final',{label:'Final', urgency:0.1});
  }

  return out;
}

// ── Generic Brain core: collect candidates from the sport module, sort, decide ──
// P1: outputs decisions to debug only. Cooldown/queue scaffolding present but inert.
const BRAIN = {
  sportModules: { MLB: mlbMoments },
  _lastTakeoverAt: 0,
  COOLDOWN_MS: 25000,          // 20–30s, per spec
  _pinCurrent: null,
  _takeoverQueue: [],

  // priority sort for the SINGLE pin (spec): historic-tier override > NYY > NYM > rarity > urgency > star
  pinRank(c){
    const historic = (c.type.startsWith('perfect_game')||c.type.startsWith('no_hitter')||c.type==='milestone') ? 1 : 0;
    const nyy = (c.meta.game||'').includes('NYY') ? 1 : 0;
    const nym = (c.meta.game||'').includes('NYM') ? 1 : 0;
    // higher = wins
    return historic*1e6 + nyy*1e5 + nym*1e4 + (c.tier*1e3) + Math.round(c.urgency*100) + (c.star?1:0);
  },

  evaluate(league, games){
    window._brainLastEval = Date.now();   // R98: Brain heartbeat stamp
    const mod = this.sportModules[league];
    if (!mod) return null;
    const cands = [];
    (games||[]).forEach(g => { try { mod(g).forEach(c => cands.push({...c, league})); } catch(e){} });

    const takeovers = cands.filter(c => c.tier === 3);
    const pins      = cands.filter(c => c.tier === 2);
    const mentions  = cands.filter(c => c.tier === 1);

    // single pin: pick highest pinRank
    const pin = pins.slice().sort((a,b)=>this.pinRank(b)-this.pinRank(a))[0] || null;

    // takeover queue order: most-recent-first is caller-fed; here rank so NYY/historic jump.
    const takeoverSorted = takeovers.slice().sort((a,b)=>this.pinRank(b)-this.pinRank(a));

    const decision = { league, takeovers: takeoverSorted, pin, mentions, ts: Date.now() };
    if (window._brainDebug) this.debugOut(decision, cands);
    window._brainLastDecision = decision;
    window._brainCands = cands.length;                          // R98: heartbeat — candidates seen
    window._brainTiers = { tko: takeovers.length, pin: pins.length };   // R98: what's hot right now
    if (window._brainFire) this.fire(decision, games);   // P2a: actually fire takeovers (default OFF)
    return decision;
  },

  // ── P2a: fire the top Tier-3 takeover, gated by safety rails ──
  // Rails: (1) 25s cooldown; (2) fire-once per moment (dedupe key); (3) skip NYY/NYM
  // (checkBigMoments still owns those — no double-fire); (4) whole path behind _brainFire.
  _lastFireAt: 0,
  _firedKeys: {},
  QUEUE_TTL_MS: 300000,   // B4: a queued moment older than 5 min is no longer "now" — expire it
  fireKey(c){ return `${c.meta.game}|${c.type}|${c.meta.inning||''}|${(c.meta.who||'').slice(0,20)}`; },
  // ── B4 (r141): CROSS-POLL TAKEOVER QUEUE (Mike's principle #4 — "let the first
  // play out, then straight to the next"). The old loop fired ONE takeover then
  // `break`, so a second coincident tier-3 survived only by feed-lingering luck.
  // Now un-fired tier-3s are enqueued WITH a self-contained {cand, game} snapshot
  // (so the moment fires next poll even after its feed entry rolls off), ranked by
  // pinRank (NYY/historic jump the line), deduped by fireKey, expired after TTL.
  // Whole path still behind _brainFire (default OFF) — inert until B2's smoke test.
  fire(decision, games){
    const now = Date.now();

    // 1. Drop queued entries that already fired or have gone stale.
    this._takeoverQueue = this._takeoverQueue.filter(e =>
      !this._firedKeys[e.key] && (now - e.at) < this.QUEUE_TTL_MS);

    // 2. Enqueue this poll's fresh, un-fired, non-favorite tier-3s (dedup by key).
    //    Snapshot the backing game NOW so a later poll can still build the payload.
    for (const c of decision.takeovers){
      if (c.mine) continue;                                       // rail 3: favorites → checkBigMoments
      const key = this.fireKey(c);
      if (this._firedKeys[key]) continue;                         // rail 2: fire-once per moment
      if (this._takeoverQueue.some(e => e.key === key)) continue; // already waiting
      const g = (games||[]).find(x => `${x.awayAbbr}@${x.homeAbbr}` === c.meta.game);
      if (!g) continue;
      this._takeoverQueue.push({ key, cand: c, game: g, at: now });
    }

    // 3. Cooldown gate — DON'T drain the queue; the waiters stay for next poll.
    if (now - this._lastFireAt < this.COOLDOWN_MS) return;        // rail 1: cooldown

    // 4. Fire the single highest-ranked eligible waiter; the rest remain queued.
    const ranked = this._takeoverQueue
      .filter(e => !this._firedKeys[e.key])
      .sort((a,b) => this.pinRank(b.cand) - this.pinRank(a.cand) || a.at - b.at);
    for (const e of ranked){
      let payload = null;
      try { payload = (typeof brainTakeoverPayload==='function') ? brainTakeoverPayload(e.cand, e.game) : null; } catch(err){}
      if (!payload) continue;
      const g = e.game;
      // R140: tag the resolvable team so showTakeover's tkolog hook logs Brain-path fires.
      payload.brainTeam = e.cand.meta.team || (BRAIN_MY_TEAMS.has(g.awayAbbr)?g.awayAbbr:BRAIN_MY_TEAMS.has(g.homeAbbr)?g.homeAbbr:g.homeAbbr);
      try {
        showTakeover(payload);
        this._lastFireAt = now;
        this._firedKeys[e.key] = now;
        this._takeoverQueue = this._takeoverQueue.filter(x => x.key !== e.key);   // dequeue the one that fired
        if (window._brainDebug){ (window._brainLog=window._brainLog||[]).push(`🔥 FIRED: ${e.cand.meta.label} (${e.cand.type}) ${e.cand.meta.game}${this._takeoverQueue.length?` · ${this._takeoverQueue.length} queued`:''}`); }
      } catch(err){ if (window._brainDebug) console.warn('[brain] fire failed:', err.message); }
      break;   // one takeover per evaluate — the queue advances next poll after cooldown
    }

    // prune old fired-keys hourly so a re-occurring key (new game day) can fire again
    if (Object.keys(this._firedKeys).length > 200){
      for (const k in this._firedKeys){ if (now - this._firedKeys[k] > 3600000) delete this._firedKeys[k]; }
    }
  },

  // R106 HUD DECLUTTER (Mike): debugOut APPENDED every evaluation, so the same
  // final_myteam takeovers (NYY@WSH, BOS@NYM — games that ended hours ago) re-logged
  // on every ~30s pass and crowded out the LIVE pins Mike actually wants to track.
  // Confirmed append-only: the candidate count went 14 → 15 as LAD dropped off.
  // FIX: dedupe by candidate identity — a given moment logs ONCE. Live PINs are
  // rendered fresh each pass (they're the volatile, interesting signal); TKOs are
  // logged once and then suppressed. Mike wants the history kept, just pared down.
  debugOut(d, cands){
    const seen = (window._brainSeenKeys = window._brainSeenKeys || new Set());
    const line = s => { try{ (window._brainLog=window._brainLog||[]).push(s); if(window._brainLog.length>12) window._brainLog.shift(); }catch(e){} };

    // Only log NEW takeovers — key on type+game so a repeat of the same moment is silent.
    const fresh = d.takeovers.filter(t => {
      const k = `${t.type}|${t.meta.game}`;
      if (seen.has(k)) return false;
      seen.add(k); return true;
    });

    // Header only when there's something new to say (stops the log churning on quiet passes).
    if (fresh.length || d.pin){
      line(`── BRAIN ${new Date().toLocaleTimeString()} · ${cands.length} cands ──`);
    }
    // PIN is the live, volatile signal — always show the current one.
    if (d.pin) line(`PIN: ${d.pin.meta.label} (${d.pin.type}) ${d.pin.meta.game} u=${d.pin.urgency.toFixed(2)}`);
    fresh.slice(0,4).forEach(t => line(`TKO: ${t.meta.label} (${t.type}) ${t.meta.game}${t.star?' ★':''}${t.mine?' [MINE]':''}`));
    if (!d.pin && !fresh.length && !window._brainLog?.length) line('(quiet — no tier2/3 moments)');
  }
};

window._brainDebug = new URLSearchParams(location.search).get('brain') === '1';
window._brainFire = new URLSearchParams(location.search).get('brainfire') === '1';   // P2a: takeover firing, DEFAULT OFF
window._ytlog = new URLSearchParams(location.search).get('ytlog') === '1';

   Kept beside the Brain so the type list stays in one place. ── */
function brainTakeoverPayload(c, g){
  const TEAMRGB = (typeof GLOW_TEAM!=='undefined' && GLOW_TEAM) || {};
  const myTeam = (typeof BRAIN_MY_TEAMS!=='undefined' && (BRAIN_MY_TEAMS.has(g.awayAbbr)?g.awayAbbr:BRAIN_MY_TEAMS.has(g.homeAbbr)?g.homeAbbr:null)) || null;

  const wash = `rgba(${TEAMRGB[teamOf]||'11,42,94'},0.95)`;
  const wm   = (typeof logoUrl==='function') ? logoUrl('MLB', teamOf) : '';
  const band = { aAbbr:g.awayAbbr, aScore:g.awayScore??0, hAbbr:g.homeAbbr, hScore:g.homeScore??0,
                 lit: (g.homeScore>g.awayScore?'h':'a') };

  // helper: HR-style card (headshot + chips)

    subIcon:'\u26be',

    band }});

  switch(c.type){

                                     sub: c.meta.pitchAbbr?`${c.meta.pitchAbbr} · ${c.meta.inning||9}th`:'', subIcon:'\u26be', band }};
    case 'no_hitter':      return { side, a:{ accent:'#34d399', wash, wm, headline:'NO-HITTER',
                                     sub: c.meta.pitchAbbr?`${c.meta.pitchAbbr} · ${c.meta.inning||9}th`:'', subIcon:'\u26be', band }};
    case 'walkoff':        return { side, a:{ accent:'#4ade80', wash, wm, headline:'WALK-OFF',
                                     sub: (c.meta.who||'').replace(/\([^)]*\)/g,'').trim(), band:{...band, lit:'h'} }};
    case 'lead_change_myteam': return { side, a:{ accent:'#60a5fa', wash, wm, headline:'LEAD CHANGE', band }};

function checkBigMoments(games){
  const tracked=['NYY','NYM'];
  (games||[]).forEach(g=>{
    if(!tracked.includes(g.awayAbbr)&&!tracked.includes(g.homeAbbr)) return;
    const key=g.id||(g.awayAbbr+g.homeAbbr);
    const teamAbbr=tracked.includes(g.homeAbbr)?g.homeAbbr:g.awayAbbr;
    const isHome=g.homeAbbr===teamAbbr;
    const side=teamAbbr==='NYM'?'right':'left';
    const accent=GLOW_TEAM[teamAbbr]?`rgb(${GLOW_TEAM[teamAbbr]})`:'#fbbf24';
    const cur={as:g.awayScore||0,hs:g.homeScore||0,status:g.gameStatus,lastPlay:(g.lastPlay&&g.lastPlay.primary)||''};
    const prev=_prevMLB[key];
    if(prev){
      // R25: go-ahead lead change on a STATIC team (NYY/NYM), 6th inning or later.
      // Only when OUR team seizes the lead (not opponent, not a tying run). Fires
      // on the same takeover overlay as HR/FINAL. inn>=6 keeps early back-and-forth quiet.
      const _ls=(a,h)=>a>h?'a':h>a?'h':'t';
      const _inn=(String(g.timeLabel||'').match(/(\d+)/)||[])[1]|0;
      const _pl=_ls(prev.as,prev.hs), _cl=_ls(cur.as,cur.hs);
      const _ours=isHome?'h':'a';
      const _tookLead = g.gameStatus==='live' && _inn>=6 && _pl!==_cl && _cl===_ours;
      // r142 FIX (Mike caught live 7/17: a Max Muncy [LAD] HR fired a NYY-skinned
      // takeover in the LAD@NYY game). The old check matched lastPlay TEXT for "home
      // run" but NEVER checked WHOSE homer it was — so ANY homer in a tracked GAME
      // fired a favorite takeover, mis-skinned in the tracked team's colors/logo/lit
      // side (Muncy's face on a Yankees-blue celebration card). Mike: opponent HRs
      // must fire NOTHING.
      //   SIGNAL: a HR scores the BATTING team, so "our score went up AND theirs did
      //   not" is definitionally our HR. Score-delta, not name/roster matching —
      //   nothing to rot when a player is traded.
      //   TRADE-OFF (accepted): the strict !_oppScoreUp guard could suppress a legit
      //   favorite HR if the opponent also scored in the SAME poll cycle (rare at 5s
      //   polls). Errs toward NOT firing, which matches "never fire on opponent".
      // Verified 8/8 jsdom incl. the exact Muncy case + both favorites still firing.
      const _ourScoreUp = isHome ? (cur.hs > (prev.hs||0)) : (cur.as > (prev.as||0));
      const _oppScoreUp = isHome ? (cur.as > (prev.as||0)) : (cur.hs > (prev.hs||0));
      /* ★ r162 — r142's score-delta test MISSED A REAL ONE (Mike, 7/19: Grisham HR for
         NYY never fired, nothing in tkolog). The flaw: it needs the score bump and the
         lastPlay text change in the SAME poll cycle. ESPN routinely posts the score
         first and the play description a beat later, so by the time lastPlay reads
         "…homers", the delta was already consumed by the previous poll, _ourScoreUp is
         false, and our own team's homer is silently rejected.
         The half-inning is a deterministic answer to "who is batting" and is immune to
         poll timing: Top/Mid = away batting, Bot/End = home batting (Mid and End are the
         breaks AFTER that half, so the homer still belongs to the team that just hit).
         timeLabel is guaranteed to carry it for live MLB — parseEvent either passes
         ESPN's detail through when it matches /top|bot|mid|end/i or builds "Bot 5th"
         from sit.isTopHalf.
         Still rejects the Muncy case r142 was written for: LAD bats in the TOP at NYY,
         so batting=away, ours=home, no fire — and now that verdict no longer depends on
         which poll the run landed in. Score-delta is kept as the fallback for an
         unparseable label, so this is strictly additive. */
      const _half = String(g.timeLabel || '');
      const _awayBatting = /\btop\b|\bmid\b/i.test(_half);
      const _homeBatting = /\bbot\b|\bend\b/i.test(_half);
      const _battingKnown = _awayBatting !== _homeBatting;      // exactly one must match
      const _ourHR = _battingKnown ? (isHome ? _homeBatting : _awayBatting)
                                   : (_ourScoreUp && !_oppScoreUp);
      /* ★ r163 — REJECTED-CANDIDATE LOGGING. When the gate says "not ours" it fires
         nothing, and firing nothing writes nothing: a missed favourite HR is INVISIBLE,
         which is exactly why the 7/19 Grisham miss took a code read to explain instead
         of a log line. Every HR-shaped lastPlay that does NOT fire now leaves a row
         carrying the decision inputs, so the next miss is diagnosable from the log
         alone. Opponent homers land here too — that is the point: they are the proof
         the gate still works, and at a few per game the volume is trivial next to the
         60-row cap. Recorded only under ?tkolog=1 / ?companion=1, alongside the
         takeovers it explains. */
      const _hrText = g.gameStatus==='live' && cur.lastPlay && cur.lastPlay!==prev.lastPlay
                      && /home run|homer|\bhr\b/i.test(cur.lastPlay);
      /* ★ r172 — WE ARE BLIND AT THE INPUT. A NYY homer on 7/20 produced NOTHING in
         tkolog: no takeover, and no r163 HR-NOT-OURS row either. A rejection row only
         writes when _hrText is TRUE, so zero rows means the detector never recognised
         an HR-shaped play at all — a different failure from "the gate said opponent".
         Candidates we cannot separate without data: ESPN's lastPlay text not matching
         /home run|homer|hr/, the text never changing between polls (prev already held
         it), or the game not reading as live at that moment.
         So: log EVERY score change for a favourite team, with the raw lastPlay strings
         either side of it. A score change is rare (a handful per game, well inside the
         60-row cap) and every home run is one. This is diagnose-only — it changes no
         behaviour and fires nothing. */
      if ((TKO_MEASURE || TKO_PLAY) && g.gameStatus === 'live'
          && (cur.as !== prev.as || cur.hs !== prev.hs)){
        try {
          tkoLogStart({
            team: teamAbbr, type: 'SCORE-CHANGE', firedVia: 'diagnostic (r172)',
            clock: new Date().toLocaleTimeString(), firedMs: Date.now(), polls: 0,
            outcome: 'diagnostic only — no takeover attempted',
            why: 'half="' + _half + '" ' + prev.as + '-' + prev.hs + ' → ' + cur.as + '-' + cur.hs
               + ' · hrTextMatched=' + _hrText + ' ourHR=' + _ourHR
               + ' · playChanged=' + (cur.lastPlay !== prev.lastPlay),
            play: 'prev="' + String(prev.lastPlay || '').slice(0,58) + '" cur="' + String(cur.lastPlay || '').slice(0,58) + '"'
          });
          tkoRenderHud();
        } catch(_){}
      }
      if (_hrText && !_ourHR && (TKO_MEASURE || TKO_PLAY)){
        try {
          tkoLogStart({
            team: teamAbbr, type: 'HR-NOT-OURS', firedVia: 'checkBigMoments (rejected)',
            clock: new Date().toLocaleTimeString(), firedMs: Date.now(), polls: 0,
            outcome: 'no takeover — gate said opponent',
            why: 'half="' + _half + '" battingKnown=' + _battingKnown
               + ' isHome=' + isHome
               + ' ourBatting=' + (_battingKnown ? (isHome ? _homeBatting : _awayBatting) : 'n/a')
               + ' scores ' + prev.as + '-' + prev.hs + ' → ' + cur.as + '-' + cur.hs
               + ' (ourUp=' + _ourScoreUp + ' oppUp=' + _oppScoreUp + ')',
            play: String(cur.lastPlay).slice(0, 100)
          });
          tkoRenderHud();
        } catch(_){}
      }
      if(_hrText&&_ourHR){
        showTakeover({side, mlbTeam:teamAbbr, a:{ accent, wash:`rgba(${GLOW_TEAM[teamAbbr]||'11,42,94'},0.95)`,
          wm:logoUrl('MLB',teamAbbr),   // R43: full-bleed team logo watermark (mockup)
          head:(g.lastPlay&&g.lastPlay.hitterId)?`https://a.espncdn.com/i/headshots/mlb/players/full/${g.lastPlay.hitterId}.png`:'',
          logo:(!(g.lastPlay&&g.lastPlay.hitterId))?logoUrl('MLB',teamAbbr):'', logoBg:`rgb(${GLOW_TEAM[teamAbbr]||'11,42,94'})`,
          headline:'HOME RUN',   // R43: no kicker (Mike) → headline goes 22cqh
          sub:((cur.lastPlay.match(/^(.+?)\s+homer/i)||[])[1]||cur.lastPlay)+(g.lastPlay&&g.lastPlay.hrNum?` (${g.lastPlay.hrNum})`:''), subIcon:'\u26be',
          chips:statcastChipsArr(g.lastPlay),
          band:{aAbbr:g.awayAbbr,aScore:cur.as,hAbbr:g.homeAbbr,hScore:cur.hs,lit:(teamAbbr===g.awayAbbr?'a':'h')} }});
      } else if(_tookLead && _leadTakeoverOn){   // R38: lead-change takeover disabled (Mike); flip _leadTakeoverOn to revive
        showTakeover({side, mlbTeam:teamAbbr, a:{ accent, wash:`rgba(${GLOW_TEAM[teamAbbr]||'11,42,94'},0.9)`,
          kicker:`${teamAbbr} take the lead`, headline:'LEAD CHANGE',
          band:{aAbbr:g.awayAbbr,aScore:cur.as,hAbbr:g.homeAbbr,hScore:cur.hs,lit:(teamAbbr===g.awayAbbr?'a':'h')} }});
      } else if(cur.status==='final'&&prev.status!=='final'){
        const won=isHome?cur.hs>cur.as:cur.as>cur.hs;
        if(won) showTakeover({side, mlbTeam:teamAbbr, a:{ accent:'#4ade80', wash:`rgba(${GLOW_TEAM[teamAbbr]||'11,42,94'},0.9)`,
          logo:logoUrl('MLB',teamAbbr), logoBg:`rgb(${GLOW_TEAM[teamAbbr]||'11,42,94'})`,
          kicker:'Final', headline:`${teamAbbr} WIN`,
          band:{aAbbr:g.awayAbbr,aScore:cur.as,hAbbr:g.homeAbbr,hScore:cur.hs,lit:(teamAbbr===g.awayAbbr?'a':'h')} }});
        // Round-10 note 12: Yankees win → Sinatra. One-shot via the final-transition
        // edge (prev!=='final'); rides the recap player (Premium session = no ads).
        if(won && teamAbbr==='NYY' && !_recapActive) setTimeout(()=>{ try{ playRecap('nyy-win'); }catch(_){} }, 3500);
        // Round-10 note 14: NY final moved the rail record — refresh standings now.
        try{ fetchDivStandings('5','NYY','AL East'); fetchDivStandings('24','NYM','NL East'); }catch(_){}
      }
    }
    _prevMLB[key]=cur;
  });
  const p=new URLSearchParams(location.search).get('takeover');
  if(p&&!window._tkoForced){ window._tkoForced=true;
    if(p==='wc'||p==='wcdemo') showTakeover({side:'right',accent:'#d4af37',wc:{
      flag:'https://a.espncdn.com/i/teamlogos/countries/500/eng.png',

    else if(p==='hr') showTakeover({side:'left', a:{ accent:'#fbbf24', wash:'rgba(11,42,94,0.95)', wm:logoUrl('MLB','NYY'),

function getTeamChipMode(abbr, todayGames, yesterdayGames) {
  const params = new URLSearchParams(location.search);
  const now = new Date();
  const hour = params.get('pregame')==='1' ? 14 : params.get('lastfinal')==='1' ? 6 : now.getHours(); // ?pregame=1 forces post-noon, ?lastfinal=1 forces pre-noon
  const isPreNoon = hour < 12;
  // Same time window as isPreNoon, named for readability where the comment
  // below talks about "before midnight" — this was being referenced but
  // never actually declared, which threw a ReferenceError on every single
  // call (i.e. every refresh cycle), crashing MLB's processing entirely and
  // sending it straight to the catch block / demo fallback every time.
  const isPostMidnight = isPreNoon;

  const todayGame = todayGames.find(g => g.awayAbbr===abbr || g.homeAbbr===abbr) || null;
  const yGame     = yesterdayGames.find(g => g.awayAbbr===abbr || g.homeAbbr===abbr) || null;

  // Live right now
  if (todayGame?.gameStatus === 'live') return 'live';

  // Game ended today, before midnight → show final in place
  if (todayGame?.gameStatus === 'final' && !isPostMidnight) return 'final';

  // Pre-noon: show last final if yesterday had a game, else offday
  if (isPreNoon) return yGame ? 'lastFinal' : 'offday';

  // Post-noon: game today → pregame; no game → offday
  if (todayGame?.gameStatus === 'upcoming') return 'pregame';
  return 'offday';
}
