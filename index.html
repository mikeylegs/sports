// Populates one AL/NL track and (re)starts its scroll — same duplicate-content
// + measured-halfWidth technique the original NHL/NBA/MLB ticker rows use
// (see rafScroll/scrollPos), so games dissolve in/out behind the league logo
// instead of needing to shrink to fit.
// Cache of the last games list/signature used per row, so a viewport resize
// (e.g. entering/exiting fullscreen) can re-run the measurement below
// against the new dimensions without needing to re-fetch anything, and so
// routine refreshes can skip rebuilding entirely when nothing changed.
const lastSubleagueGames = { AL: [], NL: [] };
const lastSubleagueSig   = { AL: '', NL: '' };
function subleagueSig(games) {
  return games.map(g => `${g.id}:${g.gameStatus}:${g.awayScore}:${g.homeScore}:${g.timeLabel}`).join('|');
}

function setupSubleagueRow(key, games, force=false) {
  const sig = subleagueSig(games);
  lastSubleagueGames[key] = games;
  if (!force && sig === lastSubleagueSig[key]) {
    // Nothing about these games actually changed since last time (very
    // common — most 30-60s refresh cycles don't change yesterday's final
    // scores at all, and often not today's either). Rebuilding the track's
    // DOM anyway would wipe out the in-progress scroll position, causing a
    // visible stutter/jump every refresh cycle for no actual reason.
    return;
  }
  lastSubleagueSig[key] = sig;
  const el = document.getElementById(TRACK_IDS[key]);
  const ca = document.getElementById('ca'+key);
  if (!el) return;
  // scroll position is preserved across content updates (normalized below) so a
  // score tick no longer snaps the crawl back to the start
  if (games.length === 0) {
    if (ca) { ca.style.webkitMaskImage = 'none'; ca.style.maskImage = 'none'; }
    scrollPos[key].active = false;
    el.style.transform = '';
    el.style.justifyContent = 'flex-start';
    el.innerHTML = `<div style="color:rgba(255,255,255,0.15);font-size:2cqh;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding-left:1cqh;">No games</div>`;
    return;
  }
  // Render one copy first to measure it — both to decide how many times to
  // repeat it for a seamless loop AND, just as importantly, to check
  // whether it needs to scroll at all. With very few games (e.g. only 2 on
  // an interleague-heavy day), forcing a scroll just cycles the same couple
  // of matchups past repeatedly, which looks broken rather than smooth — if
  // it already fits on screen once, just show it centered and static.
  // R41: in merged mode (phase LG holds mixed AL+NL), insert a thin colored
  // seam at each league boundary and at the wrap point, so the two leagues stay
  // visually grouped as they scroll. Phased AL/NL rows carry no band.
  const _merged = (key === 'LG' && _subPhase === 'LG');
  const _lgOf = g => (typeof NL_TEAMS!=='undefined' && NL_TEAMS.has(g.homeAbbr)) ? 'nl' : 'al';
  const _band = lg => `<div class="mlb-lg-band ${lg}"></div>`;
  let unitHtml;
  if (_merged && games.length){
    let prev=null, parts=[];
    for (const g of games){ const lg=_lgOf(g); if (prev && prev!==lg) parts.push(_band(lg)); parts.push(mlbCardHtml(g)); prev=lg; }
    // wrap seam: if the loop's last league differs from its first, cap it so the
    // repeat doesn't butt two same-side blocks together without a divider.
    const firstLg=_lgOf(games[0]);
    if (prev && prev!==firstLg) parts.push(_band(firstLg));
    unitHtml = parts.join('');
  } else {
    unitHtml = games.map(mlbCardHtml).join('');
  }
  el.innerHTML = unitHtml;
  fitText(el);
  el.style.transform = '';
  requestAnimationFrame(() => {
    const crawlW = (ca ? ca.clientWidth : el.parentElement.clientWidth) || 1;
    const unitW = el.scrollWidth || 1;
    if (unitW <= crawlW) {
      if (ca) { ca.style.webkitMaskImage = 'none'; ca.style.maskImage = 'none'; }
      scrollPos[key].active = false;
      el.style.justifyContent = 'center';
    } else {
      if (ca) { ca.style.webkitMaskImage = ''; ca.style.maskImage = ''; }
      el.style.justifyContent = 'flex-start';
      const reps = Math.max(2, Math.ceil((crawlW * 2) / unitW));
      el.innerHTML = unitHtml.repeat(reps);
      fitText(el);
      requestAnimationFrame(() => {
        scrollPos[key].halfW = el.scrollWidth / reps;
        scrollPos[key].x = scrollPos[key].halfW ? (scrollPos[key].x % scrollPos[key].halfW) : 0;
        scrollPos[key].active = true;
      });
    }
  });
}

// ── Single-league crawl phasing ───────────────────────────────
// Only one league is on screen at a time in the ~120px strip. We keep one
// physical track (tLG), swap its contents between AL and NL every phase, and
// crossfade the pinned league logo to match. Restarting the scroll on each
// switch means the new league's games always enter from the left.
let _subGames = { AL: [], NL: [], LG: [] };
let _subPhase = 'AL';
let _subTimer = null;
let _subFadeT = null;

function renderSubleaguePhase(phase, isSwitch) {
  _subPhase = phase;
  const wrap = document.querySelector('.mlb-league-logo');
  if (wrap) {
    wrap.classList.toggle('merged', phase === 'LG');   // R40: merged slate hides the league logo
    wrap.querySelector('.al')?.classList.toggle('active', phase === 'AL');
    wrap.querySelector('.nl')?.classList.toggle('active', phase === 'NL');
  }
  const track = document.getElementById('tLG');
  const swap = () => {
    if (isSwitch && scrollPos.LG) scrollPos.LG.x = 0;
    setupSubleagueRow('LG', _subGames[phase] || [], isSwitch);
  };
  // Real AL<->NL switch: cross-dissolve the games track in sync with the 0.9s
  // logo crossfade (fade out ~280ms, swap while invisible, fade back in) rather
  // than hard-cutting content and snapping scroll to 0. Routine refreshes
  // (isSwitch=false) still update in place with no fade.
  if (isSwitch && track) {
    track.style.opacity = '0';
    clearTimeout(_subFadeT);
    _subFadeT = setTimeout(() => { swap(); requestAnimationFrame(() => { track.style.opacity = '1'; }); }, 450);
  } else {
    swap();
  }
}

function subleaguePhaseTick() {
  if (!document.getElementById('tLG')) { clearInterval(_subTimer); _subTimer = null; return; }
  if (_subPhase === 'LG') return;                      // R40: merged mode — no alternation
  const other = _subPhase === 'AL' ? 'NL' : 'AL';
  // Only switch when the other league actually has games; otherwise stay put
  // (avoids fading to an empty "No games" panel on lopsided interleague days).
  if ((_subGames[other] || []).length > 0) renderSubleaguePhase(other, true);
}

function updateSubleaguePhased(alGames, nlGames) {
  _subGames.AL = alGames || [];
  _subGames.NL = nlGames || [];
  // R40 MERGE: on a sparse slate (either league <=2 games, or <=6 total) the
  // 14s AL/NL alternation makes a lone game "linger" on an empty-feeling row.
  // Merge both leagues into one 'LG' phase (AL first) — no alternation, league
  // logo hidden, full-width crawl. Reverts to phased automatically when the
  // slate fills back up.
  const _alN=_subGames.AL.length, _nlN=_subGames.NL.length;
  const merged = (_alN+_nlN)>0 && (Math.min(_alN,_nlN)<=2 || (_alN+_nlN)<=6);
  _subGames.LG = merged ? [..._subGames.AL, ..._subGames.NL] : [];
  if (merged) {
    renderSubleaguePhase('LG', false);
  } else {
    if (_subPhase==='LG') _subPhase='AL';
    // If the phase we're currently showing has emptied out, jump to whichever
    // league has games (preferring AL) so we never sit on an empty panel.
    if ((_subGames[_subPhase] || []).length === 0) {
      _subPhase = _subGames.AL.length ? 'AL' : (_subGames.NL.length ? 'NL' : 'AL');
    }
    renderSubleaguePhase(_subPhase, false);
  }
  if (!_subTimer) _subTimer = setInterval(subleaguePhaseTick, 14000);
}

function mlbCardHtml(g) {
  const live = g.gameStatus === 'live';
  const final = g.gameStatus === 'final';
  const upcoming = g.gameStatus === 'upcoming';
  const awayW = final && g.awayScore > g.homeScore;
  const homeW = final && g.homeScore > g.awayScore;
  const isDesig = DESIGNATED_TEAMS.has(g.awayAbbr) || DESIGNATED_TEAMS.has(g.homeAbbr);
  // Status: FINAL reinstated (F/10 for extra innings), LIVE shows the inning,
  // UPCOMING shows the start time.
  const finalTag = (g.timeLabel && g.timeLabel.includes('/'))
    ? 'F' + g.timeLabel.slice(g.timeLabel.indexOf('/')) : 'FINAL';   // "Final/10" -> "F/10"
  const status = live ? g.timeLabel : final ? finalTag : (g.timeLabel || '').split(' · ').pop();
  const statusCls = live ? 'live' : upcoming ? 'upcoming' : 'final';

  // Stacked matchup: away team over home team, each row [logo][ABBR][score].
  // Winner bold/white, loser dimmed. Status sits to the right, centered.
  const teamRow = (abbr, score, win) => `<div class="mlb-card2-row">
      <img class="mlb-card2-logo" src="${logoUrl('MLB', abbr)}" alt="${abbr}" onerror="this.style.opacity=0">
      <span class="mlb-card2-abbr${win ? ' w' : ''}">${abbr}</span>
      ${!upcoming ? `<span class="mlb-card2-score${win ? ' w' : ''}">${score ?? ''}</span>` : ''}
    </div>`;
  const _homeDiv = getTeamColor("MLB", g.homeAbbr);   // R35: home-team separator color
  return `<div class="mlb-card2${isDesig ? ' desig-game' : ''}${final ? ' is-final' : ''}" style="${_homeDiv?`--card-div:${_homeDiv}`:''}">
    <div class="mlb-card2-teams">
      ${teamRow(g.awayAbbr, g.awayScore, awayW)}
      ${teamRow(g.homeAbbr, g.homeScore, homeW)}
    </div>
    ${status ? `<span class="mlb-card2-status ${statusCls}">${status}</span>` : ''}
  </div>`;
}

// ── Team chip mode logic ──────────────────────────────────────

// ===== Win probability + leverage glow + big-moment takeover =====
function inningNum(g){
  if (g && typeof g.inning === 'number') return g.inning;
  const m = (g && g.timeLabel || '').match(/(\d+)/);
  return m ? parseInt(m[1],10) : 9;
}
// Self-contained in-game win probability (uses g.winProb if the feed supplies it).
function winProb(g){
  if (g && g.winProb && typeof g.winProb.home === 'number'){
    const h = Math.max(1, Math.min(99, Math.round(g.winProb.home)));
    return {home:h, away:100-h};
  }
  const as=(g&&g.awayScore)||0, hs=(g&&g.homeScore)||0;
  const inn=inningNum(g);
  const half=/^top/i.test((g&&g.timeLabel)||'') ? 'top':'bot';
  const outs=(g&&g.situation&&typeof g.situation.outs==='number')?g.situation.outs:0;
  let outsPlayed=(Math.min(inn,9)-1)*6 + (half==='bot'?3:0) + outs;
  if (inn>9) outsPlayed=54+(inn-9)*6;
  const outsRem=Math.max(54-outsPlayed,1);
  const diff=hs-as;
  const k=0.42*Math.sqrt(54/outsRem);
  let pHome=1/(1+Math.exp(-k*diff));
  if (diff===0) pHome=0.5+(half==='bot'?0.06:0.0);
  pHome=Math.max(0.01,Math.min(0.99,pHome));
  const h=Math.round(pHome*100);
  return {home:h, away:100-h};
}
// 0..1 leverage: high when late AND close (RISP bumps it).
function leverageIndex(g){
  if (!g || g.gameStatus!=='live') return 0;
  const margin=Math.abs(((g.homeScore)||0)-((g.awayScore)||0));
  const inn=inningNum(g);
  const close=Math.max(0,1-margin/4);
  const late=Math.min(1,Math.max(0,(inn-6)/3));
  const sit=g.situation||{};
  const risp=(sit.onSecond||sit.onThird)?0.15:0;
  return Math.min(1, close*late + risp*late);
}

function tweenScores(){
  document.querySelectorAll('.mlb-feat-score[data-to]').forEach(el=>{
    const to=parseInt(el.getAttribute('data-to'),10); el.removeAttribute('data-to');
    if(isNaN(to)) return;
    const from=parseInt(el.textContent,10)||0;
    if(from===to){ el.textContent=to; return; }
    const start=performance.now(), dur=650;
    function step(t){ const p=Math.min(1,(t-start)/dur); el.textContent=Math.round(from+(to-from)*p); if(p<1) requestAnimationFrame(step); else el.textContent=to; }
    requestAnimationFrame(step);
  });
}

/* In-place live updater for the MLB featured slot. Patches ONLY the fields
   that change on a live tick and keeps lastKnownScores + lastSituationState
   authoritative so the slow full render never misfires the "just changed"
   animations. Returns true if it fully handled the update, false if the slot
   needs a full rebuild (caller falls back to the outerHTML path). */
function updateFeaturedLiveInPlace(slotEl, g){
  if (!slotEl || !g || g.gameStatus !== 'live') return false;
  if (slotEl.querySelector('.mlb-feat-delay-badge')) return false;   // delayed layout → rebuild

  // Structural guards — bail to full rebuild if the slot isn't a stable live
  // layout for THIS game (covers slot2Game swaps, upcoming→live, delay, etc.)
  const abbrEls  = slotEl.querySelectorAll('.mlb-feat-teams .mlb-feat-abbr');
  const scoreEls = slotEl.querySelectorAll('.mlb-feat-teams .mlb-feat-score');
  const timeEl   = slotEl.querySelector('.mlb-feat-time-label.live');
  if (abbrEls.length !== 2 || scoreEls.length !== 2 || !timeEl) return false;
  if (abbrEls[0].textContent.trim() !== g.awayAbbr) return false;
  if (abbrEls[1].textContent.trim() !== g.homeAbbr) return false;

  const sitEl = slotEl.querySelector('.mlb-feat-sit');
  if (!!g.situation !== !!sitEl) return false;                        // sit appeared/vanished → rebuild
  const lpEl = slotEl.querySelector('.mlb-feat-lastplay');
  if (!!g.lastPlay !== !!lpEl) return false;

  // 1. Scores (away = [0], home = [1]). Maintain lastKnownScores ourselves.
  let scoreChanged = false;
  [[g.awayAbbr, g.awayScore, scoreEls[0]],
   [g.homeAbbr, g.homeScore, scoreEls[1]]].forEach(([abbr, score, el]) => {
    const key  = `${g.id}-${abbr}`;
    const prev = lastKnownScores[key];
    if (prev != null && score != null && score !== prev) {
      el.setAttribute('data-to', String(score));                     // tweenScores animates current→new
      el.classList.remove('score-just-changed'); void el.offsetWidth;
      el.classList.add('score-just-changed');
      el.addEventListener('animationend', () => el.classList.remove('score-just-changed'), { once:true });
      if (String(prev).length !== String(score).length) fitText(slotEl); // rare: 9→10 width change
      scoreChanged = true;
    } else if (prev == null || score == null) {
      el.textContent = (score ?? '');                                // first sight / missing — set directly
    }
    lastKnownScores[key] = score;                                    // keep map authoritative for slow path
  });
  if (scoreChanged) tweenScores();

  // 2. Situation (bases + B/S/O). situationHtml maintains lastSituationState.
  if (sitEl) sitEl.innerHTML = situationHtml(g.situation, g.id);

  // 3. Inning / time label (text only).
  const tl = g.timeLabel || '';
  if (timeEl.textContent.trim() !== tl) timeEl.textContent = tl;

  // 4. Pitcher / batter line — swaps on half-inning flip. Mirror builder logic.
  let awaySub = '', homeSub = '';
  if (g.situation) {
    const isTop = /^top/i.test(g.timeLabel || '');
    const pLine = g.situation.pitcher ? `P: ${pbLastName(g.situation.pitcher)}` : '';   // R12f: last name only
    const bLine = g.situation.batter ? `AB: ${pbLastName(g.situation.batter)}` : '';
    if (isTop) { awaySub = bLine; homeSub = pLine; } else { homeSub = bLine; awaySub = pLine; }
  }
  const pbLines = [awaySub, homeSub].filter(Boolean);
  const pbEl = slotEl.querySelector('.mlb-feat-pbline');
  if (pbLines.length) {
    if (!pbEl) return false;                                         // line needs to appear → rebuild
    const html = pbLines.map(l => `<div>${l}</div>`).join('');
    if (pbEl.innerHTML !== html) pbEl.innerHTML = html;
  } else if (pbEl) {
    return false;                                                    // line needs to vanish → rebuild
  }

  // 5. Last play.
  if (lpEl) {
    const prim = (g.lastPlay.icon ? g.lastPlay.icon + ' ' : '') + (g.lastPlay.primary || '');
    const pEl = lpEl.querySelector('.mlb-feat-lp-primary');
    if (pEl && pEl.textContent !== prim) pEl.textContent = prim;
    const sEl = lpEl.querySelector('.mlb-feat-lp-secondary');
    if (g.lastPlay.secondary) { if (!sEl) return false; if (sEl.textContent !== g.lastPlay.secondary) sEl.textContent = g.lastPlay.secondary; }
    else if (sEl) return false;                                      // secondary vanished → rebuild
  }

  return true;
}

function showTakeover(opts){

  // and play the clip when it LANDS — asynchronous companion, not a lookup.
  // Gated behind ?companion=1, default OFF: this is the first code that ACTS on a
  // live takeover, and it should be watched once before it runs unattended.
  try {
    // R118: run in EITHER mode. ?tkolog=1 = measure only (plays NOTHING).
    //       ?companion=1 = measure AND play. Observe before intervening.
    // R140: log team resolves from EITHER path — checkBigMoments sets opts.mlbTeam,
    // Brain.fire's payload sets opts.brainTeam (added below). firedVia tags which
    // detector fired, so tomorrow's full slate answers "which path reaches the screen".
    const logTeam = opts && (opts.mlbTeam || opts.brainTeam);

                   : opts && opts.brainTeam ? 'BRAIN.fire' : 'unknown';

        team: logTeam, type: opts.type || 'takeover', firedVia,
        clock: new Date().toLocaleTimeString(),
        firedMs: firedAt, polls: 0,
        recapWas: _recapActive ? (window._recapMp4 ? 'mp4 SUSPENDED' : 'iframe SUSPENDED') : 'nothing playing',
        outcome: 'in flight…'

      tkoGamePkFor({ meta:{ game: logTeam } }).then(pk => {
        if (!pk) { window._tkoCompanion = 'no gamePk'; tkoLogUpdate(rec, {outcome:'NO GAMEPK'}); return; }
        tkoLogUpdate(rec, { gamePk: pk });
        window._tkoCancel = mlbCompanionWatch(pk, firedAt,
          clip => {

          () => { window._tkoCancel = null;
                  tkoLogUpdate(rec, { outcome: 'GAVE UP — no clip in ' + (TKO_CFG.TIMEOUT_MS/1000) + 's' }); },
          rec);
      });

  // R117: a takeover must not play on top of a running recap. Suspend it, and bring

  // R38: unified Design-A payload (opts.a) drives ALL sports. Legacy opts.wc mapped in.
  const A = opts.a || (opts.wc ? {
    accent:opts.accent||'#d4af37', flag:opts.wc.flag, head:opts.wc.head,

    band:{aAbbr:opts.wc.aAbbr,aScore:opts.wc.aScore,hAbbr:opts.wc.hAbbr,hScore:opts.wc.hScore,lit:opts.wc.aWin?'a':opts.wc.hWin?'h':''}

/* ════════════════════════════════════════════════════════════════════════
   7c — Recap video integration (foundation).
   Source-agnostic: one shared IFrame player + overlay, a data-driven source
   registry, per-day video caching to protect the ~100/day search quota, and
   manual test hooks. Auto all-final rotation is gated behind ?recaps=1 so it
   never disrupts live testing. Cannot be verified offline (no network) —
   build here, tune live. Quota note: search.list = 100 units/call; channel
   resolve = 1 unit; results cached per source per day.
   ──────────────────────────────────────────────────────────────────────── */
// Last-final game facts per team (NYY/NYM), stashed by renderLastFinalSlot so
// the video recap's bottom caption can show recency + result.
const _lfRecapGame = {};
// R95 SELECTOR-DRIVEN FILTERING (Mike: "convert selector choices to search terms,
// filtered by the director logic"). The selection IS the intent — so a selected event's
// name becomes a REQUIRED token in the local RSS filter. NOT an API keyword search (that
// burns YouTube quota → the 429/ytQuotaDead problem); instead we keep RSS-primary (free)
// and tighten `require` dynamically. Fixes: golf pulling a June "Travelers Championship"
// clip when the SELECTED event is the Scottish Open. If the feed has no clip for the
// selected event → source yields → filler plays (Mike's own rule).
// Returns a RegExp or null (null = no selection of that kind → keep the source's default).
function _selEventRe(kindWant){
  try {
    const seen = [];
    for (const el of document.querySelectorAll('#wws-stage .lf-slide[data-wws]')){
      const d = WWS.events[el.dataset.wws];
      if (!d || (kindWant && d.kind !== kindWant)) continue;
      seen.push(d);
    }
    if (!seen.length) return null;
    const parts = [];
    for (const d of seen){
      // tournament/event label → drop sponsor prefixes ("2026 Genesis Scottish Open" → "Scottish Open")
      if (d.label){
        const lbl = String(d.label).replace(/^\d{4}\s+/,'').trim();
        const core = lbl.split(/\s+/).slice(-2).join(' ');   // last 2 words = the distinctive name
        if (core.length > 3) parts.push(core.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
      }
      // participants (tennis players / soccer nations) — any side name is a valid anchor
      (d.sides || []).forEach(sd => { if (sd && sd.name && String(sd.name).length > 2)
        parts.push(String(sd.name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')); });
    }
    if (!parts.length) return null;
    return new RegExp(parts.join('|'), 'i');
  } catch(_){ return null; }
}

/* ══════════════════════════════════════════════════════════════════════════════
   R128 · SPORTS CALENDAR + LIFECYCLE  (vertical slice: golf-fill only)
   ------------------------------------------------------------------------------
   HYBRID: this table holds WHEN (dates, defined once). Each source's `lifecycle`
   block holds HOW it reacts (declarative field-patches, merged over the base config
   before the gates run — the pipeline never sees a "phase", only a normal config).

   A source with no `lifecycle` block resolves to phase null and is byte-for-byte
   unchanged. That is the regression firewall for this slice.

   Dates are ET calendar dates 'YYYY-MM-DD'. Phases are declared as ordered windows;
   the FIRST window whose range contains "now" wins, so order matters (specific →
   general). `null` phase = no patch.

// Today's ET date as 'YYYY-MM-DD' (reuses nowET so DST/tz stays consistent).
function _etDateStr(d){ d = d || nowET();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

// Resolve a source's CURRENT lifecycle phase, or null. Pure/read-only.
// Returns { phase, event, patch } or null. `patch` is the field-overrides object for
// the active phase (may be {}), taken from src.lifecycle.phases[PHASE].
function resolvePhase(src){
  if (!src || !src.lifecycle || !src.lifecycle.event) return null;
  const cal = SPORTS_CAL[src.lifecycle.event];
  if (!cal) { console.warn('[lifecycle] unknown event', src.lifecycle.event); return null; }
  const today = _etDateStr();
  const hit = (cal.phases || []).find(w => today >= w.from && today <= w.to);
  if (!hit) return null;                                  // outside all windows → dormant/no patch
  const patch = (src.lifecycle.phases && src.lifecycle.phases[hit.phase]) || null;
  if (!patch) return null;                                // in a phase the source doesn't react to
  return { phase: hit.phase, event: src.lifecycle.event, patch };
}

function _leagueInSeason(lg){
  const m = nowET().getMonth() + 1;   // 1-12
  if (lg === 'NBA') return (m >= 10 || m <= 6);
  if (lg === 'NHL') return (m >= 10 || m <= 6);
  if (lg === 'NFL') return (m >= 9  || m <= 2);
  return true;
}

/* ══════════════════════════════════════════════════════════════════════════════
   R131 · "ABOUT MY TEAM" vs "MENTIONS MY TEAM" CLASSIFIER
   ------------------------------------------------------------------------------
   The bug (auditor, Jul 14): hoh-nym WON "Masataka Yoshida rockets out a homer! |
   MLB Highlights (Red Sox vs. Mets)" — a RED SOX highlight in which the Mets are the
   beaten opponent. The strict require kept it only because the word "Mets" is in the
   title. A regex cannot fix this: "Mets" appears identically whether they won or lost.

   The signal (proven by diagnostic before building): the SUBJECT is either the player
   named up front, or the FIRST team in "A vs. B". So we need to know which players are
   MINE. Rather than hardcode names that rot every trade, we fetch the LIVE active
   rosters for NYY (147) and NYM (121) from StatsAPI once at startup — the same endpoint
   family the panel already uses for recaps — and build a last-name → team map.

   Best-effort: if the fetch fails, _rosterReady stays false and the classifier is a
   NO-OP (every clip passes). That is the regression firewall — a network hiccup can
   never make the team gate stricter than R126 was.
   ══════════════════════════════════════════════════════════════════════════════ */
const _favTeamIds = { Yankees: 147, Mets: 121 };
const _favPlayers = { Yankees: new Set(), Mets: new Set() };   // lastName(lowercase) → in set
let _rosterReady = false;

async function loadFavRosters(){
  if (new URLSearchParams(location.search).get('rosteroff') === '1'){ console.log('[roster] disabled via ?rosteroff=1'); return; }
  let anyOk = false;
  for (const [team, id] of Object.entries(_favTeamIds)){
    try {
      const raw = await proxyFetchText(`https://statsapi.mlb.com/api/v1/teams/${id}/roster?rosterType=active`);
      if (!raw) { console.warn('[roster] no data for', team); continue; }
      const roster = (JSON.parse(raw).roster || []);
      for (const p of roster){
        const full = (p.person && p.person.fullName || '').trim();
        if (!full) continue;
        // last name = last whitespace-delimited token, lowercased, accent-normalized.
        const last = full.split(/\s+/).pop().toLowerCase()
          .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        if (last.length >= 3) _favPlayers[team].add(last);   // skip initials/jr noise
      }
      if (_favPlayers[team].size) anyOk = true;
      console.log(`[roster] ${team}: ${_favPlayers[team].size} players`);
    } catch(e){ console.warn('[roster] fetch/parse failed for', team, e && e.message); }
  }
  _rosterReady = anyOk;
  window._favPlayers = _favPlayers;   // exposed for auditor / debugging
}

/* Classify one title relative to a favorite team. Returns:
     'ABOUT'    — the clip's subject is my team (keep, this is what we want)
     'OPPONENT' — my team is only the beaten/other side (drop if possible)
     'NEUTRAL'  — can't tell / genuinely about both (keep; e.g. even full-game recaps)
   Read-only, pure. If rosters aren't loaded, ALWAYS returns 'NEUTRAL' (no-op firewall). */
function classifyTitle(title, teamName){
  if (!_rosterReady) return 'NEUTRAL';
  const t = String(title || '');
  const tl = t.toLowerCase();
  const mine = _favPlayers[teamName];
  const otherTeam = teamName === 'Yankees' ? 'Mets' : 'Yankees';
  const theirs = _favPlayers[otherTeam];

  // (1) Leading player name — "Yoshida rockets out a homer …", "Juan Soto NO-DOUBT homer".
  //     If a MINE player is named anywhere in the headline (before the first '|' or '('),
  //     it's about my team. If ONLY an opposing-roster player is named up front and my team
  //     appears merely in a "(A vs. B)" tail, it's about them.
  const head = t.split(/[|(]/)[0].toLowerCase();
  const nameHit = set => [...set].some(last => new RegExp('\\b' + last.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\b','i').test(head));
  const myNameUp = nameHit(mine);
  if (myNameUp) return 'ABOUT';

  // (2) "A vs. B" structure. Whichever side my team is on:
  //     my team FIRST  → about my team (they're the subject/home side in these feeds)
  //     my team SECOND → about the opponent (the winning/subject team is listed first)
  const vs = tl.match(/([a-z .]+?)\s+vs\.?\s+([a-z .]+?)(?:[:)]|$)/i);
  if (vs){
    const tn = teamName.toLowerCase();
    const aMine = vs[1].includes(tn), bMine = vs[2].includes(tn);
    if (aMine && !bMine) return 'NEUTRAL';   // my team first — could be either; don't over-reject
    if (bMine && !aMine) return 'OPPONENT';  // my team second — subject is the other side
  }
  return 'NEUTRAL';
}
window.classifyTitle = classifyTitle;

    if (wantTeam){
      if (slotClass !== 'yank'){ _dirNote('skip ' + cand + ' — team source needs yank slot, got ' + slotClass); continue; }

      // its ~12s-in-72s natural window (post-R12 alternation starved these).
      if (!lf && window._anchorMerged && window._anchorTeam !== wantTeam
          && typeof window._anchorSwap === 'function' && window._anchorSwap()){

      }

    }

    // backing slide, then the normal glow-twice-then-play treatment runs on
    // .mlb-feat-slot.secondary via the source's slot/glow config.
    if (cand === 'pga-golf' || cand === 'wws-final'){
      if (slotClass !== 'yank'){ _dirNote('skip ' + cand + ' — wws source needs yank slot, got ' + slotClass); continue; }
      const t = cand === 'pga-golf' ? wwsRecapTarget('golf') : wwsFinalTarget();
      if (!t){ _dirNote('skip ' + cand + ' — no eligible wws target today'); continue; }
      if (cand === 'wws-final' && t.id) _recapSeen.add(t.id);   // R22: fire once per final
      if (t.el && !t.el.classList.contains('active')){
        const st = document.getElementById('wws-stage');
        if (st) st.querySelectorAll('.lf-slide').forEach(x => x.classList.toggle('active', x === t.el));
      }
    }

    // starts scanning from the following entry (even rotation). If playRecap
    // bails (no eligible video — e.g. no finished WC match today), it calls
    // back via onNoVideo to rewind the cursor so nothing downstream is skipped.
    D.count = 0;
    D.idx = (pos + 1) % D.cycle.length;
    _dirNote('DISPATCH ' + cand);
    playRecap(cand, { onNoVideo: () => { /* R15: keep cycle moving, just note it */
      window._recapEvt = `skip:${cand} (no video)`; _dirNote('no video from ' + cand); } });
    return;
  }
  _dirNote('CYCLE EXHAUSTED — every candidate skipped this tick');
}

async function ytApi(path, params){
  const u = new URL(`https://www.googleapis.com/youtube/v3/${path}`);
  Object.entries({ key: RECAP.apiKey, ...params }).forEach(([k,v]) => u.searchParams.set(k, v));
  const r = await fetch(u.toString());
  if (!r.ok) throw new Error(`YouTube ${path} HTTP ${r.status}`);
  return r.json();
}
/* ★ r169 EMBEDDABLE PRE-CHECK. YouTube lets an uploader forbid embedding; the player

   rotation slot and shown a dead frame. FIFA does this on its best uploads (7/20: the
   Winners clip, ABSOLUTE CINEMA, and the post-match interviews all threw 150), so the
   cost is real and repeats with every fresh upload.

   unit, so a whole pool costs the same as a single search — negligible next to the
   100-unit search calls this file already makes.
   NOTE for anyone re-testing by hand: opening youtube.com/embed/<id> in a browser TAB
   is NOT a valid test. Top-level navigation has no parent referrer and YouTube answers
   "Error 153 · player configuration error" for embeddable and non-embeddable videos
   alike. Only this API field, or a real iframe, tells the truth.
   Cached 7 days (an uploader can flip the flag, so not forever), persisted so a reload
   doesn't re-spend quota, and FAIL-OPEN everywhere: any error, missing key, or absent
   field leaves the clip in the pool exactly as before. */

  try {
    const raw = localStorage.getItem(EMBED_KEY); if (!raw) return;
    const o = JSON.parse(raw) || {}, now = Date.now();
    Object.keys(o).forEach(id => { const v = o[id];
      if (v && (now - v.t) < EMBED_TTL_MS) _embedCache[id] = v; });
  } catch (_) {}
})();
function _saveEmbedCache(){
  try {
    const o = {}, ids = Object.keys(_embedCache);
    ids.slice(-600).forEach(id => { o[id] = _embedCache[id]; });   // bound the store
    localStorage.setItem(EMBED_KEY, JSON.stringify(o));
  } catch (_) {}
}
async function _fetchEmbeddable(ids){
  if (!ids.length) return;
  for (let i = 0; i < ids.length; i += 50){
    const batch = ids.slice(i, i + 50);
    try {
      const d = await ytApi('videos', { part:'status', id: batch.join(',') });
      const seen = new Set();
      (d.items || []).forEach(it => {
        if (!it || !it.id) return;
        seen.add(it.id);

        _embedCache[it.id] = { ok: (emb === false ? false : true), t: Date.now() };

    } catch (e) { return; }   // quota/network → stop, everything stays fail-open

}
async function resolveChannelId(handle){
  if (RECAP.channelIds[handle]) return RECAP.channelIds[handle];
  try {
    const d = await ytApi('channels', { part:'id', forHandle:handle });
    const id = d.items && d.items[0] && d.items[0].id;
    if (id){ RECAP.channelIds[handle] = id; return id; }
  } catch(e){ console.warn('[recap] forHandle failed, falling back to search:', e.message); }
  const s = await ytApi('search', { part:'snippet', q:handle, type:'channel', maxResults:'1' });
  const id = s.items && s.items[0] && s.items[0].snippet && s.items[0].snippet.channelId;
  if (!id) throw new Error('could not resolve channel for @'+handle);

function recapDateKey(){ const d=new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }

// R60: RSS-primary content pull — youtube.com/feeds/videos.xml is a free, no-quota
// feed of a channel's ~15 latest uploads. Via proxyFetch (browser CORS proxy).
// Returns [{videoId,title,published,views:0}] — same shape as the API search path.
// views/mins are hydrated later by the existing videos.list call, so RSS lacking them is fine.
async function fetchChannelRSS(channelId){
  if (!channelId) return null;
  try {
    const xml = await proxyFetchText(`https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`);
    if (!xml || typeof xml !== 'string' || xml.indexOf('<entry') === -1) return null;
    const out = [];
    const entries = xml.split('<entry>').slice(1);
    for (const e of entries){
      const vid = (e.match(/<yt:videoId>([^<]+)<\/yt:videoId>/)||[])[1];
      const title = (e.match(/<title>([^<]+)<\/title>/)||[])[1];
      const pub = (e.match(/<published>([^<]+)<\/published>/)||[])[1];
      if (vid && title){
        out.push({ videoId: vid, title: title.replace(/&amp;/g,'&').replace(/&#39;/g,"'").replace(/&quot;/g,'"').replace(/&lt;/g,'<').replace(/&gt;/g,'>'), published: pub || new Date().toISOString(), views: 0 });
      }
    }
    return out.length ? out : null;
  } catch(e){ console.warn('[recap] RSS fetch failed, will use API search:', e.message); return null; }
}

        ageH:  +ageH.toFixed(1),

        fullGame: /official full game (?:two )?highlights/i.test(t) ? 'Y' : '',
        fav:   /\byankees\b|\bmets\b|\bnyy\b|\bnym\b/i.test(t) ? 'Y' : '',
        views: x.views || 0,
        title: t.slice(0, 62)
      };
    });
    try {
      console.groupCollapsed(`%c[SCORE] ${sourceId} → picked: ${(pool[0].title||'').slice(0,50)}`, 'color:#8ef');
      console.table(rows);
      console.groupEnd();
    } catch(_){}
    // also drop the winner + runner-up into the YTLT log so it survives an export
    try {
      ytltRecord({ source: sourceId, note: 'SCORE',
        title: `WON(${rows[0].score}) ${rows[0].title}`
               + (rows[1] ? ` | 2nd(${rows[1].score}) ${rows[1].title}` : ''),
        videoId: pool[0].videoId,
        scoreDebug: rows });
    } catch(_){}
  }
  if (_AUD){
    const _n4 = Date.now();
    _AUD.final = pool.length;
    _AUD.finalIds = pool.map(x => x.videoId);
    _AUD.survivors = pool.slice(0,6).map(x=>({ score:+score(x).toFixed(1), title:x.title, id:x.videoId,
      ageH:+(((_n4 - new Date(x.published).getTime())/3600000)||0).toFixed(1),
      mins:x.mins?+x.mins.toFixed(1):null, views:x.views||0 }));
    _audEnd(pool.length ? 'WON: ' + (pool[0].title||'') : 'EMPTY (post-gate)');
  }
  const pick = pool[0] || null;
  // R123: an audit sweep is READ-ONLY — it must not warm the cache or stamp a clip as
  // served, or the auditor would change what the director serves next (measurement
  // altering the thing measured). Director calls (not auditing) behave exactly as before.
  if (!window._auditing) RECAP.videoCache[cacheKey] = { at: Date.now(), video: pick };
  if (!window._auditing && pick && pick.videoId) _recapServedAt[pick.videoId] = Date.now();   // R92: stamp at return (cross-source dedup)
  if (!window._auditing && pick) _markServed(_servedKey(pick));   // global recent-served ring
  if (!pick) console.warn('[recap] no video found for', sourceId);
  return pick;
}


/* ══════════════════════════════════════════════════════════════════════════════
   R123 · THE POOL AUDITOR  —  ?pools=1        (?poolsdump=1 → raw JSON, phone-readable)
   ------------------------------------------------------------------------------
   The YTLT log shows what WON. It says NOTHING about what was AVAILABLE.
   This shows, per source: the fetch path, the full fetched pool, WHICH GATE killed
   each item, and how the survivors scored. It is the "actual" half of the
   ideal-vs-actual study, and the half we have been blind to.

   ★ IT REFUSES TO EMIT NUMBERS IT DID NOT EARN:
     · ?ticks=1 present  → SWEEP ABORTS. Ticks hammers the free CORS proxies (a fetch
       per source per 12s); the resulting rate-limit FEED-FAILs are SELF-INFLICTED and
       are indistinguishable from "this feed has no content". That mis-diagnosis has
       already cost us twice (see R104).
     · fetch failed      → reported as FETCH FAILED, never as "0 eligible".
     · query() null      → reported as NOT-ELIGIBLE, never as "gated to empty".

   ★ IT IS READ-ONLY. While _auditing: the video cache is neither read nor written,
     and _recapServedAt is not stamped. A sweep cannot change what the panel serves.
   ══════════════════════════════════════════════════════════════════════════════ */
window.POOLS = { audits:{}, at:null, aborted:null };
window._auditing = false;

async function poolsSweep(){
  const hud = hudMake('poolsHud', '▤ POOL AUDITOR — ?pools=1', 'left:8px;top:8px;width:76vw;');
  if (new URLSearchParams(location.search).get('ticks') === '1'){
    POOLS.aborted = 'ticks';
    hud.body.innerHTML = '<b style="color:#f87171">⚠ SWEEP ABORTED — ?ticks=1 is set.</b><br><br>'
      + 'Ticks fires a fetch per source every 12s and rate-limits the CORS proxies. Every '
      + 'FEED-FAIL this sweep reported would be <b>self-inflicted</b> and would read exactly '
      + 'like an empty feed. A number we did not earn is worse than no number.<br><br>'
      + '<b>Reload with <code>?pools=1</code> ALONE.</b>';
    return;
  }
  const ids = Object.keys(RECAP.sources);
  POOLS.audits = {}; POOLS.at = Date.now();
  window._auditing = true;
  for (let i = 0; i < ids.length; i++){
    hud.body.textContent = `sweeping ${i+1}/${ids.length} … ${ids[i]}\n(2s gap between sources — hammering the proxies is what makes feeds look empty & slow)`;
    try { await findRecap(ids[i]); }
    catch(e){ POOLS.audits[ids[i]] = { src:ids[i], via:null, fetched:0, raw:[], stages:[], survivors:[],
                                       verdict:'⚠ THREW: ' + (e && e.message) }; }
    await new Promise(r => setTimeout(r, 2000));   // R132: was 1.2s — widened to reduce self-inflicted proxy rate-limiting during the sweep
  }
  window._auditing = false;
  poolsRenderHud(hud);
  console.log('[pools] sweep complete', POOLS.audits);
}

/* ★ THE AUDITOR AUDITS ITSELF.
   Every fetched item must end up in exactly one place: the final pool, or a gate's kill
   list. If items VANISH, a filter in findRecap has no probe on it and this report is
   silently lying about why a source is empty — the exact failure mode the auditor exists
   to prevent. So we count, and we say so in red.
   RESURRECTED is not an error: the team gate deliberately reaches back to 144h (ASG break)
   and the reject gate falls back — both can pull an item back out of an earlier kill list. */
function poolsAccount(a){
  // R127: DISTINCT ids. A clip can appear in more than one stage's kill-list (killed by
  // WINDOW after already being dropped), so summing per-stage counts double-counts and the
  // arithmetic goes negative. Dedupe first.
  const killedIds = new Set([].concat(...(a.stages || []).map(st => st.killed.map(x => x.id))));
  const finalIds = new Set(a.finalIds || []);
  const resurrected = [...killedIds].filter(id => finalIds.has(id));   // killed then pulled back
  const netKilled = [...killedIds].filter(id => !finalIds.has(id)).length;   // dead for good
  const final = a.final || 0;
  const unaccounted = (a.fetched || 0) - final - netKilled;
  return { killed: killedIds.size, netKilled, resurrected: resurrected.length, final,
           fetched: a.fetched || 0, unaccounted };
}

function poolsRenderHud(hud){
  hud = hud || hudMake('poolsHud', '▤ POOL AUDITOR — ?pools=1', 'left:8px;top:8px;width:76vw;');
  const A = POOLS.audits, ids = Object.keys(A);
  if (window._poolsDump){ hud.body.textContent = JSON.stringify(A, null, 1); return; }
  const esc = v => String(v == null ? '' : v).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const cut = (t,n) => { t = String(t||''); return t.length > n ? t.slice(0,n) + '…' : t; };
  const kv  = v => v >= 1000 ? Math.round(v/1000) + 'k' : v;
  const won  = a => /^WON|^PINNED/.test(a.verdict || '');   // R126: pinned counts as served
  const dead = a => /FETCH FAILED|THREW/.test(a.verdict || '');
  const nWon = ids.filter(k => won(A[k])).length;
  const nBad = ids.filter(k => dead(A[k])).length;
  const o = [];
  o.push(`<div style="color:#a5b4fc"><b>${ids.length} sources · ${nWon} served · ${nBad} fetch-failed`
        + ` · ${POOLS.at ? new Date(POOLS.at).toLocaleTimeString() : '—'}</b></div>`);
  { const rr = (window._favPlayers && (window._favPlayers.Yankees.size + window._favPlayers.Mets.size)) || 0;
    o.push(`<div style="color:${rr ? '#64748b' : '#fbbf24'}">roster classifier: ${rr ? rr + ' fav players loaded' : '⚠ not loaded (ABOUT-TEAM gate inactive)'}</div>`); }
  if (nBad) o.push(`<div style="color:#f87171;margin-top:4px">⚠ ${nBad} source(s) FAILED TO FETCH. Those are NETWORK`
        + ` verdicts, not gate verdicts — do NOT read them as "this feed is empty".</div>`);
  ids.forEach(k => {
    const a = A[k];
    const col = dead(a) ? '#f87171' : won(a) ? '#4ade80' : '#fbbf24';
    o.push(`<div style="margin:11px 0 2px;padding-top:7px;border-top:1px solid #334155">`
      + `<b style="color:${col}">▌ ${esc(k)}</b> <span style="color:#64748b">${esc(cut(a.label,26))}</span>`
      + `<span style="color:#94a3b8"> · ${esc(a.via || 'no fetch')} · <b>${a.fetched}</b> fetched</span></div>`);
    if (a.phase) o.push(`<div style="color:#c4b5fd;padding-left:3px">◷ <b>${esc(a.phase)}</b>`
      + ` <span style="color:#64748b">${esc(JSON.stringify(a.phasePatch))}</span></div>`);
    if (!won(a)) o.push(`<div style="color:${col};padding-left:3px">${esc(a.verdict || 'no verdict')}</div>`);
    if (a.fetched){
      const acc = poolsAccount(a);
      if (acc.unaccounted !== 0)
        o.push(`<div style="color:#f87171;padding-left:3px"><b>⚠ ${acc.unaccounted} ITEM(S) UNACCOUNTED FOR</b>`
          + ` — a filter in findRecap has no audit probe. THIS ROW IS NOT TRUSTWORTHY.</div>`);
      if (acc.resurrected)
        o.push(`<div style="color:#a78bfa;padding-left:3px">↩ ${acc.resurrected} clip(s) RESURRECTED by a`
          + ` never-empty fallback (team 144h widen / reject fallback) — killed above, then pulled back.</div>`);
    }
    (a.survivors || []).forEach((s, i) => {
      const _pinned = !isFinite(s.score);   // R127: pinned sources score Infinity, age null
      o.push(`<div style="color:${i ? '#94a3b8' : (_pinned ? '#38bdf8' : '#4ade80')};padding-left:3px">`
        + `${i ? '&nbsp;&nbsp;' + (i+1) + '.' : (_pinned ? '📌 PINNED' : '✓ WON')}`
        + `${_pinned ? '' : ' <b>(' + s.score + ')</b>'} ${esc(cut(s.title,66))}`
        + (_pinned ? '' : `<span style="color:#64748b"> · ${s.ageH}h${s.mins ? ' · ' + s.mins + 'm' : ''}`
        + `${s.views ? ' · ' + kv(s.views) : ''}</span>`) + `</div>`);
    });
    (a.stages || []).forEach(st => {
      if (!st.killed.length){   // R124: a fallback fires without killing anything — it RESTORES.
        o.push(`<div style="color:#fbbf24;padding-left:3px;margin-top:3px"><b>${esc(st.stage)}</b>`
          + `<span style="color:#a16207"> — ${esc(st.note)}</span></div>`);
        return;
      }
      o.push(`<div style="color:#f87171;padding-left:3px;margin-top:3px">✂ <b>${esc(st.stage)}</b> killed ${st.killed.length}`
        + `<span style="color:#64748b"> (${st.in}→${st.out}) — ${esc(st.note)}</span></div>`);
      st.killed.slice(0, 8).forEach(x =>
        o.push(`<div style="color:#cbd5e1;opacity:.5;padding-left:22px">${esc(cut(x.title,70))}`
             + `<span style="color:#64748b"> · ${x.ageH}h</span></div>`));
      if (st.killed.length > 8)
        o.push(`<div style="color:#64748b;padding-left:22px">… +${st.killed.length - 8} more</div>`);
    });
  });
  hud.body.innerHTML = o.join('');
}

/* ★ r154 — R129's blacklist was MEMORY-ONLY, so it forgot on every reload. Field
   case 7/18: e3o5cs2T608 ("Top 5 MLB Plays") has embedding disabled by the owner.
   Each session the pool re-picked it, the player mounted, sat on the poster until
   YouTube got around to reporting error 150, then blacklisted it — and the next
   reload started the whole cycle again. That's why exactly ONE video kept failing
   while everything else played: the fix was working and being thrown away.
   Persisted with a 30-day TTL because embedding is an owner setting that can be
   turned back on; a permanent blacklist would quietly shrink the pool forever. */
/* r160: KEY BUMPED TO v2 — every entry written before r158 is untrustworthy and is
   abandoned by this rename. Reason: until r158 the player was a session-long singleton,
   so onError's closure still referenced the FIRST video of the session. When a later
   clip threw 150, the panel banned that first (usually perfectly good) video for 30
   days. Proof in the 7/19 log: PLAYER-ERROR 150 attributed to 534ImdA5KFw while the
   dispatched clip was x5fosNlz0nw. Those bad bans were silently shrinking every pool —
   which is why fifa-fill looked "legitimately empty" on World Cup final day. Bans
   recorded from r158 onward are attributed correctly and are kept. */
const DEAD_IDS_KEY = 'sportsRecapDeadIds.v2', DEAD_ID_TTL_MS = 30*24*60*60*1000, DEAD_IDS_CAP = 400;
/* r155: PER-ID TTL. r154 assumed a dead video always announces itself with error 150,
   but the 7/18 field log caught e3o5cs2T608 doing the other thing: sitting at CUED
   forever and never erroring at all. YT-STALL correctly gave up — and then nothing
   marked the id, so the next tick re-picked the same clip (14:57:16 and 14:57:31,
   back to back). A stall is weaker evidence than error 150 (it can be a network
   blip), so it earns a SHORT quarantine that self-heals rather than a 30-day ban. */
const DEAD_ID_STALL_TTL_MS = 6*60*60*1000;
const _deadIdAt = Object.create(null), _deadIdTtl = Object.create(null);
const _recapDeadIds = new Set();   // R129: videoIds that threw player-error 150/101
function _saveDeadIds(){
  try {
    let ids = Array.from(_recapDeadIds);
    if (ids.length > DEAD_IDS_CAP)                       // keep the freshest
      ids = ids.sort((a,b) => (_deadIdAt[b]||0) - (_deadIdAt[a]||0)).slice(0, DEAD_IDS_CAP);
    const o = {}; ids.forEach(id => { o[id] = { t: _deadIdAt[id] || Date.now(), ttl: _deadIdTtl[id] || DEAD_ID_TTL_MS }; });
    localStorage.setItem(DEAD_IDS_KEY, JSON.stringify(o));
  } catch (_) {}                                          // private mode / quota → stay in-memory
}
function _markDeadId(id, ttlMs){
  try {
    if (!id) return;
    // never let a short stall-quarantine downgrade an existing hard 150/101 ban
    const ttl = Math.max(ttlMs || DEAD_ID_TTL_MS, _recapDeadIds.has(id) ? (_deadIdTtl[id] || 0) : 0);
    _recapDeadIds.add(id); _deadIdAt[id] = Date.now(); _deadIdTtl[id] = ttl; _saveDeadIds();
  } catch (_) {}
}
(function _loadDeadIds(){
  try {
    /* r156: r155 wrote 6-hour stall quarantines for perfectly good videos. Drop every
       entry it created (ttl === the stall TTL) exactly once, and honour ?cleardead=1
       for a manual full wipe. Hard 150/101 bans (30d) are kept — those are real. */
    try { localStorage.removeItem('sportsRecapDeadIds'); } catch(_){}   // r160: drop the poisoned pre-r158 store
    if (new URLSearchParams(location.search).get('cleardead') === '1'){
      localStorage.removeItem(DEAD_IDS_KEY); console.warn('[recap] dead-id list cleared by ?cleardead=1'); return;
    }
    const raw = localStorage.getItem(DEAD_IDS_KEY); if (!raw) return;
    const o = JSON.parse(raw) || {}, now = Date.now(); let expired = false;
    Object.keys(o).forEach(id => {
      const v = o[id];
      const t   = (typeof v === 'number') ? v : (v && v.t) || 0;         // r154 wrote bare numbers
      const ttl = (typeof v === 'number') ? DEAD_ID_TTL_MS : ((v && v.ttl) || DEAD_ID_TTL_MS);
      if (ttl === DEAD_ID_STALL_TTL_MS){ expired = true; return; }   // r156: purge r155's stall quarantines
      if (t && (now - t) < ttl){ _recapDeadIds.add(id); _deadIdAt[id] = t; _deadIdTtl[id] = ttl; }

  } catch (_) {}
})();
// A1 (r141) + A1b (r143): portrait discriminator, two layers.
// Layer 1 — oardefault.jpg ("original aspect ratio default"): exists at ratio ~0.56
// for portrait uploads. FIELD-DISPROVEN as sole gate (IwzESXtiOnY): for some portrait
// uploads the thumb is MISSING and ytimg serves its 120×90 placeholder — which LOADS
// successfully at landscape ratio, so the old code read it as landscape. The known-
// landscape control ALSO placeholder'd, so placeholder ≠ portrait; it means NO DATA.
// Layer 2 — _seamPortrait() runs only on that UNVERIFIED path (placeholder or 404):
// maxresdefault blur-fill pillarbox detection. Phone-probe-proven 3/3 with wide
// margin (portraits 82/85%% seam coverage at mirrored columns, landscape 6/2%%; a
// single off-center design split correctly fails the SYMMETRIC-pair requirement).
// Cached as a Promise per id (one probe chain per session, in-flight shared).
// Fail-open at EVERY step: timeout, taint, placeholder maxres, any error → pass.
const _portraitCache = new Map();   // videoId -> Promise<boolean>
function isPortrait(videoId){
  if (!videoId) return Promise.resolve(false);
  if (!_portraitCache.has(videoId)){
    _portraitCache.set(videoId, new Promise(res => {
      let settled = false;
      const done = v => { if (!settled){ settled = true; res(v); } };
      const img = new Image();
      const t = setTimeout(() => done(false), 2500);        // slow/blocked → pass
      img.onload  = () => {
        clearTimeout(t);
        const w = img.naturalWidth, h = img.naturalHeight;
        if (h > 0 && (w / h) < 1) return done(true);              // real portrait oardefault (fast path)
        if (w === 120 && h === 90) return _seamPortrait(videoId).then(done); // r143: ytimg 120×90 placeholder = NO DATA, not landscape
        done(false);                                              // real landscape-ratio oardefault
      };
      img.onerror = () => { clearTimeout(t); _seamPortrait(videoId).then(done); }; // r143: missing thumb = NO DATA → verify via seams
      img.src = 'https://i.ytimg.com/vi/' + videoId + '/oardefault.jpg';
    }));
  }
  return _portraitCache.get(videoId);
}
// r143: seam check for oardefault-UNVERIFIED ids. A blur-fill portrait maxresdefault
// has TWO near-full-height vertical seams where blurred rails meet real content,
// symmetric about center. Per-column coverage = fraction of rows whose central
// horizontal gradient exceeds 24; portrait = some column in the left 8–45%% with
// ≥50%% coverage whose mirror (±10px) also has ≥50%%. Thresholds are the phone-probe
// values verbatim — do not "tune" them without a new probe. getImageData needs CORS
// (ytimg sends ACAO:*, probe-proven); a taint throw is caught → fail-open pass.
function _seamPortrait(videoId){
  return new Promise(res => {
    let settled = false;
    const done = v => { if (!settled){ settled = true; res(!!v); } };
    const img = new Image();
    img.crossOrigin = 'anonymous';
    const t = setTimeout(() => done(false), 3000);   // slow → pass (fail-open)
    img.onerror = () => { clearTimeout(t); done(false); };
    img.onload = () => {
      clearTimeout(t);
      try {
        const W = img.naturalWidth, H = img.naturalHeight;
        if (!W || !H || (W === 120 && H === 90)) return done(false); // maxres placeholder = still no data
        const c = document.createElement('canvas'); c.width = W; c.height = H;
        const g = c.getContext('2d'); g.drawImage(img, 0, 0);
        const px = g.getImageData(0, 0, W, H).data;  // throws if tainted → catch below
        const lum = new Float32Array(W * H);

          cov[x] = n / H;

           probe showed exactly why: its coverage peaked at x842:55% and x438:34% — the
           predicted 9:16 seam columns dead on — but the symmetric-pair search below
           demands BOTH sides ≥50%, so a 34% seam broke the pair and the Short passed.
           A blur-fill rail's contrast depends on what is behind it, so one seam being
           weak is normal; requiring both to clear 50% was too strict.
           Fix: test the PREDICTED 9:16 columns directly at a lower bar. That position is
           not a guess — it is where the rails must fall for 9:16 content in a 16:9 frame
           (content width H*9/16, centred), so a false positive would need a landscape
           thumb with hard full-height edges at both x438 and x842 by coincidence.
           Measured margin on real thumbs: portraits 34/55, 82/85, 82/85 · landscape 6/2.
           Threshold .30 sits ~5× above the landscape control. The symmetric-pair search
           is KEPT for non-9:16 portraits (4:5 etc.), where the seams land elsewhere. */
        {
          const cw = H * 9 / 16, pl = Math.round((W - cw) / 2), pr = W - pl;
          const band = p => { let m = 0;
            for (let i = Math.max(1, p - 6); i <= Math.min(W - 2, p + 6); i++) if (cov[i] > m) m = cov[i];

if (new URLSearchParams(location.search).get('tkodump') === '1'){
  window.addEventListener('load', () => {
    const rows = tkoLogLoad();
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:100001;background:#02060f;color:#c7d2fe;'
      + 'padding:14px;overflow:auto;font:11px/1.5 monospace;white-space:pre-wrap;'
      + '-webkit-user-select:text;user-select:text;';

              + 'select-all and copy from the phone. ?tkoclear=1 to wipe.\n'
